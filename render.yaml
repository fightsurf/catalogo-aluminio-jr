# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Blueprint auxiliar para declarar variáveis usadas pelo assistente Hermes.
# ATENÇÃO: se seu serviço Render já foi criado manualmente, a Render pode não
# aplicar este arquivo automaticamente no Deploy latest commit. Nesse caso,
# use este arquivo apenas como referência e configure a variável no painel.

services:
  - type: web
    name: catalogo-aluminio-jr
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: off
    envVars:
      # Token que autoriza o Hermes a consultar /api/assistente/* no sistema JR.
      # sync:false mantém o valor fora do GitHub. Preencha no painel da Render.
      - key: ASSISTENTE_API_TOKEN
        sync: false
      # Cloudflare R2 - upload das fotos dos produtos.
      # As chaves aparecem automaticamente no Blueprint; os valores secretos ficam fora do GitHub.
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      # Opcional: endpoint S3 completo. Necessario para buckets com jurisdicao (ex.: .eu).
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_URL
        value: https://pub-51cb4ace3dfb43a4ac45a4b7c399904d.r2.dev


      # Central de Ofertas - cenário gerado por IA
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1-mini
      - key: OPENAI_IMAGE_QUALITY
        value: medium
      - key: APP_PUBLIC_URL
        value: https://catalogo-aluminio-jr.onrender.com
      # Status Vídeos / YouTube Shorts
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_PRIVACY_STATUS
        value: public
      - key: YOUTUBE_CATEGORY_ID
        value: "22"

