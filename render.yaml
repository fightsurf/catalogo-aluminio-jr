# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Blueprint auxiliar para declarar variáveis usadas pelo assistente Hermes.
# ATENÇÃO: se seu serviço Render já foi criado manualmente, a Render pode não
# aplicar este arquivo automaticamente no Deploy latest commit. Nesse caso,
# use este arquivo apenas como referência e configure a variável no painel.

services:
  - type: web
    name: catalogo-aluminio-jr
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: off
    envVars:
      # Token que autoriza o Hermes a consultar /api/assistente/* no sistema JR.
      # sync:false mantém o valor fora do GitHub. Preencha no painel da Render.
      - key: ASSISTENTE_API_TOKEN
        sync: false
      # Cloudflare R2 - upload das fotos dos produtos.
      # As chaves aparecem automaticamente no Blueprint; os valores secretos ficam fora do GitHub.
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_URL
        value: https://pub-51cb4ace3dfb43a4ac45a4b7c399904d.r2.dev

