plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.aluminiojr.statusvideos'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.aluminiojr.statusvideos'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
