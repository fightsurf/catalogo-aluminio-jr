<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Insumos - Alumínio JR</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; padding: 24px; }
    .container { max-width: 1180px; margin: 0 auto; }
    .box { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.08); margin-bottom: 24px; }
    h1,h2 { margin-top: 0; color: #243447; }
    .menu-modulo { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .menu-modulo a { text-decoration:none; background:#34495e; color:#fff; padding:9px 12px; border-radius:6px; font-size:13px; }
    .menu-modulo a.ativo { background:#2ecc71; }
    .grid-form { display:grid; grid-template-columns: 1.4fr 1fr 160px 140px 140px; gap:12px; align-items:end; }
    .grid-filtro { display:grid; grid-template-columns: 1.2fr 1fr 160px 140px 140px; gap:12px; align-items:end; }
    label { display:block; font-size:13px; font-weight:bold; color:#4a5568; margin-bottom:6px; }
    input, select, button { width:100%; padding:10px 12px; border-radius:6px; border:1px solid #ccd3db; font-size:14px; box-sizing:border-box; }
    button { border:none; cursor:pointer; font-weight:bold; }
    .btn-salvar { background:#2ecc71; color:#fff; }
    .btn-limpar { background:#95a5a6; color:#fff; }
    .btn-buscar { background:#34495e; color:#fff; }
    .btn-editar { background:#f39c12; color:#fff; padding:8px 10px; }
    .btn-excluir { background:#e74c3c; color:#fff; padding:8px 10px; }
    table { width:100%; border-collapse:collapse; margin-top:16px; }
    th { background:#2c3e50; color:#fff; padding:10px; text-align:left; }
    td { padding:10px; border-bottom:1px solid #e9edf2; vertical-align:middle; }
    tr:hover { background:#f9fbfd; }
    .acoes { display:flex; gap:8px; flex-wrap:wrap; }
    .status { font-weight:bold; }
    .status-ativo { color:#1e8449; }
    .status-inativo { color:#c0392b; }
    .mensagem { margin-top:12px; font-weight:bold; display:none; }
    .mensagem.sucesso { color:#1e8449; display:block; }
    .mensagem.erro { color:#c0392b; display:block; }
    @media (max-width: 980px) { .grid-form,.grid-filtro { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Cadastro de Insumos</h1>
      <div class="menu-modulo">
        <a href="/admin-insumos-categorias">Categorias de insumo</a>
        <a href="/admin-insumos" class="ativo">Insumos</a>
        <a href="/admin-insumos-discos">Discos de alumínio</a>
        <a href="/admin-insumos-fornecedores">Custos por fornecedor</a>
        <a href="/admin-pedido-fornecedor">Pedido para fornecedor</a>
      </div>

      <input type="hidden" id="insumo_id" />
      <div class="grid-form">
        <div>
          <label for="nome">Nome</label>
          <input type="text" id="nome" maxlength="180" placeholder="Digite o nome do insumo" />
        </div>
        <div>
          <label for="categoria_insumo_id">Categoria</label>
          <select id="categoria_insumo_id"></select>
        </div>
        <div>
          <label for="unidade_medida">Unidade</label>
          <select id="unidade_medida">
            <option value="un">un</option>
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="m">m</option>
            <option value="cm">cm</option>
            <option value="mm">mm</option>
          </select>
        </div>
        <div>
          <label for="ativo">Ativo</label>
          <select id="ativo">
            <option value="true">Sim</option>
            <option value="false">Não</option>
          </select>
        </div>
        <div style="display:flex; gap:12px;">
          <button type="button" class="btn-salvar" onclick="salvar()">Salvar</button>
          <button type="button" class="btn-limpar" onclick="limparFormulario()">Limpar</button>
        </div>
      </div>
      <div id="mensagem" class="mensagem"></div>
    </div>

    <div class="box">
      <h2>Lista de Insumos</h2>
      <div class="grid-filtro">
        <div>
          <label for="filtroNome">Buscar por nome</label>
          <input type="text" id="filtroNome" placeholder="Nome do insumo" />
        </div>
        <div>
          <label for="filtroCategoria">Categoria</label>
          <select id="filtroCategoria"></select>
        </div>
        <div>
          <label for="filtroAtivo">Status</label>
          <select id="filtroAtivo">
            <option value="">Todos</option>
            <option value="true">Ativos</option>
            <option value="false">Inativos</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="button" class="btn-buscar" onclick="listar()">Buscar</button>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="button" class="btn-limpar" onclick="limparFiltros()">Limpar filtros</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Unidade</th>
            <th>Status</th>
            <th style="width:160px;">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = '/api/insumos';
    let categorias = [];

    function mostrarMensagem(texto, tipo = 'sucesso') {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = `mensagem ${tipo}`;
    }

    function limparMensagem() {
      const el = document.getElementById('mensagem');
      el.textContent = '';
      el.className = 'mensagem';
    }

    async function carregarCategorias() {
      const resp = await fetch('/api/insumos-categorias?ativo=true');
      const json = await resp.json();
      categorias = json.data || [];

      const options = ['<option value="">Selecione</option>']
        .concat(categorias.map(c => `<option value="${c.id}">${c.nome}</option>`))
        .join('');

      document.getElementById('categoria_insumo_id').innerHTML = options;
      document.getElementById('filtroCategoria').innerHTML = '<option value="">Todas</option>' + categorias.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
    }

    function limparFormulario() {
      document.getElementById('insumo_id').value = '';
      document.getElementById('nome').value = '';
      document.getElementById('categoria_insumo_id').value = '';
      document.getElementById('unidade_medida').value = 'un';
      document.getElementById('ativo').value = 'true';
      limparMensagem();
    }

    function limparFiltros() {
      document.getElementById('filtroNome').value = '';
      document.getElementById('filtroCategoria').value = '';
      document.getElementById('filtroAtivo').value = '';
      listar();
    }

    async function listar() {
      const params = new URLSearchParams();
      const nome = document.getElementById('filtroNome').value.trim();
      const categoria = document.getElementById('filtroCategoria').value;
      const ativo = document.getElementById('filtroAtivo').value;
      if (nome) params.append('nome', nome);
      if (categoria) params.append('categoria_insumo_id', categoria);
      if (ativo) params.append('ativo', ativo);

      const resp = await fetch(`${API}?${params.toString()}`);
      const json = await resp.json();
      const dados = json.data || [];
      const tbody = document.getElementById('tbody');

      tbody.innerHTML = dados.map(item => `
        <tr>
          <td>${item.nome}</td>
          <td>${item.categoria || ''}</td>
          <td>${item.unidade_medida}</td>
          <td><span class="status ${item.ativo ? 'status-ativo' : 'status-inativo'}">${item.ativo ? 'Ativo' : 'Inativo'}</span></td>
          <td>
            <div class="acoes">
              <button class="btn-editar" onclick="editar(${item.id})">Editar</button>
              <button class="btn-excluir" onclick="excluirItem(${item.id})">Excluir</button>
            </div>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="5">Nenhum insumo encontrado.</td></tr>';
    }

    async function editar(id) {
      const resp = await fetch(`${API}/${id}`);
      const json = await resp.json();
      if (!json.success) {
        mostrarMensagem(json.message || 'Erro ao carregar insumo', 'erro');
        return;
      }

      const item = json.data;
      document.getElementById('insumo_id').value = item.id;
      document.getElementById('nome').value = item.nome;
      document.getElementById('categoria_insumo_id').value = item.categoria_insumo_id;
      document.getElementById('unidade_medida').value = item.unidade_medida;
      document.getElementById('ativo').value = String(item.ativo);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      limparMensagem();
    }

    async function salvar() {
      try {
        limparMensagem();
        const id = document.getElementById('insumo_id').value;
        const payload = {
          nome: document.getElementById('nome').value.trim(),
          categoria_insumo_id: document.getElementById('categoria_insumo_id').value,
          unidade_medida: document.getElementById('unidade_medida').value,
          ativo: document.getElementById('ativo').value === 'true'
        };

        const metodo = id ? 'PUT' : 'POST';
        const url = id ? `${API}/${id}` : API;

        const resp = await fetch(url, {
          method: metodo,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const json = await resp.json();
        if (!resp.ok || !json.success) {
          throw new Error(json.message || 'Erro ao salvar insumo');
        }

        mostrarMensagem('Insumo salvo com sucesso');
        limparFormulario();
        listar();
      } catch (error) {
        mostrarMensagem(error.message, 'erro');
      }
    }

    async function excluirItem(id) {
      if (!confirm('Deseja realmente excluir este insumo?')) return;

      const resp = await fetch(`${API}/${id}`, { method: 'DELETE' });
      const json = await resp.json();
      if (!resp.ok || !json.success) {
        mostrarMensagem(json.message || 'Erro ao excluir insumo', 'erro');
        return;
      }

      mostrarMensagem('Insumo removido com sucesso');
      listar();
    }

    (async function init() {
      await carregarCategorias();
      await listar();
    })();
  </script>
</body>
</html>
