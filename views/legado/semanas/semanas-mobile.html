<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semanas Mobile</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f6; color: #111827; }
    .page { width: 100%; max-width: 720px; margin: 0 auto; padding: 14px; }
    .topo { position: sticky; top: 0; z-index: 5; margin: -14px -14px 14px; padding: 14px; background: #111827; color: #fff; box-shadow: 0 8px 18px rgba(0,0,0,.16); }
    h1 { margin: 0; font-size: 20px; }
    .sub { margin: 6px 0 0; font-size: 13px; opacity: .8; }
    .mensagem { display: none; margin: 0 0 12px; padding: 12px; border-radius: 12px; background: #eff6ff; color: #1d4ed8; font-size: 14px; }
    .mensagem.erro { background: #fef2f2; color: #b91c1c; }
    .filtro { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 12px; }
    input, button { font: inherit; }
    input { min-height: 44px; width: 100%; border: 1px solid #d1d5db; border-radius: 12px; padding: 10px 12px; background: #fff; }
    button, .botao { min-height: 44px; border: 0; border-radius: 12px; padding: 10px 14px; background: #111827; color: #fff; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .lista { display: flex; flex-direction: column; gap: 10px; }
    .card { width: 100%; text-align: left; border: 1px solid #e5e7eb; border-radius: 16px; padding: 14px; background: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.05); color: inherit; cursor: pointer; }
    .card:active { transform: scale(.995); }
    .descricao { font-size: 22px; font-weight: 900; margin-bottom: 14px; line-height: 1.25; }
    .card.semana-atual { background: #dbeafe; border-color: #93c5fd; box-shadow: 0 8px 20px rgba(37, 99, 235, .12); }
    .linha { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .label { color: #6b7280; font-size: 13px; }
    .valor { font-size: 26px; font-weight: 900; }
    .vazio { padding: 18px; border: 1px dashed #d1d5db; border-radius: 16px; background: #fff; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <main class="page">
    <header class="topo">
      <h1>Semanas</h1>
      <p class="sub">Consulta mobile das semanas cadastradas.</p>
    </header>

    <div id="mensagem" class="mensagem"></div>

    <div class="filtro">
      <input id="busca" type="search" placeholder="Buscar descrição" autocomplete="off" />
      <button id="btnAtualizar" type="button">Atualizar</button>
    </div>

    <section id="lista" class="lista"></section>
  </main>

  <script>
    const mensagem = document.getElementById('mensagem');
    const busca = document.getElementById('busca');
    const btnAtualizar = document.getElementById('btnAtualizar');
    const lista = document.getElementById('lista');
    let semanas = [];

    function setMensagem(texto, erro = false) {
      mensagem.style.display = texto ? 'block' : 'none';
      mensagem.textContent = texto || '';
      mensagem.classList.toggle('erro', erro);
    }

    async function lerJson(response) {
      const json = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(json?.message || json?.erro || json?.detalhe || 'Erro na requisição.');
      }
      return json;
    }

    function escapeHtml(valor) {
      return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatarNumero(valor) {
      const numero = Number(valor || 0);
      return Number.isFinite(numero) ? numero.toLocaleString('pt-BR') : '0';
    }

    function formatarData(valor) {
      if (!valor) return '-';
      const texto = String(valor).slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) {
        const [ano, mes, dia] = texto.split('-');
        return `${dia}/${mes}/${ano}`;
      }
      const data = new Date(valor);
      return Number.isNaN(data.getTime()) ? String(valor) : data.toLocaleDateString('pt-BR');
    }


    function parseDataLocal(valor) {
      if (!valor) return null;
      const texto = String(valor).slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) {
        const [ano, mes, dia] = texto.split('-').map(Number);
        return new Date(ano, mes - 1, dia);
      }
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return null;
      return new Date(data.getFullYear(), data.getMonth(), data.getDate());
    }

    function isSemanaCorrente(semana) {
      const inicio = parseDataLocal(semana.data_inicial);
      const fim = parseDataLocal(semana.data_final);
      if (!inicio || !fim) return false;
      const agora = new Date();
      const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
      return hoje >= inicio && hoje <= fim;
    }

    function renderizar() {
      const termo = busca.value.trim().toLowerCase();
      const filtradas = semanas.filter((semana) => String(semana.descricao || '').toLowerCase().includes(termo));

      if (!filtradas.length) {
        lista.innerHTML = '<div class="vazio">Nenhuma semana encontrada.</div>';
        return;
      }

      lista.innerHTML = filtradas.map((semana) => {
        const url = `/legado/semanas/mobile/detalhe?id=${encodeURIComponent(semana.id)}`;
        const classeAtual = isSemanaCorrente(semana) ? ' semana-atual' : '';
        return `
          <button type="button" class="card${classeAtual}" data-url="${escapeHtml(url)}">
            <div class="descricao">${escapeHtml(semana.descricao || 'Semana sem descrição')}</div>
            <div class="linha">
              <span class="label">A produzir</span>
              <span class="valor">${escapeHtml(formatarNumero(semana.quantidade_itens_a_produzir))}</span>
            </div>
          </button>
        `;
      }).join('');

      lista.querySelectorAll('[data-url]').forEach((card) => {
        card.addEventListener('click', () => {
          window.location.href = card.dataset.url;
        });
      });
    }

    async function carregar() {
      try {
        setMensagem('Carregando semanas...');
        const response = await fetch('/api/legado/semanas');
        const json = await lerJson(response);
        semanas = Array.isArray(json?.data) ? json.data : [];
        renderizar();
        setMensagem('');
      } catch (error) {
        semanas = [];
        renderizar();
        setMensagem(error.message, true);
      }
    }

    busca.addEventListener('input', renderizar);
    btnAtualizar.addEventListener('click', carregar);
    carregar();
  </script>
</body>
</html>
