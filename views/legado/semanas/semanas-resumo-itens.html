<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumo da Semana</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #111827;
      --danger: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, a.button {
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .muted { color: var(--muted); }
    .resumo-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .resumo-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .resumo-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .resumo-valor {
      font-size: 18px;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
    }
    th { color: var(--muted); font-size: 13px; }
    .linha-total td {
      background: #111827;
      color: #fff;
      font-weight: 700;
      border-bottom: 0;
    }
    .col-indice {
      width: 64px;
    }
    .pedidos-hover {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      cursor: default;
    }
    .pedidos-hover__numero {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .pedidos-hover__tooltip {
      position: absolute;
      left: 50%;
      top: calc(100% - 2px);
      transform: translateX(-50%);
      min-width: 220px;
      max-width: 340px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s ease, visibility 0.15s ease;
      z-index: 20;
      white-space: normal;
    }
    .pedidos-hover:hover .pedidos-hover__tooltip,
    .pedidos-hover:focus-within .pedidos-hover__tooltip,
    .pedidos-hover__tooltip:hover {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .pedidos-hover__titulo {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .pedidos-hover__lista {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pedidos-hover__link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .pedidos-hover__link:hover {
      background: rgba(255, 255, 255, 0.22);
    }
    @media (max-width: 980px) {
      .resumo-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
    }
    @media (max-width: 640px) {
      .resumo-grid { grid-template-columns: 1fr; }
      .pedidos-hover__tooltip {
        left: auto;
        right: 0;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 id="titulo">Resumo da semana</h1>
        <p class="muted" id="subtitulo"></p>
      </div>
      <div class="actions">
        <a class="button btn-secondary" id="linkDetalhe" href="/legado/semanas">Voltar ao detalhe</a>
        <button class="btn-primary" id="btnImprimir">Imprimir</button>
      </div>
    </div>

    <div id="conteudo">
      <div class="card">Carregando resumo...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    function escapeHtml(valor) {
      return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatarData(valor) {
      if (!valor) return '';
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return String(valor);
      return data.toLocaleDateString('pt-BR');
    }

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function formatarQuantidade(valor) {
      return Number(valor || 0).toLocaleString('pt-BR');
    }

    async function request(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(data.error || data.message || 'Falha na requisição.');
      }

      return data.data;
    }

    function renderHover(total, titulo, links) {
      return `
        <span class="pedidos-hover" tabindex="0">
          <span class="pedidos-hover__numero">${escapeHtml(formatarQuantidade(total))}</span>
          <span class="pedidos-hover__tooltip">
            <span class="pedidos-hover__titulo">${escapeHtml(titulo)}</span>
            <span class="pedidos-hover__lista">${links}</span>
          </span>
        </span>
      `;
    }

    function renderPedidosHover(numerosPedidos) {
      const total = numerosPedidos.length;
      const titulo = total === 1 ? 'Pedido:' : 'Pedidos:';
      const links = numerosPedidos.map((numero) => {
        const numeroTexto = String(numero || '').trim();
        return `<a class="pedidos-hover__link" href="/legado/pedidos?numero=${encodeURIComponent(numeroTexto)}" target="_blank" rel="noopener noreferrer">${escapeHtml(numeroTexto)}</a>`;
      }).join('');

      return renderHover(total, titulo, links);
    }

    function renderCarradasHover(codigosCarradas) {
      const total = codigosCarradas.length;
      const titulo = total === 1 ? 'Carrada:' : 'Carradas:';
      const links = codigosCarradas.map((codigo) => {
        const codigoTexto = String(codigo || '').trim();
        return `<a class="pedidos-hover__link" href="/legado/carradas/detalhe?codigo=${encodeURIComponent(codigoTexto)}" target="_blank" rel="noopener noreferrer">${escapeHtml(codigoTexto)}</a>`;
      }).join('');

      return renderHover(total, titulo, links);
    }

    function renderResumo(data) {
      const semana = data.semana || {};
      const carradas = Array.isArray(data.carradas) ? data.carradas : [];
      const itens = Array.isArray(data.itens) ? data.itens : [];
      const totais = data.totais || {};

      document.getElementById('titulo').textContent = 'Resumo da semana';
      document.getElementById('subtitulo').textContent = `Período: ${formatarData(semana.data_inicial)} até ${formatarData(semana.data_final)} | Descrição: ${semana.descricao || '-'}`;
      document.getElementById('linkDetalhe').href = `/legado/semanas/detalhe?id=${encodeURIComponent(semana.id)}`;

      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = `
        <section class="card">
          <div class="resumo-grid">
            <div class="resumo-item">
              <div class="resumo-label">Data inicial</div>
              <div class="resumo-valor">${escapeHtml(formatarData(semana.data_inicial))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Data final</div>
              <div class="resumo-valor">${escapeHtml(formatarData(semana.data_final))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade de carradas</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_carradas))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade de pedidos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_pedidos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade total de itens</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_itens))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Tipos de itens</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_tipos_itens))}</div>
            </div>
            <div class="resumo-item" style="grid-column: 1 / -1;">
              <div class="resumo-label">Descrição</div>
              <div class="resumo-valor">${escapeHtml(semana.descricao || '-')}</div>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Carradas da semana</h2>
          ${carradas.length ? `
            <table>
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Data</th>
                  <th>Descrição</th>
                  <th>Pedidos</th>
                  <th>Itens</th>
                  <th>Total dos pedidos</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                ${carradas.map((carrada) => `
                  <tr>
                    <td>${escapeHtml(carrada.codigo)}</td>
                    <td>${escapeHtml(formatarData(carrada.data))}</td>
                    <td>${escapeHtml(carrada.descricao || '-')}</td>
                    <td>${escapeHtml(formatarQuantidade(carrada.quantidade_pedidos))}</td>
                    <td>${escapeHtml(formatarQuantidade(carrada.quantidade_itens))}</td>
                    <td>${escapeHtml(formatarMoeda(carrada.total_pedidos))}</td>
                    <td><a class="button btn-secondary" href="/legado/carradas/detalhe?codigo=${encodeURIComponent(carrada.codigo)}" target="_blank" rel="noopener noreferrer">Abrir carrada</a></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<div class="muted" style="padding-top: 12px;">Nenhuma carrada vinculada nesta semana.</div>'}
        </section>

        <section class="card">
          <h2>Consolidado de itens da semana</h2>
          ${itens.length ? `
            <table>
              <thead>
                <tr>
                  <th class="col-indice">#</th>
                  <th>Descrição</th>
                  <th>Qtd. total</th>
                  <th>Pedidos</th>
                  <th>Carradas</th>
                </tr>
              </thead>
              <tbody>
                ${itens.map((item, indice) => `
                  <tr>
                    <td>${escapeHtml(String(indice + 1))}</td>
                    <td>${escapeHtml(item.descricao || '-')}</td>
                    <td>${escapeHtml(formatarQuantidade(item.quantidade))}</td>
                    <td>${renderPedidosHover(item.numerosPedidos || [])}</td>
                    <td>${renderCarradasHover(item.codigosCarradas || [])}</td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot>
                <tr class="linha-total">
                  <td></td>
                  <td>Total geral</td>
                  <td>${escapeHtml(formatarQuantidade(totais.quantidade_itens))}</td>
                  <td></td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          ` : '<div class="muted" style="padding-top: 12px;">Nenhum item encontrado nesta semana.</div>'}
        </section>
      `;
    }

    async function carregar() {
      if (!id) {
        document.getElementById('conteudo').innerHTML = '<div class="card">ID da semana não informado.</div>';
        return;
      }

      try {
        const data = await request(`/api/legado/semanas/${id}/resumo`);
        renderResumo(data);
      } catch (error) {
        document.getElementById('conteudo').innerHTML = `<div class="card">${escapeHtml(error.message)}</div>`;
      }
    }

    document.getElementById('btnImprimir').addEventListener('click', () => {
      window.print();
    });

    carregar();
  </script>
</body>
</html>
