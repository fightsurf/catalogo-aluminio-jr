<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhe da Semana</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #111827;
      --danger: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, a.button {
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(900px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
      border: 1px solid var(--line);
    }
    .modal-header,
    .modal-body,
    .modal-footer { padding: 18px; }
    .modal-header {
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .modal-body { display: grid; gap: 16px; }
    .modal-footer {
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }
    .field textarea {
      min-height: 140px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .feedback {
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }
    .feedback.success {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }
    .feedback.error {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #b91c1c;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .muted { color: var(--muted); }
    .resumo-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .resumo-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .resumo-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .resumo-valor {
      font-size: 18px;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
    }
    th { color: var(--muted); font-size: 13px; }
    .acoes-carrada {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      align-items: center;
      white-space: nowrap;
    }
    .acoes-carrada .button {
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }
    .acoes-coluna {
      min-width: 220px;
      white-space: nowrap;
    }
    .linha-total td {
      background: #111827;
      color: #fff;
      font-weight: 700;
      border-bottom: 0;
    }
    @media (max-width: 900px) {
      .resumo-grid {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }
    }
    @media (max-width: 640px) {
      .resumo-grid {
        grid-template-columns: 1fr;
      }
      .modal-header {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 id="titulo">Semana</h1>
        <p class="muted" id="subtitulo"></p>
      </div>
      <div class="actions">
        <button class="btn-secondary" id="btnSemanaAnterior" disabled>Semana anterior</button>
        <button class="btn-secondary" id="btnProximaSemana" disabled>Próxima semana</button>
        <a class="button btn-secondary" href="/legado/semanas">Voltar</a>
        <button class="btn-secondary" id="btnResumo">Resumo da semana</button>
        <button class="btn-secondary" id="btnResumoProducao">Resumo para produção</button>
        <button class="btn-primary" id="btnEnviarWhatsappSemana">Enviar WhatsApp da semana</button>
        <button class="btn-secondary" id="btnEditar">Editar</button>
        <button class="btn-danger" id="btnExcluir">Excluir</button>
      </div>
    </div>

    <div id="conteudo">
      <div class="card">Carregando semana...</div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalWhatsappSemanaBackdrop">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3 id="modalWhatsappSemanaTitulo">Enviar WhatsApp da semana</h3>
          <p class="muted" id="modalWhatsappSemanaSubtitulo"></p>
        </div>
        <button class="btn-secondary" data-close-modal="modalWhatsappSemanaBackdrop">Fechar</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="textareaWhatsappSemanaMensagem">Mensagem personalizada</label>
          <textarea id="textareaWhatsappSemanaMensagem" placeholder="Digite a mensagem que será enviada uma vez para cada cliente da semana."></textarea>
        </div>
        <div class="feedback" id="feedbackWhatsappSemana">O sistema enviará apenas uma mensagem por cliente, mesmo que ele tenha mais de um pedido na semana.</div>
        <div id="resumoWhatsappSemana" style="display:none; margin-top:12px;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" data-close-modal="modalWhatsappSemanaBackdrop">Cancelar</button>
        <button class="btn-primary" id="btnWhatsappSemanaEnviar">Enviar mensagens</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    let semanaAtual = null;

    function escapeHtml(valor) {
      return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatarData(valor) {
      if (!valor) return '';

      const texto = String(valor).trim();
      const matchIso = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);

      if (matchIso) {
        return `${matchIso[3]}/${matchIso[2]}/${matchIso[1]}`;
      }

      const data = new Date(texto);
      if (Number.isNaN(data.getTime())) return texto;

      const dia = String(data.getDate()).padStart(2, '0');
      const mes = String(data.getMonth() + 1).padStart(2, '0');
      const ano = data.getFullYear();
      return `${dia}/${mes}/${ano}`;
    }

    function obterTimestampData(valor) {
      if (!valor) return NaN;

      const texto = String(valor).trim();
      const matchIso = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);

      if (matchIso) {
        return Date.UTC(Number(matchIso[1]), Number(matchIso[2]) - 1, Number(matchIso[3]));
      }

      const data = new Date(texto);
      return data.getTime();
    }

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function formatarQuantidade(valor) {
      return Number(valor || 0).toLocaleString('pt-BR');
    }

    async function request(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(data.error || data.message || 'Falha na requisição.');
      }

      return data.data;
    }

    function setFeedback(elemento, mensagem, tipo = '') {
      if (!elemento) return;
      elemento.className = `feedback${tipo ? ` ${tipo}` : ''}`;
      elemento.textContent = mensagem;
    }

    function abrirModal(backdrop) {
      if (backdrop) {
        backdrop.classList.add('open');
      }
    }

    function fecharModal(backdrop) {
      if (backdrop) {
        backdrop.classList.remove('open');
      }
    }

    function renderSemana(semana) {
      document.getElementById('titulo').textContent = 'Detalhe da semana';
      document.getElementById('subtitulo').textContent = `Período: ${formatarData(semana.data_inicial)} até ${formatarData(semana.data_final)} | Descrição: ${semana.descricao || '-'}`;

      const conteudo = document.getElementById('conteudo');
      const carradas = Array.isArray(semana.carradas) ? semana.carradas : [];
      const totais = semana.totais || {};

      conteudo.innerHTML = `
        <section class="card">
          <h2>Resumo da semana</h2>
          <div class="resumo-grid">
            <div class="resumo-item">
              <div class="resumo-label">Data inicial</div>
              <div class="resumo-valor">${escapeHtml(formatarData(semana.data_inicial))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Data final</div>
              <div class="resumo-valor">${escapeHtml(formatarData(semana.data_final))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade de carradas</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_carradas))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade de pedidos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_pedidos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Pedidos prontos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_pedidos_prontos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Pedidos a produzir</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_pedidos_a_produzir))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade total de itens</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_itens))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Itens de pedidos prontos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_itens_prontos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Itens a produzir</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(totais.quantidade_itens_a_produzir))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Total geral dos pedidos</div>
              <div class="resumo-valor">${escapeHtml(formatarMoeda(totais.total_geral_pedidos))}</div>
            </div>
            <div class="resumo-item" style="grid-column: 1 / -1;">
              <div class="resumo-label">Descrição</div>
              <div class="resumo-valor">${escapeHtml(semana.descricao || '-')}</div>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Carradas da semana</h2>
          ${carradas.length ? `
            <table>
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Data</th>
                  <th>Descrição</th>
                  <th>Pedidos</th>
                  <th>Pedidos prontos</th>
                  <th>Pedidos a produzir</th>
                  <th>Total itens</th>
                  <th>Itens prontos</th>
                  <th>Itens a produzir</th>
                  <th>Total dos pedidos</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                ${carradas.map((carrada) => `
                  <tr>
                    <td>${escapeHtml(carrada.codigo)}</td>
                    <td>${escapeHtml(formatarData(carrada.data))}</td>
                    <td>${escapeHtml(carrada.descricao || '-')}</td>
                    <td>${escapeHtml(formatarQuantidade(carrada.quantidade_pedidos))}</td>
                    <td>${escapeHtml(formatarQuantidade(carrada.quantidade_pedidos_prontos))}</td>
                    <td>${escapeHtml(formatarQuantidade(carrada.quantidade_pedidos_a_produzir))}</td>
                    <td>${escapeHtml(formatarQuantidade(carrada.quantidade_itens))}</td>
                    <td>${escapeHtml(formatarQuantidade(carrada.quantidade_itens_prontos))}</td>
                    <td>${escapeHtml(formatarQuantidade(carrada.quantidade_itens_a_produzir))}</td>
                    <td>${escapeHtml(formatarMoeda(carrada.total_pedidos))}</td>
                    <td class="acoes-coluna">
                      <div class="acoes-carrada">
                        <a class="button btn-secondary" href="/legado/carradas/detalhe?codigo=${encodeURIComponent(carrada.codigo)}" title="Abrir carrada">Abrir</a>
                        <a class="button btn-secondary" href="/legado/carradas/progresso?codigo=${encodeURIComponent(carrada.codigo)}" title="Progresso">Progresso</a>
                        <a class="button btn-secondary" href="/legado/pedidos-insercao-v2?carrada_codigo=${encodeURIComponent(carrada.codigo)}" title="Inserir pedido">Ins. Pedido</a>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot>
                <tr class="linha-total">
                  <td></td>
                  <td></td>
                  <td>Total geral</td>
                  <td>${escapeHtml(formatarQuantidade(totais.quantidade_pedidos))}</td>
                  <td>${escapeHtml(formatarQuantidade(totais.quantidade_pedidos_prontos))}</td>
                  <td>${escapeHtml(formatarQuantidade(totais.quantidade_pedidos_a_produzir))}</td>
                  <td>${escapeHtml(formatarQuantidade(totais.quantidade_itens))}</td>
                  <td>${escapeHtml(formatarQuantidade(totais.quantidade_itens_prontos))}</td>
                  <td>${escapeHtml(formatarQuantidade(totais.quantidade_itens_a_produzir))}</td>
                  <td>${escapeHtml(formatarMoeda(totais.total_geral_pedidos))}</td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          ` : '<div class="muted" style="padding-top: 12px;">Nenhuma carrada vinculada nesta semana.</div>'}
        </section>
      `;
    }

    async function inicializarNavegacaoSemanas(semanaAtual) {
      const btnAnterior = document.getElementById('btnSemanaAnterior');
      const btnProxima = document.getElementById('btnProximaSemana');

      if (!btnAnterior || !btnProxima || !semanaAtual) {
        return;
      }

      btnAnterior.disabled = true;
      btnProxima.disabled = true;

      const dataAtualTs = obterTimestampData(semanaAtual.data_inicial);
      if (Number.isNaN(dataAtualTs)) {
        return;
      }

      try {
        const semanas = await request('/api/legado/semanas');
        const lista = Array.isArray(semanas) ? semanas : [];

        const ordenadas = lista
          .map((semana) => ({
            ...semana,
            _dataTs: obterTimestampData(semana.data_inicial),
            _id: Number(semana.id || 0)
          }))
          .filter((semana) => !Number.isNaN(semana._dataTs) && semana._id > 0)
          .sort((a, b) => {
            if (a._dataTs !== b._dataTs) return a._dataTs - b._dataTs;
            return a._id - b._id;
          });

        const anterior = [...ordenadas]
          .reverse()
          .find((semana) => semana._dataTs < dataAtualTs);

        const proxima = ordenadas
          .find((semana) => semana._dataTs > dataAtualTs);

        if (anterior?.id) {
          btnAnterior.disabled = false;
          btnAnterior.addEventListener('click', () => {
            window.location.href = `/legado/semanas/detalhe?id=${encodeURIComponent(anterior.id)}`;
          });
        }

        if (proxima?.id) {
          btnProxima.disabled = false;
          btnProxima.addEventListener('click', () => {
            window.location.href = `/legado/semanas/detalhe?id=${encodeURIComponent(proxima.id)}`;
          });
        }
      } catch (error) {
        console.warn('Não foi possível carregar a navegação entre semanas:', error);
      }
    }

    function abrirModalWhatsappSemana() {
      const backdrop = document.getElementById('modalWhatsappSemanaBackdrop');
      const subtitulo = document.getElementById('modalWhatsappSemanaSubtitulo');
      const textarea = document.getElementById('textareaWhatsappSemanaMensagem');
      const feedback = document.getElementById('feedbackWhatsappSemana');
      const resumo = document.getElementById('resumoWhatsappSemana');

      if (subtitulo) {
        subtitulo.textContent = semanaAtual
          ? `${formatarData(semanaAtual.data_inicial)} até ${formatarData(semanaAtual.data_final)} • ${semanaAtual.descricao || 'Sem descrição'}`
          : 'Semana selecionada';
      }

      if (textarea) {
        textarea.value = '';
      }

      if (resumo) {
        resumo.style.display = 'none';
        resumo.innerHTML = '';
      }

      setFeedback(feedback, 'O sistema enviará apenas uma mensagem por cliente, mesmo que ele tenha mais de um pedido na semana.', '');
      abrirModal(backdrop);
    }

    function renderResumoWhatsappSemana(data) {
      const resumo = document.getElementById('resumoWhatsappSemana');
      if (!resumo) return;

      const itens = Array.isArray(data?.itens) ? data.itens : [];
      const linhas = itens.map((item) => {
        const status = item?.status === 'enviado'
          ? 'Enviado'
          : item?.status === 'sem_telefone'
            ? 'Sem telefone'
            : 'Erro';
        const detalhe = item?.erro ? ` • ${escapeHtml(item.erro)}` : '';
        return `<li><strong>${escapeHtml(item?.nomeCliente || '-')}</strong> • Pedido(s): ${escapeHtml(item?.numeroPedido || '-')} • Carrada(s): ${escapeHtml(item?.codigoCarrada || '-')} • ${escapeHtml(status)}${detalhe}</li>`;
      }).join('');

      resumo.innerHTML = `
        <div class="card" style="padding:12px; margin-bottom:0;">
          <div style="font-weight:700; margin-bottom:6px;">Resumo do envio</div>
          <div class="muted" style="font-size:12px;">
            Carradas: <strong>${escapeHtml(data?.totalCarradas || 0)}</strong> •
            Pedidos: <strong>${escapeHtml(data?.totalPedidos || 0)}</strong> •
            Clientes: <strong>${escapeHtml(data?.totalClientes || 0)}</strong> •
            Enviados: <strong>${escapeHtml(data?.enviadosSucesso || 0)}</strong> •
            Sem telefone: <strong>${escapeHtml(data?.semTelefone || 0)}</strong> •
            Erros: <strong>${escapeHtml(data?.comErro || 0)}</strong>
          </div>
          ${linhas ? `<ul style="margin:12px 0 0 18px; padding:0;">${linhas}</ul>` : ''}
        </div>
      `;
      resumo.style.display = 'block';
    }

    async function enviarWhatsappSemanaModal() {
      const textarea = document.getElementById('textareaWhatsappSemanaMensagem');
      const feedback = document.getElementById('feedbackWhatsappSemana');
      const botao = document.getElementById('btnWhatsappSemanaEnviar');
      const mensagemPersonalizada = textarea?.value?.trim() || '';

      if (!mensagemPersonalizada) {
        setFeedback(feedback, 'Digite a mensagem personalizada.', 'error');
        return;
      }

      const textoOriginal = botao?.textContent || 'Enviar mensagens';
      if (botao) {
        botao.disabled = true;
        botao.textContent = 'Enviando...';
      }

      try {
        const data = await request(`/api/legado/semanas/${encodeURIComponent(id)}/whatsapp/lote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensagemPersonalizada })
        });

        setFeedback(feedback, `Envio concluído. ${data?.enviadosSucesso || 0} cliente(s) enviado(s) com sucesso.`, 'success');
        renderResumoWhatsappSemana(data);
      } catch (error) {
        setFeedback(feedback, error.message, 'error');
      } finally {
        if (botao) {
          botao.disabled = false;
          botao.textContent = textoOriginal;
        }
      }
    }

    async function carregar() {
      if (!id) {
        document.getElementById('conteudo').innerHTML = '<div class="card">ID da semana não informado.</div>';
        return;
      }

      try {
        const semana = await request(`/api/legado/semanas/${id}`);
        semanaAtual = semana;
        renderSemana(semana);
        await inicializarNavegacaoSemanas(semana);
      } catch (error) {
        document.getElementById('conteudo').innerHTML = `<div class="card">${escapeHtml(error.message)}</div>`;
      }
    }

    document.querySelectorAll('[data-close-modal]').forEach((botao) => {
      botao.addEventListener('click', () => {
        const target = document.getElementById(botao.dataset.closeModal);
        if (target) {
          fecharModal(target);
        }
      });
    });

    document.querySelectorAll('.modal-backdrop').forEach((backdrop) => {
      backdrop.addEventListener('click', (event) => {
        if (event.target === backdrop) {
          fecharModal(backdrop);
        }
      });
    });

    document.getElementById('btnEnviarWhatsappSemana').addEventListener('click', abrirModalWhatsappSemana);
    document.getElementById('btnWhatsappSemanaEnviar').addEventListener('click', enviarWhatsappSemanaModal);

    document.getElementById('btnResumo').addEventListener('click', () => {
      if (!id) return;
      window.location.href = `/legado/semanas/resumo?id=${encodeURIComponent(id)}`;
    });

    document.getElementById('btnResumoProducao').addEventListener('click', () => {
      if (!id) return;
      window.location.href = `/legado/semanas/resumo-producao?id=${encodeURIComponent(id)}`;
    });

    document.getElementById('btnEditar').addEventListener('click', () => {
      if (!id) return;
      window.location.href = `/legado/semanas?id=${encodeURIComponent(id)}`;
    });

    document.getElementById('btnExcluir').addEventListener('click', async () => {
      if (!id) return;
      if (!confirm('Deseja excluir esta semana?')) {
        return;
      }

      try {
        await request(`/api/legado/semanas/${id}`, { method: 'DELETE' });
        window.location.href = '/legado/semanas';
      } catch (error) {
        alert(error.message);
      }
    });

    carregar();
  </script>
</body>
</html>
