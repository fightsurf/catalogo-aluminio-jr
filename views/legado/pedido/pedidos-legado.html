<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos do Legado - Alumínio JR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
      padding: 18px;
    }

    .titulo-pagina {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .layout {
      max-width: 1000px;
      margin: 0 auto;
    }

    .box {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 16px;
      margin-bottom: 16px;
    }

    .box h2 {
      margin: 0 0 14px 0;
      font-size: 18px;
    }

    .busca-linha {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 260px;
      flex: 1;
    }

    .campo label {
      font-size: 14px;
      font-weight: 600;
    }

    .campo input {
      height: 38px;
      border: 1px solid #cfd6dd;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 14px;
      outline: none;
    }

    .campo input:focus {
      border-color: #3b82f6;
    }

    .btn {
      height: 38px;
      border: none;
      border-radius: 4px;
      padding: 0 16px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #0ea5b7;
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .mensagem {
      margin-top: 12px;
      font-size: 14px;
      color: #374151;
    }

    .erro {
      color: #dc2626;
      font-weight: 600;
    }

    .cliente-nome {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #111827;
      text-transform: uppercase;
    }

    .cliente-dados-linha {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .cliente-linha {
      font-size: 14px;
      color: #374151;
      margin-bottom: 6px;
    }

    .placeholder {
      color: #6b7280;
      font-size: 15px;
    }

    .tabela-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #f9fafb;
      font-weight: 600;
      color: #374151;
    }

    .right {
      text-align: right;
    }

    .sem-itens {
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="layout">

    <div class="titulo-pagina">📦 Pedidos do Legado</div>

    <!-- BUSCA -->
    <div class="box">
      <h2>Pesquisar Pedido</h2>

      <div class="busca-linha">
        <div class="campo">
          <label for="numeroPedido">Número do pedido</label>
          <input
            type="text"
            id="numeroPedido"
            placeholder="Digite o número do pedido"
          />
        </div>

        <button id="btnPesquisar" class="btn btn-primary">
          Pesquisar pedido
        </button>
      </div>

      <div id="mensagem" class="mensagem">Aguardando pesquisa.</div>
    </div>

    <!-- CLIENTE -->
    <div class="box">
      <div id="dadosCliente">
        <div class="placeholder">Nenhum pedido carregado.</div>
      </div>
    </div>

    <!-- ITENS -->
    <div class="box">
      <div id="blocoItens" class="sem-itens">Nenhum item carregado.</div>
    </div>

  </div>

  <script>
    const numeroPedidoInput = document.getElementById('numeroPedido');
    const btnPesquisar = document.getElementById('btnPesquisar');
    const mensagem = document.getElementById('mensagem');
    const dadosCliente = document.getElementById('dadosCliente');
    const blocoItens = document.getElementById('blocoItens');

    function setMensagem(texto, erro = false) {
      mensagem.textContent = texto;
      mensagem.className = erro ? 'mensagem erro' : 'mensagem';
    }

    function limparCliente() {
      dadosCliente.innerHTML = '<div class="placeholder">Nenhum pedido carregado.</div>';
    }

    function limparItens() {
      blocoItens.innerHTML = '<div class="sem-itens">Nenhum item carregado.</div>';
    }

    function moeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function numero(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    function renderizarCliente(cliente, dataPedido) {
      const dataFormatada = dataPedido
        ? new Date(dataPedido).toLocaleDateString('pt-BR')
        : '-';

      dadosCliente.innerHTML = `
        <div class="cliente-linha"><strong>Data:</strong> ${dataFormatada}</div>

        <div class="cliente-nome">${cliente?.nome || '-'}</div>

        <div class="cliente-dados-linha">
          <div class="cliente-linha"><strong>Cidade:</strong> ${cliente?.cidade || '-'}</div>
          <div class="cliente-linha"><strong>UF:</strong> ${cliente?.uf || '-'}</div>
        </div>
      `;
    }

    function renderizarItens(itens) {
      if (!itens || !itens.length) {
        blocoItens.innerHTML = '<div class="sem-itens">Nenhum item encontrado.</div>';
        return;
      }

      const totalQuantidade = itens.reduce((acc, item) => acc + Number(item.quantidade || 0), 0);
      const totalSubtotal = itens.reduce((acc, item) => acc + Number(item.subtotal || 0), 0);

      blocoItens.innerHTML = `
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr>
                <th>Descrição</th>
                <th class="right">Quantidade</th>
                <th class="right">Preço</th>
                <th class="right">Subtotal</th>
              </tr>
            </thead>
            <tbody>
              ${itens.map((item) => `
                <tr>
                  <td>${item.descricao || '-'}</td>
                  <td class="right">${numero(item.quantidade)}</td>
                  <td class="right">${moeda(item.preco)}</td>
                  <td class="right">${moeda(item.subtotal)}</td>
                </tr>
              `).join('')}

              <tr style="background:#000; color:#fff; font-weight:bold;">
                <td>Total</td>
                <td class="right">${numero(totalQuantidade)}</td>
                <td></td>
                <td class="right">${moeda(totalSubtotal)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    async function pesquisarPedidos() {
      const numeroPedido = numeroPedidoInput.value.trim();

      limparCliente();
      limparItens();

      if (!numeroPedido) {
        setMensagem('Informe o número do pedido.', true);
        return;
      }

      setMensagem('Pesquisando...');

      try {
        const response = await fetch(`/api/legado/pedidos?numero=${encodeURIComponent(numeroPedido)}`);
        const json = await response.json();

        if (!response.ok || !json.success) {
          throw new Error(json.message || 'Erro ao pesquisar pedidos.');
        }

        const pedidos = json.data || [];

        if (!pedidos.length) {
          setMensagem('Nenhum pedido encontrado.', true);
          return;
        }

        const primeiroPedido = pedidos[0];

        renderizarCliente(primeiroPedido.cliente, primeiroPedido.data);

        const responseItens = await fetch(`/api/legado/pedidos/${primeiroPedido.idMestre}/itens`);
        const jsonItens = await responseItens.json();

        if (!responseItens.ok || !jsonItens.success) {
          throw new Error(jsonItens.message || 'Erro ao carregar itens.');
        }

        renderizarItens(jsonItens.data?.itens || []);

        setMensagem('Cliente carregado.');
      } catch (error) {
        limparCliente();
        limparItens();
        setMensagem(error.message || 'Erro ao pesquisar pedidos.', true);
      }
    }

    btnPesquisar.addEventListener('click', pesquisarPedidos);

    numeroPedidoInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        pesquisarPedidos();
      }
    });
  </script>
</body>
</html>
