<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedidos do Legado - Alumínio JR</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --border: #dcdfe3;
      --header: #f5f7fa;
      --text: #1f2937;
      --subtext: #6b7280;

      --primary: #2563eb;
      --primary-soft: #eff6ff;

      --table-head: #f1f5f9;
      --hover: #f9fafb;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .pagina {
      max-width: 1200px;
      margin: 10px auto;
      padding: 0 10px;
    }

    .topo {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input {
      height: 36px;
      border: 1px solid var(--border);
      padding: 0 10px;
      font-size: 14px;
      background: #fff;
    }

    button {
      height: 36px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .mensagem {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .erro {
      color: red;
      font-weight: bold;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      grid-template-rows: 120px 1fr;
      gap: 10px;
      height: calc(100vh - 100px);
    }

    .bloco {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .titulo {
      background: var(--header);
      border-bottom: 1px solid var(--border);
      padding: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--subtext);
    }

    .conteudo {
      padding: 10px;
      height: calc(100% - 28px);
      overflow: auto;
    }

    .cliente {
      grid-row: 1 / 3;
    }

    .cliente-nome {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .dados-pedido {
      display: grid;
      grid-template-columns: 1fr 120px 120px;
      gap: 10px;
    }

    .campo {
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .campo-label {
      background: var(--table-head);
      font-size: 12px;
      text-align: center;
      padding: 4px;
      border-bottom: 1px solid var(--border);
    }

    .campo-valor {
      padding: 6px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }

    .observacao {
      border: 1px solid var(--border);
      background: #fff;
      padding: 8px;
      font-size: 13px;
    }

    .pedido-card {
      border: 1px solid var(--border);
      padding: 8px;
      background: #fff;
      cursor: pointer;
      min-width: 220px;
    }

    .pedido-card:hover {
      background: var(--hover);
    }

    .pedido-card.ativo {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .lista {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 6px;
      font-size: 13px;
    }

    th {
      background: var(--table-head);
      color: var(--subtext);
    }

    tr:hover td {
      background: var(--hover);
    }

    .right { text-align: right; }

    .rodape {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="pagina">

  <div class="topo">
    <input type="text" id="numeroPedido" placeholder="Número do pedido">
    <button id="btnPesquisar">Pesquisar</button>
  </div>

  <div id="mensagem" class="mensagem">Aguardando pesquisa.</div>

  <div class="layout">

    <!-- CLIENTE -->
    <div class="bloco cliente">
      <div class="titulo">Cliente</div>
      <div id="dadosCliente" class="conteudo">
        <div class="cliente-nome">-</div>
        <div>-</div>
        <div>-</div>
      </div>
    </div>

    <!-- PEDIDO -->
    <div class="bloco">
      <div class="titulo">Pedido</div>
      <div class="conteudo">

        <div class="dados-pedido">
          <div class="observacao" id="observacaoPedido">-</div>

          <div class="campo">
            <div class="campo-label">Data</div>
            <div class="campo-valor" id="pedidoData">-</div>
          </div>

          <div class="campo">
            <div class="campo-label">Número</div>
            <div class="campo-valor" id="pedidoNumero">-</div>
          </div>
        </div>

        <div style="margin-top:10px; display:flex; gap:10px;">
          <div class="campo" style="flex:1;">
            <div class="campo-label">Total Produtos</div>
            <div class="campo-valor" id="pedidoTotalProdutos">R$ 0,00</div>
          </div>

          <div class="campo" style="flex:1;">
            <div class="campo-label">Desconto</div>
            <div class="campo-valor" id="pedidoDesconto">R$ 0,00</div>
          </div>

          <div class="campo" style="flex:1;">
            <div class="campo-label">Total</div>
            <div class="campo-valor" id="pedidoTotal">R$ 0,00</div>
          </div>
        </div>

      </div>
    </div>

    <!-- PRODUTOS -->
    <div class="bloco" style="grid-column:2;">
      <div class="titulo">Produtos</div>
      <div class="conteudo">

        <div id="listaPedidos" class="lista"></div>

        <table>
          <thead>
            <tr>
              <th>Descrição</th>
              <th class="right">Qtd</th>
              <th class="right">Preço</th>
              <th class="right">Subtotal</th>
            </tr>
          </thead>
          <tbody id="tabelaItensBody">
            <tr>
              <td colspan="4" style="text-align:center;">Nenhum pedido</td>
            </tr>
          </tbody>
        </table>

        <div class="rodape">
          <div>Itens: <span id="rodapeItens">0</span></div>
          <div>Qtd: <span id="rodapeQuantidade">0</span></div>
          <div>Total: <span id="rodapeTotal">R$ 0,00</span></div>
        </div>

      </div>
    </div>

  </div>

</div>

<script>
const numeroPedidoInput = document.getElementById('numeroPedido');
const btnPesquisar = document.getElementById('btnPesquisar');
const mensagem = document.getElementById('mensagem');
const listaPedidos = document.getElementById('listaPedidos');

function moeda(v){
  return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}

function data(d){
  if(!d) return '-';
  return new Date(d).toLocaleDateString('pt-BR');
}

btnPesquisar.onclick = async () => {
  const numero = numeroPedidoInput.value.trim();
  if(!numero) return;

  mensagem.innerText = 'Buscando...';
  listaPedidos.innerHTML = '';

  const res = await fetch(`/api/legado/pedidos?numero=${numero}`);
  const json = await res.json();

  if(!json.success){
    mensagem.innerText = 'Erro';
    return;
  }

  listaPedidos.innerHTML = json.data.map(p => `
    <div class="pedido-card" data-id="${p.idMestre}">
      ${p.numero} - ${moeda(p.total)}
    </div>
  `).join('');

  document.querySelectorAll('.pedido-card').forEach(card=>{
    card.onclick = () => carregar(card.dataset.id);
  });
};

async function carregar(id){
  const res = await fetch(`/api/legado/pedidos/${id}/itens`);
  const json = await res.json();

  const {pedido, cliente, itens} = json.data;

  document.getElementById('dadosCliente').innerHTML = `
    <div class="cliente-nome">${cliente.nome}</div>
    <div>${cliente.cidade}</div>
    <div>${cliente.uf}</div>
  `;

  document.getElementById('observacaoPedido').innerText = pedido.observacao;
  document.getElementById('pedidoNumero').innerText = pedido.numero;
  document.getElementById('pedidoData').innerText = data(pedido.data);
  document.getElementById('pedidoTotal').innerText = moeda(pedido.total);
  document.getElementById('pedidoDesconto').innerText = moeda(pedido.desconto);
  document.getElementById('pedidoTotalProdutos').innerText = moeda(pedido.totalProdutos);

  document.getElementById('tabelaItensBody').innerHTML = itens.map(i=>`
    <tr>
      <td>${i.descricao}</td>
      <td class="right">${i.quantidade}</td>
      <td class="right">${moeda(i.preco)}</td>
      <td class="right">${moeda(i.subtotal)}</td>
    </tr>
  `).join('');

  document.getElementById('rodapeItens').innerText = itens.length;
  document.getElementById('rodapeQuantidade').innerText =
    itens.reduce((a,b)=>a+Number(b.quantidade||0),0);

  document.getElementById('rodapeTotal').innerText =
    moeda(itens.reduce((a,b)=>a+Number(b.subtotal||0),0));
}
</script>

</body>
</html>
