<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos do Legado - Alumínio JR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
      padding: 18px;
    }

    .titulo-pagina {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .layout {
      max-width: 1000px;
      margin: 0 auto;
    }

    .box {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 16px;
      margin-bottom: 16px;
    }

    .box h2 {
      margin: 0 0 14px 0;
      font-size: 18px;
    }

    .busca-linha {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
    }

    .acoes-pedido {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .oculto {
      display: none !important;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
      flex: 1;
    }

    .campo label {
      font-size: 14px;
      font-weight: 600;
    }

    .campo input {
      height: 38px;
      border: 1px solid #cfd6dd;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 14px;
      outline: none;
    }

    .campo input:focus {
      border-color: #3b82f6;
    }

    .btn {
      height: 38px;
      border: none;
      border-radius: 4px;
      padding: 0 16px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #0ea5b7;
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .btn-whatsapp {
      background: #111827;
      color: #fff;
    }

    .btn-whatsapp:hover {
      opacity: 0.92;
    }

    .mensagem {
      margin-top: 12px;
      font-size: 14px;
      color: #374151;
    }

    .erro {
      color: #dc2626;
      font-weight: 600;
    }

    .cliente-nome {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #111827;
      text-transform: uppercase;
    }

    .cliente-dados-linha {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .cliente-linha {
      font-size: 14px;
      color: #374151;
      margin-bottom: 6px;
    }

    .telefone-link {
      color: #111827;
      font-weight: 600;
      text-decoration: underline;
    }

    .telefone-link:hover {
      color: #000;
    }

    .placeholder {
      color: #6b7280;
      font-size: 15px;
    }

    .tabela-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #f9fafb;
      font-weight: 600;
      color: #374151;
    }

    .right {
      text-align: right;
    }

    .sem-itens {
      color: #6b7280;
      font-size: 14px;
    }

    .resultados-box {
      margin-top: 14px;
      border-top: 1px solid #e5e7eb;
      padding-top: 14px;
    }

    .resultados-box h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
    }

    .resultado-lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .resultado-item {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      background: #fff;
      transition: 0.2s;
    }

    .resultado-item:hover {
      background: #f9fafb;
      border-color: #cfd6dd;
    }

    .resultado-item.ativo {
      border-color: #0ea5b7;
      background: #ecfeff;
    }

    .resultado-principal {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .resultado-secundario {
      font-size: 13px;
      color: #4b5563;
    }
  </style>
</head>

<body>
  <div class="layout">

    <div class="titulo-pagina">📦 Pedidos do Legado</div>

    <div class="box">
      <h2>Pesquisar Pedido</h2>

      <div class="busca-linha">
        <div class="campo">
          <label for="numeroPedido">Número do pedido</label>
          <input
            type="text"
            id="numeroPedido"
            placeholder="Digite o número do pedido"
          />
        </div>

        <div class="campo">
          <label for="clientePedido">Cliente</label>
          <input
            type="text"
            id="clientePedido"
            placeholder="Digite o nome do cliente"
          />
        </div>

        <div class="campo">
          <label for="dataPedido">Data</label>
          <input
            type="date"
            id="dataPedido"
          />
        </div>

        <button id="btnPesquisar" class="btn btn-primary">
          Pesquisar pedido
        </button>
      </div>

      <div id="mensagem" class="mensagem">Aguardando pesquisa.</div>

      <div id="resultadosBusca" class="resultados-box oculto">
        <h3>Resultados encontrados</h3>
        <div id="resultadoLista" class="resultado-lista"></div>
      </div>

      <div class="acoes-pedido">
        <button id="btnEnviarWhatsapp" class="btn btn-whatsapp oculto">Enviar para WhatsApp</button>
        <button id="btnImprimirRelatorio" class="btn btn-primary oculto">Imprimir relatório</button>
      </div>
    </div>

    <div class="box">
      <div id="dadosCliente">
        <div class="placeholder">Nenhum pedido carregado.</div>
      </div>
    </div>

    <div class="box">
      <div id="blocoItens" class="sem-itens">Nenhum item carregado.</div>
    </div>

  </div>

  <script>
    const numeroPedidoInput = document.getElementById('numeroPedido');
    const clientePedidoInput = document.getElementById('clientePedido');
    const dataPedidoInput = document.getElementById('dataPedido');
    const btnPesquisar = document.getElementById('btnPesquisar');
    const mensagem = document.getElementById('mensagem');
    const dadosCliente = document.getElementById('dadosCliente');
    const blocoItens = document.getElementById('blocoItens');
    const btnImprimirRelatorio = document.getElementById('btnImprimirRelatorio');
    const btnEnviarWhatsapp = document.getElementById('btnEnviarWhatsapp');
    const resultadosBusca = document.getElementById('resultadosBusca');
    const resultadoLista = document.getElementById('resultadoLista');

    let pedidoCarregado = null;
    let pedidosEncontrados = [];

    function setMensagem(texto, erro = false) {
      mensagem.textContent = texto;
      mensagem.className = erro ? 'mensagem erro' : 'mensagem';
    }

    function limparCliente() {
      dadosCliente.innerHTML = '<div class="placeholder">Nenhum pedido carregado.</div>';
      btnImprimirRelatorio.classList.add('oculto');
      btnEnviarWhatsapp.classList.add('oculto');
      btnEnviarWhatsapp.disabled = true;
      pedidoCarregado = null;
    }

    function limparItens() {
      blocoItens.innerHTML = '<div class="sem-itens">Nenhum item carregado.</div>';
    }

    function limparResultados() {
      pedidosEncontrados = [];
      resultadoLista.innerHTML = '';
      resultadosBusca.classList.add('oculto');
    }

    function moeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function normalizarTelefone(valor) {
      return String(valor || '').replace(/\D+/g, '');
    }

    function formatarTelefoneExibicao(valor) {
      const telefone = normalizarTelefone(valor);
      if (!telefone) return '';
      if (telefone.length === 13) return `+${telefone.slice(0, 2)} (${telefone.slice(2, 4)}) ${telefone.slice(4, 9)}-${telefone.slice(9)}`;
      if (telefone.length === 12) return `+${telefone.slice(0, 2)} (${telefone.slice(2, 4)}) ${telefone.slice(4, 8)}-${telefone.slice(8)}`;
      if (telefone.length === 11) return `(${telefone.slice(0, 2)}) ${telefone.slice(2, 7)}-${telefone.slice(7)}`;
      if (telefone.length === 10) return `(${telefone.slice(0, 2)}) ${telefone.slice(2, 6)}-${telefone.slice(6)}`;
      return telefone;
    }

    function formatarData(valor) {
      if (!valor) return '-';
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return valor;
      return data.toLocaleDateString('pt-BR');
    }

    function montarMensagemWhatsappPedido(pedido) {
      if (!pedido?.numero) return '';

      const linhas = [
        '📦 *Pedido Alumínio JR*',
        `Cliente: *${pedido?.cliente?.nome || '-'}*`,
        `Número do pedido: *${pedido?.numero || '-'}*`,
        `Vendedor: *${pedido?.vendedor?.nome || '-'}*`,
        '-----------------------------------------------'
      ];

      const itens = Array.isArray(pedido?.itens) ? pedido.itens : [];
      itens.forEach((item, index) => {
        linhas.push(`- ${item.descricao || '-'}`);
        linhas.push(`- QTD: ${Number(item.quantidade || 0)}`);
        linhas.push(`- Preço: *${moeda(item.preco || 0)}*`);
        linhas.push(`- Subtotal: *${moeda(item.subtotal || 0)}*`);
        if (index < itens.length - 1) {
          linhas.push('');
        }
      });

      if (itens.length) {
        linhas.push('');
      }
      linhas.push(`Total do pedido: *${moeda(pedido?.total || 0)}*`);

      if (pedido?.obs) {
        linhas.push('');
        linhas.push(`Observação: ${pedido.obs}`);
      }

      return linhas.join('\n');
    }

    function obterWhatsappHref(pedido) {
      const telefone = normalizarTelefone(pedido?.cliente?.telefonePrincipal || pedido?.cliente?.telefone1 || '');
      if (!telefone) return '#';
      const params = new URLSearchParams({ telefone, mensagem: montarMensagemWhatsappPedido(pedido) });
      return `${window.location.origin}/whatsapp/enviar?${params.toString()}`;
    }

    function numero(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    function abrirRelatorioPedido(pedido) {
      if (!pedido?.numero) {
        return;
      }

      const storageKey = `relatorio_pedido_${pedido.numero}_${Date.now()}`;

      localStorage.setItem(storageKey, JSON.stringify(pedido));
      window.open(`/legado/pedidos-relatorio?numero=${encodeURIComponent(pedido.numero)}&storageKey=${encodeURIComponent(storageKey)}&autoPrint=1`, '_blank');
    }

    function obterFiltrosDaUrl() {
      const params = new URLSearchParams(window.location.search);
      return {
        numero: (params.get('numero') || '').trim(),
        cliente: (params.get('cliente') || '').trim(),
        data: (params.get('data') || '').trim()
      };
    }

    function construirQuery(filtros) {
      const params = new URLSearchParams();

      if (filtros.numero) params.set('numero', filtros.numero);
      if (filtros.cliente) params.set('cliente', filtros.cliente);
      if (filtros.data) params.set('data', filtros.data);

      return params.toString();
    }

    function renderizarCliente(pedido) {
      const dataFormatada = pedido?.data
        ? new Date(pedido.data).toLocaleDateString('pt-BR')
        : '-';

      dadosCliente.innerHTML = `
        <div class="cliente-linha"><strong>Data:</strong> ${dataFormatada}</div>
        <div class="cliente-linha"><strong>Número:</strong> ${pedido?.numero || '-'}</div>
        <div class="cliente-linha"><strong>Vendedor:</strong> ${pedido?.vendedor?.nome || '-'}</div>

        <div class="cliente-nome">${pedido?.cliente?.nome || '-'}</div>

        <div class="cliente-dados-linha">
          <div class="cliente-linha"><strong>Cidade:</strong> ${pedido?.cliente?.cidade || '-'}</div>
          <div class="cliente-linha"><strong>UF:</strong> ${pedido?.cliente?.uf || '-'}</div>
          <div class="cliente-linha"><strong>Telefone:</strong> ${normalizarTelefone(pedido?.cliente?.telefonePrincipal || pedido?.cliente?.telefone1 || '') ? `<a class="telefone-link" href="${obterWhatsappHref(pedido)}" target="_blank" rel="noopener noreferrer">${formatarTelefoneExibicao(pedido?.cliente?.telefonePrincipal || pedido?.cliente?.telefone1 || '')}</a>` : 'Telefone não encontrado.'}</div>
          <div class="cliente-linha"><strong>Total:</strong> ${moeda(pedido?.total || 0)}</div>
        </div>
      `;
    }

    function renderizarItens(itens) {
      if (!itens || !itens.length) {
        blocoItens.innerHTML = '<div class="sem-itens">Nenhum item encontrado.</div>';
        return;
      }

      const totalQuantidade = itens.reduce((acc, item) => acc + Number(item.quantidade || 0), 0);
      const totalSubtotal = itens.reduce((acc, item) => acc + Number(item.subtotal || 0), 0);

      blocoItens.innerHTML = `
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr>
                <th>Descrição</th>
                <th class="right">Quantidade</th>
                <th class="right">Preço</th>
                <th class="right">Subtotal</th>
              </tr>
            </thead>
            <tbody>
              ${itens.map((item) => `
                <tr>
                  <td>${item.descricao || '-'}</td>
                  <td class="right">${numero(item.quantidade)}</td>
                  <td class="right">${moeda(item.preco)}</td>
                  <td class="right">${moeda(item.subtotal)}</td>
                </tr>
              `).join('')}

              <tr style="background:#000; color:#fff; font-weight:bold;">
                <td>Total</td>
                <td class="right">${numero(totalQuantidade)}</td>
                <td></td>
                <td class="right">${moeda(totalSubtotal)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    function renderizarResultados(pedidos) {
      if (!Array.isArray(pedidos) || !pedidos.length) {
        limparResultados();
        return;
      }

      resultadosBusca.classList.remove('oculto');
      resultadoLista.innerHTML = pedidos.map((pedido, index) => `
        <div class="resultado-item" data-index="${index}">
          <div class="resultado-principal">
            Pedido ${pedido?.numero || '-'} · ${pedido?.cliente?.nome || '-'}
          </div>
          <div class="resultado-secundario">
            Data: ${formatarData(pedido?.data)} · Cidade: ${pedido?.cliente?.cidade || '-'} / ${pedido?.cliente?.uf || '-'} · Total: ${moeda(pedido?.total || 0)}
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.resultado-item').forEach((item) => {
        item.addEventListener('click', async () => {
          const index = Number(item.dataset.index);
          const pedido = pedidosEncontrados[index];
          await carregarPedidoSelecionado(pedido);
          marcarResultadoAtivo(index);
        });
      });
    }

    function marcarResultadoAtivo(indexAtivo) {
      document.querySelectorAll('.resultado-item').forEach((item) => {
        item.classList.toggle('ativo', Number(item.dataset.index) === Number(indexAtivo));
      });

      pedidosEncontrados = pedidosEncontrados.filter((_, index) => index === Number(indexAtivo));

      resultadoLista.innerHTML = pedidosEncontrados.map((pedido, index) => `
        <div class="resultado-item ativo" data-index="${index}">
          <div class="resultado-principal">
            Pedido ${pedido?.numero || '-'} · ${pedido?.cliente?.nome || '-'}
          </div>
          <div class="resultado-secundario">
            Data: ${formatarData(pedido?.data)} · Cidade: ${pedido?.cliente?.cidade || '-'} / ${pedido?.cliente?.uf || '-'} · Total: ${moeda(pedido?.total || 0)}
          </div>
        </div>
      `).join('');
    }

    async function carregarPedidoSelecionado(pedidoBase) {
      const responseItens = await fetch(`/api/legado/pedidos/${pedidoBase.idMestre}/itens`);
      const jsonItens = await responseItens.json();

      if (!responseItens.ok || !jsonItens.success) {
        throw new Error(jsonItens.message || 'Erro ao carregar itens.');
      }

      pedidoCarregado = {
        idMestre: pedidoBase?.idMestre || null,
        numero: pedidoBase?.numero || '',
        data: pedidoBase?.data || null,
        cliente: pedidoBase?.cliente || {},
        vendedor: pedidoBase?.vendedor || {},
        obs: pedidoBase?.obs || '',
        total: Number(pedidoBase?.total || 0),
        itens: Array.isArray(jsonItens?.data?.itens) ? jsonItens.data.itens : []
      };

      renderizarCliente(pedidoCarregado);
      renderizarItens(pedidoCarregado.itens);
      btnImprimirRelatorio.classList.remove('oculto');
      btnEnviarWhatsapp.classList.remove('oculto');
      btnEnviarWhatsapp.disabled = !normalizarTelefone(pedidoCarregado?.cliente?.telefonePrincipal || pedidoCarregado?.cliente?.telefone1 || '');
    }

    async function pesquisarPedidos(filtrosExternos = null) {
      const filtros = filtrosExternos || {
        numero: numeroPedidoInput.value.trim(),
        cliente: clientePedidoInput.value.trim(),
        data: dataPedidoInput.value.trim()
      };

      limparCliente();
      limparItens();
      limparResultados();

      if (!filtros.numero && !filtros.cliente && !filtros.data) {
        setMensagem('Informe pelo menos um filtro: número, cliente ou data.', true);
        return;
      }

      setMensagem('Pesquisando...');

      try {
        const query = construirQuery(filtros);
        const response = await fetch(`/api/legado/pedidos?${query}`);
        const json = await response.json();

        if (!response.ok || !json.success) {
          throw new Error(json.message || 'Erro ao pesquisar pedidos.');
        }

        const pedidos = Array.isArray(json.data) ? json.data : [];
        pedidosEncontrados = pedidos;

        if (!pedidos.length) {
          setMensagem('Nenhum pedido encontrado.', true);
          return;
        }

        let pedidoSelecionado = null;
        let indiceSelecionado = -1;

        if (filtros.numero) {
          indiceSelecionado = pedidos.findIndex((item) => String(item?.numero || '').trim() === filtros.numero.trim());
          if (indiceSelecionado >= 0) {
            pedidoSelecionado = pedidos[indiceSelecionado];
          }
        }

        if (!pedidoSelecionado && pedidos.length === 1) {
          pedidoSelecionado = pedidos[0];
          indiceSelecionado = 0;
        }

        renderizarResultados(pedidos);

        if (pedidoSelecionado) {
          await carregarPedidoSelecionado(pedidoSelecionado);
          marcarResultadoAtivo(indiceSelecionado);
          setMensagem('Pedido carregado.');
        } else {
          setMensagem(`${pedidos.length} pedidos encontrados. Selecione um resultado.`);
        }
      } catch (error) {
        limparCliente();
        limparItens();
        limparResultados();
        setMensagem(error.message || 'Erro ao pesquisar pedidos.', true);
      }
    }

    btnPesquisar.addEventListener('click', () => pesquisarPedidos());

    btnImprimirRelatorio.addEventListener('click', () => {
      if (pedidoCarregado) {
        abrirRelatorioPedido(pedidoCarregado);
      }
    });

    btnEnviarWhatsapp.addEventListener('click', async () => {
      if (!pedidoCarregado?.numero) {
        setMensagem('Nenhum pedido carregado para envio.', true);
        return;
      }

      const telefone = normalizarTelefone(pedidoCarregado?.cliente?.telefonePrincipal || pedidoCarregado?.cliente?.telefone1 || '');
      if (!telefone) {
        setMensagem('Telefone do cliente não encontrado.', true);
        return;
      }

      const textoOriginal = btnEnviarWhatsapp.textContent;

      try {
        btnEnviarWhatsapp.disabled = true;
        btnEnviarWhatsapp.textContent = 'Enviando...';

        const response = await fetch('/api/whatsapp/enviar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telefone, mensagem: montarMensagemWhatsappPedido(pedidoCarregado) })
        });

        const json = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(json?.detalhe || json?.erro || json?.message || 'Erro ao enviar mensagem.');
        }

        setMensagem('Pedido enviado com sucesso pelo WhatsApp.');
      } catch (error) {
        setMensagem(error.message || 'Erro ao enviar mensagem.', true);
      } finally {
        btnEnviarWhatsapp.disabled = !normalizarTelefone(pedidoCarregado?.cliente?.telefonePrincipal || pedidoCarregado?.cliente?.telefone1 || '');
        btnEnviarWhatsapp.textContent = textoOriginal;
      }
    });

    [numeroPedidoInput, clientePedidoInput, dataPedidoInput].forEach((campo) => {
      campo.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          pesquisarPedidos();
        }
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      const filtrosUrl = obterFiltrosDaUrl();

      if (filtrosUrl.numero) numeroPedidoInput.value = filtrosUrl.numero;
      if (filtrosUrl.cliente) clientePedidoInput.value = filtrosUrl.cliente;
      if (filtrosUrl.data) dataPedidoInput.value = filtrosUrl.data;

      if (filtrosUrl.numero || filtrosUrl.cliente || filtrosUrl.data) {
        pesquisarPedidos(filtrosUrl);
      }
    });
  </script>
</body>
</html>
