<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos do Legado - Alumínio JR</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #cfd9e4;
      color: #111;
    }

    .pagina {
      width: 100%;
      max-width: 1200px;
      margin: 10px auto;
      padding: 0 10px;
    }

    .topo-busca {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .topo-busca input,
    .topo-busca button {
      height: 34px;
      border: 1px solid #7f8c99;
      padding: 0 10px;
      font-size: 14px;
    }

    .topo-busca input {
      width: 220px;
      background: #fff;
    }

    .topo-busca button {
      cursor: pointer;
      background: #e6edf5;
      font-weight: bold;
    }

    .mensagem {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .erro {
      color: #a50000;
      font-weight: bold;
    }

    .layout {
      border: 1px solid #6f8091;
      background: #d8e4f0;
      height: calc(100vh - 90px);
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: 120px 1fr;
      gap: 8px;
      padding: 8px;
    }

    .bloco {
      border: 1px solid #6f8091;
      background: #f2f2f2;
      min-width: 0;
      min-height: 0;
    }

    .titulo {
      background: #b8cadc;
      border-bottom: 1px solid #6f8091;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 8px;
    }

    .conteudo {
      padding: 8px;
      height: calc(100% - 26px);
      overflow: auto;
      font-size: 13px;
    }

    .cliente {
      grid-row: 1 / 3;
    }

    .cliente-nome {
      font-size: 22px;
      font-weight: bold;
      color: #b30000;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .cliente-linha {
      margin-bottom: 6px;
      font-size: 15px;
    }

    .vendedor-box {
      margin-top: 18px;
      border: 1px solid #6f8091;
      background: #fff;
      height: 34px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 14px;
    }

    .dados-pedido {
      display: grid;
      grid-template-columns: 1fr 130px 130px;
      gap: 8px;
      height: 100%;
    }

    .observacao-area {
      border: 1px solid #6f8091;
      background: #fff;
      padding: 8px;
      font-size: 13px;
      overflow: auto;
    }

    .campo-box {
      border: 1px solid #6f8091;
      background: #fff;
      display: flex;
      flex-direction: column;
      height: 55px;
    }

    .campo-label {
      background: #d5e0eb;
      border-bottom: 1px solid #6f8091;
      font-size: 12px;
      text-align: center;
      padding: 3px;
      font-weight: bold;
    }

    .campo-valor {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      padding: 0 8px;
      background: #fff;
    }

    .totais {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
    }

    .produtos {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .resultado-pedidos {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 8px;
    }

    .pedido-card {
      min-width: 240px;
      border: 1px solid #6f8091;
      background: #fff;
      padding: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .pedido-card:hover,
    .pedido-card.ativo {
      background: #dce8f4;
    }

    .tabela-area {
      flex: 1;
      border: 1px solid #6f8091;
      background: #fff;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #c7d1db;
      padding: 6px 8px;
      white-space: nowrap;
    }

    th {
      background: #d9e4ee;
      text-align: left;
    }

    .right {
      text-align: right;
    }

    .rodape {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="pagina">
    <div class="topo-busca">
      <input type="text" id="numeroPedido" placeholder="Número do pedido" />
      <button id="btnPesquisar">Pesquisar</button>
    </div>

    <div id="mensagem" class="mensagem">Aguardando pesquisa.</div>

    <div class="layout">
      <div class="bloco cliente">
        <div class="titulo">Dados do Cliente</div>
        <div id="dadosCliente" class="conteudo">
          <div class="cliente-nome">-</div>
          <div class="cliente-linha">Cidade: -</div>
          <div class="cliente-linha">UF: -</div>

          <div style="margin-top: 20px; font-weight: bold;">Vendedor</div>
          <div class="vendedor-box">-</div>
        </div>
      </div>

      <div class="bloco">
        <div class="titulo">Pedido</div>
        <div class="conteudo">
          <div class="dados-pedido">
            <div>
              <div class="observacao-area" id="observacaoPedido">-</div>

              <div class="totais">
                <div>Total: <span id="pedidoTotal">R$ 0,00</span></div>
              </div>
            </div>

            <div>
              <div class="campo-box">
                <div class="campo-label">Data</div>
                <div class="campo-valor" id="pedidoData">-</div>
              </div>

              <div class="campo-box" style="margin-top: 8px;">
                <div class="campo-label">Desconto</div>
                <div class="campo-valor" id="pedidoDesconto">R$ 0,00</div>
              </div>
            </div>

            <div>
              <div class="campo-box">
                <div class="campo-label">Número</div>
                <div class="campo-valor" id="pedidoNumero">-</div>
              </div>

              <div class="campo-box" style="margin-top: 8px;">
                <div class="campo-label">Total Produtos</div>
                <div class="campo-valor" id="pedidoTotalProdutos">R$ 0,00</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="produtos">
        <div id="listaPedidos" class="resultado-pedidos"></div>

        <div class="bloco" style="flex: 1; min-height: 0;">
          <div class="titulo">Produtos</div>
          <div class="conteudo" style="display:flex; flex-direction:column; min-height:0;">
            <div class="tabela-area">
              <table>
                <thead>
                  <tr>
                    <th>Descrição</th>
                    <th class="right">Qtd.</th>
                    <th class="right">Preço</th>
                    <th class="right">Subtotal</th>
                  </tr>
                </thead>
                <tbody id="tabelaItensBody">
                  <tr>
                    <td colspan="4" style="text-align:center;">Nenhum pedido carregado.</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="rodape">
              <div>Itens: <span id="rodapeItens">0</span></div>
              <div>Qtd: <span id="rodapeQuantidade">0,00</span></div>
              <div>Total: <span id="rodapeTotal">R$ 0,00</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const numeroPedidoInput = document.getElementById('numeroPedido');
    const btnPesquisar = document.getElementById('btnPesquisar');
    const mensagem = document.getElementById('mensagem');
    const listaPedidos = document.getElementById('listaPedidos');

    const dadosCliente = document.getElementById('dadosCliente');
    const observacaoPedido = document.getElementById('observacaoPedido');
    const pedidoNumero = document.getElementById('pedidoNumero');
    const pedidoData = document.getElementById('pedidoData');
    const pedidoTotal = document.getElementById('pedidoTotal');
    const pedidoDesconto = document.getElementById('pedidoDesconto');
    const pedidoTotalProdutos = document.getElementById('pedidoTotalProdutos');

    const tabelaItensBody = document.getElementById('tabelaItensBody');
    const rodapeItens = document.getElementById('rodapeItens');
    const rodapeQuantidade = document.getElementById('rodapeQuantidade');
    const rodapeTotal = document.getElementById('rodapeTotal');

    let pedidoAtivoId = null;

    function formatarData(dataIso) {
      if (!dataIso) return '-';
      const data = new Date(dataIso);
      if (Number.isNaN(data.getTime())) return dataIso;
      return data.toLocaleDateString('pt-BR');
    }

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function formatarNumero(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function setMensagem(texto, erro = false) {
      mensagem.textContent = texto;
      mensagem.className = erro ? 'mensagem erro' : 'mensagem';
    }

    function resetarTela() {
      dadosCliente.innerHTML = `
        <div class="cliente-nome">-</div>
        <div class="cliente-linha">Cidade: -</div>
        <div class="cliente-linha">UF: -</div>
        <div style="margin-top: 20px; font-weight: bold;">Vendedor</div>
        <div class="vendedor-box">-</div>
      `;

      observacaoPedido.textContent = '-';
      pedidoNumero.textContent = '-';
      pedidoData.textContent = '-';
      pedidoTotal.textContent = formatarMoeda(0);
      pedidoDesconto.textContent = formatarMoeda(0);
      pedidoTotalProdutos.textContent = formatarMoeda(0);

      tabelaItensBody.innerHTML = `
        <tr>
          <td colspan="4" style="text-align:center;">Nenhum pedido carregado.</td>
        </tr>
      `;

      rodapeItens.textContent = '0';
      rodapeQuantidade.textContent = '0,00';
      rodapeTotal.textContent = formatarMoeda(0);
    }

    function preencherCliente(cliente) {
      dadosCliente.innerHTML = `
        <div class="cliente-nome">${cliente.nome || '-'}</div>
        <div class="cliente-linha">Cidade: ${cliente.cidade || '-'}</div>
        <div class="cliente-linha">UF: ${cliente.uf || '-'}</div>
        <div style="margin-top: 20px; font-weight: bold;">Vendedor</div>
        <div class="vendedor-box">-</div>
      `;
    }

    function preencherPedido(pedido) {
      observacaoPedido.textContent = pedido.observacao || '-';
      pedidoNumero.textContent = pedido.numero || '-';
      pedidoData.textContent = formatarData(pedido.data);
      pedidoTotal.textContent = formatarMoeda(pedido.total);
      pedidoDesconto.textContent = formatarMoeda(pedido.desconto);
      pedidoTotalProdutos.textContent = formatarMoeda(pedido.totalProdutos);
    }

    function preencherItens(itens) {
      if (!itens.length) {
        tabelaItensBody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align:center;">Nenhum item encontrado.</td>
          </tr>
        `;
        rodapeItens.textContent = '0';
        rodapeQuantidade.textContent = '0,00';
        rodapeTotal.textContent = formatarMoeda(0);
        return;
      }

      tabelaItensBody.innerHTML = itens.map(item => `
        <tr>
          <td>${item.descricao || '-'}</td>
          <td class="right">${formatarNumero(item.quantidade)}</td>
          <td class="right">${formatarMoeda(item.preco)}</td>
          <td class="right">${formatarMoeda(item.subtotal)}</td>
        </tr>
      `).join('');

      const quantidadeTotal = itens.reduce((acc, item) => acc + Number(item.quantidade || 0), 0);
      const total = itens.reduce((acc, item) => acc + Number(item.subtotal || 0), 0);

      rodapeItens.textContent = String(itens.length);
      rodapeQuantidade.textContent = formatarNumero(quantidadeTotal);
      rodapeTotal.textContent = formatarMoeda(total);
    }

    async function pesquisarPedidos() {
      const numero = numeroPedidoInput.value.trim();

      listaPedidos.innerHTML = '';
      pedidoAtivoId = null;
      resetarTela();

      if (!numero) {
        setMensagem('Informe o número do pedido.', true);
        return;
      }

      setMensagem('Pesquisando...');

      try {
        const response = await fetch(`/api/legado/pedidos?numero=${encodeURIComponent(numero)}`);
        const json = await response.json();

        if (!response.ok || !json.success) {
          throw new Error(json.message || 'Erro ao pesquisar pedidos.');
        }

        const pedidos = json.data || [];

        if (!pedidos.length) {
          setMensagem('Nenhum pedido encontrado.', true);
          return;
        }

        listaPedidos.innerHTML = pedidos.map((pedido) => `
          <div class="pedido-card" data-id="${pedido.idMestre}">
            <div><strong>Pedido:</strong> ${pedido.numero || '-'}</div>
            <div><strong>Cliente:</strong> ${pedido.cliente?.nome || '-'}</div>
            <div><strong>Data:</strong> ${formatarData(pedido.data)}</div>
            <div><strong>Total:</strong> ${formatarMoeda(pedido.total)}</div>
          </div>
        `).join('');

        document.querySelectorAll('.pedido-card').forEach((card) => {
          card.addEventListener('click', () => carregarPedido(Number(card.dataset.id), card));
        });

        setMensagem(`${pedidos.length} pedido(s) encontrado(s).`);

        if (pedidos.length === 1) {
          const card = document.querySelector('.pedido-card');
          await carregarPedido(pedidos[0].idMestre, card);
        }
      } catch (error) {
        setMensagem(error.message || 'Erro ao pesquisar pedidos.', true);
      }
    }

    async function carregarPedido(idMestre, cardSelecionado) {
      try {
        pedidoAtivoId = idMestre;

        document.querySelectorAll('.pedido-card').forEach((card) => {
          card.classList.toggle('ativo', Number(card.dataset.id) === Number(idMestre));
        });

        setMensagem('Carregando pedido...');

        const response = await fetch(`/api/legado/pedidos/${idMestre}/itens`);
        const json = await response.json();

        if (!response.ok || !json.success) {
          throw new Error(json.message || 'Erro ao carregar pedido.');
        }

        const data = json.data || {};
        preencherPedido(data.pedido || {});
        preencherCliente(data.cliente || {});
        preencherItens(data.itens || []);

        setMensagem('Pedido carregado.');
      } catch (error) {
        setMensagem(error.message || 'Erro ao carregar pedido.', true);
      }
    }

    btnPesquisar.addEventListener('click', pesquisarPedidos);

    numeroPedidoInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        pesquisarPedidos();
      }
    });

    resetarTela();
  </script>
</body>
</html>
