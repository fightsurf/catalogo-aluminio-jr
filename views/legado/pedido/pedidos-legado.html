<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos do Legado - Alumínio JR</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
      padding: 18px;
    }

    .titulo-pagina {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .layout {
      max-width: 820px;
    }

    .box {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 16px;
      margin-bottom: 16px;
    }

    .box h2 {
      margin: 0 0 14px 0;
      font-size: 18px;
    }

    .busca-linha {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 260px;
      flex: 1;
    }

    .campo label {
      font-size: 14px;
      font-weight: 600;
    }

    .campo input {
      height: 38px;
      border: 1px solid #cfd6dd;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 14px;
      outline: none;
    }

    .campo input:focus {
      border-color: #3b82f6;
    }

    .btn {
      height: 38px;
      border: none;
      border-radius: 4px;
      padding: 0 16px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #0ea5b7;
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .mensagem {
      margin-top: 12px;
      font-size: 14px;
      color: #374151;
    }

    .erro {
      color: #dc2626;
      font-weight: 600;
    }

    .cliente-nome {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 14px;
      color: #111827;
    }

    .cliente-linha {
      font-size: 16px;
      margin-bottom: 10px;
      color: #374151;
    }

    .placeholder {
      color: #6b7280;
      font-size: 15px;
    }

    .lista-resultados {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .resultado-item {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      background: #f9fafb;
      transition: 0.2s;
    }

    .resultado-item:hover {
      background: #eef2ff;
      border-color: #93c5fd;
    }

    .resultado-item strong {
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="titulo-pagina">📦 Pedidos do Legado</div>

    <div class="box">
      <h2>Pesquisar Pedido</h2>

      <div class="busca-linha">
        <div class="campo">
          <label for="numeroPedido">Número do pedido</label>
          <input
            type="text"
            id="numeroPedido"
            placeholder="Digite o número do pedido"
          />
        </div>

        <button id="btnPesquisar" class="btn btn-primary">
          Pesquisar pedido
        </button>
      </div>

      <div id="mensagem" class="mensagem">Aguardando pesquisa.</div>

      <div id="listaResultados" class="lista-resultados"></div>
    </div>

    <div class="box">
      <h2>Dados do Cliente</h2>

      <div id="dadosCliente">
        <div class="placeholder">Nenhum pedido carregado.</div>
      </div>
    </div>
  </div>

  <script>
    const numeroPedidoInput = document.getElementById('numeroPedido');
    const btnPesquisar = document.getElementById('btnPesquisar');
    const mensagem = document.getElementById('mensagem');
    const listaResultados = document.getElementById('listaResultados');
    const dadosCliente = document.getElementById('dadosCliente');

    function formatarData(dataIso) {
      if (!dataIso) return '-';

      const data = new Date(dataIso);

      if (Number.isNaN(data.getTime())) {
        return dataIso;
      }

      return data.toLocaleDateString('pt-BR');
    }

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function setMensagem(texto, erro = false) {
      mensagem.textContent = texto;
      mensagem.className = erro ? 'mensagem erro' : 'mensagem';
    }

    function limparCliente() {
      dadosCliente.innerHTML = '<div class="placeholder">Nenhum pedido carregado.</div>';
    }

    function renderizarCliente(cliente, pedido) {
      dadosCliente.innerHTML = `
        <div class="cliente-nome">${cliente?.nome || '-'}</div>
        <div class="cliente-linha"><strong>Cidade:</strong> ${cliente?.cidade || '-'}</div>
        <div class="cliente-linha"><strong>UF:</strong> ${cliente?.uf || '-'}</div>
        <div class="cliente-linha"><strong>Pedido:</strong> ${pedido?.numero || '-'}</div>
        <div class="cliente-linha"><strong>Data:</strong> ${formatarData(pedido?.data)}</div>
        <div class="cliente-linha"><strong>Total:</strong> ${formatarMoeda(pedido?.total)}</div>
      `;
    }

    async function pesquisarPedidos() {
      const numero = numeroPedidoInput.value.trim();

      listaResultados.innerHTML = '';
      limparCliente();

      if (!numero) {
        setMensagem('Informe o número do pedido.', true);
        return;
      }

      setMensagem('Pesquisando...');

      try {
        const response = await fetch(`/api/legado/pedidos?numero=${encodeURIComponent(numero)}`);
        const json = await response.json();

        if (!response.ok || !json.success) {
          throw new Error(json.message || 'Erro ao pesquisar pedidos.');
        }

        const pedidos = json.data || [];

        if (!pedidos.length) {
          setMensagem('Nenhum pedido encontrado.', true);
          return;
        }

        setMensagem(`${pedidos.length} pedido(s) encontrado(s). Clique em um resultado.`);

        listaResultados.innerHTML = pedidos.map((pedido) => `
          <div class="resultado-item" data-id="${pedido.idMestre}">
            <strong>Pedido ${pedido.numero}</strong>
            <span>Cliente: ${pedido.cliente?.nome || '-'}</span><br>
            <span>Data: ${formatarData(pedido.data)}</span><br>
            <span>Total: ${formatarMoeda(pedido.total)}</span>
          </div>
        `).join('');

        document.querySelectorAll('.resultado-item').forEach((item, index) => {
          item.addEventListener('click', () => {
            const pedido = pedidos[index];
            renderizarCliente(pedido.cliente, pedido);
            setMensagem(`Pedido ${pedido.numero} carregado.`);
          });
        });

        if (pedidos.length === 1) {
          renderizarCliente(pedidos[0].cliente, pedidos[0]);
          setMensagem(`Pedido ${pedidos[0].numero} carregado.`);
        }
      } catch (error) {
        setMensagem(error.message || 'Erro ao pesquisar pedidos.', true);
      }
    }

    btnPesquisar.addEventListener('click', pesquisarPedidos);

    numeroPedidoInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        pesquisarPedidos();
      }
    });
  </script>
</body>
</html>
