<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhe da Carrada</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #111827;
      --danger: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .nav-carradas {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button, a.button {
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .muted { color: var(--muted); }
    .pedido-link,
    .cliente-link {
      color: inherit;
      text-decoration: none;
    }
    .cliente-link {
      font-weight: 700;
    }
    .pedido-link:hover,
    .cliente-link:hover {
      text-decoration: underline;
    }
    .pedido-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
    }
    th { color: var(--muted); font-size: 13px; }
    .linha-total-pedido td {
      background: #111827;
      color: #fff;
      font-weight: 700;
      border-bottom: 0;
    }
    .resumo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .resumo-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .resumo-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .resumo-valor {
      font-size: 18px;
      font-weight: 700;
    }
    .pedido-acoes {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: 230px;
    }
    .mover-carrada-box {
      display: none;
      width: 100%;
      max-width: 320px;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }
    .mover-carrada-box.ativo {
      display: block;
    }
    .mover-carrada-box label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .mover-carrada-box select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 10px;
      background: #fff;
      margin-bottom: 8px;
    }
    .mover-carrada-box .opcao-sem-whatsapp {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 13px;
      margin: 0 0 10px;
      cursor: pointer;
    }
    .mover-carrada-box .opcao-sem-whatsapp input {
      width: 16px;
      height: 16px;
      margin: 0;
      flex: 0 0 auto;
    }
    .mover-carrada-acoes {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    @media (max-width: 700px) {
      .resumo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 id="titulo">Carrada</h1>
        <p class="muted" id="subtitulo"></p>
      </div>
      <div class="actions">
        <div class="nav-carradas">
          <button class="btn-secondary" id="btnCarradaAnterior" disabled>Carrada anterior</button>
          <button class="btn-secondary" id="btnProximaCarrada" disabled>Próxima carrada</button>
        </div>
        <a class="button btn-secondary" href="/legado/carradas">Voltar</a>
        <button class="btn-secondary" id="btnResumoItens">Resumo de itens</button>
        <button class="btn-secondary" id="btnResumoProducao">Resumo para produção</button>
        <button class="btn-secondary" id="btnProgresso">Progresso</button>
        <button class="btn-secondary" id="btnEditar">Editar</button>
        <button class="btn-danger" id="btnExcluir">Excluir</button>
      </div>
    </div>

    <div id="conteudo">
      <div class="card">Carregando carrada...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get('codigo');

    function escapeHtml(valor) {
      return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatarData(valor) {
      if (!valor) return '';
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return String(valor);
      return data.toLocaleDateString('pt-BR');
    }

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function formatarQuantidade(valor) {
      return Number(valor || 0).toLocaleString('pt-BR');
    }

    function montarLabelCarrada(carrada) {
      const data = formatarData(carrada?.data);
      const descricao = String(carrada?.descricao || '').trim();
      return descricao ? `${data} - ${descricao}` : data;
    }

    async function carregarCarradasDisponiveis() {
      return request(`/api/legado/carradas/${codigo}/carradas-disponiveis?dias=120`);
    }

    async function moverPedido(numero, codigoDestino, enviarWhatsapp = true) {
      return request(`/api/legado/carradas/${codigo}/pedidos/mover`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero, codigoDestino, enviarWhatsapp })
      });
    }

    async function request(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(data.error || data.message || 'Falha na requisição.');
      }

      return data.data;
    }

    function calcularResumo(carrada) {
      const resumoBackend = carrada?.resumoProducao || {};

      if (Object.keys(resumoBackend).length) {
        return {
          totalPedidos: resumoBackend.quantidadePedidos,
          totalPedidosProntos: resumoBackend.quantidadePedidosProntos,
          totalPedidosAProduzir: resumoBackend.quantidadePedidosAProduzir,
          totalItens: resumoBackend.quantidadeItens,
          totalItensProntos: resumoBackend.quantidadeItensProntos,
          totalItensAProduzir: resumoBackend.quantidadeItensAProduzir,
          totalGeral: resumoBackend.totalPedidos
        };
      }

      const pedidos = Array.isArray(carrada.pedidos) ? carrada.pedidos : [];

      return pedidos.reduce((acc, pedido) => {
        const pedidoPronto = Boolean(pedido?.pedidoPronto || pedido?.pedido_pronto);
        const itens = Array.isArray(pedido.itens) ? pedido.itens : [];
        const quantidadePedido = itens.reduce((total, item) => total + Number(item.quantidade || 0), 0);

        acc.totalPedidos += 1;
        acc.totalItens += quantidadePedido;
        acc.totalGeral += Number(pedido.total || 0);

        if (pedidoPronto) {
          acc.totalPedidosProntos += 1;
          acc.totalItensProntos += quantidadePedido;
        } else {
          acc.totalPedidosAProduzir += 1;
          acc.totalItensAProduzir += quantidadePedido;
        }

        return acc;
      }, {
        totalPedidos: 0,
        totalPedidosProntos: 0,
        totalPedidosAProduzir: 0,
        totalItens: 0,
        totalItensProntos: 0,
        totalItensAProduzir: 0,
        totalGeral: 0
      });
    }

    function renderCarrada(carrada) {
      document.getElementById('titulo').textContent = `Carrada ${carrada.codigo}`;
      document.getElementById('subtitulo').textContent = `Data: ${formatarData(carrada.data)} | Descrição: ${carrada.descricao || '-'}`;

      const conteudo = document.getElementById('conteudo');
      const pedidos = Array.isArray(carrada.pedidos) ? carrada.pedidos : [];

      if (!pedidos.length) {
        conteudo.innerHTML = '<div class="card">Nenhum pedido nesta carrada.</div>';
        return;
      }

      const resumo = calcularResumo(carrada);

      conteudo.innerHTML = `
        ${pedidos.map((pedido) => {
          const itens = Array.isArray(pedido.itens) ? pedido.itens : [];
          const quantidadePedido = itens.reduce((total, item) => total + Number(item.quantidade || 0), 0);
          const numeroPedido = String(pedido.numero ?? '').trim();
          const numeroPedidoHtml = numeroPedido
            ? `<a class="pedido-link" href="/legado/pedidos?numero=${encodeURIComponent(numeroPedido)}" target="_blank" rel="noopener noreferrer">Pedido ${escapeHtml(numeroPedido)}</a>`
            : 'Pedido -';
          const nomeCliente = escapeHtml(pedido.cliente?.nome || '-');
          const nomeClienteHtml = pedido.cliente?.favorecido
            ? `<a class="cliente-link" href="/legado/pedidos-cliente?favorecido=${encodeURIComponent(pedido.cliente.favorecido)}" target="_blank" rel="noopener noreferrer">${nomeCliente}</a>`
            : nomeCliente;

          return `
            <section class="card">
              <div class="pedido-header">
                <div>
                  <h2>${numeroPedidoHtml}${pedido.pedidoPronto ? ' <span style="font-size:12px; color:#166534; background:#dcfce7; padding:3px 8px; border-radius:999px;">PRONTO</span>' : ''}</h2>
                  <div class="muted">Cliente: ${nomeClienteHtml} | Cidade: ${escapeHtml(((pedido.cliente?.cidade || '') + ((pedido.cliente?.uf || '') ? ' / ' + pedido.cliente.uf : '')).trim() || '-')} | Data: ${escapeHtml(formatarData(pedido.data))}</div>
                </div>
                <div class="pedido-acoes">
                  <button class="btn-secondary btn-mudar-carrada" data-numero="${escapeHtml(pedido.numero)}">Mudar de carrada</button>
                  <div class="mover-carrada-box" id="mover-${escapeHtml(pedido.numero)}">
                    <label for="select-${escapeHtml(pedido.numero)}">Carradas disponíveis</label>
                    <select id="select-${escapeHtml(pedido.numero)}" data-numero="${escapeHtml(pedido.numero)}">
                      <option value="">Carregando...</option>
                    </select>
                    <label class="opcao-sem-whatsapp" for="sem-whatsapp-${escapeHtml(pedido.numero)}">
                      <input type="checkbox" id="sem-whatsapp-${escapeHtml(pedido.numero)}" data-numero="${escapeHtml(pedido.numero)}" />
                      <span>Não enviar mensagem no WhatsApp ao cliente</span>
                    </label>
                    <div class="mover-carrada-acoes">
                      <button class="btn-secondary btn-cancelar-mover" data-numero="${escapeHtml(pedido.numero)}">Cancelar</button>
                      <button class="btn-primary btn-salvar-mover" data-numero="${escapeHtml(pedido.numero)}">Salvar</button>
                    </div>
                  </div>
                </div>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Subtotal</th>
                  </tr>
                </thead>
                <tbody>
                  ${itens.length ? itens.map((item) => `
                    <tr>
                      <td>${escapeHtml(item.descricao || '')}</td>
                      <td>${escapeHtml(formatarQuantidade(item.quantidade))}</td>
                      <td>${escapeHtml(formatarMoeda(item.preco))}</td>
                      <td>${escapeHtml(formatarMoeda(item.subtotal))}</td>
                    </tr>
                  `).join('') : '<tr><td colspan="4" class="muted">Nenhum item encontrado.</td></tr>'}
                </tbody>
                <tfoot>
                  <tr class="linha-total-pedido">
                    <td>Total do pedido</td>
                    <td>${escapeHtml(formatarQuantidade(quantidadePedido))}</td>
                    <td></td>
                    <td>${escapeHtml(formatarMoeda(pedido.total))}</td>
                  </tr>
                </tfoot>
              </table>
            </section>
          `;
        }).join('')}

        <section class="card">
          <h2>Resumo da carrada</h2>
          <div class="resumo-grid">
            <div class="resumo-item">
              <div class="resumo-label">Data da carrada</div>
              <div class="resumo-valor">${escapeHtml(formatarData(carrada.data))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Descrição da carrada</div>
              <div class="resumo-valor">${escapeHtml(carrada.descricao || '-')}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade de pedidos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalPedidos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Pedidos prontos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalPedidosProntos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Pedidos a produzir</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalPedidosAProduzir))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade de itens</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalItens))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Itens prontos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalItensProntos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Itens a produzir</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalItensAProduzir))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Total dos pedidos</div>
              <div class="resumo-valor">${escapeHtml(formatarMoeda(resumo.totalGeral))}</div>
            </div>
          </div>
        </section>
      `;
    }


    async function inicializarMoverCarrada() {
      const carradasDisponiveis = await carregarCarradasDisponiveis();
      const opcoes = Array.isArray(carradasDisponiveis) ? carradasDisponiveis : [];

      document.querySelectorAll('.btn-mudar-carrada').forEach((botao) => {
        botao.addEventListener('click', () => {
          const numero = botao.dataset.numero;
          const box = document.getElementById(`mover-${numero}`);
          const select = document.getElementById(`select-${numero}`);
          const checkboxSemWhatsapp = document.getElementById(`sem-whatsapp-${numero}`);
          if (!box || !select) return;

          select.innerHTML = `<option value="">Selecione uma carrada</option>` + opcoes.map((carrada) => (`
            <option value="${String(carrada.codigo)}">${escapeHtml(montarLabelCarrada(carrada))}</option>
          `)).join('');

          if (checkboxSemWhatsapp) checkboxSemWhatsapp.checked = false;
          box.classList.add('ativo');
        });
      });

      document.querySelectorAll('.btn-cancelar-mover').forEach((botao) => {
        botao.addEventListener('click', () => {
          const numero = botao.dataset.numero;
          const box = document.getElementById(`mover-${numero}`);
          const checkboxSemWhatsapp = document.getElementById(`sem-whatsapp-${numero}`);
          if (checkboxSemWhatsapp) checkboxSemWhatsapp.checked = false;
          if (box) box.classList.remove('ativo');
        });
      });

      document.querySelectorAll('.btn-salvar-mover').forEach((botao) => {
        botao.addEventListener('click', async () => {
          const numero = botao.dataset.numero;
          const select = document.getElementById(`select-${numero}`);
          const box = document.getElementById(`mover-${numero}`);
          const checkboxSemWhatsapp = document.getElementById(`sem-whatsapp-${numero}`);

          if (!select?.value) {
            alert('Selecione uma carrada de destino.');
            return;
          }

          const codigoDestino = Number(select.value);
          const enviarWhatsapp = !checkboxSemWhatsapp?.checked;
          botao.disabled = true;

          try {
            await moverPedido(numero, codigoDestino, enviarWhatsapp);
            if (box) box.classList.remove('ativo');
            window.location.reload();
          } catch (error) {
            alert(error.message);
          } finally {
            botao.disabled = false;
          }
        });
      });
    }

    function obterTimestampData(valor) {
      if (!valor) return Number.NaN;
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return Number.NaN;
      return new Date(data.getFullYear(), data.getMonth(), data.getDate()).getTime();
    }

    async function inicializarNavegacaoCarradas(carradaAtual) {
      const btnAnterior = document.getElementById('btnCarradaAnterior');
      const btnProxima = document.getElementById('btnProximaCarrada');

      if (!btnAnterior || !btnProxima || !carradaAtual) {
        return;
      }

      const carradas = await request('/api/legado/carradas');
      const lista = Array.isArray(carradas) ? carradas : [];
      const dataAtualTs = obterTimestampData(carradaAtual.data);

      if (Number.isNaN(dataAtualTs)) {
        return;
      }

      const ordenadas = lista
        .map((item) => ({
          ...item,
          _dataTs: obterTimestampData(item.data),
          _codigo: Number(item.codigo || 0)
        }))
        .filter((item) => !Number.isNaN(item._dataTs))
        .sort((a, b) => {
          if (b._dataTs !== a._dataTs) return b._dataTs - a._dataTs;
          return b._codigo - a._codigo;
        });

      const anterior = ordenadas.find((item) => item._dataTs < dataAtualTs);
      const proxima = [...ordenadas].reverse().find((item) => item._dataTs > dataAtualTs);

      if (anterior?.codigo) {
        btnAnterior.disabled = false;
        btnAnterior.addEventListener('click', () => {
          window.location.href = `/legado/carradas/detalhe?codigo=${encodeURIComponent(anterior.codigo)}`;
        });
      }

      if (proxima?.codigo) {
        btnProxima.disabled = false;
        btnProxima.addEventListener('click', () => {
          window.location.href = `/legado/carradas/detalhe?codigo=${encodeURIComponent(proxima.codigo)}`;
        });
      }
    }


    async function carregar() {
      if (!codigo) {
        document.getElementById('conteudo').innerHTML = '<div class="card">Código da carrada não informado.</div>';
        return;
      }

      try {
        const carrada = await request(`/api/legado/carradas/${codigo}`);
        renderCarrada(carrada);
        await inicializarNavegacaoCarradas(carrada);
        if (Array.isArray(carrada?.pedidos) && carrada.pedidos.length) {
          await inicializarMoverCarrada();
        }
      } catch (error) {
        document.getElementById('conteudo').innerHTML = `<div class="card">${escapeHtml(error.message)}</div>`;
      }
    }

    document.getElementById('btnResumoItens').addEventListener('click', () => {
      window.location.href = `/legado/carradas/resumo-itens?codigo=${encodeURIComponent(codigo)}`;
    });

    document.getElementById('btnResumoProducao').addEventListener('click', () => {
      window.location.href = `/legado/carradas/resumo-producao?codigo=${encodeURIComponent(codigo)}`;
    });

    document.getElementById('btnProgresso').addEventListener('click', () => {
      window.location.href = `/legado/carradas/progresso?codigo=${encodeURIComponent(codigo)}`;
    });

    document.getElementById('btnEditar').addEventListener('click', () => {
      window.location.href = `/legado/carradas?codigo=${codigo}`;
    });

    document.getElementById('btnExcluir').addEventListener('click', async () => {
      if (!codigo || !confirm(`Deseja excluir a carrada ${codigo}?`)) {
        return;
      }

      try {
        await request(`/api/legado/carradas/${codigo}`, { method: 'DELETE' });
        window.location.href = '/legado/carradas';
      } catch (error) {
        alert(error.message);
      }
    });

    carregar();
  </script>
</body>
</html>
