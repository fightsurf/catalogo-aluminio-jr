<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhe da Carrada</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #111827;
      --danger: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .nav-carradas {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button, a.button {
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .muted { color: var(--muted); }
    .pedido-link,
    .cliente-link {
      color: inherit;
      text-decoration: none;
    }
    .cliente-link {
      font-weight: 700;
    }
    .pedido-link:hover,
    .cliente-link:hover {
      text-decoration: underline;
    }
    .pedido-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .pedido-titulo {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 0 0 4px;
    }
    .pedido-status-card {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }
    .pedido-status-card.pendente {
      background: #fef3c7;
      color: #92400e;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
    }
    th { color: var(--muted); font-size: 13px; }
    .linha-total-pedido td {
      background: #111827;
      color: #fff;
      font-weight: 700;
      border-bottom: 0;
    }
    .resumo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .resumo-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .resumo-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .resumo-valor {
      font-size: 18px;
      font-weight: 700;
    }
    .pedido-acoes {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: 230px;
    }
    .mover-carrada-box {
      display: none;
      width: 100%;
      max-width: 320px;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }
    .mover-carrada-box.ativo {
      display: block;
    }
    .mover-carrada-box label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .mover-carrada-box select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 10px;
      background: #fff;
      margin-bottom: 8px;
    }
    .mover-carrada-box .opcao-sem-whatsapp {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 13px;
      margin: 0 0 10px;
      cursor: pointer;
    }
    .mover-carrada-box .opcao-sem-whatsapp input {
      width: 16px;
      height: 16px;
      margin: 0;
      flex: 0 0 auto;
    }
    .mover-carrada-acoes {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Transferência de vários pedidos: modal compacto com rolagem só na lista. */
    .carrada-lote-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1100;
      padding: 12px;
      background: rgba(15, 23, 42, .55);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .carrada-lote-backdrop.aberto { display: flex; }
    .carrada-lote-modal {
      width: min(650px, 100%);
      max-height: calc(100dvh - 24px);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,.24);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .carrada-lote-cabecalho, .carrada-lote-rodape {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
    }
    .carrada-lote-cabecalho { border-bottom: 1px solid var(--line); }
    .carrada-lote-rodape { border-top: 1px solid var(--line); justify-content: flex-end; }
    .carrada-lote-cabecalho h2 { font-size: 16px; margin: 0 0 4px; }
    .carrada-lote-cabecalho .muted { margin: 0; font-size: 11px; }
    .carrada-lote-corpo {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 10px 12px;
    }
    .carrada-lote-lista {
      min-height: 60px;
      max-height: 38dvh;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      overscroll-behavior: contain;
    }
    .carrada-lote-item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px 11px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      cursor: pointer;
    }
    .carrada-lote-item:last-child { border-bottom: 0; }
    .carrada-lote-item:hover { background: #f8fafc; }
    .carrada-lote-item strong { min-width: 86px; flex: 0 0 auto; }
    .carrada-lote-item input, .carrada-lote-todos input, .carrada-lote-sem-whatsapp input {
      width: 16px;
      height: 16px;
      margin: 0;
      flex: 0 0 auto;
      accent-color: #1d4ed8;
    }
    .carrada-lote-todos, .carrada-lote-sem-whatsapp {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      font-size: 12px;
    }
    .carrada-lote-todos { font-weight: 700; }
    .carrada-lote-campo label { display: block; font-size: 12px; margin-bottom: 4px; }
    .carrada-lote-campo select {
      width: 100%;
      height: 36px;
      padding: 6px 9px;
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .carrada-lote-cabecalho button, .carrada-lote-rodape button {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 12px;
    }
    .carrada-lote-feedback { white-space: pre-wrap; font-size: 12px; line-height: 1.4; }
    .carrada-lote-feedback:empty { display: none; }
    .carrada-lote-feedback.erro { color: #991b1b; }
    #btnMudarCarradaLote:disabled, .carrada-lote-backdrop button:disabled { cursor: not-allowed; opacity: .55; }
    @media (max-width: 540px) {
      .carrada-lote-item { flex-wrap: wrap; gap: 6px 9px; }
      .carrada-lote-item span { flex: 1 1 145px; }
      .carrada-lote-cabecalho h2 { font-size: 14px; }
    }
    @media (max-width: 700px) {
      .resumo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 id="titulo">Carrada</h1>
        <p class="muted" id="subtitulo"></p>
      </div>
      <div class="actions">
        <div class="nav-carradas">
          <button class="btn-secondary" id="btnCarradaAnterior" disabled>Carrada anterior</button>
          <button class="btn-secondary" id="btnProximaCarrada" disabled>Próxima carrada</button>
        </div>
        <a class="button btn-secondary" href="/legado/carradas">Voltar</a>
        <button class="btn-secondary" id="btnResumoItens">Resumo de itens</button>
        <button class="btn-secondary" id="btnResumoProducao">Resumo para produção</button>
        <button class="btn-secondary" id="btnProgresso">Progresso</button>
        <button class="btn-primary" id="btnMudarCarradaLote" type="button" disabled>Modificar carrada dos pedidos</button>
        <button class="btn-secondary" id="btnEditar">Editar</button>
        <button class="btn-danger" id="btnExcluir">Excluir</button>
      </div>
    </div>

    <div id="conteudo">
      <div class="card">Carregando carrada...</div>
    </div>
  </div>

  <div class="carrada-lote-backdrop" id="modalMudarCarradaLoteBackdrop" aria-hidden="true">
    <div class="carrada-lote-modal" role="dialog" aria-modal="true" aria-labelledby="modalMudarCarradaLoteTitulo">
      <div class="carrada-lote-cabecalho">
        <div>
          <h2 id="modalMudarCarradaLoteTitulo">Modificar carrada dos pedidos</h2>
          <p class="muted" id="subtituloMudarCarradaLote">Selecione os pedidos da carrada atual.</p>
        </div>
        <button class="btn-secondary" type="button" id="btnFecharMudarCarradaLote">Fechar</button>
      </div>
      <div class="carrada-lote-corpo">
        <label class="carrada-lote-todos" for="checkboxCarradaLoteTodos">
          <input type="checkbox" id="checkboxCarradaLoteTodos" /> Selecionar todos os pedidos
        </label>
        <div class="carrada-lote-lista" id="listaCarradaLotePedidos" aria-label="Pedidos da carrada atual"></div>
        <div class="muted" id="contadorCarradaLote" aria-live="polite" style="font-size:12px">0 pedidos selecionados</div>
        <div class="carrada-lote-campo">
          <label for="selectCarradaLoteDestino">Nova carrada</label>
          <select id="selectCarradaLoteDestino" required>
            <option value="">Selecione a carrada de destino</option>
          </select>
        </div>
        <label class="carrada-lote-sem-whatsapp" for="checkboxCarradaLoteNaoEnviarWhatsapp">
          <input type="checkbox" id="checkboxCarradaLoteNaoEnviarWhatsapp" />
          <span>Não enviar mensagem aos clientes (WhatsApp)</span>
        </label>
        <div class="carrada-lote-feedback" id="feedbackMudarCarradaLote" role="status" aria-live="polite"></div>
      </div>
      <div class="carrada-lote-rodape">
        <button class="btn-secondary" type="button" id="btnCancelarMudarCarradaLote">Cancelar</button>
        <button class="btn-primary" type="button" id="btnSalvarMudarCarradaLote" disabled>Salvar</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get('codigo');
    const estadoMudarCarradaLote = {
      carrada: null,
      carregando: false,
      salvando: false,
      abertura: 0
    };
    const elMudarCarradaLote = {
      botao: document.getElementById('btnMudarCarradaLote'),
      backdrop: document.getElementById('modalMudarCarradaLoteBackdrop'),
      subtitulo: document.getElementById('subtituloMudarCarradaLote'),
      lista: document.getElementById('listaCarradaLotePedidos'),
      todos: document.getElementById('checkboxCarradaLoteTodos'),
      contador: document.getElementById('contadorCarradaLote'),
      destino: document.getElementById('selectCarradaLoteDestino'),
      semWhatsapp: document.getElementById('checkboxCarradaLoteNaoEnviarWhatsapp'),
      feedback: document.getElementById('feedbackMudarCarradaLote'),
      salvar: document.getElementById('btnSalvarMudarCarradaLote'),
      cancelar: document.getElementById('btnCancelarMudarCarradaLote'),
      fechar: document.getElementById('btnFecharMudarCarradaLote')
    };

    function escapeHtml(valor) {
      return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatarData(valor) {
      if (!valor) return '';
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return String(valor);
      return data.toLocaleDateString('pt-BR');
    }

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function formatarQuantidade(valor) {
      return Number(valor || 0).toLocaleString('pt-BR');
    }

    function montarLabelCarrada(carrada) {
      const data = formatarData(carrada?.data);
      const descricao = String(carrada?.descricao || '').trim();
      return descricao ? `${data} - ${descricao}` : data;
    }

    async function carregarCarradasDisponiveis() {
      return request(`/api/legado/carradas/${codigo}/carradas-disponiveis?dias=120`);
    }

    async function moverPedido(numero, codigoDestino, enviarWhatsapp = true) {
      return request(`/api/legado/carradas/${codigo}/pedidos/mover`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero, codigoDestino, enviarWhatsapp })
      });
    }

    async function request(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(data.error || data.message || 'Falha na requisição.');
      }

      return data.data;
    }

    function criarMapaProgressoPedidos(matriz) {
      const pedidos = Array.isArray(matriz?.pedidos) ? matriz.pedidos : [];
      return new Map(pedidos.map((pedido) => [String(pedido?.numero ?? '').trim(), pedido]));
    }

    function montarCardsStatusPedido(pedido, progressoPedido) {
      const fases = progressoPedido?.fases || {};
      const fasePronto = fases.PEDIDO_PRONTO;
      const faseExpedicao = fases.DATA_EXPEDICAO;
      const fasePagamento = fases.PAGAMENTO_QUITADO;

      const pedidoPronto = fasePronto
        ? Boolean(fasePronto.concluido)
        : Boolean(pedido?.pedidoPronto || pedido?.pedido_pronto);

      const dataExpedicao = String(
        faseExpedicao?.dataExpedicao
          || pedido?.dataExpedicao
          || pedido?.data_expedicao
          || ''
      ).trim();

      const cards = [];

      if (pedidoPronto) {
        cards.push('<span class="pedido-status-card">✅ PRONTO</span>');
      }

      if (dataExpedicao) {
        cards.push(`<span class="pedido-status-card">🚚 EXPEDIÇÃO ${escapeHtml(formatarData(dataExpedicao))}</span>`);
      }

      if (fasePagamento) {
        if (fasePagamento.concluido) {
          cards.push('<span class="pedido-status-card">💰 QUITADO</span>');
        } else {
          const saldoRestante = Number(fasePagamento.saldoRestante ?? 0);
          cards.push(`<span class="pedido-status-card pendente">💰 FALTA PAGAR ${escapeHtml(formatarMoeda(Math.max(saldoRestante, 0)))}</span>`);
        }
      }

      return cards.join('');
    }

    function calcularResumo(carrada) {
      const resumoBackend = carrada?.resumoProducao || {};

      if (Object.keys(resumoBackend).length) {
        return {
          totalPedidos: resumoBackend.quantidadePedidos,
          totalPedidosProntos: resumoBackend.quantidadePedidosProntos,
          totalPedidosAProduzir: resumoBackend.quantidadePedidosAProduzir,
          totalItens: resumoBackend.quantidadeItens,
          totalItensProntos: resumoBackend.quantidadeItensProntos,
          totalItensAProduzir: resumoBackend.quantidadeItensAProduzir,
          totalGeral: resumoBackend.totalPedidos
        };
      }

      const pedidos = Array.isArray(carrada.pedidos) ? carrada.pedidos : [];

      return pedidos.reduce((acc, pedido) => {
        const pedidoPronto = Boolean(pedido?.pedidoPronto || pedido?.pedido_pronto);
        const itens = Array.isArray(pedido.itens) ? pedido.itens : [];
        const quantidadePedido = itens.reduce((total, item) => total + Number(item.quantidade || 0), 0);

        acc.totalPedidos += 1;
        acc.totalItens += quantidadePedido;
        acc.totalGeral += Number(pedido.total || 0);

        if (pedidoPronto) {
          acc.totalPedidosProntos += 1;
          acc.totalItensProntos += quantidadePedido;
        } else {
          acc.totalPedidosAProduzir += 1;
          acc.totalItensAProduzir += quantidadePedido;
        }

        return acc;
      }, {
        totalPedidos: 0,
        totalPedidosProntos: 0,
        totalPedidosAProduzir: 0,
        totalItens: 0,
        totalItensProntos: 0,
        totalItensAProduzir: 0,
        totalGeral: 0
      });
    }

    function renderCarrada(carrada, matrizProgresso = null) {
      const progressoPorPedido = criarMapaProgressoPedidos(matrizProgresso);
      document.getElementById('titulo').textContent = `Carrada ${carrada.codigo}`;
      document.getElementById('subtitulo').textContent = `Data: ${formatarData(carrada.data)} | Descrição: ${carrada.descricao || '-'}`;

      const conteudo = document.getElementById('conteudo');
      const pedidos = Array.isArray(carrada.pedidos) ? carrada.pedidos : [];

      if (!pedidos.length) {
        conteudo.innerHTML = '<div class="card">Nenhum pedido nesta carrada.</div>';
        return;
      }

      const resumo = calcularResumo(carrada);

      conteudo.innerHTML = `
        ${pedidos.map((pedido) => {
          const itens = Array.isArray(pedido.itens) ? pedido.itens : [];
          const quantidadePedido = itens.reduce((total, item) => total + Number(item.quantidade || 0), 0);
          const numeroPedido = String(pedido.numero ?? '').trim();
          const numeroPedidoHtml = numeroPedido
            ? `<a class="pedido-link" href="/legado/pedidos?numero=${encodeURIComponent(numeroPedido)}" target="_blank" rel="noopener noreferrer">Pedido ${escapeHtml(numeroPedido)}</a>`
            : 'Pedido -';
          const nomeCliente = escapeHtml(pedido.cliente?.nome || '-');
          const nomeClienteHtml = pedido.cliente?.favorecido
            ? `<a class="cliente-link" href="/legado/pedidos-cliente?favorecido=${encodeURIComponent(pedido.cliente.favorecido)}" target="_blank" rel="noopener noreferrer">${nomeCliente}</a>`
            : nomeCliente;
          const progressoPedido = progressoPorPedido.get(numeroPedido) || null;
          const cardsStatus = montarCardsStatusPedido(pedido, progressoPedido);

          return `
            <section class="card">
              <div class="pedido-header">
                <div>
                  <h2 class="pedido-titulo">${numeroPedidoHtml}${cardsStatus}</h2>
                  <div class="muted">Cliente: ${nomeClienteHtml} | Cidade: ${escapeHtml(((pedido.cliente?.cidade || '') + ((pedido.cliente?.uf || '') ? ' / ' + pedido.cliente.uf : '')).trim() || '-')} | Data: ${escapeHtml(formatarData(pedido.data))}</div>
                </div>
                <div class="pedido-acoes">
                  <button class="btn-secondary btn-mudar-carrada" data-numero="${escapeHtml(pedido.numero)}">Mudar de carrada</button>
                  <div class="mover-carrada-box" id="mover-${escapeHtml(pedido.numero)}">
                    <label for="select-${escapeHtml(pedido.numero)}">Carradas disponíveis</label>
                    <select id="select-${escapeHtml(pedido.numero)}" data-numero="${escapeHtml(pedido.numero)}">
                      <option value="">Carregando...</option>
                    </select>
                    <label class="opcao-sem-whatsapp" for="sem-whatsapp-${escapeHtml(pedido.numero)}">
                      <input type="checkbox" id="sem-whatsapp-${escapeHtml(pedido.numero)}" data-numero="${escapeHtml(pedido.numero)}" />
                      <span>Não enviar mensagem no WhatsApp ao cliente</span>
                    </label>
                    <div class="mover-carrada-acoes">
                      <button class="btn-secondary btn-cancelar-mover" data-numero="${escapeHtml(pedido.numero)}">Cancelar</button>
                      <button class="btn-primary btn-salvar-mover" data-numero="${escapeHtml(pedido.numero)}">Salvar</button>
                    </div>
                  </div>
                </div>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Subtotal</th>
                  </tr>
                </thead>
                <tbody>
                  ${itens.length ? itens.map((item) => `
                    <tr>
                      <td>${escapeHtml(item.descricao || '')}</td>
                      <td>${escapeHtml(formatarQuantidade(item.quantidade))}</td>
                      <td>${escapeHtml(formatarMoeda(item.preco))}</td>
                      <td>${escapeHtml(formatarMoeda(item.subtotal))}</td>
                    </tr>
                  `).join('') : '<tr><td colspan="4" class="muted">Nenhum item encontrado.</td></tr>'}
                </tbody>
                <tfoot>
                  <tr class="linha-total-pedido">
                    <td>Total do pedido</td>
                    <td>${escapeHtml(formatarQuantidade(quantidadePedido))}</td>
                    <td></td>
                    <td>${escapeHtml(formatarMoeda(pedido.total))}</td>
                  </tr>
                </tfoot>
              </table>
            </section>
          `;
        }).join('')}

        <section class="card">
          <h2>Resumo da carrada</h2>
          <div class="resumo-grid">
            <div class="resumo-item">
              <div class="resumo-label">Data da carrada</div>
              <div class="resumo-valor">${escapeHtml(formatarData(carrada.data))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Descrição da carrada</div>
              <div class="resumo-valor">${escapeHtml(carrada.descricao || '-')}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade de pedidos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalPedidos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Pedidos prontos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalPedidosProntos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Pedidos a produzir</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalPedidosAProduzir))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade de itens</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalItens))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Itens prontos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalItensProntos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Itens a produzir</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalItensAProduzir))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Total dos pedidos</div>
              <div class="resumo-valor">${escapeHtml(formatarMoeda(resumo.totalGeral))}</div>
            </div>
          </div>
        </section>
      `;
    }


    function feedbackMudarCarradaLote(mensagem, erro = false) {
      elMudarCarradaLote.feedback.textContent = mensagem;
      elMudarCarradaLote.feedback.classList.toggle('erro', erro);
    }

    function pedidosSelecionadosCarradaLote() {
      return Array.from(elMudarCarradaLote.lista.querySelectorAll('input[data-carrada-lote-numero]:checked'))
        .map((input) => input.value);
    }

    function atualizarSelecaoCarradaLote() {
      const inputs = Array.from(elMudarCarradaLote.lista.querySelectorAll('input[data-carrada-lote-numero]'));
      const selecionados = inputs.filter((input) => input.checked).length;
      elMudarCarradaLote.todos.checked = inputs.length > 0 && selecionados === inputs.length;
      elMudarCarradaLote.todos.indeterminate = selecionados > 0 && selecionados < inputs.length;
      elMudarCarradaLote.todos.disabled = estadoMudarCarradaLote.salvando || !inputs.length;
      elMudarCarradaLote.contador.textContent = `${selecionados} de ${inputs.length} pedido(s) selecionado(s)`;
      const codigoDestino = Number(elMudarCarradaLote.destino.value);
      elMudarCarradaLote.salvar.disabled = estadoMudarCarradaLote.salvando
        || estadoMudarCarradaLote.carregando
        || !selecionados
        || !Number.isInteger(codigoDestino)
        || codigoDestino <= 0
        || String(codigoDestino) === String(codigo);
    }

    function fecharModalMudarCarradaLote() {
      if (estadoMudarCarradaLote.salvando) return;
      estadoMudarCarradaLote.abertura += 1;
      elMudarCarradaLote.backdrop.classList.remove('aberto');
      elMudarCarradaLote.backdrop.setAttribute('aria-hidden', 'true');
      elMudarCarradaLote.botao.focus();
    }

    async function abrirModalMudarCarradaLote() {
      if (estadoMudarCarradaLote.salvando || !estadoMudarCarradaLote.carrada) return;
      const carrada = estadoMudarCarradaLote.carrada;
      const pedidos = Array.isArray(carrada.pedidos) ? carrada.pedidos : [];
      if (!pedidos.length) return;

      const abertura = ++estadoMudarCarradaLote.abertura;
      estadoMudarCarradaLote.carregando = true;
      elMudarCarradaLote.subtitulo.textContent = `Carrada ${carrada.codigo} • ${formatarData(carrada.data) || 'Sem data'} • ${carrada.descricao || 'Sem descrição'}`;
      elMudarCarradaLote.semWhatsapp.checked = false;
      elMudarCarradaLote.lista.innerHTML = pedidos.map((pedido) => `
        <label class="carrada-lote-item">
          <input type="checkbox" data-carrada-lote-numero value="${escapeHtml(pedido.numero)}" />
          <strong>Pedido ${escapeHtml(pedido.numero)}</strong>
          <span>${escapeHtml(pedido.cliente?.nome || '-')}${pedido.cliente?.cidade ? ` — ${escapeHtml([pedido.cliente.cidade, pedido.cliente?.uf].filter(Boolean).join(' / '))}` : ''}</span>
        </label>
      `).join('');
      elMudarCarradaLote.todos.checked = false;
      elMudarCarradaLote.destino.innerHTML = '<option value="">Carregando carradas...</option>';
      feedbackMudarCarradaLote('Carregando carradas disponíveis...');
      atualizarSelecaoCarradaLote();
      elMudarCarradaLote.backdrop.classList.add('aberto');
      elMudarCarradaLote.backdrop.setAttribute('aria-hidden', 'false');
      elMudarCarradaLote.fechar.focus();

      try {
        // O mesmo período da transferência em lote da tela de Progresso.
        const disponiveis = await request(`/api/legado/carradas/${encodeURIComponent(codigo)}/carradas-disponiveis?dias=36500`);
        if (abertura !== estadoMudarCarradaLote.abertura) return;
        const carradas = (Array.isArray(disponiveis) ? disponiveis : [])
          .filter((item) => Number.isInteger(Number(item?.codigo))
            && Number(item.codigo) > 0 && String(item.codigo) !== String(codigo))
          .sort((a, b) => new Date(b.data || 0).getTime() - new Date(a.data || 0).getTime()
            || Number(b.codigo) - Number(a.codigo));
        elMudarCarradaLote.destino.innerHTML = '<option value="">Selecione a carrada de destino</option>'
          + carradas.map((item) => `<option value="${escapeHtml(item.codigo)}">${escapeHtml(`Carrada ${item.codigo} • ${formatarData(item.data) || 'Sem data'} • ${item.descricao || 'Sem descrição'}`)}</option>`).join('');
        feedbackMudarCarradaLote(carradas.length ? '' : 'Nenhuma carrada de destino disponível.', !carradas.length);
      } catch (error) {
        if (abertura !== estadoMudarCarradaLote.abertura) return;
        elMudarCarradaLote.destino.innerHTML = '<option value="">Não foi possível carregar as carradas</option>';
        feedbackMudarCarradaLote(error.message || 'Erro ao listar as carradas.', true);
      } finally {
        if (abertura === estadoMudarCarradaLote.abertura) {
          estadoMudarCarradaLote.carregando = false;
          atualizarSelecaoCarradaLote();
        }
      }
    }

    async function salvarMudarCarradaLote() {
      const numeros = pedidosSelecionadosCarradaLote();
      const codigoDestino = Number(elMudarCarradaLote.destino.value);
      if (estadoMudarCarradaLote.salvando || estadoMudarCarradaLote.carregando || !numeros.length) return;
      if (!Number.isInteger(codigoDestino) || codigoDestino <= 0 || String(codigoDestino) === String(codigo)) {
        feedbackMudarCarradaLote('Selecione uma carrada de destino diferente da atual.', true);
        return;
      }

      const enviarWhatsapp = !elMudarCarradaLote.semWhatsapp.checked;
      estadoMudarCarradaLote.salvando = true;
      elMudarCarradaLote.cancelar.disabled = true;
      elMudarCarradaLote.fechar.disabled = true;
      elMudarCarradaLote.destino.disabled = true;
      elMudarCarradaLote.semWhatsapp.disabled = true;
      elMudarCarradaLote.lista.querySelectorAll('input').forEach((input) => { input.disabled = true; });
      atualizarSelecaoCarradaLote();
      const falhas = [];
      let transferidos = 0;
      try {
        // Transferir sequencialmente evita reprocessamento de pedidos já concluídos.
        for (let indice = 0; indice < numeros.length; indice += 1) {
          const numero = numeros[indice];
          feedbackMudarCarradaLote(`Transferindo ${indice + 1} de ${numeros.length}: pedido ${numero}${enviarWhatsapp ? ' (WhatsApp habilitado)' : ' (sem WhatsApp)'}...`);
          try {
            await moverPedido(numero, codigoDestino, enviarWhatsapp);
            transferidos += 1;
          } catch (error) {
            falhas.push(`Pedido ${numero}: ${error.message || 'Falha desconhecida'}`);
          }
        }
        if (!falhas.length) {
          window.location.reload();
          return;
        }
        const detalhes = falhas.slice(0, 10).join('\n');
        const complemento = falhas.length > 10 ? `\n... e mais ${falhas.length - 10} falha(s).` : '';
        if (transferidos) {
          window.alert(`${transferidos} pedido(s) transferido(s); ${falhas.length} falha(s).\n${detalhes}${complemento}\nA carrada será recarregada. Confira os pedidos restantes antes de tentar novamente.`);
          window.location.reload();
          return;
        }
        feedbackMudarCarradaLote(`Nenhum pedido foi confirmado como transferido. ${falhas.join(' | ')}. Recarregue a página antes de tentar novamente.`, true);
      } finally {
        estadoMudarCarradaLote.salvando = false;
        elMudarCarradaLote.cancelar.disabled = false;
        elMudarCarradaLote.fechar.disabled = false;
        elMudarCarradaLote.destino.disabled = false;
        elMudarCarradaLote.semWhatsapp.disabled = false;
        elMudarCarradaLote.lista.querySelectorAll('input').forEach((input) => { input.disabled = false; });
        atualizarSelecaoCarradaLote();
      }
    }


    async function inicializarMoverCarrada() {
      const carradasDisponiveis = await carregarCarradasDisponiveis();
      const opcoes = Array.isArray(carradasDisponiveis) ? carradasDisponiveis : [];

      document.querySelectorAll('.btn-mudar-carrada').forEach((botao) => {
        botao.addEventListener('click', () => {
          const numero = botao.dataset.numero;
          const box = document.getElementById(`mover-${numero}`);
          const select = document.getElementById(`select-${numero}`);
          const checkboxSemWhatsapp = document.getElementById(`sem-whatsapp-${numero}`);
          if (!box || !select) return;

          select.innerHTML = `<option value="">Selecione uma carrada</option>` + opcoes.map((carrada) => (`
            <option value="${String(carrada.codigo)}">${escapeHtml(montarLabelCarrada(carrada))}</option>
          `)).join('');

          if (checkboxSemWhatsapp) checkboxSemWhatsapp.checked = false;
          box.classList.add('ativo');
        });
      });

      document.querySelectorAll('.btn-cancelar-mover').forEach((botao) => {
        botao.addEventListener('click', () => {
          const numero = botao.dataset.numero;
          const box = document.getElementById(`mover-${numero}`);
          const checkboxSemWhatsapp = document.getElementById(`sem-whatsapp-${numero}`);
          if (checkboxSemWhatsapp) checkboxSemWhatsapp.checked = false;
          if (box) box.classList.remove('ativo');
        });
      });

      document.querySelectorAll('.btn-salvar-mover').forEach((botao) => {
        botao.addEventListener('click', async () => {
          const numero = botao.dataset.numero;
          const select = document.getElementById(`select-${numero}`);
          const box = document.getElementById(`mover-${numero}`);
          const checkboxSemWhatsapp = document.getElementById(`sem-whatsapp-${numero}`);

          if (!select?.value) {
            alert('Selecione uma carrada de destino.');
            return;
          }

          const codigoDestino = Number(select.value);
          const enviarWhatsapp = !checkboxSemWhatsapp?.checked;
          botao.disabled = true;

          try {
            await moverPedido(numero, codigoDestino, enviarWhatsapp);
            if (box) box.classList.remove('ativo');
            window.location.reload();
          } catch (error) {
            alert(error.message);
          } finally {
            botao.disabled = false;
          }
        });
      });
    }

    function obterTimestampData(valor) {
      if (!valor) return Number.NaN;
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return Number.NaN;
      return new Date(data.getFullYear(), data.getMonth(), data.getDate()).getTime();
    }

    async function inicializarNavegacaoCarradas(carradaAtual) {
      const btnAnterior = document.getElementById('btnCarradaAnterior');
      const btnProxima = document.getElementById('btnProximaCarrada');

      if (!btnAnterior || !btnProxima || !carradaAtual) {
        return;
      }

      const carradas = await request('/api/legado/carradas');
      const lista = Array.isArray(carradas) ? carradas : [];
      const dataAtualTs = obterTimestampData(carradaAtual.data);

      if (Number.isNaN(dataAtualTs)) {
        return;
      }

      const ordenadas = lista
        .map((item) => ({
          ...item,
          _dataTs: obterTimestampData(item.data),
          _codigo: Number(item.codigo || 0)
        }))
        .filter((item) => !Number.isNaN(item._dataTs))
        .sort((a, b) => {
          if (b._dataTs !== a._dataTs) return b._dataTs - a._dataTs;
          return b._codigo - a._codigo;
        });

      const anterior = ordenadas.find((item) => item._dataTs < dataAtualTs);
      const proxima = [...ordenadas].reverse().find((item) => item._dataTs > dataAtualTs);

      if (anterior?.codigo) {
        btnAnterior.disabled = false;
        btnAnterior.addEventListener('click', () => {
          window.location.href = `/legado/carradas/detalhe?codigo=${encodeURIComponent(anterior.codigo)}`;
        });
      }

      if (proxima?.codigo) {
        btnProxima.disabled = false;
        btnProxima.addEventListener('click', () => {
          window.location.href = `/legado/carradas/detalhe?codigo=${encodeURIComponent(proxima.codigo)}`;
        });
      }
    }


    async function carregar() {
      if (!codigo) {
        document.getElementById('conteudo').innerHTML = '<div class="card">Código da carrada não informado.</div>';
        return;
      }

      try {
        const carrada = await request(`/api/legado/carradas/${codigo}`);
        const matrizProgresso = await request(`/api/legado/carradas-progresso/${encodeURIComponent(codigo)}`)
          .catch((error) => {
            console.error('Não foi possível carregar os indicadores do progresso da carrada:', error);
            return null;
          });

        renderCarrada(carrada, matrizProgresso);
        estadoMudarCarradaLote.carrada = carrada;
        elMudarCarradaLote.botao.disabled = !(Array.isArray(carrada?.pedidos) && carrada.pedidos.length);
        await inicializarNavegacaoCarradas(carrada);
        if (Array.isArray(carrada?.pedidos) && carrada.pedidos.length) {
          await inicializarMoverCarrada();
        }
      } catch (error) {
        document.getElementById('conteudo').innerHTML = `<div class="card">${escapeHtml(error.message)}</div>`;
      }
    }

    document.getElementById('btnResumoItens').addEventListener('click', () => {
      window.location.href = `/legado/carradas/resumo-itens?codigo=${encodeURIComponent(codigo)}`;
    });

    document.getElementById('btnResumoProducao').addEventListener('click', () => {
      window.location.href = `/legado/carradas/resumo-producao?codigo=${encodeURIComponent(codigo)}`;
    });

    document.getElementById('btnProgresso').addEventListener('click', () => {
      window.location.href = `/legado/carradas/progresso?codigo=${encodeURIComponent(codigo)}`;
    });

    document.getElementById('btnEditar').addEventListener('click', () => {
      window.location.href = `/legado/carradas?codigo=${codigo}`;
    });

    document.getElementById('btnExcluir').addEventListener('click', async () => {
      if (!codigo || !confirm(`Deseja excluir a carrada ${codigo}?`)) {
        return;
      }

      try {
        await request(`/api/legado/carradas/${codigo}`, { method: 'DELETE' });
        window.location.href = '/legado/carradas';
      } catch (error) {
        alert(error.message);
      }
    });

    elMudarCarradaLote.botao.addEventListener('click', abrirModalMudarCarradaLote);
    elMudarCarradaLote.salvar.addEventListener('click', salvarMudarCarradaLote);
    elMudarCarradaLote.cancelar.addEventListener('click', fecharModalMudarCarradaLote);
    elMudarCarradaLote.fechar.addEventListener('click', fecharModalMudarCarradaLote);
    elMudarCarradaLote.destino.addEventListener('change', atualizarSelecaoCarradaLote);
    elMudarCarradaLote.lista.addEventListener('change', atualizarSelecaoCarradaLote);
    elMudarCarradaLote.todos.addEventListener('change', () => {
      elMudarCarradaLote.lista.querySelectorAll('input[data-carrada-lote-numero]').forEach((input) => {
        input.checked = elMudarCarradaLote.todos.checked;
      });
      atualizarSelecaoCarradaLote();
    });
    elMudarCarradaLote.backdrop.addEventListener('click', (event) => {
      if (event.target === elMudarCarradaLote.backdrop) fecharModalMudarCarradaLote();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && elMudarCarradaLote.backdrop.classList.contains('aberto')) {
        fecharModalMudarCarradaLote();
      }
    });

    carregar();
  </script>
</body>
</html>
