<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhe da Carrada</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #111827;
      --danger: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, a.button {
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .muted { color: var(--muted); }
    .pedido-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
    }
    th { color: var(--muted); font-size: 13px; }
    .pedido-total {
      text-align: right;
      margin-top: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 id="titulo">Carrada</h1>
        <p class="muted" id="subtitulo"></p>
      </div>
      <div class="actions">
        <a class="button btn-secondary" href="/legado/carradas">Voltar</a>
        <button class="btn-secondary" id="btnEditar">Editar</button>
        <button class="btn-danger" id="btnExcluir">Excluir</button>
      </div>
    </div>

    <div id="conteudo">
      <div class="card">Carregando carrada...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get('codigo');

    function formatarData(valor) {
      if (!valor) return '';
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return String(valor);
      return data.toLocaleDateString('pt-BR');
    }

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    async function request(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(data.error || data.message || 'Falha na requisição.');
      }

      return data.data;
    }

    function renderCarrada(carrada) {
      document.getElementById('titulo').textContent = `Carrada ${carrada.codigo}`;
      document.getElementById('subtitulo').textContent = `Data: ${formatarData(carrada.data)} | Descrição: ${carrada.descricao || '-'}`;

      const conteudo = document.getElementById('conteudo');

      if (!Array.isArray(carrada.pedidos) || !carrada.pedidos.length) {
        conteudo.innerHTML = '<div class="card">Nenhum pedido nesta carrada.</div>';
        return;
      }

      conteudo.innerHTML = carrada.pedidos.map((pedido) => `
        <section class="card">
          <div class="pedido-header">
            <div>
              <h2>Pedido ${pedido.numero}</h2>
              <div class="muted">Cliente: ${pedido.cliente?.nome || '-'} | Data: ${formatarData(pedido.data)}</div>
            </div>
            <div><strong>Total: ${formatarMoeda(pedido.total)}</strong></div>
          </div>
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody>
              ${(pedido.itens || []).map((item) => `
                <tr>
                  <td>${item.descricao || ''}</td>
                  <td>${item.quantidade ?? 0}</td>
                  <td>${formatarMoeda(item.preco)}</td>
                  <td>${formatarMoeda(item.subtotal)}</td>
                </tr>
              `).join('') || '<tr><td colspan="4" class="muted">Nenhum item encontrado.</td></tr>'}
            </tbody>
          </table>
          <div class="pedido-total">Total do pedido: ${formatarMoeda(pedido.total)}</div>
        </section>
      `).join('');
    }

    async function carregar() {
      if (!codigo) {
        document.getElementById('conteudo').innerHTML = '<div class="card">Código da carrada não informado.</div>';
        return;
      }

      try {
        const carrada = await request(`/api/legado/carradas/${codigo}`);
        renderCarrada(carrada);
      } catch (error) {
        document.getElementById('conteudo').innerHTML = `<div class="card">${error.message}</div>`;
      }
    }

    document.getElementById('btnEditar').addEventListener('click', () => {
      window.location.href = `/legado/carradas?codigo=${codigo}`;
    });

    document.getElementById('btnExcluir').addEventListener('click', async () => {
      if (!codigo || !confirm(`Deseja excluir a carrada ${codigo}?`)) {
        return;
      }

      try {
        await request(`/api/legado/carradas/${codigo}`, { method: 'DELETE' });
        window.location.href = '/legado/carradas';
      } catch (error) {
        alert(error.message);
      }
    });

    carregar();
  </script>
</body>
</html>
