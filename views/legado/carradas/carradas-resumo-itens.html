<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumo de Itens da Carrada</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    a.button, button {
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .muted { color: var(--muted); }
    .resumo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .resumo-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .resumo-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .resumo-valor {
      font-size: 18px;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #fff;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
    }
    th {
      color: var(--muted);
      font-size: 13px;
    }
    .td-quantidade {
      width: 180px;
      text-align: right;
      font-weight: 700;
    }
    .linha-total td {
      background: #111827;
      color: #fff;
      font-weight: 700;
      border-bottom: 0;
    }
    @media (max-width: 700px) {
      .resumo-grid {
        grid-template-columns: 1fr;
      }
      .td-quantidade {
        width: auto;
      }
    }
    @media print {
      .actions {
        display: none;
      }
      body {
        background: #fff;
      }
      .page {
        max-width: 100%;
        padding: 0;
      }
      .card {
        border: 0;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 id="titulo">Resumo de itens da carrada</h1>
        <p class="muted" id="subtitulo"></p>
      </div>
      <div class="actions">
        <a class="button btn-secondary" id="btnVoltarDetalhe" href="#">Voltar ao detalhe</a>
        <button class="btn-primary" id="btnImprimir" type="button">Imprimir</button>
      </div>
    </div>

    <div id="conteudo">
      <div class="card">Carregando resumo...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get('codigo');

    function escapeHtml(valor) {
      return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatarData(valor) {
      if (!valor) return '';
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return String(valor);
      return data.toLocaleDateString('pt-BR');
    }

    function formatarQuantidade(valor) {
      return Number(valor || 0).toLocaleString('pt-BR');
    }

    async function request(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(data.error || data.message || 'Falha na requisição.');
      }

      return data.data;
    }

    function normalizarDescricao(descricao) {
      return String(descricao || '')
        .trim()
        .replace(/\s+/g, ' ')
        .toUpperCase();
    }

    function gerarResumo(carrada) {
      const pedidos = Array.isArray(carrada.pedidos) ? carrada.pedidos : [];
      const mapa = new Map();
      let quantidadeTotal = 0;

      pedidos.forEach((pedido) => {
        const itens = Array.isArray(pedido.itens) ? pedido.itens : [];

        itens.forEach((item) => {
          const descricaoOriginal = String(item.descricao || '').trim().replace(/\s+/g, ' ');
          const chave = normalizarDescricao(descricaoOriginal);

          if (!chave) {
            return;
          }

          if (!mapa.has(chave)) {
            mapa.set(chave, {
              descricao: descricaoOriginal,
              quantidadeTotal: 0
            });
          }

          const registro = mapa.get(chave);
          const quantidade = Number(item.quantidade || 0);

          registro.quantidadeTotal += quantidade;
          quantidadeTotal += quantidade;
        });
      });

      const itens = Array.from(mapa.values()).sort((a, b) => {
        return a.descricao.localeCompare(b.descricao, 'pt-BR');
      });

      return {
        totalPedidos: pedidos.length,
        totalItensDistintos: itens.length,
        quantidadeTotal,
        itens
      };
    }

    function renderResumo(carrada) {
      const resumo = gerarResumo(carrada);

      document.getElementById('titulo').textContent = `Resumo de itens da carrada ${carrada.codigo}`;
      document.getElementById('subtitulo').textContent = `Data: ${formatarData(carrada.data)} | Descrição: ${carrada.descricao || '-'}`;
      document.getElementById('btnVoltarDetalhe').href = `/legado/carradas/detalhe?codigo=${encodeURIComponent(carrada.codigo)}`;

      const conteudo = document.getElementById('conteudo');

      if (!resumo.itens.length) {
        conteudo.innerHTML = '<div class="card">Nenhum item encontrado nesta carrada.</div>';
        return;
      }

      conteudo.innerHTML = `
        <section class="card">
          <h2>Resumo para produção</h2>
          <div class="resumo-grid">
            <div class="resumo-item">
              <div class="resumo-label">Data da carrada</div>
              <div class="resumo-valor">${escapeHtml(formatarData(carrada.data))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Descrição da carrada</div>
              <div class="resumo-valor">${escapeHtml(carrada.descricao || '-')}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade de pedidos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalPedidos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Itens distintos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalItensDistintos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade total consolidada</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.quantidadeTotal))}</div>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Itens consolidados</h2>
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th class="td-quantidade">Quantidade total</th>
              </tr>
            </thead>
            <tbody>
              ${resumo.itens.map((item) => `
                <tr>
                  <td>${escapeHtml(item.descricao)}</td>
                  <td class="td-quantidade">${escapeHtml(formatarQuantidade(item.quantidadeTotal))}</td>
                </tr>
              `).join('')}
            </tbody>
            <tfoot>
              <tr class="linha-total">
                <td>Total consolidado</td>
                <td class="td-quantidade">${escapeHtml(formatarQuantidade(resumo.quantidadeTotal))}</td>
              </tr>
            </tfoot>
          </table>
        </section>
      `;
    }

    async function carregar() {
      if (!codigo) {
        document.getElementById('conteudo').innerHTML = '<div class="card">Código da carrada não informado.</div>';
        return;
      }

      try {
        const carrada = await request(`/api/legado/carradas/${codigo}`);
        renderResumo(carrada);
      } catch (error) {
        document.getElementById('conteudo').innerHTML = `<div class="card">${escapeHtml(error.message)}</div>`;
      }
    }

    document.getElementById('btnImprimir').addEventListener('click', () => {
      window.print();
    });

    carregar();
  </script>
</body>
</html>
