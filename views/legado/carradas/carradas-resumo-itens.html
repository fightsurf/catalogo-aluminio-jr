<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumo de Itens da Carrada</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    a.button, button {
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .muted { color: var(--muted); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #fff;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }
    th { color: var(--muted); font-size: 13px; }
    .resumo-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .resumo-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .resumo-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .resumo-valor {
      font-size: 18px;
      font-weight: 700;
    }
    .linha-total td {
      background: #111827;
      color: #fff;
      font-weight: 700;
      border-bottom: 0;
    }
    .col-indice {
      width: 64px;
    }
    .pedidos-hover {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      cursor: default;
    }
    .pedidos-hover__numero {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .pedidos-hover__tooltip {
      position: absolute;
      left: 50%;
      top: calc(100% - 2px);
      transform: translateX(-50%);
      min-width: 220px;
      max-width: 320px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s ease, visibility 0.15s ease;
      z-index: 20;
      white-space: normal;
    }
    .pedidos-hover:hover .pedidos-hover__tooltip,
    .pedidos-hover:focus-within .pedidos-hover__tooltip,
    .pedidos-hover__tooltip:hover {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .pedidos-hover__titulo {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .pedidos-hover__lista {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pedidos-hover__link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .pedidos-hover__link:hover {
      background: rgba(255, 255, 255, 0.22);
    }
    @media (max-width: 900px) {
      .resumo-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
    }
    @media (max-width: 640px) {
      .resumo-grid { grid-template-columns: 1fr; }
      .pedidos-hover__tooltip {
        left: auto;
        right: 0;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 id="titulo">Resumo de itens</h1>
        <p class="muted" id="subtitulo"></p>
      </div>
      <div class="actions">
        <a class="button btn-secondary" id="linkDetalhe" href="/legado/carradas">Voltar ao detalhe</a>
        <button class="btn-primary" id="btnImprimir">Imprimir</button>
      </div>
    </div>

    <div id="conteudo">
      <div class="card">Carregando resumo...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get('codigo');

    function escapeHtml(valor) {
      return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatarData(valor) {
      if (!valor) return '';
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return String(valor);
      return data.toLocaleDateString('pt-BR');
    }

    function formatarQuantidade(valor) {
      return Number(valor || 0).toLocaleString('pt-BR');
    }

    async function request(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(data.error || data.message || 'Falha na requisição.');
      }

      return data.data;
    }

    function obterDescricaoResumo(item) {
      return String(item.descricaoOriginal || '').trim();
    }

    function consolidarItens(carrada) {
      const pedidos = Array.isArray(carrada.pedidos) ? carrada.pedidos : [];
      const mapa = new Map();
      let totalItens = 0;
      let totalItensProntos = 0;
      let totalItensAProduzir = 0;
      let totalPedidosProntos = 0;
      let totalPedidosAProduzir = 0;

      pedidos.forEach((pedido) => {
        const itens = Array.isArray(pedido.itens) ? pedido.itens : [];
        const pedidoPronto = Boolean(pedido?.pedidoPronto || pedido?.pedido_pronto);

        if (pedidoPronto) {
          totalPedidosProntos += 1;
        } else {
          totalPedidosAProduzir += 1;
        }

        itens.forEach((item) => {
          const codigoItem = Number(item.item || 0);
          const descricaoResumo = obterDescricaoResumo(item);
          const chave = codigoItem > 0
            ? String(codigoItem)
            : `SEM-CODIGO::${descricaoResumo.toUpperCase()}`;
          const quantidade = Number(item.quantidade || 0);
          totalItens += quantidade;

          if (pedidoPronto) {
            totalItensProntos += quantidade;
          } else {
            totalItensAProduzir += quantidade;
          }

          if (!mapa.has(chave)) {
            mapa.set(chave, {
              item: codigoItem > 0 ? codigoItem : null,
              descricao: descricaoResumo,
              quantidade: 0,
              quantidadePronta: 0,
              quantidadeAProduzir: 0,
              pedidos: new Set(),
              pedidosProntos: new Set(),
              pedidosAProduzir: new Set()
            });
          }

          const atual = mapa.get(chave);
          if (!atual.descricao && descricaoResumo) {
            atual.descricao = descricaoResumo;
          }
          atual.quantidade += quantidade;
          if (pedidoPronto) {
            atual.quantidadePronta += quantidade;
          } else {
            atual.quantidadeAProduzir += quantidade;
          }
          if (pedido.numero) {
            atual.pedidos.add(String(pedido.numero));
            if (pedidoPronto) {
              atual.pedidosProntos.add(String(pedido.numero));
            } else {
              atual.pedidosAProduzir.add(String(pedido.numero));
            }
          }
        });
      });

      const ordenarNumeros = (valores) => Array.from(valores).sort((a, b) => String(a).localeCompare(String(b), 'pt-BR', { numeric: true }));

      const itens = Array.from(mapa.values())
        .map((item) => ({
          descricao: item.descricao,
          quantidade: item.quantidade,
          quantidadePronta: item.quantidadePronta,
          quantidadeAProduzir: item.quantidadeAProduzir,
          totalPedidos: item.pedidos.size,
          totalPedidosProntos: item.pedidosProntos.size,
          totalPedidosAProduzir: item.pedidosAProduzir.size,
          numerosPedidos: ordenarNumeros(item.pedidos),
          numerosPedidosProntos: ordenarNumeros(item.pedidosProntos),
          numerosPedidosAProduzir: ordenarNumeros(item.pedidosAProduzir),
        }))
        .sort((a, b) => String(a.descricao || '').localeCompare(String(b.descricao || ''), 'pt-BR'));

      return {
        itens,
        totalPedidos: pedidos.length,
        totalPedidosProntos,
        totalPedidosAProduzir,
        totalItens,
        totalItensProntos,
        totalItensAProduzir,
        totalTipos: itens.length
      };
    }

    function renderPedidosHover(numerosPedidos) {
      const totalPedidos = numerosPedidos.length;
      const titulo = totalPedidos === 1 ? 'Pedido:' : 'Pedidos:';
      const links = numerosPedidos.map((numero) => {
        const numeroTexto = String(numero || '').trim();
        const href = `/legado/pedidos?numero=${encodeURIComponent(numeroTexto)}`;
        return `<a class="pedidos-hover__link" href="${href}" target="_blank" rel="noopener noreferrer">${escapeHtml(numeroTexto)}</a>`;
      }).join('');

      return `
        <span class="pedidos-hover" tabindex="0">
          <span class="pedidos-hover__numero">${escapeHtml(formatarQuantidade(totalPedidos))}</span>
          <span class="pedidos-hover__tooltip">
            <span class="pedidos-hover__titulo">${escapeHtml(titulo)}</span>
            <span class="pedidos-hover__lista">${links}</span>
          </span>
        </span>
      `;
    }

    function renderResumo(carrada) {
      document.getElementById('titulo').textContent = `Resumo de itens da carrada ${carrada.codigo}`;
      document.getElementById('subtitulo').textContent = `Data: ${formatarData(carrada.data)} | Descrição: ${carrada.descricao || '-'}`;
      document.getElementById('linkDetalhe').href = `/legado/carradas/detalhe?codigo=${encodeURIComponent(carrada.codigo)}`;

      const conteudo = document.getElementById('conteudo');
      const resumo = consolidarItens(carrada);

      if (!resumo.itens.length) {
        conteudo.innerHTML = '<div class="card">Nenhum item encontrado nesta carrada.</div>';
        return;
      }

      conteudo.innerHTML = `
        <section class="card">
          <div class="resumo-grid">
            <div class="resumo-item">
              <div class="resumo-label">Carrada</div>
              <div class="resumo-valor">${escapeHtml(carrada.codigo)}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade de pedidos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalPedidos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Quantidade total de itens</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalItens))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Itens de pedidos prontos</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalItensProntos))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Itens a produzir</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalItensAProduzir))}</div>
            </div>
            <div class="resumo-item">
              <div class="resumo-label">Tipos de itens</div>
              <div class="resumo-valor">${escapeHtml(formatarQuantidade(resumo.totalTipos))}</div>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th class="col-indice">#</th>
                <th>Descrição</th>
                <th>Qtd. total</th>
                <th>Qtd. pronta</th>
                <th>Qtd. a produzir</th>
                <th>Pedidos</th>
              </tr>
            </thead>
            <tbody>
              ${resumo.itens.map((item, indice) => `
                <tr>
                  <td>${escapeHtml(String(indice + 1))}</td>
                  <td>${escapeHtml(item.descricao || '-')}</td>
                  <td>${escapeHtml(formatarQuantidade(item.quantidade))}</td>
                  <td>${escapeHtml(formatarQuantidade(item.quantidadePronta))}</td>
                  <td>${escapeHtml(formatarQuantidade(item.quantidadeAProduzir))}</td>
                  <td>${renderPedidosHover(item.numerosPedidos)}</td>
                </tr>
              `).join('')}
            </tbody>
            <tfoot>
              <tr class="linha-total">
                <td></td>
                <td>Total geral</td>
                <td>${escapeHtml(formatarQuantidade(resumo.totalItens))}</td>
                <td>${escapeHtml(formatarQuantidade(resumo.totalItensProntos))}</td>
                <td>${escapeHtml(formatarQuantidade(resumo.totalItensAProduzir))}</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </section>
      `;
    }

    async function carregar() {
      if (!codigo) {
        document.getElementById('conteudo').innerHTML = '<div class="card">Código da carrada não informado.</div>';
        return;
      }

      try {
        const carrada = await request(`/api/legado/carradas/${codigo}`);
        renderResumo(carrada);
      } catch (error) {
        document.getElementById('conteudo').innerHTML = `<div class="card">${escapeHtml(error.message)}</div>`;
      }
    }

    document.getElementById('btnImprimir').addEventListener('click', () => {
      window.print();
    });

    carregar();
  </script>
</body>
</html>
