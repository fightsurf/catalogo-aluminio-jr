<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes do Legado - Alumínio JR</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
      padding: 18px;
    }

    .layout {
      max-width: 1200px;
      margin: 0 auto;
    }

    .titulo-pagina {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .box {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 16px;
      margin-bottom: 16px;
    }

    .box h2 {
      margin: 0 0 14px 0;
      font-size: 18px;
    }

    .topo-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .grid-form,
    .grid-filtros {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 10px;
      align-items: end;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .campo label {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    .campo input,
    .campo select {
      height: 38px;
      border: 1px solid #cfd6dd;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
      width: 100%;
    }

    .campo input:focus,
    .campo select:focus {
      border-color: #0ea5b7;
      box-shadow: 0 0 0 2px rgba(14, 165, 183, 0.12);
    }

    .campo-1 { grid-column: span 1; }
    .campo-2 { grid-column: span 2; }
    .campo-3 { grid-column: span 3; }
    .campo-4 { grid-column: span 4; }
    .campo-5 { grid-column: span 5; }
    .campo-6 { grid-column: span 6; }
    .campo-8 { grid-column: span 8; }

    .linha-botoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      align-items: center;
    }

    .btn {
      height: 38px;
      border: none;
      border-radius: 6px;
      padding: 0 14px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary { background: #0ea5b7; color: #ffffff; }
    .btn-secondary { background: #e5e7eb; color: #111827; }
    .btn-success { background: #16a34a; color: #ffffff; }
    .btn-danger { background: #dc2626; color: #ffffff; }
    .btn-warning { background: #f59e0b; color: #111827; }
    .btn-dark { background: #111827; color: #ffffff; }

    .btn:hover { opacity: 0.92; }

    .mensagem {
      margin-top: 12px;
      font-size: 14px;
      color: #374151;
      min-height: 18px;
    }

    .erro { color: #dc2626; font-weight: 700; }
    .ok { color: #15803d; font-weight: 700; }

    .autocomplete-lista {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
      max-height: 240px;
      overflow-y: auto;
      z-index: 50;
      display: none;
    }

    .autocomplete-lista.ativo { display: block; }

    .autocomplete-item {
      width: 100%;
      border: none;
      background: #ffffff;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      color: #111827;
      display: block;
    }

    .autocomplete-item:hover,
    .autocomplete-item.ativo { background: #eff6ff; }

    .autocomplete-vazio {
      padding: 10px 12px;
      font-size: 14px;
      color: #6b7280;
    }

    .info-topo {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .resumo {
      font-size: 14px;
      color: #374151;
      font-weight: 700;
    }

    .placeholder,
    .sem-registros {
      color: #6b7280;
      font-size: 15px;
    }

    .tabela-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 9px;
      font-size: 14px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f9fafb;
      font-weight: 800;
      color: #374151;
    }

    tr.inativo { background: #fff7ed; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-ativo { background: #dcfce7; color: #166534; }
    .status-inativo { background: #fee2e2; color: #991b1b; }

    .telefone-link-btn,
    .link-btn {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      color: #0f766e;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      font-family: Arial, sans-serif;
      text-decoration: none;
    }

    .telefone-link-btn:hover,
    .link-btn:hover { text-decoration: underline; }

    .acoes-linha {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-mini {
      height: 30px;
      border-radius: 5px;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .aviso-edicao {
      display: none;
      margin-bottom: 12px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      color: #92400e;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .aviso-edicao.ativo { display: block; }

    @media (max-width: 900px) {
      .campo-1,
      .campo-2,
      .campo-3,
      .campo-4,
      .campo-5,
      .campo-6,
      .campo-8 { grid-column: span 12; }

      .linha-botoes .btn { flex: 1; }
    }
  </style>
</head>

<body>
  <div class="layout">
    <div class="titulo-pagina">👥 Clientes do Legado</div>

    <div class="box" id="boxFormulario">
      <div class="topo-box">
        <h2 id="tituloFormulario">Cadastrar cliente</h2>
        <button id="btnNovoClienteTopo" class="btn btn-secondary" type="button">Novo cliente</button>
      </div>

      <div id="avisoEdicao" class="aviso-edicao">Editando cliente existente.</div>

      <form id="formCliente" autocomplete="off">
        <input type="hidden" id="clienteFavorecido" />

        <div class="grid-form">
          <div class="campo campo-2">
            <label for="inputCodigo">Código</label>
            <input id="inputCodigo" type="text" placeholder="Opcional" />
          </div>

          <div class="campo campo-5">
            <label for="inputNome">Nome *</label>
            <input id="inputNome" type="text" placeholder="Nome do cliente" required />
          </div>

          <div class="campo campo-5">
            <label for="inputRazao">Razão</label>
            <input id="inputRazao" type="text" placeholder="Razão / nome completo" />
          </div>

          <div class="campo campo-3">
            <label for="inputTelefonePrincipal">Telefone</label>
            <input id="inputTelefonePrincipal" type="text" placeholder="Telefone / WhatsApp" />
          </div>

          <div class="campo campo-5 autocomplete-wrapper">
            <label for="inputCidade">Cidade</label>
            <input id="inputCidade" type="text" placeholder="Digite as primeiras letras" autocomplete="off" />
            <div id="autocompleteCidadeForm" class="autocomplete-lista"></div>
          </div>

          <div class="campo campo-2">
            <label for="inputUf">UF</label>
            <input id="inputUf" type="text" maxlength="2" placeholder="UF" />
          </div>

          <div class="campo campo-2">
            <label for="inputStatus">Status</label>
            <select id="inputStatus">
              <option value="ativo">Ativo</option>
              <option value="inativo">Inativo</option>
            </select>
          </div>
        </div>

        <div class="linha-botoes">
          <button id="btnSalvarCliente" class="btn btn-success" type="submit">Salvar cliente</button>
          <button id="btnCancelarEdicao" class="btn btn-secondary" type="button">Cancelar edição</button>
        </div>
      </form>

      <div id="mensagemForm" class="mensagem"></div>
    </div>

    <div class="box">
      <h2>Pesquisar clientes</h2>

      <div class="grid-filtros">
        <div class="campo campo-4">
          <label for="filtroNome">Nome</label>
          <input id="filtroNome" type="text" placeholder="Digite o nome do cliente" />
        </div>

        <div class="campo campo-4 autocomplete-wrapper">
          <label for="filtroCidade">Cidade</label>
          <input id="filtroCidade" type="text" placeholder="Digite as primeiras letras" autocomplete="off" />
          <div id="autocompleteCidadeFiltro" class="autocomplete-lista"></div>
        </div>

        <div class="campo campo-1">
          <label for="filtroUf">UF</label>
          <input id="filtroUf" type="text" maxlength="2" placeholder="UF" />
        </div>

        <div class="campo campo-2">
          <label for="filtroStatus">Status</label>
          <select id="filtroStatus">
            <option value="ativos">Ativos</option>
            <option value="inativos">Inativos</option>
            <option value="todos">Todos</option>
          </select>
        </div>

        <div class="campo campo-1">
          <label for="filtroLimite">Limite</label>
          <input id="filtroLimite" type="number" min="1" max="500" value="50" />
        </div>
      </div>

      <div class="linha-botoes">
        <button id="btnPesquisar" class="btn btn-primary" type="button">Pesquisar</button>
        <button id="btnLimpar" class="btn btn-secondary" type="button">Limpar filtros</button>
      </div>

      <div id="mensagemBusca" class="mensagem">Aguardando pesquisa.</div>
    </div>

    <div class="box">
      <div class="info-topo">
        <h2 style="margin: 0;">Resultado</h2>
        <div id="resumo" class="resumo">Nenhum cliente carregado.</div>
      </div>

      <div id="blocoTabela">
        <div class="placeholder">Nenhum cliente carregado.</div>
      </div>
    </div>
  </div>

  <script>
    const formCliente = document.getElementById('formCliente');
    const clienteFavorecido = document.getElementById('clienteFavorecido');
    const inputCodigo = document.getElementById('inputCodigo');
    const inputNome = document.getElementById('inputNome');
    const inputRazao = document.getElementById('inputRazao');
    const inputTelefonePrincipal = document.getElementById('inputTelefonePrincipal');
    const inputCidade = document.getElementById('inputCidade');
    const inputUf = document.getElementById('inputUf');
    const inputStatus = document.getElementById('inputStatus');
    const autocompleteCidadeForm = document.getElementById('autocompleteCidadeForm');
    const tituloFormulario = document.getElementById('tituloFormulario');
    const avisoEdicao = document.getElementById('avisoEdicao');
    const btnNovoClienteTopo = document.getElementById('btnNovoClienteTopo');
    const btnSalvarCliente = document.getElementById('btnSalvarCliente');
    const btnCancelarEdicao = document.getElementById('btnCancelarEdicao');
    const mensagemForm = document.getElementById('mensagemForm');

    const filtroNome = document.getElementById('filtroNome');
    const filtroCidade = document.getElementById('filtroCidade');
    const filtroUf = document.getElementById('filtroUf');
    const filtroStatus = document.getElementById('filtroStatus');
    const filtroLimite = document.getElementById('filtroLimite');
    const autocompleteCidadeFiltro = document.getElementById('autocompleteCidadeFiltro');
    const btnPesquisar = document.getElementById('btnPesquisar');
    const btnLimpar = document.getElementById('btnLimpar');
    const mensagemBusca = document.getElementById('mensagemBusca');
    const resumo = document.getElementById('resumo');
    const blocoTabela = document.getElementById('blocoTabela');

    let clientesCarregados = [];

    function setMensagem(elemento, texto, tipo = '') {
      elemento.textContent = texto || '';
      elemento.className = `mensagem ${tipo}`.trim();
    }

    function escaparHtml(valor) {
      return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function limparSomenteNumeros(valor) {
      return String(valor || '').replace(/\D/g, '');
    }

    function abrirWhatsapp(telefone) {
      let numeros = limparSomenteNumeros(telefone);

      if (!numeros) return;

      if (numeros.length === 10 || numeros.length === 11) {
        numeros = `55${numeros}`;
      }

      window.open(`https://wa.me/${numeros}`, '_blank');
    }

    function criarHtmlTelefone(valor) {
      const telefone = String(valor || '').trim();

      if (!telefone) return '-';

      return `<button type="button" class="telefone-link-btn" data-telefone="${escaparHtml(telefone)}" title="Abrir WhatsApp">${escaparHtml(telefone)}</button>`;
    }

    function obterFavorecidoCliente(cliente) {
      return cliente?.favorecido ?? cliente?.Favorecido ?? cliente?.FAVORECIDO ?? '';
    }

    function criarAutocompleteCidade({ input, ufInput, lista }) {
      let sugestoes = [];
      let indiceAtivo = -1;
      let controlador = null;

      function fechar() {
        lista.classList.remove('ativo');
        lista.innerHTML = '';
        sugestoes = [];
        indiceAtivo = -1;
      }

      function selecionar(cidade) {
        if (!cidade) return;

        input.value = cidade.nome || '';
        ufInput.value = String(cidade.estado || '').toUpperCase().slice(0, 2);
        fechar();
      }

      function renderizar() {
        if (!sugestoes.length) {
          lista.innerHTML = '<div class="autocomplete-vazio">Nenhuma cidade encontrada.</div>';
          lista.classList.add('ativo');
          indiceAtivo = -1;
          return;
        }

        lista.innerHTML = sugestoes.map((cidade, indice) => `
          <button type="button" class="autocomplete-item ${indice === indiceAtivo ? 'ativo' : ''}" data-indice="${indice}">
            ${escaparHtml(cidade.nome)} - ${escaparHtml(cidade.estado)}
          </button>
        `).join('');

        lista.classList.add('ativo');

        lista.querySelectorAll('.autocomplete-item').forEach((botao) => {
          botao.addEventListener('mousedown', (event) => {
            event.preventDefault();
            selecionar(sugestoes[Number(botao.dataset.indice)]);
          });
        });
      }

      async function buscar() {
        const termo = input.value.trim();

        if (termo.length < 3) {
          fechar();
          return;
        }

        if (controlador) controlador.abort();
        controlador = new AbortController();

        try {
          const response = await fetch(`/api/logistica/cidades/busca?nome=${encodeURIComponent(termo)}`, {
            signal: controlador.signal
          });
          const json = await response.json();

          if (!response.ok) {
            throw new Error(json?.erro || 'Erro ao buscar cidades.');
          }

          sugestoes = Array.isArray(json) ? json : [];
          indiceAtivo = sugestoes.length ? 0 : -1;
          renderizar();
        } catch (error) {
          if (error.name === 'AbortError') return;
          console.error('Erro ao buscar cidades:', error);
          fechar();
        }
      }

      function mover(direcao) {
        if (!sugestoes.length) return;

        indiceAtivo += direcao;

        if (indiceAtivo < 0) indiceAtivo = sugestoes.length - 1;
        if (indiceAtivo >= sugestoes.length) indiceAtivo = 0;

        renderizar();
      }

      input.addEventListener('input', () => {
        ufInput.value = '';
        buscar();
      });

      input.addEventListener('focus', () => {
        if (input.value.trim().length >= 3) buscar();
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          mover(1);
          return;
        }

        if (event.key === 'ArrowUp') {
          event.preventDefault();
          mover(-1);
          return;
        }

        if (event.key === 'Enter' && indiceAtivo >= 0 && sugestoes[indiceAtivo]) {
          event.preventDefault();
          selecionar(sugestoes[indiceAtivo]);
          return;
        }

        if (event.key === 'Escape') {
          fechar();
        }
      });

      input.addEventListener('blur', () => {
        setTimeout(fechar, 120);
      });

      return { fechar };
    }

    const autocompleteForm = criarAutocompleteCidade({
      input: inputCidade,
      ufInput: inputUf,
      lista: autocompleteCidadeForm
    });

    const autocompleteFiltro = criarAutocompleteCidade({
      input: filtroCidade,
      ufInput: filtroUf,
      lista: autocompleteCidadeFiltro
    });

    function limparFormulario() {
      clienteFavorecido.value = '';
      inputCodigo.value = '';
      inputNome.value = '';
      inputRazao.value = '';
      inputTelefonePrincipal.value = '';
      inputCidade.value = '';
      inputUf.value = '';
      inputStatus.value = 'ativo';
      tituloFormulario.textContent = 'Cadastrar cliente';
      avisoEdicao.classList.remove('ativo');
      btnSalvarCliente.textContent = 'Salvar cliente';
      setMensagem(mensagemForm, '');
      autocompleteForm.fechar();
      inputNome.focus();
    }

    function preencherFormulario(cliente) {
      clienteFavorecido.value = obterFavorecidoCliente(cliente);
      inputCodigo.value = cliente?.codigo || '';
      inputNome.value = cliente?.nome || '';
      inputRazao.value = cliente?.razao || '';
      inputTelefonePrincipal.value = cliente?.telefonePrincipal || '';
      inputCidade.value = cliente?.cidade || '';
      inputUf.value = String(cliente?.uf || '').toUpperCase().slice(0, 2);
      inputStatus.value = cliente?.ativo === false ? 'inativo' : 'ativo';
      tituloFormulario.textContent = 'Editar cliente';
      avisoEdicao.classList.add('ativo');
      btnSalvarCliente.textContent = 'Salvar alterações';
      setMensagem(mensagemForm, `Editando cliente ${cliente?.nome || ''}.`, 'ok');
      document.getElementById('boxFormulario').scrollIntoView({ behavior: 'smooth', block: 'start' });
      inputNome.focus();
    }

    function montarPayloadFormulario() {
      const nome = inputNome.value.trim();

      if (!nome) {
        throw new Error('Nome do cliente é obrigatório.');
      }

      return {
        nome,
        razao: inputRazao.value.trim(),
        codigo: inputCodigo.value.trim(),
        telefonePrincipal: inputTelefonePrincipal.value.trim(),
        cidade: inputCidade.value.trim(),
        uf: inputUf.value.trim().toUpperCase().slice(0, 2),
        ativo: inputStatus.value === 'ativo'
      };
    }

    async function salvarCliente(event) {
      event.preventDefault();

      try {
        const favorecido = clienteFavorecido.value.trim();
        const payload = montarPayloadFormulario();
        const editando = Boolean(favorecido);
        const url = editando
          ? `/api/legado/clientes/${encodeURIComponent(favorecido)}`
          : '/api/legado/clientes';
        const method = editando ? 'PUT' : 'POST';

        btnSalvarCliente.disabled = true;
        setMensagem(mensagemForm, editando ? 'Salvando alterações...' : 'Cadastrando cliente...');

        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await response.json();

        if (!response.ok) {
          throw new Error(json?.erro || json?.detalhe || 'Erro ao salvar cliente.');
        }

        limparFormulario();
        setMensagem(mensagemForm, editando ? 'Cliente alterado com sucesso.' : 'Cliente cadastrado com sucesso.', 'ok');
        await pesquisarClientes(false);
      } catch (error) {
        setMensagem(mensagemForm, error.message || 'Erro ao salvar cliente.', 'erro');
      } finally {
        btnSalvarCliente.disabled = false;
      }
    }

    function montarQueryString() {
      const params = new URLSearchParams();
      const nome = filtroNome.value.trim();
      const cidade = filtroCidade.value.trim();
      const uf = filtroUf.value.trim().toUpperCase().slice(0, 2);
      const status = filtroStatus.value;
      const limite = filtroLimite.value.trim();

      if (nome) params.set('nome', nome);
      if (cidade) params.set('cidade', cidade);
      if (uf) params.set('uf', uf);
      if (status) params.set('status', status);
      if (limite) params.set('limite', limite);

      return params.toString();
    }

    function limparTabela() {
      clientesCarregados = [];
      blocoTabela.innerHTML = '<div class="placeholder">Nenhum cliente carregado.</div>';
      resumo.textContent = 'Nenhum cliente carregado.';
    }

    function renderizarTabela(clientes) {
      clientesCarregados = clientes || [];

      if (!clientesCarregados.length) {
        blocoTabela.innerHTML = '<div class="sem-registros">Nenhum cliente encontrado.</div>';
        resumo.textContent = '0 clientes encontrados.';
        return;
      }

      resumo.textContent = `${clientesCarregados.length} cliente(s) encontrado(s).`;

      blocoTabela.innerHTML = `
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>Razão</th>
                <th>Telefone</th>
                <th>Cidade</th>
                <th>UF</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              ${clientesCarregados.map((cliente, index) => `
                <tr class="${cliente.ativo === false ? 'inativo' : ''}">
                  <td>${escaparHtml(cliente.codigo || obterFavorecidoCliente(cliente) || '-')}</td>
                  <td>${escaparHtml(cliente.nome || '-')}</td>
                  <td>${escaparHtml(cliente.razao || '-')}</td>
                  <td>${criarHtmlTelefone(cliente.telefonePrincipal)}</td>
                  <td>${escaparHtml(cliente.cidade || '-')}</td>
                  <td>${escaparHtml(cliente.uf || '-')}</td>
                  <td>
                    <span class="status-pill ${cliente.ativo === false ? 'status-inativo' : 'status-ativo'}">
                      ${cliente.ativo === false ? 'Inativo' : 'Ativo'}
                    </span>
                  </td>
                  <td>
                    <div class="acoes-linha">
                      <button type="button" class="btn btn-mini btn-primary" data-acao="editar" data-index="${index}">Editar</button>
                      <button type="button" class="btn btn-mini btn-dark" data-acao="historico" data-index="${index}">Histórico</button>
                      ${cliente.ativo === false
                        ? `<button type="button" class="btn btn-mini btn-success" data-acao="reativar" data-index="${index}">Reativar</button>`
                        : `<button type="button" class="btn btn-mini btn-danger" data-acao="desativar" data-index="${index}">Desativar</button>`}
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      blocoTabela.querySelectorAll('[data-telefone]').forEach((botao) => {
        botao.addEventListener('click', () => abrirWhatsapp(botao.dataset.telefone));
      });

      blocoTabela.querySelectorAll('[data-acao]').forEach((botao) => {
        botao.addEventListener('click', () => {
          const cliente = clientesCarregados[Number(botao.dataset.index)];
          const acao = botao.dataset.acao;

          if (acao === 'editar') preencherFormulario(cliente);
          if (acao === 'historico') abrirHistorico(cliente);
          if (acao === 'desativar') desativarCliente(cliente);
          if (acao === 'reativar') reativarCliente(cliente);
        });
      });
    }

    async function pesquisarClientes(mostrarMensagem = true) {
      if (mostrarMensagem) setMensagem(mensagemBusca, 'Pesquisando clientes...');
      limparTabela();

      try {
        const queryString = montarQueryString();
        const url = queryString ? `/api/legado/clientes?${queryString}` : '/api/legado/clientes';
        const response = await fetch(url);
        const json = await response.json();

        if (!response.ok) {
          throw new Error(json?.erro || json?.detalhe || 'Erro ao consultar clientes.');
        }

        const clientes = Array.isArray(json?.dados) ? json.dados : [];
        renderizarTabela(clientes);

        if (!clientes.length) {
          setMensagem(mensagemBusca, 'Nenhum cliente encontrado.', 'erro');
          return;
        }

        setMensagem(mensagemBusca, 'Clientes carregados com sucesso.', 'ok');
      } catch (error) {
        limparTabela();
        setMensagem(mensagemBusca, error.message || 'Erro ao consultar clientes.', 'erro');
      }
    }

    function limparFiltros() {
      filtroNome.value = '';
      filtroCidade.value = '';
      filtroUf.value = '';
      filtroStatus.value = 'ativos';
      filtroLimite.value = '50';
      autocompleteFiltro.fechar();
      limparTabela();
      setMensagem(mensagemBusca, 'Filtros limpos.');
    }

    function abrirHistorico(cliente) {
      const favorecido = obterFavorecidoCliente(cliente);

      if (!favorecido) {
        setMensagem(mensagemBusca, 'Código do cliente não disponível para abrir histórico.', 'erro');
        return;
      }

      window.open(`/legado/pedidos-cliente?favorecido=${encodeURIComponent(favorecido)}`, '_blank');
    }

    async function desativarCliente(cliente) {
      const favorecido = obterFavorecidoCliente(cliente);

      if (!favorecido) {
        setMensagem(mensagemBusca, 'Código do cliente não disponível para desativar.', 'erro');
        return;
      }

      if (!confirm(`Desativar o cliente ${cliente?.nome || favorecido}?`)) return;

      try {
        setMensagem(mensagemBusca, 'Desativando cliente...');
        const response = await fetch(`/api/legado/clientes/${encodeURIComponent(favorecido)}`, { method: 'DELETE' });
        const json = await response.json();

        if (!response.ok) {
          throw new Error(json?.erro || json?.detalhe || 'Erro ao desativar cliente.');
        }

        setMensagem(mensagemBusca, 'Cliente desativado com sucesso.', 'ok');
        await pesquisarClientes(false);
      } catch (error) {
        setMensagem(mensagemBusca, error.message || 'Erro ao desativar cliente.', 'erro');
      }
    }

    async function reativarCliente(cliente) {
      const favorecido = obterFavorecidoCliente(cliente);

      if (!favorecido) {
        setMensagem(mensagemBusca, 'Código do cliente não disponível para reativar.', 'erro');
        return;
      }

      if (!confirm(`Reativar o cliente ${cliente?.nome || favorecido}?`)) return;

      try {
        setMensagem(mensagemBusca, 'Reativando cliente...');
        const response = await fetch(`/api/legado/clientes/${encodeURIComponent(favorecido)}/reativar`, { method: 'PATCH' });
        const json = await response.json();

        if (!response.ok) {
          throw new Error(json?.erro || json?.detalhe || 'Erro ao reativar cliente.');
        }

        setMensagem(mensagemBusca, 'Cliente reativado com sucesso.', 'ok');
        await pesquisarClientes(false);
      } catch (error) {
        setMensagem(mensagemBusca, error.message || 'Erro ao reativar cliente.', 'erro');
      }
    }

    formCliente.addEventListener('submit', salvarCliente);
    btnNovoClienteTopo.addEventListener('click', limparFormulario);
    btnCancelarEdicao.addEventListener('click', limparFormulario);
    btnPesquisar.addEventListener('click', () => pesquisarClientes(true));
    btnLimpar.addEventListener('click', limparFiltros);

    [inputUf, filtroUf].forEach((campo) => {
      campo.addEventListener('input', () => {
        campo.value = campo.value.toUpperCase().slice(0, 2);
      });
    });

    [filtroNome, filtroUf, filtroLimite].forEach((campo) => {
      campo.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') pesquisarClientes(true);
      });
    });

    filtroStatus.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') pesquisarClientes(true);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        autocompleteForm.fechar();
        autocompleteFiltro.fechar();
      }
    });

    pesquisarClientes(true);
  </script>
</body>
</html>
