<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central de Ofertas</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.topo{background:#111827;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.topo h1{margin:0;font-size:22px}.topo a{color:#fff}.layout{max-width:1400px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,.8fr);gap:18px;align-items:start}.painel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 25px #0001}.passos{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.passo{padding:7px 12px;border-radius:999px;background:#e5e7eb;font-weight:700;font-size:14px}.passo.ativo{background:#f97316;color:#fff}.config-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.campo{margin-bottom:12px}.campo label{display:block;font-weight:700;margin-bottom:6px}.campo input,.campo textarea,.campo select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.campo textarea{resize:vertical}.temas{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:8px}.tema-opcao{border:2px solid #e5e7eb;border-radius:12px;padding:7px;background:#fff;cursor:pointer;text-align:left;color:#172033}.tema-opcao.ativo{border-color:#ea580c;box-shadow:0 0 0 3px #ffedd5}.tema-amostra{height:32px;border-radius:8px;margin-bottom:6px;border:1px solid #0002}.tema-opcao b{font-size:12px}.seletor-categoria{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start;margin-top:14px}.lista-categorias{height:310px;border:1px solid #d1d5db;border-radius:12px;padding:6px;background:#f9fafb;font-weight:700}.area-produtos{min-width:0}.categoria-titulo{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff7ed;padding:10px 12px;border-radius:10px;margin:0 0 6px}.categoria-titulo h3{margin:0}.contador-filtro{color:#6b7280;font-size:13px}.lista-produtos{max-height:440px;overflow:auto;border:1px solid #e5e7eb;border-radius:12px}.produto{display:grid;grid-template-columns:28px 62px minmax(0,1fr) 76px;align-items:center;gap:9px;padding:9px;border-bottom:1px solid #eee;cursor:pointer}.produto:last-child{border-bottom:0}.produto:hover{background:#fffaf5}.produto img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:8px}.produto span{min-width:0}.produto b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.produto input[type=number]{width:70px;padding:8px}.resumo{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}.resumo h2{margin:0 0 10px}.selecionados-vazio{padding:20px;text-align:center;color:#6b7280;background:#f9fafb;border-radius:12px}.selecionados-lista{overflow:auto;max-height:43vh;border:1px solid #e5e7eb;border-radius:12px}.selecionado{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px;border-bottom:1px solid #eee}.selecionado:last-child{border-bottom:0}.selecionado img{width:50px;height:50px;object-fit:contain;background:#fff;border-radius:8px}.selecionado b{display:block;font-size:13px;line-height:1.25}.selecionado small{color:#6b7280}.selecionado .qtd-mini{font-weight:900;color:#c2410c;background:#ffedd5;padding:5px 7px;border-radius:999px}.bloco-resumo{margin-top:12px;padding:13px;background:#fff7ed;border-radius:12px}.linha-resumo{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}.valor{font-size:28px;font-weight:900;color:#c2410c}.botoes{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer;background:#ea580c;color:#fff}button.sec{background:#374151}button:disabled{opacity:.45;cursor:not-allowed}.preview{width:100%;max-height:340px;object-fit:contain;background:#eee;border-radius:14px;margin-top:10px}.oculto{display:none!important}.aviso{margin-top:12px;padding:11px;border-radius:10px;background:#f3f4f6;color:#374151;min-height:42px;white-space:pre-wrap}.aviso.erro{background:#fee2e2;color:#991b1b}.aviso.sucesso{background:#dcfce7;color:#166534}.girando{display:inline-block;width:16px;height:16px;border:3px solid #fed7aa;border-top-color:#ea580c;border-radius:50%;animation:girar .8s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes girar{to{transform:rotate(360deg)}}.historico{max-width:1400px;margin:0 auto 40px;padding:0 16px}.oferta{background:#fff;margin:10px 0;padding:14px;border-radius:12px;display:flex;justify-content:space-between;gap:15px;align-items:center}.status{font-size:12px;padding:5px 9px;border-radius:99px;background:#e5e7eb}@media(max-width:1050px){.layout{grid-template-columns:1fr}.resumo{position:static;max-height:none}.selecionados-lista{max-height:360px}.temas{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.config-grid,.seletor-categoria{grid-template-columns:1fr}.lista-categorias{height:140px}.temas{grid-template-columns:repeat(2,1fr)}.produto{grid-template-columns:25px 52px minmax(0,1fr) 68px}.topo{padding:14px 16px}.topo h1{font-size:18px}}
</style>
</head>
<body>
<header class="topo"><h1>Central de Ofertas — Kit Feirinha</h1><a href="/whatsapp/status">Status atual</a></header>
<main class="layout">
<section class="painel">
<div class="passos"><span class="passo ativo">1. Montar kit</span><span class="passo">2. Compor arte</span><span class="passo">3. Publicar</span></div>
<div class="config-grid">
  <div class="campo"><label>Título da oferta</label><input id="titulo" value="Kit Feirinha Especial"></div>
  <div class="campo"><label>Expiração (opcional)</label><input id="expira" type="datetime-local"></div>
</div>
<div class="campo"><label>Tema da arte</label>
  <div id="temas" class="temas">
    <button class="tema-opcao ativo" type="button" data-tema="claro"><span class="tema-amostra" style="display:block;background:linear-gradient(135deg,#fffdf7,#e9d8b7)"></span><b>Claro premium</b></button>
    <button class="tema-opcao" type="button" data-tema="branco"><span class="tema-amostra" style="display:block;background:linear-gradient(135deg,#fff,#e9edf2)"></span><b>Branco comercial</b></button>
    <button class="tema-opcao" type="button" data-tema="escuro"><span class="tema-amostra" style="display:block;background:linear-gradient(135deg,#080808,#17120a)"></span><b>Escuro premium</b></button>
    <button class="tema-opcao" type="button" data-tema="azul"><span class="tema-amostra" style="display:block;background:linear-gradient(135deg,#f1f8fc,#bfd8e8)"></span><b>Azul elegante</b></button>
    <button class="tema-opcao" type="button" data-tema="verde"><span class="tema-amostra" style="display:block;background:linear-gradient(135deg,#f4f8f1,#c9d9bd)"></span><b>Verde sofisticado</b></button>
  </div>
</div>
<div class="campo"><label>Observação interna (opcional)</label><textarea id="prompt" rows="2" placeholder="Esta observação fica salva na oferta; não altera a composição da arte."></textarea></div>
<div class="seletor-categoria">
  <div class="campo" style="margin:0"><label for="filtroCategoria">Categorias</label><select id="filtroCategoria" class="lista-categorias" size="10" aria-label="Selecione uma categoria"></select></div>
  <div class="area-produtos">
    <div class="categoria-titulo"><h3 id="categoriaAtual">Categoria</h3><span id="contadorFiltro" class="contador-filtro"></span></div>
    <div id="lista" class="lista-produtos">Carregando produtos...</div>
  </div>
</div>
</section>
<aside class="painel resumo">
<h2>Itens selecionados</h2>
<div id="selecionadosPainel" class="selecionados-vazio">Nenhum item selecionado.</div>
<div class="bloco-resumo">
  <div class="linha-resumo"><span>Quantidade de peças</span><b id="qtd">0 itens</b></div>
  <div class="linha-resumo"><span>Preço médio do kit</span><b id="medio">R$ 0,00</b></div>
  <div class="linha-resumo" style="align-items:end"><span>Valor total</span><div class="valor" id="total">R$ 0,00</div></div>
</div>
<div class="botoes"><button id="criar" type="button">Criar oferta e gerar arte</button></div>
<div id="aviso" class="aviso">Selecione uma categoria e monte o kit.</div>
<div id="resultado" class="oculto"><img id="preview" class="preview" alt="Prévia da arte"><p><b id="codigo"></b></p><div class="botoes"><button id="regerar" class="sec" type="button">Gerar novamente</button><button id="publicar" type="button">Publicar no Status</button></div></div>
</aside>
</main>
<section class="historico"><h2>Ofertas recentes</h2><div id="historico"></div></section>
<script>
'use strict';
let produtos=[];let ofertaAtual=null;let temaArte='claro';let categoriaSelecionada='';
const el={lista:document.querySelector('#lista'),titulo:document.querySelector('#titulo'),expira:document.querySelector('#expira'),prompt:document.querySelector('#prompt'),qtd:document.querySelector('#qtd'),total:document.querySelector('#total'),medio:document.querySelector('#medio'),criar:document.querySelector('#criar'),aviso:document.querySelector('#aviso'),resultado:document.querySelector('#resultado'),preview:document.querySelector('#preview'),codigo:document.querySelector('#codigo'),regerar:document.querySelector('#regerar'),publicar:document.querySelector('#publicar'),historico:document.querySelector('#historico'),filtroCategoria:document.querySelector('#filtroCategoria'),contadorFiltro:document.querySelector('#contadorFiltro'),categoriaAtual:document.querySelector('#categoriaAtual'),selecionadosPainel:document.querySelector('#selecionadosPainel'),temas:document.querySelector('#temas')};
const temasConfig={claro:{nome:'Claro premium'},branco:{nome:'Branco comercial'},escuro:{nome:'Escuro premium'},azul:{nome:'Azul elegante'},verde:{nome:'Verde sofisticado'}};
const brl=valor=>Number(valor||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const escapeHtml=valor=>String(valor??'').replace(/[&<>'"]/g,caractere=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[caractere]));
function escolherTema(tema){temaArte=temasConfig[tema]?tema:'claro';document.querySelectorAll('.tema-opcao').forEach(botao=>botao.classList.toggle('ativo',botao.dataset.tema===temaArte))}
function mostrarAviso(texto,tipo='normal',carregando=false){el.aviso.className=`aviso${tipo==='erro'?' erro':tipo==='sucesso'?' sucesso':''}`;el.aviso.innerHTML=`${carregando?'<span class="girando"></span>':''}${escapeHtml(texto)}`}
async function api(url,opt={}){const response=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const texto=await response.text();let data={};try{data=texto?JSON.parse(texto):{}}catch(_){throw new Error(`O servidor respondeu em formato inesperado (${response.status}).`)}if(response.status===401){location.href=`/login?next=${encodeURIComponent(location.pathname)}`;throw new Error('Sua sessão expirou.')}if(!response.ok||!data.success)throw new Error(data.message||data.erro||`Erro HTTP ${response.status}`);return data.data}
function categorias(){return[...new Set(produtos.map(p=>String(p.categoria||'SEM CATEGORIA').trim()))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function prepararCategorias(){const lista=categorias();el.filtroCategoria.innerHTML=lista.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');categoriaSelecionada=lista[0]||'';el.filtroCategoria.value=categoriaSelecionada}
function produtoSelecionado(id){return document.querySelector(`.chk[data-id="${id}"]`)?.checked||false}
function quantidadeProduto(id){const input=document.querySelector(`.qtdp[data-id="${id}"]`);return Math.max(1,Number.parseInt(input?.value||'1',10))}
function estadoAtual(){const estado=new Map();document.querySelectorAll('.chk').forEach(chk=>{estado.set(Number(chk.dataset.id),{marcado:chk.checked,quantidade:quantidadeProduto(chk.dataset.id)})});return estado}
function renderProdutos(){const estado=estadoAtual();const itens=produtos.filter(p=>String(p.categoria||'SEM CATEGORIA').trim()===categoriaSelecionada);el.categoriaAtual.textContent=categoriaSelecionada||'Sem categorias';el.contadorFiltro.textContent=`${itens.length} ${itens.length===1?'produto':'produtos'}`;el.lista.innerHTML=itens.length?itens.map(produto=>{const salvo=estado.get(Number(produto.id));const marcado=salvo?.marcado||selecoesGlobais.has(Number(produto.id));const quantidade=salvo?.quantidade||selecoesGlobais.get(Number(produto.id))?.quantidade||1;return`<label class="produto"><input type="checkbox" class="chk" data-id="${produto.id}" ${marcado?'checked':''}><img src="${escapeHtml(produto.foto||'')}" alt="" onerror="this.style.visibility='hidden'"><span><b title="${escapeHtml(produto.nome)}">${escapeHtml(produto.nome)}</b>${brl(produto.preco)}</span><input type="number" class="qtdp" data-id="${produto.id}" min="1" step="1" value="${quantidade}" aria-label="Quantidade de ${escapeHtml(produto.nome)}"></label>`}).join(''):'<div class="selecionados-vazio">Nenhum produto nesta categoria.</div>';el.lista.querySelectorAll('.chk,.qtdp').forEach(campo=>{campo.addEventListener('change',sincronizarSelecoes);campo.addEventListener('input',sincronizarSelecoes)})}
const selecoesGlobais=new Map();
function sincronizarSelecoes(){document.querySelectorAll('.chk').forEach(chk=>{const id=Number(chk.dataset.id);if(chk.checked)selecoesGlobais.set(id,{produto_id:id,quantidade:quantidadeProduto(id)});else selecoesGlobais.delete(id)});atualizar()}
function selecionados(){return[...selecoesGlobais.values()]}
function atualizar(){let total=0;let quantidadeTotal=0;const itens=selecionados().map(item=>{const produto=produtos.find(p=>Number(p.id)===item.produto_id);if(!produto)return null;const subtotal=Number(produto.preco)*item.quantidade;total+=subtotal;quantidadeTotal+=item.quantidade;return{...item,produto,subtotal}}).filter(Boolean);el.qtd.textContent=`${quantidadeTotal} ${quantidadeTotal===1?'item':'itens'}`;el.total.textContent=brl(total);el.medio.textContent=brl(quantidadeTotal?total/quantidadeTotal:0);if(!itens.length){el.selecionadosPainel.className='selecionados-vazio';el.selecionadosPainel.textContent='Nenhum item selecionado.';return}el.selecionadosPainel.className='selecionados-lista';el.selecionadosPainel.innerHTML=itens.map(({produto,quantidade,subtotal})=>`<div class="selecionado"><img src="${escapeHtml(produto.foto||'')}" alt="" onerror="this.style.visibility='hidden'"><div><b>${escapeHtml(produto.nome)}</b><small>${brl(produto.preco)} · subtotal ${brl(subtotal)}</small></div><span class="qtd-mini">x${quantidade}</span></div>`).join('')}
function bloquear(bloqueado,textoBotao){el.criar.disabled=bloqueado;el.regerar.disabled=bloqueado;el.publicar.disabled=bloqueado;el.criar.textContent=textoBotao||'Criar oferta e gerar arte'}
async function iniciar(){try{mostrarAviso('Carregando produtos...','normal',true);produtos=await api('/api/ofertas/produtos');prepararCategorias();renderProdutos();atualizar();await carregarHistorico();mostrarAviso('Escolha uma categoria, selecione os produtos e acompanhe o kit ao lado.')}catch(error){el.lista.textContent='Não foi possível carregar os produtos.';mostrarAviso(error.message,'erro');console.error(error)}}
async function criarOferta(){const itens=selecionados();if(!itens.length){mostrarAviso('Selecione ao menos um produto antes de criar a oferta.','erro');return}try{bloquear(true,'Criando oferta...');mostrarAviso('Criando a oferta no banco de dados...','normal',true);ofertaAtual=await api('/api/ofertas',{method:'POST',body:JSON.stringify({titulo:el.titulo.value,itens,expira_em:el.expira.value||null,prompt_cenario:el.prompt.value||null,tema_arte:temaArte,cores_arte:{}})});el.codigo.textContent=ofertaAtual.codigo;el.resultado.classList.remove('oculto');mostrarAviso(`Oferta ${ofertaAtual.codigo} criada. Gerando a arte com as fotos reais dos produtos.`,'normal',true);el.criar.textContent='Gerando arte...';await gerarArte()}catch(error){mostrarAviso(error.message,'erro');console.error(error)}finally{bloquear(false)}}
async function gerarArte(){if(!ofertaAtual?.id){mostrarAviso('Crie uma oferta antes de gerar a arte.','erro');return}try{bloquear(true,'Gerando arte...');mostrarAviso('Compondo a arte. Não feche esta página.','normal',true);ofertaAtual=await api(`/api/ofertas/${ofertaAtual.id}/gerar-arte`,{method:'POST'});if(!ofertaAtual.imagem_url)throw new Error('O servidor não retornou a URL da arte.');el.preview.src=`${ofertaAtual.imagem_url}?v=${Date.now()}`;el.codigo.textContent=ofertaAtual.codigo;el.resultado.classList.remove('oculto');mostrarAviso('Arte pronta para conferência.','sucesso');await carregarHistorico()}catch(error){mostrarAviso(`A oferta foi criada, mas a arte não foi gerada: ${error.message}`,'erro');console.error(error)}finally{bloquear(false)}}
async function publicarOferta(){if(!ofertaAtual?.id){mostrarAviso('Nenhuma oferta está selecionada para publicação.','erro');return}try{bloquear(true);mostrarAviso('Publicando no Status...','normal',true);const resultado=await api(`/api/ofertas/${ofertaAtual.id}/publicar`,{method:'POST'});mostrarAviso(`Publicado com sucesso. Link público: ${resultado.link}`,'sucesso');await carregarHistorico()}catch(error){mostrarAviso(error.message,'erro');console.error(error)}finally{bloquear(false)}}
async function carregarHistorico(){try{const lista=await api('/api/ofertas');el.historico.innerHTML=lista.map(oferta=>`<div class="oferta"><div><b>${escapeHtml(oferta.codigo)} — ${escapeHtml(oferta.titulo)}</b><br>${brl(oferta.total)} · médio ${brl(oferta.preco_medio)} · tema ${escapeHtml(temasConfig[oferta.tema_arte]?.nome||oferta.tema_arte||'Claro premium')} · ${oferta.visualizacoes} visualizações · ${oferta.cliques_whatsapp} cliques</div><div><span class="status">${escapeHtml(oferta.status)}</span> <button class="sec duplicar" type="button" data-id="${oferta.id}">Duplicar</button></div></div>`).join('')||'<p>Nenhuma oferta criada.</p>'}catch(error){el.historico.textContent=error.message}}
async function duplicar(id){try{mostrarAviso('Duplicando oferta...','normal',true);ofertaAtual=await api(`/api/ofertas/${id}/duplicar`,{method:'POST'});el.codigo.textContent=ofertaAtual.codigo;el.resultado.classList.remove('oculto');mostrarAviso(`Oferta duplicada: ${ofertaAtual.codigo}. Clique em “Gerar novamente”.`,'sucesso');await carregarHistorico()}catch(error){mostrarAviso(error.message,'erro')}}
el.temas.addEventListener('click',event=>{const botao=event.target.closest('.tema-opcao');if(botao)escolherTema(botao.dataset.tema)});el.filtroCategoria.addEventListener('change',()=>{categoriaSelecionada=el.filtroCategoria.value;renderProdutos();atualizar()});el.criar.addEventListener('click',criarOferta);el.regerar.addEventListener('click',gerarArte);el.publicar.addEventListener('click',publicarOferta);el.historico.addEventListener('click',event=>{const botao=event.target.closest('.duplicar');if(botao)duplicar(Number(botao.dataset.id))});escolherTema('claro');iniciar();
</script>
</body>
</html>
