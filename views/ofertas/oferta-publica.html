<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oferta Alumínio JR</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#111827}.box{max-width:650px;margin:auto;background:#fff;min-height:100vh;padding-bottom:28px}.capa{width:100%;display:block;background:#eee}.conteudo{padding:20px}.codigo{color:#6b7280;font-size:13px}.item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eee}.item img{width:54px;height:54px;object-fit:contain}.preco{font-weight:800;color:#c2410c}.total{margin:18px 0;padding:16px;background:#fff7ed;border-radius:14px;text-align:center}.total strong{display:block;font-size:32px;color:#c2410c}.quantidade{display:flex;justify-content:center;align-items:center;gap:18px;margin:18px}.quantidade button{width:46px;height:46px;border:0;border-radius:50%;font-size:24px;background:#e5e7eb}.quantidade input{width:90px;text-align:center;font-size:22px;padding:9px;border:1px solid #ccc;border-radius:10px}.whats{display:block;width:100%;border:0;border-radius:14px;background:#16a34a;color:#fff;font-size:19px;font-weight:900;padding:17px}.expirada{padding:30px;text-align:center;color:#b91c1c}</style></head><body><main class="box" id="app">Carregando...</main><script>
const codigo=decodeURIComponent(location.pathname.split('/').pop());let oferta;const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function carregar(){const r=await fetch('/api/ofertas/publica/'+encodeURIComponent(codigo));const d=await r.json();if(!r.ok)throw new Error(d.message);oferta=d.data;const expirada=oferta.expira_em&&new Date(oferta.expira_em)<new Date();if(expirada){app.innerHTML='<div class="expirada"><h1>Oferta encerrada</h1><p>Esta oferta não está mais disponível.</p></div>';return}app.innerHTML=`${oferta.imagem_url?`<img class="capa" src="${oferta.imagem_url}">`:''}<div class="conteudo"><div class="codigo">${oferta.codigo}</div><h1>${oferta.titulo}</h1><h3>Itens de 1 kit</h3>${oferta.itens.map(i=>`<div class="item"><img src="${i.foto_url||''}"><div><b>${i.nome}</b><br>Quantidade: ${i.quantidade}</div><span class="preco">Médio ${brl(i.preco_medio)}</span></div>`).join('')}<div class="total">Valor de 1 kit<strong>${brl(oferta.total)}</strong><span id="totalPedido"></span></div><label style="display:block;text-align:center;font-weight:bold">Quantidade de kits</label><div class="quantidade"><button onclick="mudar(-1)">−</button><input id="q" type="number" min="1" value="1" onchange="recalcular()"><button onclick="mudar(1)">+</button></div><button class="whats" onclick="enviar()">ENVIAR PARA WHATSAPP</button></div>`;recalcular()}
function mudar(n){q.value=Math.max(1,Number(q.value||1)+n);recalcular()}function recalcular(){const n=Math.max(1,Number(q.value||1));q.value=n;totalPedido.textContent='Total do pedido: '+brl(oferta.total*n)}
async function enviar(){const n=Math.max(1,Number(q.value||1));await fetch(`/api/ofertas/publica/${encodeURIComponent(codigo)}/clique`,{method:'POST'}).catch(()=>{});const itens=oferta.itens.map(i=>`- ${i.nome} | Qtd. por kit: ${i.quantidade} | Médio: ${brl(i.preco_medio)}`).join('\n');const texto=`Olá, George.\n\nQuero fazer um pedido desta oferta.\n\nOferta: ${oferta.codigo}\nKit: ${oferta.titulo}\n\nItens de cada kit:\n${itens}\n\nValor de 1 kit: ${brl(oferta.total)}\nQuantidade de kits: ${n}\nTotal do pedido: ${brl(oferta.total*n)}`;location.href='https://wa.me/558399792085?text='+encodeURIComponent(texto)}carregar().catch(e=>app.innerHTML='<div class="expirada"><h1>Oferta indisponível</h1><p>'+e.message+'</p></div>');
</script></body></html>
