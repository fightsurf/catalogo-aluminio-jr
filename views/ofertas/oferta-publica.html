<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oferta Alumínio JR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#111827}.box{max-width:650px;margin:auto;background:#fff;min-height:100vh}.conteudo{padding:22px}.codigo{color:#6b7280;font-size:13px}.cabecalho{text-align:center;padding-bottom:12px;border-bottom:1px solid #eee}.cabecalho h1{margin:7px 0 3px}.cabecalho p{margin:0;color:#6b7280}.medio{margin:20px 0;padding:20px;background:#111827;border:3px solid #d4a017;border-radius:17px;text-align:center;color:#fff}.medio span{display:block;font-size:14px;font-weight:800;letter-spacing:.04em}.medio strong{display:block;margin-top:6px;font-size:42px;color:#fbbf24}.relatorio{margin-top:18px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #e5e7eb}.item b{display:block}.item small{color:#6b7280}.qtd-item{font-weight:900;font-size:18px;color:#9a3412}.total-kit{display:flex;justify-content:space-between;gap:12px;margin:15px 0;padding:12px 0;border-top:1px solid #ddd;color:#6b7280;font-size:14px}.total-kit strong{color:#374151}.quantidade-label{display:block;text-align:center;font-weight:800;margin-top:18px}.quantidade{display:flex;justify-content:center;align-items:center;gap:18px;margin:14px}.quantidade button{width:46px;height:46px;border:0;border-radius:50%;font-size:24px;background:#e5e7eb}.quantidade input{width:90px;text-align:center;font-size:22px;padding:9px;border:1px solid #ccc;border-radius:10px}.pedido-total{text-align:center;color:#6b7280;font-size:14px;margin:8px 0 15px}.whats{display:block;width:100%;border:0;border-radius:14px;background:#16a34a;color:#fff;font-size:19px;font-weight:900;padding:17px}.expirada{padding:30px;text-align:center;color:#b91c1c}@media(max-width:420px){.medio strong{font-size:36px}.conteudo{padding:17px}}
</style>
</head>
<body><main class="box" id="app">Carregando...</main>
<script>
const app=document.querySelector('#app');const codigo=decodeURIComponent(location.pathname.split('/').pop());let oferta;const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function carregar(){const r=await fetch('/api/ofertas/publica/'+encodeURIComponent(codigo));const d=await r.json();if(!r.ok)throw new Error(d.message);oferta=d.data;const expirada=oferta.expira_em&&new Date(oferta.expira_em)<new Date();if(expirada){app.innerHTML='<div class="expirada"><h1>Oferta encerrada</h1><p>Esta oferta não está mais disponível.</p></div>';return}app.innerHTML=`<div class="conteudo"><header class="cabecalho"><div class="codigo">${escapeHtml(oferta.codigo)}</div><h1>${escapeHtml(oferta.titulo)}</h1><p>Relatório de 1 kit</p></header><section class="medio"><span>PREÇO MÉDIO DO KIT</span><strong>${brl(oferta.preco_medio)}</strong><small>média por peça considerando todos os itens do kit</small></section><section class="relatorio"><h3>Itens e quantidades</h3>${oferta.itens.map(i=>`<div class="item"><div><b>${escapeHtml(i.nome)}</b><small>Preço unitário de referência: ${brl(i.preco_unitario)}</small></div><span class="qtd-item">${i.quantidade} un.</span></div>`).join('')}</section><div class="total-kit"><span>Valor total de 1 kit</span><strong>${brl(oferta.total)}</strong></div><label class="quantidade-label">Quantidade de kits</label><div class="quantidade"><button type="button" onclick="mudar(-1)">−</button><input id="q" type="number" min="1" value="1" inputmode="numeric" onchange="recalcular()" oninput="recalcular()"><button type="button" onclick="mudar(1)">+</button></div><div id="totalPedido" class="pedido-total"></div><button class="whats" type="button" onclick="enviar()">ENVIAR PARA WHATSAPP</button></div>`;recalcular()}
function mudar(n){const q=document.querySelector('#q');q.value=Math.max(1,Number(q.value||1)+n);recalcular()}function recalcular(){const q=document.querySelector('#q');const totalPedido=document.querySelector('#totalPedido');const n=Math.max(1,Number(q.value||1));q.value=n;totalPedido.textContent='Total do pedido: '+brl(oferta.total*n)}
async function enviar(){const q=document.querySelector('#q');const n=Math.max(1,Number(q.value||1));await fetch(`/api/ofertas/publica/${encodeURIComponent(codigo)}/clique`,{method:'POST'}).catch(()=>{});const itens=oferta.itens.map(i=>`- ${i.nome} | Quantidade por kit: ${i.quantidade}`).join('\n');const texto=`Olá, George.\n\nQuero fazer um pedido desta oferta.\n\nOferta: ${oferta.codigo}\nKit: ${oferta.titulo}\n\nItens de cada kit:\n${itens}\n\nPreço médio do kit: ${brl(oferta.preco_medio)}\nValor de 1 kit: ${brl(oferta.total)}\nQuantidade de kits: ${n}\nTotal do pedido: ${brl(oferta.total*n)}`;location.href='https://wa.me/558399792085?text='+encodeURIComponent(texto)}
carregar().catch(e=>app.innerHTML='<div class="expirada"><h1>Oferta indisponível</h1><p>'+escapeHtml(e.message)+'</p></div>');
</script></body></html>
