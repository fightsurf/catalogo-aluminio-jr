<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Fornecedores - Alumínio JR</title>
  <style>
    body { font-family: Arial; padding: 30px; background: #f4f6f9; }
    .container { max-width: 900px; margin: auto; }
    .box { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    button { cursor: pointer; }
    #cidadeResultados {
      max-height: 150px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="box">
    <h2>Novo Fornecedor</h2>

    <input type="text" id="nome" placeholder="Nome" required>
    <input type="text" id="contato" placeholder="Contato Principal" required>
    <input type="text" id="telefone" placeholder="Telefone" required>

    <input type="text" id="cidadeBusca" placeholder="Digite a cidade" autocomplete="off" required>
    <select id="cidadeResultados" size="5"></select>
    <input type="hidden" id="cidade_id">

    <button onclick="criar()">Salvar</button>
  </div>

  <div class="box">
    <h2>Lista</h2>
    <input type="text" id="filtroNome" placeholder="Buscar por nome">
    <button onclick="listar()">Buscar</button>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Contato</th>
          <th>Telefone</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>

</div>

<script>
const API = '/api/fornecedores';

const cidadeInput = document.getElementById('cidadeBusca');
const resultados = document.getElementById('cidadeResultados');
const hiddenCidadeId = document.getElementById('cidade_id');

// ===============================
// BUSCA CIDADE
// ===============================
cidadeInput.addEventListener('input', async function() {
  const termo = this.value;
  hiddenCidadeId.value = '';

  if (termo.length < 2) {
    resultados.style.display = 'none';
    return;
  }

  const res = await fetch(`/api/logistica/cidades/busca?nome=${termo}`);
  const cidades = await res.json();

  resultados.innerHTML = '';
  resultados.style.display = 'block';

  cidades.forEach(c => {
    const option = document.createElement('option');
    option.value = c.id;
    option.textContent = `${c.nome} - ${c.estado}`;
    resultados.appendChild(option);
  });
});

// 🔥 AGORA USANDO CHANGE CORRETAMENTE
resultados.addEventListener('change', function() {
  const selectedOption = this.options[this.selectedIndex];
  if (!selectedOption) return;

  hiddenCidadeId.value = selectedOption.value;
  cidadeInput.value = selectedOption.textContent;
  resultados.style.display = 'none';
});

// ===============================
// LISTAR
// ===============================
async function listar() {
  const nome = document.getElementById('filtroNome').value;
  const res = await fetch(`${API}?nome=${nome}`);
  const data = await res.json();

  const tbody = document.getElementById('tabela');
  tbody.innerHTML = '';

  data.forEach(f => {
    tbody.innerHTML += `
      <tr>
        <td>${f.id}</td>
        <td>${f.nome}</td>
        <td>${f.contato_principal}</td>
        <td>${f.telefone}</td>
        <td>
          <button onclick="deletar(${f.id})">Excluir</button>
        </td>
      </tr>
    `;
  });
}

// ===============================
// CRIAR
// ===============================
async function criar() {

  const cidadeIdNumero = parseInt(hiddenCidadeId.value);

  if (isNaN(cidadeIdNumero)) {
    alert("Selecione a cidade na lista antes de salvar.");
    return;
  }

  const body = {
    nome: document.getElementById('nome').value,
    contato_principal: document.getElementById('contato').value,
    telefone: document.getElementById('telefone').value,
    cidade_id: cidadeIdNumero
  };

  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const erro = await res.json();
    alert(erro.error);
    return;
  }

  limparFormulario();
  listar();
}

// ===============================
// DELETE
// ===============================
async function deletar(id) {
  await fetch(`${API}/${id}`, { method: 'DELETE' });
  listar();
}

// ===============================
// LIMPAR
// ===============================
function limparFormulario() {
  document.getElementById('nome').value = '';
  document.getElementById('contato').value = '';
  document.getElementById('telefone').value = '';
  cidadeInput.value = '';
  hiddenCidadeId.value = '';
}

// Inicializa
listar();
</script>

</body>
</html>
