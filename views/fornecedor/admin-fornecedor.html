<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Fornecedores - Alumínio JR</title>
  <style>
    body { font-family: Arial; padding: 30px; background: #f4f6f9; }
    .container { max-width: 900px; margin: auto; }
    .box { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    button { cursor: pointer; }
    #cidadeResultados {
      max-height: 150px;
      overflow-y: auto;
      display: none;
    }
    .btn-editar { background: orange; color: #fff; border: none; }
    .btn-excluir { background: red; color: #fff; border: none; }
    .btn-salvar { background: green; color: #fff; border: none; }
  </style>
</head>
<body>
<div class="container">

  <div class="box">
    <h2 id="tituloForm">Novo Fornecedor</h2>

    <input type="hidden" id="fornecedor_id">

    <input type="text" id="nome" placeholder="Nome" required>
    <input type="text" id="contato" placeholder="Contato Principal" required>
    <input type="text" id="telefone" placeholder="Telefone" required>

    <input type="text" id="cidadeBusca" placeholder="Digite a cidade" required>
    <select id="cidadeResultados" size="5"></select>
    <input type="hidden" id="cidade_id">

    <button class="btn-salvar" onclick="salvar()">Salvar</button>
  </div>

  <div class="box">
    <h2>Lista</h2>
    <input type="text" id="filtroNome" placeholder="Buscar por nome">
    <button onclick="listar()">Buscar</button>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Contato</th>
          <th>Telefone</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>

</div>

<script>
const API = '/api/fornecedores';

async function listar() {
  const nome = document.getElementById('filtroNome').value;
  const res = await fetch(`${API}?nome=${nome}`);
  const data = await res.json();

  const tbody = document.getElementById('tabela');
  tbody.innerHTML = '';

  data.forEach(f => {
    tbody.innerHTML += `
      <tr>
        <td>${f.id}</td>
        <td>${f.nome}</td>
        <td>${f.contato_principal}</td>
        <td>${f.telefone}</td>
        <td>
          <button class="btn-editar" onclick="editar(${f.id}, '${f.nome}', '${f.contato_principal}', '${f.telefone}', ${f.cidade_id})">Editar</button>
          <button class="btn-excluir" onclick="deletar(${f.id})">Excluir</button>
        </td>
      </tr>
    `;
  });
}

function editar(id, nome, contato, telefone, cidade_id) {
  document.getElementById('fornecedor_id').value = id;
  document.getElementById('nome').value = nome;
  document.getElementById('contato').value = contato;
  document.getElementById('telefone').value = telefone;
  document.getElementById('cidade_id').value = cidade_id;

  document.getElementById('tituloForm').innerText = "Editar Fornecedor";
}

async function salvar() {

  const id = document.getElementById('fornecedor_id').value;

  const body = {
    nome: document.getElementById('nome').value,
    contato_principal: document.getElementById('contato').value,
    telefone: document.getElementById('telefone').value,
    cidade_id: parseInt(document.getElementById('cidade_id').value)
  };

  if (!body.cidade_id) {
    alert("Selecione a cidade clicando na lista.");
    return;
  }

  if (id) {
    await fetch(`${API}/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  } else {
    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  limparFormulario();
  listar();
}

async function deletar(id) {
  await fetch(`${API}/${id}`, { method: 'DELETE' });
  listar();
}

function limparFormulario() {
  document.getElementById('fornecedor_id').value = '';
  document.getElementById('nome').value = '';
  document.getElementById('contato').value = '';
  document.getElementById('telefone').value = '';
  document.getElementById('cidadeBusca').value = '';
  document.getElementById('cidade_id').value = '';
  document.getElementById('tituloForm').innerText = "Novo Fornecedor";
}

const cidadeInput = document.getElementById('cidadeBusca');
const resultados = document.getElementById('cidadeResultados');

cidadeInput.addEventListener('input', async function() {
  const termo = this.value;

  if (termo.length < 2) {
    resultados.style.display = 'none';
    return;
  }

  const res = await fetch(`/api/logistica/cidades/busca-id?nome=${termo}`);
  const cidades = await res.json();

  resultados.innerHTML = '';
  resultados.style.display = 'block';

  cidades.forEach(c => {
    const option = document.createElement('option');
    option.value = c.id;
    option.textContent = `${c.nome} - ${c.estado}`;
    resultados.appendChild(option);
  });
});

resultados.addEventListener('change', function() {
  const selected = this.options[this.selectedIndex];
  document.getElementById('cidade_id').value = selected.value;
  document.getElementById('cidadeBusca').value = selected.textContent;
  resultados.style.display = 'none';
});

listar();
</script>

</body>
</html>
