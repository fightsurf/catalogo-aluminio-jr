<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin Produtos – Alumínio JR</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.tab-btn {
  padding: 10px 15px;
  border: none;
  cursor: pointer;
  background: #ddd;
}

.tab-btn.active {
  background: #222;
  color: #fff;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

.card {
  background: #fff;
  padding: 15px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
}

input, select {
  padding: 6px;
  margin: 4px 0;
  width: 100%;
}

button {
  padding: 6px 10px;
  margin-top: 5px;
  cursor: pointer;
}

.lista-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid #eee;
}
</style>
</head>
<body>

<h1>⚙️ Administração de Produtos</h1>

<div class="tabs">
  <button class="tab-btn active" onclick="trocarTab('categorias')">Categorias</button>
  <button class="tab-btn" onclick="trocarTab('produtos')">Produtos</button>
</div>

<!-- ================= CATEGORIAS ================= -->

<div id="categorias" class="section active">

  <div class="card">
    <h3>Nova Categoria</h3>
    <input type="text" id="novaCategoriaNome" placeholder="Nome da categoria">
    <button onclick="criarCategoria()">Criar</button>
  </div>

  <div class="card">
    <h3>Lista de Categorias</h3>
    <div id="listaCategorias"></div>
  </div>

</div>

<!-- ================= PRODUTOS ================= -->

<div id="produtos" class="section">

  <div class="card">
    <h3>Novo Produto</h3>
    <input type="text" id="produtoNome" placeholder="Nome">
    <input type="number" step="0.01" id="produtoPreco" placeholder="Preço">
    <select id="produtoCategoria"></select>
    <input type="text" id="produtoFoto" placeholder="URL da Foto">
    <input type="number" id="produtoCaixa" placeholder="Capacidade Caixa" value="1">
    <label>
      <input type="checkbox" id="produtoAtivo" checked> Ativo
    </label>
    <button onclick="criarProduto()">Criar Produto</button>
  </div>

  <div class="card">
    <h3>Lista de Produtos</h3>
    <div id="listaProdutos"></div>
  </div>

</div>

<script>

let categorias = [];
let produtos = [];

function trocarTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

  if (tab === 'categorias') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('categorias').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('produtos').classList.add('active');
  }
}

async function apiGet(url) {
  const r = await fetch(url);
  const j = await r.json();
  if (!j.success) throw new Error(j.message);
  return j.data;
}

async function apiPost(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return r.json();
}

async function apiDelete(url) {
  const r = await fetch(url, { method: 'DELETE' });
  return r.json();
}

/* ================= CATEGORIAS ================= */

async function carregarCategorias() {
  categorias = await apiGet('/api/produtos-categorias');

  const lista = document.getElementById('listaCategorias');
  lista.innerHTML = '';

  categorias.forEach(c => {
    const div = document.createElement('div');
    div.className = 'lista-item';
    div.innerHTML = `
      <span>${c.nome}</span>
      <button onclick="excluirCategoria(${c.id})">Excluir</button>
    `;
    lista.appendChild(div);
  });

  const select = document.getElementById('produtoCategoria');
  select.innerHTML = '';
  categorias.forEach(c => {
    select.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
  });
}

async function criarCategoria() {
  const nome = document.getElementById('novaCategoriaNome').value;
  if (!nome) return alert('Digite o nome');

  await apiPost('/api/produtos-categorias', { nome });
  document.getElementById('novaCategoriaNome').value = '';
  carregarCategorias();
}

async function excluirCategoria(id) {
  const r = await apiDelete(`/api/produtos-categorias/${id}`);
  if (!r.success) return alert(r.message);
  carregarCategorias();
}

/* ================= PRODUTOS ================= */

async function carregarProdutos() {
  produtos = await apiGet('/api/produtos');

  const lista = document.getElementById('listaProdutos');
  lista.innerHTML = '';

  produtos.forEach(p => {
    const div = document.createElement('div');
    div.className = 'lista-item';
    div.innerHTML = `
      <span>${p.nome} — R$ ${Number(p.preco).toFixed(2)} — ${p.categoria} — ${p.ativo ? 'Ativo' : 'Inativo'}</span>
      <button onclick="excluirProduto(${p.id})">Excluir</button>
    `;
    lista.appendChild(div);
  });
}

async function criarProduto() {
  const data = {
    nome: document.getElementById('produtoNome').value,
    preco: Number(document.getElementById('produtoPreco').value),
    categoria_id: Number(document.getElementById('produtoCategoria').value),
    foto: document.getElementById('produtoFoto').value,
    capacidade_caixa: Number(document.getElementById('produtoCaixa').value),
    ativo: document.getElementById('produtoAtivo').checked
  };

  await apiPost('/api/produtos', data);

  document.getElementById('produtoNome').value = '';
  document.getElementById('produtoPreco').value = '';
  document.getElementById('produtoFoto').value = '';

  carregarProdutos();
}

async function excluirProduto(id) {
  await apiDelete(`/api/produtos/${id}`);
  carregarProdutos();
}

carregarCategorias();
carregarProdutos();

</script>

</body>
</html>
