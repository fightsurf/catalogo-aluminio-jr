<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin Produtos – Alumínio JR</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 25px;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

.tab-btn {
  padding: 10px 18px;
  border: none;
  cursor: pointer;
  background: #ddd;
  border-radius: 4px;
}

.tab-btn.active {
  background: #222;
  color: #fff;
}

.section { display: none; }
.section.active { display: block; }

.card {
  background: #fff;
  padding: 20px;
  margin-bottom: 20px;
  border: 1px solid #ddd;
  border-radius: 6px;
}

h3 { margin-top: 0; margin-bottom: 15px; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

label {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
  display: block;
}

input, select {
  width: 100%;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.checkbox-area {
  display: flex;
  align-items: center;
  gap: 8px;
}

.button-area {
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
}

button {
  background: #222;
  color: #fff;
  border: none;
  padding: 7px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
}

button:hover { background: #000; }

.lista-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.lista-acoes {
  display: flex;
  gap: 6px;
}

.filtro-area {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}
</style>
</head>
<body>

<h1>⚙️ Administração de Produtos</h1>

<div class="tabs">
  <button class="tab-btn active" onclick="trocarTab('categorias')">Categorias</button>
  <button class="tab-btn" onclick="trocarTab('produtos')">Produtos</button>
</div>

<!-- ================= CATEGORIAS ================= -->

<div id="categorias" class="section active">

  <div class="card">
    <h3>Nova / Editar Categoria</h3>
    <div class="form-grid">
      <div>
        <label>Nome</label>
        <input type="text" id="novaCategoriaNome">
      </div>
      <div class="button-area">
        <button onclick="salvarCategoria()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Lista de Categorias</h3>
    <div id="listaCategorias"></div>
  </div>

</div>

<!-- ================= PRODUTOS ================= -->

<div id="produtos" class="section">

  <div class="card">
    <h3>Novo / Editar Produto</h3>

    <div class="form-grid">

      <div>
        <label>Nome</label>
        <input type="text" id="produtoNome">
      </div>

      <div>
        <label>Preço</label>
        <input type="number" step="0.01" id="produtoPreco">
      </div>

      <div>
        <label>Categoria</label>
        <select id="produtoCategoria"></select>
      </div>

      <div>
        <label>Capacidade por Caixa</label>
        <input type="number" id="produtoCaixa" value="1" min="1">
      </div>

      <div style="grid-column: span 2;">
        <label>URL da Foto</label>
        <input type="text" id="produtoFoto">
      </div>

      <div class="checkbox-area">
        <input type="checkbox" id="produtoAtivo" checked>
        <label for="produtoAtivo">Produto Ativo</label>
      </div>

      <div class="button-area">
        <button onclick="salvarProduto()">Salvar Produto</button>
      </div>

    </div>
  </div>

  <div class="card">
    <h3>Lista de Produtos</h3>

    <div class="filtro-area">
      <input type="text" id="buscaNome" placeholder="Buscar por nome..." oninput="renderProdutos()">
      <select id="filtroCategoria" onchange="renderProdutos()"></select>
    </div>

    <div id="listaProdutos"></div>
  </div>

</div>

<script>

let categorias = [];
let produtos = [];
let produtoEditando = null;
let categoriaEditando = null;

function trocarTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

  if (tab === 'categorias') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('categorias').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('produtos').classList.add('active');
  }
}

async function api(url, method='GET', body=null) {
  const options = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) options.body = JSON.stringify(body);
  const r = await fetch(url, options);
  return r.json();
}

/* ================= CATEGORIAS ================= */

async function carregarCategorias() {
  const res = await api('/api/produtos-categorias');
  categorias = res.data;

  const lista = document.getElementById('listaCategorias');
  lista.innerHTML = '';

  categorias.forEach(c => {
    lista.innerHTML += `
      <div class="lista-item">
        <span>${c.nome}</span>
        <div class="lista-acoes">
          <button onclick="editarCategoria(${c.id})">Editar</button>
          <button onclick="excluirCategoria(${c.id})">Excluir</button>
        </div>
      </div>
    `;
  });

  const select = document.getElementById('produtoCategoria');
  const filtro = document.getElementById('filtroCategoria');

  select.innerHTML = '';
  filtro.innerHTML = '<option value="">Todas Categorias</option>';

  categorias.forEach(c => {
    select.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
    filtro.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
  });
}

function editarCategoria(id) {
  const c = categorias.find(c => c.id === id);
  categoriaEditando = id;
  document.getElementById('novaCategoriaNome').value = c.nome;
}

async function salvarCategoria() {
  const nome = document.getElementById('novaCategoriaNome').value;
  if (!nome) return;

  if (categoriaEditando) {
    await api(`/api/produtos-categorias/${categoriaEditando}`, 'PUT', { nome });
  } else {
    await api('/api/produtos-categorias', 'POST', { nome });
  }

  categoriaEditando = null;
  document.getElementById('novaCategoriaNome').value = '';
  carregarCategorias();
}

async function excluirCategoria(id) {
  await api(`/api/produtos-categorias/${id}`, 'DELETE');
  carregarCategorias();
}

/* ================= PRODUTOS ================= */

async function carregarProdutos() {
  const res = await api('/api/produtos');
  produtos = res.data;
  renderProdutos();
}

function renderProdutos() {
  const lista = document.getElementById('listaProdutos');
  lista.innerHTML = '';

  const busca = document.getElementById('buscaNome').value.toLowerCase();
  const filtroCat = document.getElementById('filtroCategoria').value;

  produtos
    .filter(p =>
      (!busca || p.nome.toLowerCase().includes(busca)) &&
      (!filtroCat || p.categoria_id == filtroCat)
    )
    .forEach(p => {
      lista.innerHTML += `
        <div class="lista-item">
          <span>
            ${p.nome} — R$ ${Number(p.preco).toFixed(2)} — ${p.categoria} — ${p.ativo ? 'Ativo' : 'Inativo'}
          </span>
          <div class="lista-acoes">
            <button onclick="editarProduto(${p.id})">Editar</button>
            <button onclick="toggleAtivo(${p.id})">
              ${p.ativo ? 'Desativar' : 'Ativar'}
            </button>
            <button onclick="excluirProduto(${p.id})">Excluir</button>
          </div>
        </div>
      `;
    });
}

async function salvarProduto() {
  const data = {
    nome: document.getElementById('produtoNome').value,
    preco: Number(document.getElementById('produtoPreco').value),
    categoria_id: Number(document.getElementById('produtoCategoria').value),
    foto: document.getElementById('produtoFoto').value,
    capacidade_caixa: Number(document.getElementById('produtoCaixa').value),
    ativo: document.getElementById('produtoAtivo').checked
  };

  if (produtoEditando) {
    await api(`/api/produtos/${produtoEditando}`, 'PUT', data);
  } else {
    await api('/api/produtos', 'POST', data);
  }

  limparFormulario();
  carregarProdutos();
}

function editarProduto(id) {
  const p = produtos.find(p => p.id === id);
  produtoEditando = id;

  document.getElementById('produtoNome').value = p.nome;
  document.getElementById('produtoPreco').value = p.preco;
  document.getElementById('produtoCategoria').value = p.categoria_id;
  document.getElementById('produtoFoto').value = p.foto;
  document.getElementById('produtoCaixa').value = p.capacidade_caixa;
  document.getElementById('produtoAtivo').checked = p.ativo;

  trocarTab('produtos');
}

async function toggleAtivo(id) {
  const p = produtos.find(p => p.id === id);
  await api(`/api/produtos/${id}`, 'PUT', { ...p, ativo: !p.ativo });
  carregarProdutos();
}

async function excluirProduto(id) {
  await api(`/api/produtos/${id}`, 'DELETE');
  carregarProdutos();
}

function limparFormulario() {
  produtoEditando = null;
  document.getElementById('produtoNome').value = '';
  document.getElementById('produtoPreco').value = '';
  document.getElementById('produtoFoto').value = '';
  document.getElementById('produtoCaixa').value = 1;
  document.getElementById('produtoAtivo').checked = true;
}

carregarCategorias();
carregarProdutos();

</script>

</body>
</html>
