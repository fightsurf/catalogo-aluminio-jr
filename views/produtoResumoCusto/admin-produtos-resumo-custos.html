<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumo de Custos dos Produtos - Alumínio JR</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    body { font-family: Arial, sans-serif; background:#eef2f7; margin:0; padding:24px; color:#17202a; }
    .container { max-width:1200px; margin:0 auto; }
    .box { background:#fff; padding:20px; border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.08); margin-bottom:20px; }
    h1 { margin-top:0; color:#243447; }
    .menu-modulo { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .menu-modulo a { text-decoration:none; background:#34495e; color:#fff; padding:9px 12px; border-radius:6px; font-size:13px; }
    .menu-modulo a.ativo { background:#2ecc71; }
    label { display:block; font-size:13px; font-weight:bold; color:#4a5568; margin-bottom:6px; }
    input, select, button { width:100%; padding:9px 10px; border-radius:6px; border:1px solid #ccd3db; font-size:14px; box-sizing:border-box; }
    button { border:none; cursor:pointer; font-weight:bold; }
    .btn-principal { background:#34495e; color:#fff; }
    .filtros { display:grid; grid-template-columns: 1fr 210px 150px 110px; gap:12px; align-items:end; }
    .cards-resumo { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin:14px 0 4px; }
    .card-resumo { background:#f6f8fb; border-radius:8px; padding:12px; }
    .card-resumo span { display:block; font-size:12px; color:#566573; margin-bottom:4px; }
    .card-resumo strong { font-size:20px; color:#17202a; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    th { background:#2c3e50; color:#fff; padding:8px; text-align:left; font-size:13px; }
    td { padding:8px; border-bottom:1px solid #e9edf2; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    tr:hover { background:#f9fbfd; }
    .col-produto { width:52%; }
    .col-num { width:16%; text-align:right; }
    .produto-erro { color:#c0392b; font-weight:bold; }
    .lucro-negativo { color:#c0392b; font-weight:bold; }
    .ok { color:#1e8449; font-weight:bold; }
    .mensagem { margin-top:12px; font-weight:bold; display:none; }
    .mensagem.erro { color:#c0392b; display:block; }
    .vazio { background:#f6f8fb; border:1px dashed #ccd3db; color:#6c7a89; padding:14px; border-radius:8px; }
    @media (max-width: 900px) {
      .filtros, .cards-resumo { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Resumo de Custos dos Produtos</h1>
      <div class="menu-modulo">
        <a href="/admin-produtos">Produtos</a>
        <a href="/admin-insumos">Insumos</a>
        <a href="/admin-insumos-discos">Discos de alumínio</a>
        <a href="/admin-insumos-fornecedores">Custos por fornecedor</a>
        <a href="/admin-produtos-composicao">Composição de produtos</a>
        <a href="/admin-produtos-resumo-custos" class="ativo">Resumo de custos</a>
      </div>

      <div class="filtros">
        <div>
          <label for="busca">Buscar produto</label>
          <input type="text" id="busca" placeholder="Nome do produto" onkeydown="if(event.key==='Enter'){carregarResumo()}" />
        </div>
        <div>
          <label for="status">Status</label>
          <select id="status">
            <option value="todos">Todos</option>
            <option value="erro">Somente com erro</option>
            <option value="custo_zerado">Custo zerado</option>
            <option value="lucro_negativo">Lucro negativo</option>
            <option value="ok">OK</option>
          </select>
        </div>
        <div>
          <label for="ativos">Produtos</label>
          <select id="ativos">
            <option value="true">Somente ativos</option>
            <option value="false">Todos</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="button" class="btn-principal" onclick="carregarResumo()">Buscar</button>
        </div>
      </div>

      <div class="cards-resumo">
        <div class="card-resumo"><span>Produtos listados</span><strong id="totalProdutos">0</strong></div>
        <div class="card-resumo"><span>Com erro</span><strong id="totalErros">0</strong></div>
        <div class="card-resumo"><span>Custo zerado</span><strong id="totalCustoZerado">0</strong></div>
        <div class="card-resumo"><span>Lucro negativo</span><strong id="totalLucroNegativo">0</strong></div>
      </div>

      <div id="mensagem" class="mensagem"></div>
    </div>

    <div class="box">
      <table>
        <thead>
          <tr>
            <th class="col-produto">Produto</th>
            <th class="col-num">Custo</th>
            <th class="col-num">Preço de venda</th>
            <th class="col-num">Lucro</th>
          </tr>
        </thead>
        <tbody id="tbodyResumo"></tbody>
      </table>
      <div id="vazio" class="vazio" style="display:none;">Nenhum produto encontrado.</div>
    </div>
  </div>

  <script>
    function escapeHtml(texto) {
      return String(texto ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function moeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function mostrarErro(texto) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = 'mensagem erro';
    }

    function limparMensagem() {
      const el = document.getElementById('mensagem');
      el.textContent = '';
      el.className = 'mensagem';
    }

    async function carregarResumo() {
      try {
        limparMensagem();
        const params = new URLSearchParams();
        const busca = document.getElementById('busca').value.trim();
        const status = document.getElementById('status').value;
        const ativos = document.getElementById('ativos').value;

        if (busca) params.append('busca', busca);
        if (status) params.append('status', status);
        params.append('ativos', ativos);

        const resp = await fetch(`/api/produtos-resumo-custos?${params.toString()}`);
        const json = await resp.json();
        if (!resp.ok || !json.success) throw new Error(json.message || 'Erro ao carregar resumo');

        renderizar(json.data.produtos || [], json.data.totais || {});
      } catch (error) {
        mostrarErro(error.message);
      }
    }

    function renderizar(produtos, totais) {
      document.getElementById('totalProdutos').textContent = totais.total_produtos || 0;
      document.getElementById('totalErros').textContent = totais.total_erros || 0;
      document.getElementById('totalCustoZerado').textContent = totais.total_custo_zerado || 0;
      document.getElementById('totalLucroNegativo').textContent = totais.total_lucro_negativo || 0;

      const tbody = document.getElementById('tbodyResumo');
      const vazio = document.getElementById('vazio');

      if (!produtos.length) {
        tbody.innerHTML = '';
        vazio.style.display = 'block';
        return;
      }

      vazio.style.display = 'none';
      tbody.innerHTML = produtos.map(item => {
        const classeProduto = item.erro ? 'produto-erro' : '';
        const classeLucro = item.lucro < 0 ? 'lucro-negativo' : 'ok';
        const titulo = item.custo_zerado
          ? 'Custo zerado: produto sem composição, composição vazia ou item sem custo válido.'
          : item.lucro_negativo
            ? 'Lucro negativo: preço de venda menor que custo.'
            : 'Produto OK';

        return `
          <tr title="${escapeHtml(titulo)}">
            <td class="col-produto ${classeProduto}">${escapeHtml(item.produto)}</td>
            <td class="col-num">${moeda(item.custo)}</td>
            <td class="col-num">${moeda(item.preco_venda)}</td>
            <td class="col-num ${classeLucro}">${moeda(item.lucro)}</td>
          </tr>
        `;
      }).join('');
    }

    carregarResumo();
  </script>
</body>
</html>
