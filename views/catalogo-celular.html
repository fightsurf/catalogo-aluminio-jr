<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo Alumínio JR</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 10px;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 10px;
    }

    /* ===== CATEGORIA ===== */
    .categoria {
      margin-top: 25px;
    }

    .categoria h2 {
      background: #222;
      color: #fff;
      padding: 10px;
      font-size: 16px;
      border-radius: 4px;
    }

    /* ===== PRODUTO ===== */
    .produto {
      background: #fff;
      margin-top: 10px;
      border-radius: 6px;
      padding: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    .produto img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .nome {
      font-size: 16px;
      margin-top: 8px;
    }

    .preco {
      font-size: 18px;
      font-weight: bold;
      color: #0a7;
      margin-top: 4px;
    }

    /* ===== WHATSAPP FLUTUANTE ===== */
    .whatsapp-flutuante {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 9999;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      background: #25d366;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .whatsapp-flutuante img {
      width: 42px;
      height: 42px;
    }

    /* ===== GALERIA / CARROSSEL DE FOTOS ===== */
    .produto img.foto-clicavel {
      cursor: zoom-in;
    }

    .galeria-produto {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .galeria-produto[hidden] {
      display: none;
    }

    .galeria-produto-conteudo {
      position: relative;
      width: min(760px, 100%);
      height: min(88vh, 820px);
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 52px;
      grid-template-rows: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .galeria-produto-titulo {
      grid-column: 1 / 4;
      text-align: center;
      padding: 0 48px;
      font-weight: bold;
      font-size: 17px;
    }

    .galeria-produto-imagem {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      height: 100%;
      max-height: 72vh;
      object-fit: contain;
      background: #fff;
      border-radius: 12px;
    }

    .galeria-produto-fechar,
    .galeria-produto-nav {
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      color: #102438;
      font-weight: bold;
      cursor: pointer;
    }

    .galeria-produto-fechar {
      position: absolute;
      right: 0;
      top: -8px;
      width: 42px;
      height: 42px;
      font-size: 25px;
    }

    .galeria-produto-nav {
      width: 46px;
      height: 46px;
      font-size: 28px;
    }

    .galeria-produto-anterior {
      grid-column: 1;
      grid-row: 2;
    }

    .galeria-produto-proxima {
      grid-column: 3;
      grid-row: 2;
    }

    .galeria-produto-contador {
      grid-column: 1 / 4;
      text-align: center;
      font-size: 14px;
    }

    .galeria-produto-nav[hidden] {
      display: block;
      visibility: hidden;
    }
  </style>
  <link rel="stylesheet" href="/css/theme.css" />
</head>

<body>

  <h1>📦 Catálogo Alumínio JR</h1>

  <div id="catalogo"></div>

  <!-- WHATSAPP FLUTUANTE -->
  <a
    class="whatsapp-flutuante"
    href="https://wa.me/558399792085"
    target="_blank"
    title="Falar no WhatsApp"
  >
    <img
      src="https://pub-51cb4ace3dfb43a4ac45a4b7c399904d.r2.dev/%C3%ADcone%20whatsapp.jpg"
      alt="WhatsApp"
    />
  </a>


<div class="galeria-produto" id="galeriaProduto" hidden role="dialog" aria-modal="true" aria-labelledby="galeriaProdutoTitulo" tabindex="-1" onclick="fecharGaleriaProdutoFora(event)">
  <div class="galeria-produto-conteudo">
    <button type="button" class="galeria-produto-fechar" aria-label="Fechar galeria" onclick="fecharGaleriaProduto()">×</button>
    <div class="galeria-produto-titulo" id="galeriaProdutoTitulo"></div>
    <button type="button" class="galeria-produto-nav galeria-produto-anterior" id="galeriaProdutoAnterior" aria-label="Foto anterior" onclick="mudarFotoProduto(-1)">‹</button>
    <img class="galeria-produto-imagem" id="galeriaProdutoImagem" alt="">
    <button type="button" class="galeria-produto-nav galeria-produto-proxima" id="galeriaProdutoProxima" aria-label="Próxima foto" onclick="mudarFotoProduto(1)">›</button>
    <div class="galeria-produto-contador" id="galeriaProdutoContador"></div>
  </div>
</div>

<script>
  let produtos = [];

  async function apiGet(url) {
    const response = await fetch(url);
    const json = await response.json();

    if (!json.success) {
      throw new Error(json.message || 'Erro na API');
    }

    return json.data;
  }

  async function carregarCatalogo() {
    try {
      produtos = await apiGet('/api/produtos');

      const porCategoria = {};

      produtos.forEach(p => {
        const cat = p.categoria || 'SEM CATEGORIA';

        if (!porCategoria[cat]) {
          porCategoria[cat] = [];
        }

        porCategoria[cat].push(p);
      });

      const container = document.getElementById('catalogo');
      container.innerHTML = '';

      // 1️⃣ PRIMEIRO: Ordena as CATEGORIAS pelo menor ID
      const categoriasOrdenadas = Object.keys(porCategoria).sort((catA, catB) => {
        const idMinA = Math.min(...porCategoria[catA].map(p => Number(p.id)));
        const idMinB = Math.min(...porCategoria[catB].map(p => Number(p.id)));
        return idMinA - idMinB;
      });

      // 2️⃣ DEPOIS: Processa as categorias em ordem crescente
      categoriasOrdenadas.forEach(categoria => {
        const bloco = document.createElement('div');
        bloco.className = 'categoria';

        bloco.innerHTML = `<h2>${categoria}</h2>`;

        // 🔤 Ordena os produtos ALFABETICAMENTE
        porCategoria[categoria]
          .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'))
          .forEach(p => {

            const foto = p.foto && p.foto.trim() !== ''
              ? p.foto
              : 'https://via.placeholder.com/400x400?text=Sem+Foto';

            const preco = Number(p.preco);

            const div = document.createElement('div');
            div.className = 'produto';

            div.innerHTML = `
              <img class="foto-clicavel" src="${foto}" alt="${p.nome}" onclick="abrirGaleriaProduto(${Number(p.id)})">
              <div class="nome">${p.nome}</div>
              <div class="preco">
                R$ ${preco.toFixed(2).replace('.', ',')}
              </div>
            `;

            bloco.appendChild(div);
          });

        container.appendChild(bloco);
      });

    } catch (error) {
      console.error('Erro ao carregar catálogo:', error);
      document.getElementById('catalogo').innerHTML =
        '<p style="color:red;text-align:center;">Erro ao carregar produtos.</p>';
    }
  }


const galeriaProdutoEstado = { fotos: [], indice: 0, toqueInicioX: null };

function fotosDoProduto(produto) {
  const candidatas = Array.isArray(produto?.fotos)
    ? produto.fotos
    : [produto?.foto, produto?.foto_2, produto?.foto_3, produto?.foto_4, produto?.foto_5, produto?.foto_6];

  return [...new Set(
    candidatas
      .map(foto => String(foto || '').trim())
      .filter(Boolean)
  )];
}

function abrirGaleriaProduto(id) {
  const produto = produtos.find(item => Number(item.id) === Number(id));
  if (!produto) return;

  const fotos = fotosDoProduto(produto);
  if (!fotos.length) return;

  galeriaProdutoEstado.fotos = fotos;
  galeriaProdutoEstado.indice = 0;

  document.getElementById('galeriaProdutoTitulo').textContent = produto.nome || 'Fotos do produto';
  document.getElementById('galeriaProduto').hidden = false;
  document.body.style.overflow = 'hidden';
  atualizarGaleriaProduto();
  document.getElementById('galeriaProduto').focus();
}

function atualizarGaleriaProduto() {
  const total = galeriaProdutoEstado.fotos.length;
  const indice = galeriaProdutoEstado.indice;
  const imagem = document.getElementById('galeriaProdutoImagem');
  const titulo = document.getElementById('galeriaProdutoTitulo').textContent;

  imagem.src = galeriaProdutoEstado.fotos[indice] || '';
  imagem.alt = `${titulo} — foto ${indice + 1} de ${total}`;

  document.getElementById('galeriaProdutoContador').textContent =
    total > 1 ? `${indice + 1} de ${total}` : '';

  document.getElementById('galeriaProdutoAnterior').hidden = total < 2;
  document.getElementById('galeriaProdutoProxima').hidden = total < 2;
}

function mudarFotoProduto(direcao) {
  const total = galeriaProdutoEstado.fotos.length;
  if (total < 2) return;

  galeriaProdutoEstado.indice =
    (galeriaProdutoEstado.indice + direcao + total) % total;

  atualizarGaleriaProduto();
}

function fecharGaleriaProduto() {
  document.getElementById('galeriaProduto').hidden = true;
  document.body.style.overflow = '';
  galeriaProdutoEstado.fotos = [];
  galeriaProdutoEstado.indice = 0;
  galeriaProdutoEstado.toqueInicioX = null;
}

function fecharGaleriaProdutoFora(event) {
  if (event.target === document.getElementById('galeriaProduto')) {
    fecharGaleriaProduto();
  }
}

function ativarControlesGaleriaProduto() {
  const galeria = document.getElementById('galeriaProduto');

  galeria.addEventListener('touchstart', event => {
    galeriaProdutoEstado.toqueInicioX = event.changedTouches[0]?.clientX ?? null;
  }, { passive: true });

  galeria.addEventListener('touchend', event => {
    if (galeriaProdutoEstado.toqueInicioX === null) return;

    const fim = event.changedTouches[0]?.clientX ?? galeriaProdutoEstado.toqueInicioX;
    const deslocamento = fim - galeriaProdutoEstado.toqueInicioX;
    galeriaProdutoEstado.toqueInicioX = null;

    if (Math.abs(deslocamento) > 45) {
      mudarFotoProduto(deslocamento < 0 ? 1 : -1);
    }
  }, { passive: true });

  document.addEventListener('keydown', event => {
    if (galeria.hidden) return;

    if (event.key === 'Escape') fecharGaleriaProduto();
    else if (event.key === 'ArrowLeft') mudarFotoProduto(-1);
    else if (event.key === 'ArrowRight') mudarFotoProduto(1);
  });
}

ativarControlesGaleriaProduto();

  carregarCatalogo();
</script>
  
</body>
</html>
