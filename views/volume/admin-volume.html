<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin Volume – Alumínio JR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 25px; }
    h1 { text-align: center; margin-bottom: 25px; }
    .search-area { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .search-area input, .search-area select { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-width: 160px; }
    .search-area button { padding: 8px 16px; background: #222; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .search-area button:hover { background: #000; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    th, td { border: 1px solid #ddd; padding: 9px 12px; text-align: left; font-size: 14px; }
    th { background: #eee; font-weight: 600; }
    tr:hover { background: #fafafa; }
    td input[type="number"] { width: 90px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
    .btn-salvar { background: #2a7d2a; color: #fff; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-salvar:hover { background: #1e5e1e; }
    .msg { padding: 10px 15px; margin-bottom: 15px; border-radius: 4px; display: none; font-size: 14px; }
    .msg.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
    .msg.error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
  </style>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>

<h1>📦 Admin – Volume de Produtos</h1>

<div id="mensagem" class="msg"></div>

<div class="search-area">
  <input type="text" id="campoBusca" placeholder="Buscar por código ou descrição..." oninput="filtrarTabela()">
  <select id="filtroCategoria" onchange="carregarProdutos()">
    <option value="">Todas as Categorias</option>
  </select>
  <button onclick="carregarProdutos()">🔄 Recarregar</button>
</div>

<table>
  <thead>
    <tr>
      <th>Código</th>
      <th>Descrição</th>
      <th>Categoria</th>
      <th>Volume (capacidade/caixa)</th>
      <th>Ação</th>
    </tr>
  </thead>
  <tbody id="corpoTabela"></tbody>
</table>

<script>
let produtos = [];

async function carregarCategorias() {
  try {
    const res = await fetch('/api/produtos-categorias');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (!json.success) return;
    const select = document.getElementById('filtroCategoria');
    json.data.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.nome;
      select.appendChild(opt);
    });
  } catch (err) {
    console.error('Erro ao carregar categorias:', err.message);
  }
}

async function carregarProdutos() {
  const search = document.getElementById('campoBusca').value.trim();
  const categoria = document.getElementById('filtroCategoria').value;
  const params = new URLSearchParams();
  if (search) params.set('search', search);
  if (categoria) params.set('categoria', categoria);
  const url = '/api/admin-volume/produtos' + (params.toString() ? '?' + params.toString() : '');
  try {
    const res = await fetch(url);
    const json = await res.json();
    if (!json.success) throw new Error(json.message);
    produtos = json.data;
    renderTabela(produtos);
  } catch (err) {
    mostrarMensagem('Erro ao carregar produtos: ' + err.message, 'error');
  }
}

function filtrarTabela() {
  const termo = document.getElementById('campoBusca').value.toLowerCase();
  const filtrados = produtos.filter(p =>
    String(p.id).includes(termo) || p.nome.toLowerCase().includes(termo)
  );
  renderTabela(filtrados);
}

function renderTabela(lista) {
  const tbody = document.getElementById('corpoTabela');
  tbody.innerHTML = '';
  lista.forEach(p => {
    const tr = document.createElement('tr');

    const tdId = document.createElement('td');
    tdId.textContent = p.id;

    const tdNome = document.createElement('td');
    tdNome.textContent = p.nome;

    const tdCat = document.createElement('td');
    tdCat.textContent = p.categoria || '—';

    const tdVol = document.createElement('td');
    const input = document.createElement('input');
    input.type = 'number';
    input.id = 'vol_' + p.id;
    input.value = p.volume;
    input.min = '0';
    input.step = '0.01';
    tdVol.appendChild(input);

    const tdAcao = document.createElement('td');
    const btn = document.createElement('button');
    btn.className = 'btn-salvar';
    btn.textContent = 'Salvar';
    btn.onclick = () => salvarVolume(p.id);
    tdAcao.appendChild(btn);

    tr.appendChild(tdId);
    tr.appendChild(tdNome);
    tr.appendChild(tdCat);
    tr.appendChild(tdVol);
    tr.appendChild(tdAcao);
    tbody.appendChild(tr);
  });
}

async function salvarVolume(id) {
  const input = document.getElementById('vol_' + id);
  const volume = input.value;
  try {
    const res = await fetch(`/api/admin-volume/produtos/${id}/volume`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ volume: Number(volume) })
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.message);
    mostrarMensagem('Volume atualizado com sucesso!', 'success');
    const produto = produtos.find(p => p.id === id);
    if (produto) produto.volume = json.data.volume;
  } catch (err) {
    mostrarMensagem('Erro ao salvar: ' + err.message, 'error');
  }
}

function mostrarMensagem(texto, tipo) {
  const el = document.getElementById('mensagem');
  el.textContent = texto;
  el.className = 'msg ' + tipo;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = 'msg'; }, 4000);
}

carregarCategorias().then(carregarProdutos);
</script>

</body>
</html>
