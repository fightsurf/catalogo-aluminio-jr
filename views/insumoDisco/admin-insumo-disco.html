<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discos de Alumínio - Alumínio JR</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; padding: 24px; }
    .container { max-width: 1180px; margin: 0 auto; }
    .box { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.08); margin-bottom: 24px; }
    h1,h2 { margin-top: 0; color: #243447; }
    .menu-modulo { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .menu-modulo a { text-decoration:none; background:#34495e; color:#fff; padding:9px 12px; border-radius:6px; font-size:13px; }
    .menu-modulo a.ativo { background:#2ecc71; }
    .grid-form { display:grid; grid-template-columns: 180px 180px 180px 160px 140px 140px; gap:12px; align-items:end; }
    .grid-filtro { display:grid; grid-template-columns: 1fr 180px 180px 160px 140px 140px; gap:12px; align-items:end; }
    label { display:block; font-size:13px; font-weight:bold; color:#4a5568; margin-bottom:6px; }
    input, select, button { width:100%; padding:10px 12px; border-radius:6px; border:1px solid #ccd3db; font-size:14px; box-sizing:border-box; }
    input[readonly] { background:#f4f7fa; }
    button { border:none; cursor:pointer; font-weight:bold; }
    .btn-salvar { background:#2ecc71; color:#fff; }
    .btn-limpar { background:#95a5a6; color:#fff; }
    .btn-buscar { background:#34495e; color:#fff; }
    .btn-editar { background:#f39c12; color:#fff; padding:8px 10px; }
    .btn-excluir { background:#e74c3c; color:#fff; padding:8px 10px; }
    table { width:100%; border-collapse:collapse; margin-top:16px; }
    th { background:#2c3e50; color:#fff; padding:10px; text-align:left; }
    td { padding:10px; border-bottom:1px solid #e9edf2; vertical-align:middle; }
    tr:hover { background:#f9fbfd; }
    .acoes { display:flex; gap:8px; flex-wrap:wrap; }
    .status { font-weight:bold; }
    .status-ativo { color:#1e8449; }
    .status-inativo { color:#c0392b; }
    .mensagem { margin-top:12px; font-weight:bold; display:none; }
    .mensagem.sucesso { color:#1e8449; display:block; }
    .mensagem.erro { color:#c0392b; display:block; }
    @media (max-width: 1080px) { .grid-form,.grid-filtro { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Discos de Alumínio</h1>
      <div class="menu-modulo">
        <a href="/admin-insumos-categorias">Categorias de insumo</a>
        <a href="/admin-insumos">Insumos</a>
        <a href="/admin-insumos-discos" class="ativo">Discos de alumínio</a>
        <a href="/admin-insumos-fornecedores">Custos por fornecedor</a>
        <a href="/admin-pedido-fornecedor">Pedido para fornecedor</a>
      </div>

      <input type="hidden" id="insumo_id" />
      <div class="grid-form">
        <div>
          <label for="diametro_mm">Diâmetro (mm)</label>
          <input type="number" id="diametro_mm" min="0" step="0.01" oninput="atualizarPreview()" />
        </div>
        <div>
          <label for="espessura_mm">Espessura (mm)</label>
          <input type="number" id="espessura_mm" min="0" step="0.01" oninput="atualizarPreview()" />
        </div>
        <div>
          <label for="nome_preview">Nome gerado</label>
          <input type="text" id="nome_preview" readonly />
        </div>
        <div>
          <label for="peso_kg_preview">Peso (kg)</label>
          <input type="text" id="peso_kg_preview" readonly />
        </div>
        <div>
          <label for="ativo">Ativo</label>
          <select id="ativo">
            <option value="true">Sim</option>
            <option value="false">Não</option>
          </select>
        </div>
        <div style="display:flex; gap:12px;">
          <button type="button" class="btn-salvar" onclick="salvar()">Salvar</button>
          <button type="button" class="btn-limpar" onclick="limparFormulario()">Limpar</button>
        </div>
      </div>
      <div id="mensagem" class="mensagem"></div>
    </div>

    <div class="box">
      <h2>Lista de Discos</h2>
      <div class="grid-filtro">
        <div>
          <label for="filtroNome">Buscar por nome</label>
          <input type="text" id="filtroNome" placeholder="Nome do disco" />
        </div>
        <div>
          <label for="filtroDiametro">Diâmetro (mm)</label>
          <input type="number" id="filtroDiametro" min="0" step="0.01" />
        </div>
        <div>
          <label for="filtroEspessura">Espessura (mm)</label>
          <input type="number" id="filtroEspessura" min="0" step="0.01" />
        </div>
        <div>
          <label for="filtroAtivo">Status</label>
          <select id="filtroAtivo">
            <option value="">Todos</option>
            <option value="true">Ativos</option>
            <option value="false">Inativos</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="button" class="btn-buscar" onclick="listar()">Buscar</button>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="button" class="btn-limpar" onclick="limparFiltros()">Limpar filtros</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Diâmetro (mm)</th>
            <th>Espessura (mm)</th>
            <th>Peso (kg)</th>
            <th>Status</th>
            <th style="width:160px;">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = '/api/insumos-discos';
    const COEF = 0.0000021206;

    function mostrarMensagem(texto, tipo = 'sucesso') {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = `mensagem ${tipo}`;
    }

    function limparMensagem() {
      const el = document.getElementById('mensagem');
      el.textContent = '';
      el.className = 'mensagem';
    }

    function formatarDiametro(valor) {
      const numero = Number(valor || 0);
      if (!numero) return '';
      return Number.isInteger(numero) ? String(numero) : numero.toFixed(2).replace(/\.00$/, '').replace(/(\.[1-9])0$/, '$1');
    }

    function formatarEspessura(valor) {
      const numero = Number(valor || 0);
      if (!numero) return '';
      return numero.toFixed(2);
    }

    function atualizarPreview() {
      const diametro = Number(document.getElementById('diametro_mm').value || 0);
      const espessura = Number(document.getElementById('espessura_mm').value || 0);
      document.getElementById('nome_preview').value = diametro > 0 && espessura > 0 ? `DISCO ${formatarDiametro(diametro)} X ${formatarEspessura(espessura)}` : '';
      const peso = diametro > 0 && espessura > 0 ? diametro * diametro * espessura * COEF : 0;
      document.getElementById('peso_kg_preview').value = peso > 0 ? peso.toFixed(6) : '';
    }

    function limparFormulario() {
      document.getElementById('insumo_id').value = '';
      document.getElementById('diametro_mm').value = '';
      document.getElementById('espessura_mm').value = '';
      document.getElementById('ativo').value = 'true';
      document.getElementById('nome_preview').value = '';
      document.getElementById('peso_kg_preview').value = '';
      limparMensagem();
    }

    function limparFiltros() {
      document.getElementById('filtroNome').value = '';
      document.getElementById('filtroDiametro').value = '';
      document.getElementById('filtroEspessura').value = '';
      document.getElementById('filtroAtivo').value = '';
      listar();
    }

    async function listar() {
      const params = new URLSearchParams();
      const nome = document.getElementById('filtroNome').value.trim();
      const diametro = document.getElementById('filtroDiametro').value;
      const espessura = document.getElementById('filtroEspessura').value;
      const ativo = document.getElementById('filtroAtivo').value;
      if (nome) params.append('nome', nome);
      if (diametro) params.append('diametro_mm', diametro);
      if (espessura) params.append('espessura_mm', espessura);
      if (ativo) params.append('ativo', ativo);

      const resp = await fetch(`${API}?${params.toString()}`);
      const json = await resp.json();
      const dados = json.data || [];
      const tbody = document.getElementById('tbody');

      tbody.innerHTML = dados.map(item => `
        <tr>
          <td>${item.nome}</td>
          <td>${Number(item.diametro_mm).toFixed(2).replace(/\.00$/, '')}</td>
          <td>${Number(item.espessura_mm).toFixed(2)}</td>
          <td>${Number(item.peso_kg).toFixed(6)}</td>
          <td><span class="status ${item.ativo ? 'status-ativo' : 'status-inativo'}">${item.ativo ? 'Ativo' : 'Inativo'}</span></td>
          <td>
            <div class="acoes">
              <button class="btn-editar" onclick="editar(${item.id})">Editar</button>
              <button class="btn-excluir" onclick="excluirItem(${item.id})">Excluir</button>
            </div>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="6">Nenhum disco encontrado.</td></tr>';
    }

    async function editar(id) {
      const resp = await fetch(`${API}/${id}`);
      const json = await resp.json();
      if (!json.success) {
        mostrarMensagem(json.message || 'Erro ao carregar disco', 'erro');
        return;
      }

      const item = json.data;
      document.getElementById('insumo_id').value = item.id;
      document.getElementById('diametro_mm').value = item.diametro_mm;
      document.getElementById('espessura_mm').value = item.espessura_mm;
      document.getElementById('ativo').value = String(item.ativo);
      atualizarPreview();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      limparMensagem();
    }

    async function salvar() {
      try {
        limparMensagem();
        const id = document.getElementById('insumo_id').value;
        const payload = {
          diametro_mm: document.getElementById('diametro_mm').value,
          espessura_mm: document.getElementById('espessura_mm').value,
          ativo: document.getElementById('ativo').value === 'true'
        };

        const metodo = id ? 'PUT' : 'POST';
        const url = id ? `${API}/${id}` : API;
        const resp = await fetch(url, {
          method: metodo,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const json = await resp.json();
        if (!resp.ok || !json.success) {
          throw new Error(json.message || 'Erro ao salvar disco');
        }

        mostrarMensagem('Disco salvo com sucesso');
        limparFormulario();
        listar();
      } catch (error) {
        mostrarMensagem(error.message, 'erro');
      }
    }

    async function excluirItem(id) {
      if (!confirm('Deseja realmente excluir este disco?')) return;
      const resp = await fetch(`${API}/${id}`, { method: 'DELETE' });
      const json = await resp.json();
      if (!resp.ok || !json.success) {
        mostrarMensagem(json.message || 'Erro ao excluir disco', 'erro');
        return;
      }
      mostrarMensagem('Disco removido com sucesso');
      listar();
    }

    listar();
  </script>
</body>
</html>
