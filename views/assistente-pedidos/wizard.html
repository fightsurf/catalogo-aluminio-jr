<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistente de pedido</title>
<style>
:root{font-family:Arial,sans-serif;color:#1d2530;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;min-height:100vh;background:white;padding:16px 16px 285px}.topo{position:sticky;top:0;background:white;z-index:4;padding:10px 0;border-bottom:1px solid #ddd}.passos{font-size:13px;color:#667}.tela{display:none}.tela.ativa{display:block}.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid #d8dde3;border-radius:14px;padding:12px;background:#fff}.produto img{width:100%;height:145px;object-fit:contain;background:#f7f7f7;border-radius:10px}.produto h3{font-size:15px;min-height:36px}.preco{font-weight:bold}.qtd{display:flex;gap:8px;align-items:center;justify-content:center}.qtd button,.botao{min-height:46px;border:0;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:bold}.qtd button{width:46px}.botao{background:#162b45;color:white;width:100%}.secundario{background:#e8edf2;color:#162b45}.acoes{display:grid;gap:10px;margin-top:18px}.campo{width:100%;min-height:48px;padding:10px;border:1px solid #bcc5cf;border-radius:10px;font-size:16px}.opcao{display:block;border:1px solid #ccd3da;border-radius:12px;padding:15px;margin:10px 0}.carrinho{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);max-height:270px;overflow:hidden;background:#102438;color:#fff;padding:10px 16px;z-index:5}#miniItens{max-height:130px;overflow:auto}.mini{display:flex;gap:8px;align-items:center;font-size:13px;margin:5px 0}.mini img{width:34px;height:34px;object-fit:contain;background:white;border-radius:6px}.linha{display:flex;justify-content:space-between;gap:10px}.botao-carrinho{margin-top:10px;background:#fff;color:#102438}.erro{background:#ffe7e7;color:#8b1111;padding:12px;border-radius:10px}.sucesso{background:#e4f7e8;color:#145b27;padding:12px;border-radius:10px}@media(max-width:460px){.grade{grid-template-columns:1fr 1fr}.produto img{height:115px}.app{padding-left:10px;padding-right:10px}}
</style></head><body><main class="app"><header class="topo"><strong id="cliente">Carregando...</strong><div class="passos" id="indicador"></div></header><div id="mensagem"></div>
<section class="tela ativa" data-passo="0"><h1>Como deseja fazer seu pedido?</h1><div class="acoes"><button class="botao" onclick="escolherModalidade('orcamento')">Pedido tradicional</button><button class="botao secundario" onclick="escolherModalidade('kit-feirinha')">Kit Feirinha</button></div></section>
<section class="tela" data-passo="1"><h1>Escolha os produtos</h1><select id="categoria" class="campo" onchange="renderProdutos()"><option value="">Todas as categorias</option></select><div class="grade" id="produtos"></div></section>
<section class="tela" data-passo="2"><h1>Resumo do pedido</h1><div id="resumo"></div><div class="acoes"><button class="botao" onclick="carregarDatas()">Escolher data</button><button class="botao secundario" onclick="mostrar(1)">Voltar</button></div></section>
<section class="tela" data-passo="3"><h1>Data de entrega</h1><div id="datas"></div><div class="acoes"><button class="botao" onclick="avancarLocal()">Continuar</button></div></section>
<section class="tela" data-passo="4"><h1>Local de entrega</h1><div id="cidades"></div><div id="blocoTransportadora" hidden><h2>Transportadora</h2><select id="transportadora" class="campo"></select></div><div class="acoes"><button class="botao" onclick="irFinal()">Continuar</button></div></section>
<section class="tela" data-passo="5"><h1>Confira tudo</h1><div id="final"></div><div class="acoes"><button class="botao" id="concluir" onclick="concluir()">Concluir pedido</button></div></section>
<section class="tela" data-passo="6"><h1>Pedido enviado</h1><div class="sucesso">Seu pedido foi enviado para confirmação da fábrica.</div></section>
</main><aside class="carrinho" id="carrinho"><strong>Seu pedido</strong><div id="miniItens">Nenhum item selecionado.</div><div class="linha"><strong>Total</strong><strong id="miniTotal">R$ 0,00</strong></div><button class="botao botao-carrinho" id="proximoEtapa2" onclick="irResumo()" hidden>Próximo</button></aside>
<script>
const token=location.pathname.split('/').filter(Boolean).pop(); const estado={contexto:null,modalidade:null,produtos:[],itens:new Map(),carrada:null,cidade:null};
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok||j.success===false)throw new Error(j.message||'Falha na operação');return j.data}
function erro(e){document.getElementById('mensagem').innerHTML=`<div class="erro">${esc(e.message)}</div>`;scrollTo(0,0)}
function mostrar(n){document.querySelectorAll('.tela').forEach(x=>x.classList.toggle('ativa',Number(x.dataset.passo)===n));document.getElementById('indicador').textContent=n<6?`Etapa ${n+1} de 6`:'';document.getElementById('proximoEtapa2').hidden=n!==1;scrollTo(0,0)}
async function iniciar(){try{estado.contexto=await api(`/api/assistente-pedidos/publico/${token}/contexto`);document.getElementById('cliente').textContent=estado.contexto.cliente.nome;document.getElementById('cidades').innerHTML=estado.contexto.cidades.map(c=>`<label class="opcao"><input type="radio" name="cidade" value="${c.valor}" onchange="selecionarCidade('${c.valor}')"> ${esc(c.rotulo)}${c.coletaFabrica?' — coleta na fábrica':''}</label>`).join('');mostrar(0)}catch(e){erro(e)}}
async function escolherModalidade(m){try{estado.modalidade=m;estado.produtos=await api(`/api/assistente-pedidos/publico/${token}/produtos?modalidade=${encodeURIComponent(m)}`);const cats=[...new Map(estado.produtos.filter(p=>p.categoria_id).map(p=>[p.categoria_id,p.categoria||`Categoria ${p.categoria_id}`])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'pt-BR',{sensitivity:'base'}));const seletor=document.getElementById('categoria');seletor.innerHTML='<option value="">Todas as categorias</option>'+cats.map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('');const normalizar=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const panelaPressao=cats.find(([,nome])=>normalizar(nome)==='panela de pressao')||cats.find(([,nome])=>normalizar(nome).includes('panela de pressao'));seletor.value=panelaPressao?String(panelaPressao[0]):'';renderProdutos();mostrar(1)}catch(e){erro(e)}}
function renderProdutos(){const cat=document.getElementById('categoria').value;const lista=estado.produtos.filter(p=>!cat||String(p.categoria_id)===cat);document.getElementById('produtos').innerHTML=lista.map(p=>{const q=estado.itens.get(Number(p.id))?.quantidade||0;return `<article class="card produto"><img src="${esc(p.foto||'/placeholder.png')}" alt=""><h3>${esc(p.nome)}</h3><div class="preco">${brl(p.preco)}</div><div class="qtd"><button onclick="qtd(${p.id},-1)">−</button><strong id="q${p.id}">${q}</strong><button onclick="qtd(${p.id},1)">+</button></div></article>`}).join('')||'<p>Nenhum produto nesta categoria.</p>'}
function qtd(id,d){const p=estado.produtos.find(x=>Number(x.id)===Number(id));let q=(estado.itens.get(Number(id))?.quantidade||0)+d;q=Math.max(0,q);if(q)estado.itens.set(Number(id),{produto:p,quantidade:q});else estado.itens.delete(Number(id));const el=document.getElementById(`q${id}`);if(el)el.textContent=q;renderCarrinho()}
function totais(){const itens=[...estado.itens.values()];return{itens,quantidade:itens.reduce((s,x)=>s+x.quantidade,0),total:itens.reduce((s,x)=>s+x.quantidade*Number(x.produto.preco),0)}}
function renderCarrinho(){const t=totais();document.getElementById('miniItens').innerHTML=t.itens.length?t.itens.map(x=>`<div class="mini"><img src="${esc(x.produto.foto||'')}" alt=""><span>${esc(x.produto.nome)} × ${x.quantidade}</span></div>`).join(''):'Nenhum item selecionado.';document.getElementById('miniTotal').textContent=brl(t.total)}
function montarResumo(){const t=totais();return t.itens.map(x=>`<div class="card"><div style="display:flex;gap:12px;align-items:center"><img src="${esc(x.produto.foto||'')}" alt="" style="width:58px;height:58px;object-fit:contain"><div style="flex:1"><strong>${esc(x.produto.nome)}</strong><div class="linha"><span>${x.quantidade} × ${brl(x.produto.preco)}</span><strong>${brl(x.quantidade*x.produto.preco)}</strong></div></div></div></div>`).join('')+`<h2>Total: ${brl(t.total)}</h2>`}
function irResumo(){if(!estado.itens.size)return erro(new Error('Selecione ao menos um produto.'));document.getElementById('resumo').innerHTML=montarResumo();mostrar(2)}
async function carregarDatas(){try{const t=totais();const datas=await api(`/api/assistente-pedidos/publico/${token}/datas?quantidade=${t.quantidade}`);if(!datas.length)throw new Error('Não há carradas com capacidade para este pedido.');document.getElementById('datas').innerHTML=datas.map(d=>`<label class="opcao"><input type="radio" name="data" value="${d.codigo}" onchange='estado.carrada=${JSON.stringify(d)}'> ${new Date(d.data+'T12:00:00').toLocaleDateString('pt-BR')} — ${d.capacidadeLivre} itens livres</label>`).join('');mostrar(3)}catch(e){erro(e)}}
function avancarLocal(){if(!estado.carrada)return erro(new Error('Escolha uma data.'));mostrar(4)}
async function selecionarCidade(valor){try{estado.cidade=estado.contexto.cidades.find(c=>c.valor===valor);const bloco=document.getElementById('blocoTransportadora');if(estado.cidade.coletaFabrica){bloco.hidden=true;document.getElementById('transportadora').innerHTML='';return}const ts=await api(`/api/assistente-pedidos/publico/${token}/transportadoras?cidade=${encodeURIComponent(valor)}`);if(!ts.length)throw new Error('Nenhuma transportadora cadastrada para esta cidade.');bloco.hidden=false;document.getElementById('transportadora').innerHTML='<option value="">Selecione</option>'+ts.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}catch(e){erro(e)}}
function irFinal(){if(!estado.cidade)return erro(new Error('Escolha o local de entrega.'));if(!estado.cidade.coletaFabrica&&!document.getElementById('transportadora').value)return erro(new Error('Escolha a transportadora.'));document.getElementById('final').innerHTML=montarResumo()+`<div class="card"><strong>Entrega</strong><p>${new Date(estado.carrada.data+'T12:00:00').toLocaleDateString('pt-BR')}</p><p>${esc(estado.cidade.rotulo)}</p>${estado.cidade.coletaFabrica?'':'<p>'+esc(document.getElementById('transportadora').selectedOptions[0].textContent)+'</p>'}</div>`;mostrar(5)}
async function concluir(){const b=document.getElementById('concluir');b.disabled=true;try{const t=totais();await api(`/api/assistente-pedidos/publico/${token}/concluir`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({modalidade:estado.modalidade,carrada_codigo:estado.carrada.codigo,cidade:estado.cidade.valor,transportadora_id:estado.cidade.coletaFabrica?null:Number(document.getElementById('transportadora').value),itens:t.itens.map(x=>({produto_id:x.produto.id,quantidade:x.quantidade}))})});document.getElementById('carrinho').hidden=true;mostrar(6)}catch(e){b.disabled=false;erro(e)}}
iniciar();renderCarrinho();
</script></body></html>
