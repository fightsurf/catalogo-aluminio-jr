<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistente de pedido</title>
<style>
:root{font-family:Arial,sans-serif;color:#1d2530;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;min-height:100vh;background:white;padding:16px 16px 285px}.topo{position:sticky;top:0;background:white;z-index:4;padding:10px 0;border-bottom:1px solid #ddd}.passos{font-size:13px;color:#667}.tela{display:none}.tela.ativa{display:block}.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid #d8dde3;border-radius:14px;padding:12px;background:#fff}.foto-produto{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}.produto img{width:100%;height:145px;object-fit:contain;background:#f7f7f7;border-radius:10px}.produto h3{font-size:15px;min-height:36px}.preco{font-weight:bold}.qtd{display:flex;gap:8px;align-items:center;justify-content:center}.qtd button,.botao{min-height:46px;border:0;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:bold}.qtd button{width:46px}.botao{background:#162b45;color:white;width:100%}.secundario{background:#e8edf2;color:#162b45}.acoes{display:grid;gap:10px;margin-top:18px}.acoes-fixas{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);margin:0;padding:10px 16px;background:#fff;z-index:5;box-shadow:0 -3px 12px rgba(0,0,0,.12)}.campo{width:100%;min-height:48px;padding:10px;border:1px solid #bcc5cf;border-radius:10px;font-size:16px}.opcao{display:block;border:1px solid #ccd3da;border-radius:12px;padding:15px;margin:10px 0}.data-carrada{display:flex;align-items:flex-start;gap:10px}.data-carrada-conteudo{display:grid;gap:4px}.data-carrada-descricao{font-size:14px;color:#667}.separador-semana{border-top:1px solid #b8c1ca;margin:20px 0 10px}.carrinho{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);max-height:270px;overflow:hidden;background:#102438;color:#fff;padding:10px 16px;z-index:5}#miniItens{max-height:130px;overflow:auto}.mini{display:flex;gap:8px;align-items:center;font-size:13px;margin:5px 0}.mini img{width:34px;height:34px;object-fit:contain;background:white;border-radius:6px}.linha{display:flex;justify-content:space-between;gap:10px}.botao-carrinho{margin-top:10px;background:#fff;color:#102438}.erro{background:#ffe7e7;color:#8b1111;padding:12px;border-radius:10px}.sucesso{background:#e4f7e8;color:#145b27;padding:12px;border-radius:10px}.galeria{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:18px}.galeria[hidden]{display:none}.galeria-conteudo{position:relative;width:min(720px,100%);height:min(86vh,760px);display:grid;grid-template-columns:52px minmax(0,1fr) 52px;grid-template-rows:auto minmax(0,1fr) auto;align-items:center;gap:8px;color:#fff}.galeria-titulo{grid-column:1/4;text-align:center;padding:0 48px;font-weight:bold;font-size:17px}.galeria-imagem{grid-column:2;grid-row:2;width:100%;height:100%;max-height:70vh;object-fit:contain;background:#fff;border-radius:12px}.galeria-fechar,.galeria-nav{border:0;border-radius:999px;background:rgba(255,255,255,.95);color:#102438;font-weight:bold;cursor:pointer}.galeria-fechar{position:absolute;right:0;top:-8px;width:42px;height:42px;font-size:25px}.galeria-nav{width:46px;height:46px;font-size:28px}.galeria-anterior{grid-column:1;grid-row:2}.galeria-proxima{grid-column:3;grid-row:2}.galeria-contador{grid-column:1/4;text-align:center;font-size:14px}.galeria-nav[hidden]{display:block;visibility:hidden}@media(max-width:460px){.grade{grid-template-columns:1fr 1fr}.produto img{height:115px}.app{padding-left:10px;padding-right:10px}}
</style></head><body><main class="app"><header class="topo"><strong id="cliente">Carregando...</strong><div class="passos" id="indicador"></div></header><div id="mensagem"></div>
<section class="tela ativa" data-passo="0"><h1>Como deseja fazer seu pedido?</h1><div class="acoes"><button class="botao" onclick="escolherModalidade('orcamento')">Pedido tradicional</button><button class="botao secundario" onclick="escolherModalidade('kit-feirinha')">Kit Feirinha</button></div></section>
<section class="tela" data-passo="1"><h1>Escolha os produtos</h1><select id="categoria" class="campo" onchange="renderProdutos()"><option value="">Todas as categorias</option></select><div class="grade" id="produtos"></div></section>
<section class="tela" data-passo="2"><h1>Resumo do pedido</h1><div id="resumo"></div><div class="acoes acoes-fixas"><button class="botao" onclick="carregarDatas()">Escolher data</button><button class="botao secundario" onclick="mostrar(1)">Voltar</button></div></section>
<section class="tela" data-passo="3"><h1>Data de entrega</h1><div id="datas"></div><div class="acoes"><button class="botao" onclick="avancarLocal()">Continuar</button></div></section>
<section class="tela" data-passo="4"><h1>Local de entrega</h1><div id="cidades"></div><div id="blocoTransportadora" hidden><h2>Transportadora</h2><select id="transportadora" class="campo"></select></div><div class="acoes"><button class="botao" onclick="irFinal()">Continuar</button></div></section>
<section class="tela" data-passo="5"><h1>Confira tudo</h1><div id="final"></div><div class="acoes"><button class="botao" id="concluir" onclick="concluir()">Concluir pedido</button></div></section>
<section class="tela" data-passo="6"><h1>Pedido enviado</h1><div class="sucesso">Seu pedido foi enviado para confirmação da fábrica.</div></section>
</main><aside class="carrinho" id="carrinho"><strong>Seu pedido</strong><div id="miniItens">Nenhum item selecionado.</div><div class="linha"><strong>Total</strong><strong id="miniTotal">R$ 0,00</strong></div><button class="botao botao-carrinho" id="proximoEtapa2" onclick="irResumo()" hidden>Próximo</button></aside><div class="galeria" id="galeria" hidden role="dialog" aria-modal="true" aria-labelledby="galeriaTitulo" tabindex="-1" onclick="fecharGaleriaFora(event)"><div class="galeria-conteudo"><button type="button" class="galeria-fechar" aria-label="Fechar galeria" onclick="fecharGaleria()">×</button><div class="galeria-titulo" id="galeriaTitulo"></div><button type="button" class="galeria-nav galeria-anterior" id="galeriaAnterior" aria-label="Foto anterior" onclick="mudarFoto(-1)">‹</button><img class="galeria-imagem" id="galeriaImagem" alt=""><button type="button" class="galeria-nav galeria-proxima" id="galeriaProxima" aria-label="Próxima foto" onclick="mudarFoto(1)">›</button><div class="galeria-contador" id="galeriaContador"></div></div></div>
<script>
const token=location.pathname.split('/').filter(Boolean).pop(); const estado={contexto:null,modalidade:null,produtos:[],itens:new Map(),carrada:null,cidade:null,galeria:{fotos:[],indice:0,toqueInicioX:null}};
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok||j.success===false)throw new Error(j.message||'Falha na operação');return j.data}
function erro(e){document.getElementById('mensagem').innerHTML=`<div class="erro">${esc(e.message)}</div>`;scrollTo(0,0)}
function limparMensagem(){document.getElementById('mensagem').innerHTML=''}
function mostrar(n){document.querySelectorAll('.tela').forEach(x=>x.classList.toggle('ativa',Number(x.dataset.passo)===n));document.getElementById('indicador').textContent=n<6?`Etapa ${n+1} de 6`:'';document.getElementById('proximoEtapa2').hidden=n!==1;const carrinho=document.getElementById('carrinho');if(n===2)carrinho.hidden=true;else if(n<6)carrinho.hidden=false;scrollTo(0,0)}
async function iniciar(){try{estado.contexto=await api(`/api/assistente-pedidos/publico/${token}/contexto`);document.getElementById('cliente').textContent=estado.contexto.cliente.nome;document.getElementById('cidades').innerHTML=estado.contexto.cidades.map(c=>`<label class="opcao"><input type="radio" name="cidade" value="${c.valor}" onchange="selecionarCidade('${c.valor}')"> ${esc(c.rotulo)}${c.coletaFabrica?' — coleta na fábrica':''}</label>`).join('');mostrar(0)}catch(e){erro(e)}}
async function escolherModalidade(m){try{estado.modalidade=m;estado.produtos=await api(`/api/assistente-pedidos/publico/${token}/produtos?modalidade=${encodeURIComponent(m)}`);const cats=[...new Map(estado.produtos.filter(p=>p.categoria_id).map(p=>[p.categoria_id,p.categoria||`Categoria ${p.categoria_id}`])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'pt-BR',{sensitivity:'base'}));const seletor=document.getElementById('categoria');seletor.innerHTML='<option value="">Todas as categorias</option>'+cats.map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('');const normalizar=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const panelaPressao=cats.find(([,nome])=>normalizar(nome)==='panela de pressao')||cats.find(([,nome])=>normalizar(nome).includes('panela de pressao'));seletor.value=panelaPressao?String(panelaPressao[0]):'';renderProdutos();mostrar(1)}catch(e){erro(e)}}
function renderProdutos(){const cat=document.getElementById('categoria').value;const lista=estado.produtos.filter(p=>!cat||String(p.categoria_id)===cat);document.getElementById('produtos').innerHTML=lista.map(p=>{const q=estado.itens.get(Number(p.id))?.quantidade||0;return `<article class="card produto"><button type="button" class="foto-produto" aria-label="Ampliar fotos de ${esc(p.nome)}" onclick="abrirGaleria(${Number(p.id)})"><img src="${esc(p.foto||'/placeholder.png')}" alt="${esc(p.nome)}"></button><h3>${esc(p.nome)}</h3><div class="preco">${brl(p.preco)}</div><div class="qtd"><button onclick="qtd(${p.id},-1)">−</button><strong id="q${p.id}">${q}</strong><button onclick="qtd(${p.id},1)">+</button></div></article>`}).join('')||'<p>Nenhum produto nesta categoria.</p>'}
function fotosProduto(produto){const candidatas=Array.isArray(produto?.fotos)?produto.fotos:[produto?.foto,produto?.foto_2,produto?.foto_3,produto?.foto_4,produto?.foto_5,produto?.foto_6];return [...new Set(candidatas.map(x=>String(x||'').trim()).filter(Boolean))]}
function abrirGaleria(id){const produto=estado.produtos.find(x=>Number(x.id)===Number(id));if(!produto)return;const fotos=fotosProduto(produto);if(!fotos.length)return;estado.galeria.fotos=fotos;estado.galeria.indice=0;document.getElementById('galeriaTitulo').textContent=produto.nome||'Fotos do produto';document.getElementById('galeria').hidden=false;document.body.style.overflow='hidden';atualizarGaleria();document.getElementById('galeria').focus()}
function atualizarGaleria(){const total=estado.galeria.fotos.length;const indice=estado.galeria.indice;const imagem=document.getElementById('galeriaImagem');imagem.src=estado.galeria.fotos[indice]||'';imagem.alt=`${document.getElementById('galeriaTitulo').textContent} — foto ${indice+1} de ${total}`;document.getElementById('galeriaContador').textContent=total>1?`${indice+1} de ${total}`:'';document.getElementById('galeriaAnterior').hidden=total<2;document.getElementById('galeriaProxima').hidden=total<2}
function mudarFoto(direcao){const total=estado.galeria.fotos.length;if(total<2)return;estado.galeria.indice=(estado.galeria.indice+direcao+total)%total;atualizarGaleria()}
function fecharGaleria(){document.getElementById('galeria').hidden=true;document.body.style.overflow='';estado.galeria.fotos=[];estado.galeria.indice=0}
function fecharGaleriaFora(event){if(event.target===document.getElementById('galeria'))fecharGaleria()}
document.getElementById('galeria').addEventListener('touchstart',event=>{estado.galeria.toqueInicioX=event.changedTouches[0]?.clientX??null},{passive:true});document.getElementById('galeria').addEventListener('touchend',event=>{if(estado.galeria.toqueInicioX===null)return;const fim=event.changedTouches[0]?.clientX??estado.galeria.toqueInicioX;const deslocamento=fim-estado.galeria.toqueInicioX;estado.galeria.toqueInicioX=null;if(Math.abs(deslocamento)>45)mudarFoto(deslocamento<0?1:-1)},{passive:true});document.addEventListener('keydown',event=>{if(document.getElementById('galeria').hidden)return;if(event.key==='Escape')fecharGaleria();else if(event.key==='ArrowLeft')mudarFoto(-1);else if(event.key==='ArrowRight')mudarFoto(1)});
function qtd(id,d){const p=estado.produtos.find(x=>Number(x.id)===Number(id));let q=(estado.itens.get(Number(id))?.quantidade||0)+d;q=Math.max(0,q);if(q)estado.itens.set(Number(id),{produto:p,quantidade:q});else estado.itens.delete(Number(id));const el=document.getElementById(`q${id}`);if(el)el.textContent=q;renderCarrinho();if(estado.itens.size)limparMensagem()}
function totais(){const itens=[...estado.itens.values()];return{itens,quantidade:itens.reduce((s,x)=>s+x.quantidade,0),total:itens.reduce((s,x)=>s+x.quantidade*Number(x.produto.preco),0)}}
function renderCarrinho(){const t=totais();document.getElementById('miniItens').innerHTML=t.itens.length?t.itens.map(x=>`<div class="mini"><img src="${esc(x.produto.foto||'')}" alt=""><span>${esc(x.produto.nome)} × ${x.quantidade}</span></div>`).join(''):'Nenhum item selecionado.';document.getElementById('miniTotal').textContent=brl(t.total)}
function montarResumo(){const t=totais();return t.itens.map(x=>`<div class="card"><div style="display:flex;gap:12px;align-items:center"><img src="${esc(x.produto.foto||'')}" alt="" style="width:58px;height:58px;object-fit:contain"><div style="flex:1"><strong>${esc(x.produto.nome)}</strong><div class="linha"><span>${x.quantidade} × ${brl(x.produto.preco)}</span><strong>${brl(x.quantidade*x.produto.preco)}</strong></div></div></div></div>`).join('')+`<h2>Total: ${brl(t.total)}</h2>`}
function irResumo(){if(!estado.itens.size)return erro(new Error('Selecione ao menos um produto.'));limparMensagem();document.getElementById('resumo').innerHTML=montarResumo();mostrar(2)}
function chaveSemana(dataIso){const data=new Date(dataIso+'T12:00:00');const dia=data.getDay()||7;data.setDate(data.getDate()-dia+1);return data.toISOString().slice(0,10)}
function renderDatasDisponiveis(datas){let semanaAnterior='';return datas.map(d=>{const semana=chaveSemana(d.data);const separador=semanaAnterior&&semana!==semanaAnterior?'<div class="separador-semana" aria-hidden="true"></div>':'';semanaAnterior=semana;const descricao=d.descricao?`<span class="data-carrada-descricao">${esc(d.descricao)}</span>`:'';return `${separador}<label class="opcao data-carrada"><input type="radio" name="data" value="${d.codigo}" onchange='estado.carrada=${JSON.stringify(d)}'><span class="data-carrada-conteudo"><strong>${new Date(d.data+'T12:00:00').toLocaleDateString('pt-BR')}</strong>${descricao}</span></label>`}).join('')}
async function carregarDatas(){try{const t=totais();const datas=await api(`/api/assistente-pedidos/publico/${token}/datas?quantidade=${t.quantidade}`);if(!datas.length)throw new Error('Não há carradas com capacidade para este pedido.');document.getElementById('datas').innerHTML=renderDatasDisponiveis(datas);mostrar(3)}catch(e){erro(e)}}
function avancarLocal(){if(!estado.carrada)return erro(new Error('Escolha uma data.'));mostrar(4)}
async function selecionarCidade(valor){try{estado.cidade=estado.contexto.cidades.find(c=>c.valor===valor);const bloco=document.getElementById('blocoTransportadora');if(estado.cidade.coletaFabrica){bloco.hidden=true;document.getElementById('transportadora').innerHTML='';return}const ts=await api(`/api/assistente-pedidos/publico/${token}/transportadoras?cidade=${encodeURIComponent(valor)}`);if(!ts.length)throw new Error('Nenhuma transportadora cadastrada para esta cidade.');bloco.hidden=false;document.getElementById('transportadora').innerHTML='<option value="">Selecione</option>'+ts.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}catch(e){erro(e)}}
function irFinal(){if(!estado.cidade)return erro(new Error('Escolha o local de entrega.'));if(!estado.cidade.coletaFabrica&&!document.getElementById('transportadora').value)return erro(new Error('Escolha a transportadora.'));document.getElementById('final').innerHTML=montarResumo()+`<div class="card"><strong>Entrega</strong><p>${new Date(estado.carrada.data+'T12:00:00').toLocaleDateString('pt-BR')}</p><p>${esc(estado.cidade.rotulo)}</p>${estado.cidade.coletaFabrica?'':'<p>'+esc(document.getElementById('transportadora').selectedOptions[0].textContent)+'</p>'}</div>`;mostrar(5)}
async function concluir(){const b=document.getElementById('concluir');b.disabled=true;try{const t=totais();await api(`/api/assistente-pedidos/publico/${token}/concluir`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({modalidade:estado.modalidade,carrada_codigo:estado.carrada.codigo,cidade:estado.cidade.valor,transportadora_id:estado.cidade.coletaFabrica?null:Number(document.getElementById('transportadora').value),itens:t.itens.map(x=>({produto_id:x.produto.id,quantidade:x.quantidade}))})});document.getElementById('carrinho').hidden=true;mostrar(6)}catch(e){b.disabled=false;erro(e)}}
iniciar();renderCarrinho();
</script></body></html>
