<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pré-pedidos</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#162536}.app{max-width:1200px;margin:auto;padding:20px}.box{background:white;border-radius:12px;padding:16px;margin-bottom:16px}.linha{display:flex;gap:10px;flex-wrap:wrap}.campo,button{min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid #bbb;font-size:15px}button{background:#173655;color:white;font-weight:bold;cursor:pointer}.pedido{border-bottom:1px solid #ddd;padding:14px 0}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#586878}.status{font-weight:bold}.erro{color:#a00}.sucesso{color:#176326}dialog{width:min(760px,95vw);border:0;border-radius:14px}img{width:50px;height:50px;object-fit:contain}</style></head><body><main class="app"><h1>Assistente de pedidos</h1><section class="box"><h2>Gerar link</h2><div class="linha"><input class="campo" id="busca" placeholder="Nome do cliente"><button onclick="buscarClientes()">Buscar</button><select class="campo" id="clientes"></select><button onclick="gerarLink()">Gerar link</button></div><p id="link"></p></section><section class="box"><div class="linha"><h2 style="flex:1">Pré-pedidos</h2><button onclick="carregar()">Atualizar</button></div><div id="lista">Carregando...</div></section></main><dialog id="modal"><div id="detalhe"></div><div class="linha"><button onclick="modal.close()">Fechar</button><button id="btnConfirmar" onclick="confirmar()">Confirmar e inserir pedido</button></div></dialog><script>
let atual=null;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function api(u,o){const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok||j.success===false)throw new Error(j.message||'Falha');return j.data}
async function buscarClientes(){try{const q=document.getElementById('busca').value;const j=await fetch(`/api/legado/clientes?nome=${encodeURIComponent(q)}`).then(r=>r.json());const dados=j.dados||[];document.getElementById('clientes').innerHTML=dados.map(c=>`<option value="${c.favorecido}">${esc(c.nome)} — ${esc(c.cidade||'')}</option>`).join('')}catch(e){alert(e.message)}}
async function gerarLink(){try{const favorecido=Number(document.getElementById('clientes').value);if(!favorecido)throw new Error('Selecione o cliente.');const d=await api('/api/assistente-pedidos/admin/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({favorecido})});const url=`${location.origin}/pedido/${d.token}`;document.getElementById('link').innerHTML=`<a href="${url}" target="_blank">${url}</a> <button onclick="navigator.clipboard.writeText('${url}')">Copiar</button>`}catch(e){alert(e.message)}}
async function carregar(){try{const ps=await api('/api/assistente-pedidos/admin/pre-pedidos');document.getElementById('lista').innerHTML=ps.map(p=>`<div class="pedido"><div><strong>#${p.id} — ${esc(p.cliente_nome)}</strong></div><div class="meta"><span>${esc(p.modalidade)}</span><span>${brl(p.total)}</span><span>${new Date(p.data_entrega+'T12:00:00').toLocaleDateString('pt-BR')}</span><span>${esc(p.cidade)}</span><span class="status ${p.status==='confirmado'?'sucesso':p.status==='erro_confirmacao'?'erro':''}">${esc(p.status)}</span></div><button onclick="abrir(${p.id})">Abrir</button></div>`).join('')||'Nenhum pré-pedido.'}catch(e){document.getElementById('lista').textContent=e.message}}
async function abrir(id){try{atual=await api(`/api/assistente-pedidos/admin/pre-pedidos/${id}`);document.getElementById('detalhe').innerHTML=`<h2>Pré-pedido #${atual.id}</h2><p><strong>${esc(atual.cliente_nome)}</strong></p><p>${esc(atual.cidade)} — ${new Date(atual.data_entrega+'T12:00:00').toLocaleDateString('pt-BR')}</p><p>${esc(atual.transportadora_nome||'Coleta na fábrica')}</p>${atual.itens.map(i=>`<div class="linha"><img src="${esc(i.foto||'')}" alt=""><span style="flex:1">${esc(i.nome)}</span><span>${Number(i.quantidade)} × ${brl(i.preco)}</span><strong>${brl(i.subtotal)}</strong></div>`).join('')}<h3>Total: ${brl(atual.total)}</h3>${atual.erro_confirmacao?`<p class="erro">${esc(atual.erro_confirmacao)}</p>`:''}`;document.getElementById('btnConfirmar').hidden=atual.status==='confirmado';modal.showModal()}catch(e){alert(e.message)}}
async function confirmar(){if(!atual||!confirm('Confirmar com o cliente e inserir este pedido no legado?'))return;const b=document.getElementById('btnConfirmar');b.disabled=true;try{await api(`/api/assistente-pedidos/admin/pre-pedidos/${atual.id}/confirmar`,{method:'POST'});modal.close();await carregar()}catch(e){alert(e.message);b.disabled=false}}
carregar();setInterval(carregar,60000);
</script></body></html>
