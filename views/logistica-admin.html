<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Logística - Alumínio JR</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      padding: 30px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 5px;
    }

    .btn-primary { background: #007bff; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-edit { background: #17a2b8; color: white; }

    .transportadora-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .observacao {
      font-size: 13px;
      color: #555;
      margin-top: 5px;
    }

    .cidade {
      background: #f8f9fa;
      padding: 8px;
      margin-bottom: 5px;
      border-radius: 4px;
    }

    .cidade small {
      display: block;
      color: #666;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 15px 0;
    }
  </style>
</head>
<body>

<div class="container">

  <h2>🚚 Nova Transportadora</h2>
  <div class="box">
    <input id="nome" placeholder="Nome">
    <input id="telefone" placeholder="Telefone">
    <textarea id="observacao" placeholder="Observação"></textarea>
    <button class="btn-primary" onclick="criarTransportadora()">Criar</button>
  </div>

  <h2>📋 Transportadoras</h2>
  <div id="lista"></div>

</div>

<script>
const API = '/api/logistica';

async function carregarTransportadoras() {
  const res = await fetch(API + '/transportadoras');
  const dados = await res.json();

  const div = document.getElementById('lista');
  div.innerHTML = '';

  dados.forEach(t => {
    div.innerHTML += `
      <div class="box">
        <div class="transportadora-header">
          <div>
            <strong>${t.nome}</strong><br>
            <small>${t.telefone || ''}</small>
            <div class="observacao">${t.observacao || ''}</div>
          </div>
          <div>
            <button class="btn-edit" onclick="editarTransportadora(${t.id})">Editar</button>
            <button class="btn-danger" onclick="excluirTransportadora(${t.id})">Excluir</button>
          </div>
        </div>

        <div class="divider"></div>

        <input placeholder="Buscar cidade..." 
               onkeyup="buscarCidade(event, ${t.id})">

        <div id="busca-${t.id}"></div>

        <div class="divider"></div>

        <div id="cidades-${t.id}"></div>
      </div>
    `;
    carregarCidades(t.id);
  });
}

async function criarTransportadora() {
  const nome = document.getElementById('nome').value;
  const telefone = document.getElementById('telefone').value;
  const observacao = document.getElementById('observacao').value;

  await fetch(API + '/transportadoras', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome, telefone, observacao })
  });

  document.getElementById('nome').value = '';
  document.getElementById('telefone').value = '';
  document.getElementById('observacao').value = '';

  carregarTransportadoras();
}

async function editarTransportadora(id) {
  const nome = prompt('Novo nome:');
  const telefone = prompt('Novo telefone:');
  const observacao = prompt('Nova observação:');

  if (!nome) return;

  await fetch(API + '/transportadoras/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome, telefone, observacao })
  });

  carregarTransportadoras();
}

async function excluirTransportadora(id) {
  if (!confirm('Excluir transportadora?')) return;

  await fetch(API + '/transportadoras/' + id, {
    method: 'DELETE'
  });

  carregarTransportadoras();
}

async function buscarCidade(event, transportadoraId) {
  const termo = event.target.value;
  if (termo.length < 3) return;

  const res = await fetch(API + '/cidades/busca?nome=' + termo);
  const dados = await res.json();

  const div = document.getElementById('busca-' + transportadoraId);
  div.innerHTML = '';

  dados.forEach(c => {
    div.innerHTML += `
      <div class="cidade">
        ${c.nome} - ${c.estado}
        <input id="obs-${transportadoraId}-${c.codigo_ibge}" 
               placeholder="Observação para esta cidade">
        <button class="btn-primary"
          onclick="vincular(${transportadoraId}, ${c.codigo_ibge})">
          Vincular
        </button>
      </div>
    `;
  });
}

async function vincular(transportadoraId, codigo_ibge) {
  const observacao = document.getElementById(
    `obs-${transportadoraId}-${codigo_ibge}`
  ).value;

  await fetch(API + '/transportadoras/' + transportadoraId + '/cidades', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ codigo_ibge, observacao })
  });

  carregarCidades(transportadoraId);
}

async function removerCidade(transportadoraId, codigo_ibge) {
  await fetch(API + '/transportadoras/' + transportadoraId + '/cidades/' + codigo_ibge, {
    method: 'DELETE'
  });

  carregarCidades(transportadoraId);
}

async function carregarCidades(transportadoraId) {
  const res = await fetch(API + '/transportadoras/' + transportadoraId + '/cidades');
  const dados = await res.json();

  const div = document.getElementById('cidades-' + transportadoraId);
  div.innerHTML = '<strong>Cidades Atendidas:</strong><br>';

  dados.forEach(c => {
    div.innerHTML += `
      <div class="cidade">
        ${c.nome} - ${c.estado}
        <small>${c.observacao || ''}</small>
        <button class="btn-danger"
          onclick="removerCidade(${transportadoraId}, ${c.codigo_ibge})">
          Remover
        </button>
      </div>
    `;
  });
}

carregarTransportadoras();
</script>

</body>
</html>
