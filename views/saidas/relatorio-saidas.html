<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório de Médias de Despesas - Alumínio JR</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    body { font-family: Arial, sans-serif; background:#eef2f7; margin:0; padding:24px; }
    .container { max-width:1280px; margin:0 auto; }
    .box { background:#fff; padding:22px; border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.08); margin-bottom:22px; }
    h1,h2,h3 { margin-top:0; color:#243447; }
    h3 { margin-bottom:10px; }
    .menu { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .menu a { text-decoration:none; background:#34495e; color:#fff; padding:9px 12px; border-radius:6px; font-size:13px; }
    .menu a.ativo { background:#2ecc71; }
    .grid-filtro { display:grid; grid-template-columns:160px 160px; gap:12px; align-items:end; max-width:340px; }
    label { display:block; font-size:13px; font-weight:bold; color:#4a5568; margin-bottom:6px; }
    input, button { width:100%; padding:10px 12px; border-radius:6px; border:1px solid #ccd3db; font-size:14px; box-sizing:border-box; }
    button { border:none; cursor:pointer; font-weight:bold; background:#34495e; color:#fff; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th { background:#2c3e50; color:#fff; padding:10px; text-align:left; }
    td { padding:10px; border-bottom:1px solid #e9edf2; vertical-align:middle; }
    tfoot td { font-weight:bold; background:#f4f6f8; border-top:2px solid #ccd3db; }
    .resumo { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:18px; }
    .card { border-radius:10px; padding:16px; background:#f8fafc; border:1px solid #e5e7eb; }
    .card .label { font-size:13px; color:#667085; margin-bottom:8px; }
    .card .valor { font-size:24px; font-weight:bold; color:#243447; }
    .card.destaque { background:#eafaf1; border-color:#b7e4c7; }
    .categoria { margin-top:18px; }
    .categoria-topo { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:8px; }
    .categoria-total { font-size:18px; font-weight:bold; color:#243447; }
    .muted { color:#667085; font-size:13px; }
    .mensagem { margin-top:12px; font-weight:bold; display:none; }
    .mensagem.sucesso { color:#1e8449; display:block; }
    .mensagem.erro { color:#c0392b; display:block; }
    @media (max-width:900px) { .grid-filtro,.resumo { grid-template-columns:1fr; } .categoria-topo { display:block; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Relatório de Médias Anuais de Despesas</h1>
      <div class="menu">
        <a href="/admin-saidas-categorias">Categorias</a>
        <a href="/admin-saidas-itens">Itens de saída</a>
        <a href="/admin-saidas">Lançar saída</a>
        <a href="/admin-saidas-consulta">Consultar/editar</a>
        <a href="/admin-saidas-carne">Carnê</a>
        <a href="/admin-saidas-boletos">Boletos</a>
        <a href="/relatorio-saidas" class="ativo">Relatório</a>
      </div>

      <div class="grid-filtro">
        <div>
          <label for="ano">Ano</label>
          <input id="ano" type="number" min="2000" max="2100" />
        </div>
        <div>
          <label>&nbsp;</label>
          <button onclick="carregar()">Carregar</button>
        </div>
      </div>

      <div id="mensagem" class="mensagem"></div>

      <div class="resumo">
        <div class="card destaque"><div class="label">Total geral médio mensal</div><div class="valor" id="totalGeral">R$ 0,00</div></div>
        <div class="card"><div class="label">Categorias</div><div class="valor" id="qtdCategorias">0</div></div>
        <div class="card"><div class="label">Itens de saída</div><div class="valor" id="qtdItens">0</div></div>
      </div>
      <p class="muted">A média considera lançamentos PAGO + PENDENTE do ano selecionado. Lançamentos CANCELADOS não entram.</p>
    </div>

    <div id="relatorio"></div>
  </div>

  <script>
    function escapeHtml(v) { return String(v ?? '').replace(/[&<>'"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c])); }
    function moeda(v) { return Number(v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
    function msg(texto, tipo='erro') { const el = document.getElementById('mensagem'); el.textContent = texto; el.className = `mensagem ${tipo}`; }
    function limparMsg() { const el = document.getElementById('mensagem'); el.textContent = ''; el.className = 'mensagem'; }
    async function tratar(res) { const json = await res.json(); if (!res.ok || json.success === false) throw new Error(json.message || 'Erro'); return json; }

    function iniciar() {
      document.getElementById('ano').value = new Date().getFullYear();
      carregar();
    }

    async function carregar() {
      try {
        limparMsg();
        const ano = document.getElementById('ano').value;
        const json = await tratar(await fetch(`/api/saidas/medias-anuais?ano=${encodeURIComponent(ano)}`));
        renderizar(json.data);
      } catch (error) {
        msg(error.message, 'erro');
      }
    }

    function renderizar(data) {
      document.getElementById('totalGeral').textContent = moeda(data.totais.total_geral_medio_mensal);
      document.getElementById('qtdCategorias').textContent = data.totais.quantidade_categorias;
      document.getElementById('qtdItens').textContent = data.totais.quantidade_itens;

      const html = data.categorias.map(categoria => {
        const linhas = categoria.itens.length ? categoria.itens.map(item => `
          <tr>
            <td>${escapeHtml(item.item_saida_nome)}</td>
            <td>${moeda(item.valor_total)}</td>
            <td>${item.qtd_meses_considerados}</td>
            <td>${moeda(item.valor_medio)}</td>
          </tr>
        `).join('') : '<tr><td colspan="4">Nenhum item cadastrado nesta categoria.</td></tr>';

        return `
          <div class="box categoria">
            <div class="categoria-topo">
              <h3>Categoria: ${escapeHtml(categoria.categoria_nome)}</h3>
              <div class="categoria-total">Média mensal: ${moeda(categoria.total_categoria)}</div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Item de saída</th>
                  <th>Total no ano</th>
                  <th>Meses considerados</th>
                  <th>Média mensal ${escapeHtml(data.ano)}</th>
                </tr>
              </thead>
              <tbody>${linhas}</tbody>
              <tfoot>
                <tr>
                  <td colspan="3">TOTAL DA CATEGORIA</td>
                  <td>${moeda(categoria.total_categoria)}</td>
                </tr>
              </tfoot>
            </table>
          </div>
        `;
      }).join('');

      document.getElementById('relatorio').innerHTML = html || '<div class="box">Nenhuma categoria cadastrada.</div>';
    }

    iniciar();
  </script>
</body>
</html>
