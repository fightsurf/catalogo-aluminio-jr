<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lançar Saída - Alumínio JR</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    body { font-family: Arial, sans-serif; background:#eef2f7; margin:0; padding:24px; }
    .container { max-width:760px; margin:0 auto; }
    .box { background:#fff; padding:22px; border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.08); margin-bottom:22px; }
    h1 { margin-top:0; color:#243447; }
    .menu { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .menu a { text-decoration:none; background:#34495e; color:#fff; padding:9px 12px; border-radius:6px; font-size:13px; }
    .menu a.ativo { background:#2ecc71; }
    .form-vertical { display:flex; flex-direction:column; gap:13px; margin-top:16px; }
    label { display:block; font-size:13px; font-weight:bold; color:#4a5568; margin-bottom:6px; }
    input, select, textarea, button { width:100%; padding:11px 12px; border-radius:6px; border:1px solid #ccd3db; font-size:15px; box-sizing:border-box; }
    textarea { min-height:74px; resize:vertical; }
    button { border:none; cursor:pointer; font-weight:bold; }
    .acoes { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
    .btn-salvar { background:#2ecc71; color:#fff; }
    .btn-limpar { background:#95a5a6; color:#fff; }
    .mensagem { margin-top:12px; font-weight:bold; display:none; }
    .mensagem.sucesso { color:#1e8449; display:block; }
    .mensagem.erro { color:#c0392b; display:block; }
    @media (max-width:700px) { body { padding:12px; } .acoes { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Lançar saída avulsa</h1>
      <div class="menu">
        <a href="/admin-saidas-categorias">Categorias</a>
        <a href="/admin-saidas-itens">Itens de saída</a>
        <a href="/admin-saidas" class="ativo">Lançar saída</a>
      </div>

      <div class="form-vertical">
        <div>
          <label for="categoria_id">Categoria da saída</label>
          <select id="categoria_id" onchange="filtrarItensPorCategoria()"></select>
        </div>

        <div>
          <label for="item_saida_id">Item de saída</label>
          <select id="item_saida_id"></select>
        </div>

        <div>
          <label for="competencia_mes">Mês de competência</label>
          <select id="competencia_mes"></select>
        </div>

        <div>
          <label for="competencia_ano">Ano de competência</label>
          <input id="competencia_ano" type="number" min="2000" max="2100" />
        </div>

        <div>
          <label for="vencimento">Vencimento</label>
          <input id="vencimento" type="date" onchange="usarVencimentoNaCompetencia()" />
        </div>

        <div>
          <label for="data_saida">Data pagamento</label>
          <input id="data_saida" type="date" />
        </div>

        <div>
          <label for="valor">Valor</label>
          <input id="valor" inputmode="decimal" placeholder="0,00" />
        </div>

        <div>
          <label for="forma_pagamento">Forma pagamento</label>
          <select id="forma_pagamento">
            <option value="Pix">Pix</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Cartão">Cartão</option>
            <option value="Boleto">Boleto</option>
            <option value="Transferência">Transferência</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div>
          <label for="status">Status</label>
          <select id="status" onchange="ajustarDataPagamentoPorStatus()">
            <option value="PAGO">Pago</option>
            <option value="PENDENTE">Pendente</option>
            <option value="CANCELADO">Cancelado</option>
          </select>
        </div>

        <div>
          <label for="observacao">Observação</label>
          <textarea id="observacao" placeholder="Opcional"></textarea>
        </div>

        <div class="acoes">
          <button class="btn-salvar" onclick="salvar()">Salvar saída</button>
          <button class="btn-limpar" onclick="limparFormulario()">Limpar</button>
        </div>
      </div>

      <div id="mensagem" class="mensagem"></div>
    </div>
  </div>

  <script>
    const API = '/api/saidas';
    let itens = [];
    let categorias = [];
    const nomesMeses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    function escapeHtml(v) { return String(v ?? '').replace(/[&<>'"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c])); }
    function msg(texto, tipo='sucesso') { const el = document.getElementById('mensagem'); el.textContent = texto; el.className = `mensagem ${tipo}`; }
    function limparMsg() { const el = document.getElementById('mensagem'); el.textContent = ''; el.className = 'mensagem'; }
    async function tratar(res) { const json = await res.json(); if (!res.ok || json.success === false) throw new Error(json.message || 'Erro'); return json; }

    function preencherMeses() {
      const opts = nomesMeses.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
      document.getElementById('competencia_mes').innerHTML = opts;
    }

    async function carregarBases() {
      const [itensJson, categoriasJson] = await Promise.all([
        tratar(await fetch('/api/saidas-itens?ativo=true')),
        tratar(await fetch('/api/saidas-categorias?ativo=true'))
      ]);
      itens = itensJson.data || [];
      categorias = categoriasJson.data || [];
      document.getElementById('categoria_id').innerHTML = '<option value="">Selecione a categoria</option>' + categorias.map(c => `<option value="${c.id}">${escapeHtml(c.nome)}</option>`).join('');
      filtrarItensPorCategoria();
    }

    function filtrarItensPorCategoria() {
      const categoriaId = document.getElementById('categoria_id').value;
      const itensFiltrados = categoriaId ? itens.filter(i => String(i.categoria_id) === String(categoriaId)) : [];
      document.getElementById('item_saida_id').innerHTML = '<option value="">Selecione o item</option>' + itensFiltrados.map(i => `<option value="${i.id}">${escapeHtml(i.nome)}</option>`).join('');
    }

    function usarVencimentoNaCompetencia() {
      const vencimento = document.getElementById('vencimento').value;
      if (!vencimento) return;
      const [ano, mes] = vencimento.split('-');
      document.getElementById('competencia_mes').value = Number(mes);
      document.getElementById('competencia_ano').value = ano;
    }

    function ajustarDataPagamentoPorStatus() {
      const status = document.getElementById('status').value;
      const dataPagamento = document.getElementById('data_saida');
      if (status === 'PAGO' && !dataPagamento.value) {
        dataPagamento.value = new Date().toISOString().slice(0,10);
      }
      if (status !== 'PAGO') {
        dataPagamento.value = '';
      }
    }

    function limparFormulario() {
      const hoje = new Date();
      const hojeISO = hoje.toISOString().slice(0,10);
      document.getElementById('categoria_id').value = '';
      filtrarItensPorCategoria();
      document.getElementById('competencia_mes').value = hoje.getMonth() + 1;
      document.getElementById('competencia_ano').value = hoje.getFullYear();
      document.getElementById('vencimento').value = hojeISO;
      document.getElementById('data_saida').value = hojeISO;
      document.getElementById('valor').value = '';
      document.getElementById('forma_pagamento').value = 'Pix';
      document.getElementById('status').value = 'PAGO';
      document.getElementById('observacao').value = '';
      limparMsg();
    }

    async function salvar() {
      try {
        limparMsg();
        const body = {
          item_saida_id: document.getElementById('item_saida_id').value,
          competencia_mes: document.getElementById('competencia_mes').value,
          competencia_ano: document.getElementById('competencia_ano').value,
          vencimento: document.getElementById('vencimento').value,
          data_saida: document.getElementById('data_saida').value,
          valor: document.getElementById('valor').value,
          forma_pagamento: document.getElementById('forma_pagamento').value,
          status: document.getElementById('status').value,
          observacao: document.getElementById('observacao').value.trim()
        };
        if (!document.getElementById('categoria_id').value) throw new Error('Categoria é obrigatória');
        if (!body.item_saida_id) throw new Error('Item de saída é obrigatório');
        if (!body.valor) throw new Error('Valor é obrigatório');
        if (body.status === 'PAGO' && !body.data_saida) throw new Error('Data de pagamento é obrigatória para saída paga');
        await tratar(await fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) }));
        msg('Saída lançada com sucesso');
        limparFormulario();
      } catch (error) {
        msg(error.message, 'erro');
      }
    }

    function redirecionarEdicaoAntiga() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id) window.location.href = `/admin-saidas-consulta?id=${encodeURIComponent(id)}`;
    }

    preencherMeses();
    carregarBases()
      .then(() => { limparFormulario(); redirecionarEdicaoAntiga(); })
      .catch(error => msg(error.message, 'erro'));
  </script>
</body>
</html>
