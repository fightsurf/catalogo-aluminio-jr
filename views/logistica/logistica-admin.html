<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Logística - Alumínio JR</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  margin: 0;
  padding: 20px;
}

h3 {
  margin-top: 0;
}

.main-grid {
  display: grid;
  grid-template-columns: 260px 1fr 1fr;
  gap: 20px;
}

.box {
  background: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  height: fit-content;
}

.transportadora-item {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 5px;
}

.transportadora-item:hover {
  background: #eef2f7;
}

.transportadora-item.active {
  background: #007bff;
  color: white;
}

input, textarea {
  width: 100%;
  padding: 6px;
  margin-bottom: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

button {
  padding: 6px 12px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-right: 5px;
}

.btn-primary { background: #007bff; color: white; }
.btn-danger { background: #dc3545; color: white; }
.btn-edit { background: #17a2b8; color: white; }

.cidade {
  background: #f8f9fa;
  padding: 6px;
  margin-bottom: 5px;
  border-radius: 4px;
  font-size: 14px;
}

small {
  color: #666;
}

.divider {
  height: 1px;
  background: #eee;
  margin: 10px 0;
}

.copy-icon {
  cursor: pointer;
  margin-left: 8px;
  font-size: 16px;
}

.copy-icon:hover {
  opacity: 0.7;
}
</style>
  <link rel="stylesheet" href="/css/theme.css" />
</head>

<body>

<h2>🚚 Admin Logística</h2>

<div class="main-grid">

  <!-- COLUNA 1 -->
  <div class="box">
    <h3>Transportadoras</h3>

    <div class="divider"></div>

    <input id="novo-nome" placeholder="Nome">
    <input id="novo-telefone" placeholder="Telefone">
    <textarea id="novo-observacao" placeholder="Observação"></textarea>
    <button class="btn-primary" onclick="criarTransportadora()">Criar</button>

    <div class="divider"></div>

    <div id="lista"></div>
  </div>

  <!-- COLUNA 2 -->
  <div class="box">
    <h3>Detalhes</h3>
    <div id="detalhes">
      <small>Selecione uma transportadora</small>
    </div>
  </div>

  <!-- COLUNA 3 -->
  <div class="box">
    <h3>Cidades</h3>
    <div id="cidades-area">
      <small>Selecione uma transportadora</small>
    </div>
  </div>

</div>

<script>
const API_TRANSPORTADORAS = '/api/transportadoras';
const API_LOGISTICA = '/api/logistica';

let transportadoraSelecionada = null;

// =============================
// LISTAR TRANSPORTADORAS
// =============================
async function carregarTransportadoras() {
  const res = await fetch(API_TRANSPORTADORAS);
  const dados = await res.json();

  const div = document.getElementById('lista');
  div.innerHTML = '';

  dados.forEach(t => {
    const item = document.createElement('div');
    item.className = 'transportadora-item';
    item.innerText = t.nome;

    item.onclick = () => selecionarTransportadora(t);

    if (transportadoraSelecionada && transportadoraSelecionada.id === t.id) {
      item.classList.add('active');
    }

    div.appendChild(item);
  });
}

// =============================
function selecionarTransportadora(t) {
  transportadoraSelecionada = t;
  carregarTransportadoras();
  renderDetalhes();
  carregarCidades();

  // 🔥 Força scroll para o topo
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// =============================
function renderDetalhes() {
  const div = document.getElementById('detalhes');

  if (!transportadoraSelecionada) {
    div.innerHTML = '<small>Selecione uma transportadora</small>';
    return;
  }

  div.innerHTML = `
    <div style="display:flex; align-items:center;">
      <strong style="font-size:18px;">
        ${transportadoraSelecionada.nome}
      </strong>
      <span class="copy-icon"
            title="Copiar cidades"
            onclick="copiarCidades()">
        📋
      </span>
    </div>

    <div class="divider"></div>

    <input id="edit-nome" value="${transportadoraSelecionada.nome}">
    <input id="edit-telefone" value="${transportadoraSelecionada.telefone || ''}">
    <textarea id="edit-observacao">${transportadoraSelecionada.observacao || ''}</textarea>

    <button class="btn-edit" onclick="salvarEdicao()">Salvar</button>
    <button class="btn-danger" onclick="excluirTransportadora()">Excluir</button>
  `;
}

// =============================
async function copiarCidades() {
  if (!transportadoraSelecionada) return;

  const res = await fetch(
    API_LOGISTICA +
    '/transportadoras/' +
    transportadoraSelecionada.id +
    '/cidades'
  );

  const dados = await res.json();

  if (!dados.length) {
    alert('Nenhuma cidade vinculada.');
    return;
  }

  const lista = dados.map(c =>
    `${c.nome} - ${c.estado}`
  ).join('\n');

  navigator.clipboard.writeText(lista)
    .then(() => alert('Cidades copiadas para a memória.'))
    .catch(() => alert('Erro ao copiar.'));
}

// =============================
async function salvarEdicao() {
  const nome = document.getElementById('edit-nome').value;
  const telefone = document.getElementById('edit-telefone').value;
  const observacao = document.getElementById('edit-observacao').value;

  await fetch(API_TRANSPORTADORAS + '/' + transportadoraSelecionada.id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome, telefone, observacao })
  });

  transportadoraSelecionada = null;
  document.getElementById('detalhes').innerHTML = '';
  document.getElementById('cidades-area').innerHTML = '';
  carregarTransportadoras();
}

// =============================
async function excluirTransportadora() {
  if (!confirm('Excluir transportadora?')) return;

  await fetch(API_TRANSPORTADORAS + '/' + transportadoraSelecionada.id, {
    method: 'DELETE'
  });

  transportadoraSelecionada = null;
  document.getElementById('detalhes').innerHTML = '';
  document.getElementById('cidades-area').innerHTML = '';
  carregarTransportadoras();
}

// =============================
async function criarTransportadora() {
  const nome = document.getElementById('novo-nome').value;
  const telefone = document.getElementById('novo-telefone').value;
  const observacao = document.getElementById('novo-observacao').value;

  await fetch(API_TRANSPORTADORAS, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome, telefone, observacao })
  });

  document.getElementById('novo-nome').value = '';
  document.getElementById('novo-telefone').value = '';
  document.getElementById('novo-observacao').value = '';

  carregarTransportadoras();
}

// =============================
async function carregarCidades() {
  const div = document.getElementById('cidades-area');

  if (!transportadoraSelecionada) {
    div.innerHTML = '<small>Selecione uma transportadora</small>';
    return;
  }

  const res = await fetch(
    API_LOGISTICA +
    '/transportadoras/' +
    transportadoraSelecionada.id +
    '/cidades'
  );

  const dados = await res.json();

  div.innerHTML = `
    <input id="input-busca-cidade"
           placeholder="Buscar cidade..."
           onkeyup="buscarCidade(event)">
    <div id="resultado-busca"></div>
    <div class="divider"></div>
    <strong>Cidades vinculadas:</strong><br>
    <div id="lista-cidades-vinculadas"></div>
  `;

  const lista = document.getElementById('lista-cidades-vinculadas');

  if (!dados.length) {
    lista.innerHTML = '<small>Nenhuma cidade vinculada</small>';
    return;
  }

  dados.forEach(c => {
    lista.innerHTML += `
      <div class="cidade">
        ${c.nome} - ${c.estado}
        <small>${c.observacao || ''}</small><br>
        <button class="btn-danger" onclick="removerCidade(${c.codigo_ibge})">
          Remover
        </button>
      </div>
    `;
  });
}

// =============================
async function buscarCidade(event) {
  const termo = event.target.value;
  const resultadoDiv = document.getElementById('resultado-busca');

  if (termo.length < 3) {
    resultadoDiv.innerHTML = '';
    return;
  }

  const res = await fetch(API_LOGISTICA + '/cidades/busca?nome=' + termo);
  const dados = await res.json();

  resultadoDiv.innerHTML = '';

  dados.forEach(c => {
    resultadoDiv.innerHTML += `
      <div class="cidade">
        ${c.nome} - ${c.estado}
        <input id="obs-${c.codigo_ibge}" placeholder="Observação">
        <button class="btn-primary"
          onclick="vincular(${c.codigo_ibge})">
          Vincular
        </button>
      </div>
    `;
  });
}

// =============================
async function vincular(codigo_ibge) {
  const observacao = document.getElementById(`obs-${codigo_ibge}`).value;

  await fetch(
    API_LOGISTICA +
    '/transportadoras/' +
    transportadoraSelecionada.id +
    '/cidades',
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo_ibge, observacao })
    }
  );

  carregarCidades();
}

// =============================
async function removerCidade(codigo_ibge) {
  await fetch(
    API_LOGISTICA +
    '/transportadoras/' +
    transportadoraSelecionada.id +
    '/cidades/' +
    codigo_ibge,
    { method: 'DELETE' }
  );

  carregarCidades();
}

carregarTransportadoras();
</script>

</body>
</html>
