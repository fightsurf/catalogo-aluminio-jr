<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Logística - Alumínio JR</title>

<style>
body { font-family: Arial; background:#f4f6f9; margin:0; padding:20px; }
.main-grid { display:grid; grid-template-columns:260px 1fr 1fr; gap:20px; }
.box { background:white; padding:15px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
.transportadora-item { padding:8px; border-radius:6px; cursor:pointer; margin-bottom:5px; }
.transportadora-item:hover { background:#eef2f7; }
.transportadora-item.active { background:#007bff; color:white; }
input, textarea, select { width:100%; padding:6px; margin-bottom:8px; border:1px solid #ccc; border-radius:4px; }
button { padding:6px 12px; border:none; border-radius:4px; cursor:pointer; }
.btn-link { display:inline-block; padding:7px 12px; border-radius:4px; text-decoration:none; }
.top-actions { margin:-4px 0 16px; }
.btn-primary { background:#007bff; color:white; }
.btn-danger { background:#dc3545; color:white; }
.btn-edit { background:#17a2b8; color:white; }
.cidade { background:#f8f9fa; padding:6px; margin-bottom:5px; border-radius:4px; font-size:14px; }
.divider { height:1px; background:#eee; margin:10px 0; }
.section-header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
.section-header strong { display:block; }
.btn-secondary { background:#6c757d; color:white; }
.autocomplete-wrapper { position:relative; }
.autocomplete-lista {
  position:absolute; top:calc(100% - 6px); left:0; right:0;
  background:#fff; border:1px solid #d1d5db; border-radius:6px;
  box-shadow:0 8px 20px rgba(0,0,0,0.12); max-height:220px; overflow-y:auto;
  z-index:100; display:none;
}
.autocomplete-lista.ativo { display:block; }
.autocomplete-item {
  width:100%; border:0; background:#fff; padding:9px 10px; text-align:left;
  cursor:pointer; display:block; color:#111;
}
.autocomplete-item:hover, .autocomplete-item.ativo { background:#eef2f7; }
.autocomplete-vazio { padding:9px 10px; color:#6c757d; font-size:14px; }
.cidade-uf-grid { display:grid; grid-template-columns:1fr 72px; gap:8px; }

.modal-overlay {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}
.modal {
  background:white;
  padding:20px;
  border-radius:8px;
  width:320px;
}
.modal-buttons {
  margin-top:15px;
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>

<h2>🚚 Admin Logística</h2>
<div class="top-actions">
  <a class="btn-link btn-secondary" href="/admin-logistica/agencias">Agências de recebimento</a>
</div>

<div class="main-grid">

<div class="box">
<h3>Transportadoras</h3>
<input id="novo-nome" placeholder="Nome">
<input id="novo-telefone" placeholder="Telefone">
<input id="novo-telefone-principal" placeholder="Telefone principal">
<div class="cidade-uf-grid">
  <div class="autocomplete-wrapper">
    <input id="novo-cidade" placeholder="Cidade - digite as primeiras letras" autocomplete="off">
    <input id="novo-cidade-id" type="hidden">
    <div id="novo-cidade-autocomplete" class="autocomplete-lista"></div>
  </div>
  <input id="novo-cidade-uf" placeholder="UF" maxlength="2" readonly>
</div>
<textarea id="novo-observacao" placeholder="Observação"></textarea>
<button class="btn-primary" onclick="criarTransportadora()">Criar</button>
<div class="divider"></div>
<div id="lista"></div>
</div>

<div class="box">
<h3>Detalhes</h3>
<div id="detalhes"><small>Selecione uma transportadora</small></div>
</div>

<div class="box">
<h3>Cidades</h3>
<div id="cidades-area"><small>Selecione uma transportadora</small></div>
</div>

</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <h3>Nova Cidade</h3>
    <input id="nova-cidade-nome" placeholder="Nome da cidade">
    <select id="nova-cidade-estado">
      <option value="">Carregando estados...</option>
    </select>

    <div class="modal-buttons">
      <button class="btn-primary" onclick="salvarNovaCidade()">Salvar</button>
      <button class="btn-danger" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const API_TRANSPORTADORAS = '/api/transportadoras';
const API_LOGISTICA = '/api/logistica';

let transportadoraSelecionada = null;
let cidadesVinculadasCarregadas = [];

// =============================
async function criarTransportadora() {
  const nome = document.getElementById('novo-nome').value.trim();
  const telefone = document.getElementById('novo-telefone').value.trim();
  const telefone_principal = document.getElementById('novo-telefone-principal').value.trim();
  const cidadeTexto = document.getElementById('novo-cidade').value.trim();
  const cidade_id = document.getElementById('novo-cidade-id').value || null;
  const observacao = document.getElementById('novo-observacao').value.trim();

  if (!nome) return alert('Nome é obrigatório');
  if (cidadeTexto && !cidade_id) return alert('Selecione a cidade na lista de sugestões ou deixe o campo em branco.');

  const response = await fetch(API_TRANSPORTADORAS, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome, telefone, telefone_principal, cidade_id, observacao })
  });

  if (!response.ok) {
    const erro = await response.json().catch(() => ({}));
    return alert(erro.error || 'Erro ao criar transportadora');
  }

  document.getElementById('novo-nome').value = '';
  document.getElementById('novo-telefone').value = '';
  document.getElementById('novo-telefone-principal').value = '';
  document.getElementById('novo-cidade').value = '';
  document.getElementById('novo-cidade-id').value = '';
  document.getElementById('novo-cidade-uf').value = '';
  document.getElementById('novo-observacao').value = '';
  fecharAutocompleteCidade(document.getElementById('novo-cidade-autocomplete'));

  carregarTransportadoras();
}

// =============================
async function carregarTransportadoras() {
  const res = await fetch(API_TRANSPORTADORAS);
  const dados = await res.json();

  const div = document.getElementById('lista');
  div.innerHTML = '';

  dados.forEach(t => {
    const item = document.createElement('div');
    item.className = 'transportadora-item';
    item.innerText = t.nome;
    item.onclick = () => selecionarTransportadora(t);

    if (transportadoraSelecionada?.id === t.id) {
      item.classList.add('active');
    }

    div.appendChild(item);
  });
}

function selecionarTransportadora(t) {
  transportadoraSelecionada = t;
  carregarTransportadoras();
  renderDetalhes();
  carregarCidades();
  window.scrollTo({ top:0, behavior:'smooth' });
}

// =============================
function renderDetalhes() {
  const div = document.getElementById('detalhes');

  if (!transportadoraSelecionada) {
    div.innerHTML = '<small>Selecione uma transportadora</small>';
    return;
  }

  div.innerHTML = `
    <strong>${transportadoraSelecionada.nome}</strong>
    <div class="divider"></div>
    <input id="edit-nome" value="${transportadoraSelecionada.nome}">
    <input id="edit-telefone" value="${transportadoraSelecionada.telefone || ''}" placeholder="Telefone">
    <input id="edit-telefone-principal" value="${transportadoraSelecionada.telefone_principal || ''}" placeholder="Telefone principal">
    <div class="cidade-uf-grid">
      <div class="autocomplete-wrapper">
        <input id="edit-cidade" value="${transportadoraSelecionada.cidade_nome || ''}" placeholder="Cidade - digite as primeiras letras" autocomplete="off">
        <input id="edit-cidade-id" type="hidden" value="${transportadoraSelecionada.cidade_id || ''}">
        <div id="edit-cidade-autocomplete" class="autocomplete-lista"></div>
      </div>
      <input id="edit-cidade-uf" value="${transportadoraSelecionada.cidade_estado || ''}" placeholder="UF" maxlength="2" readonly>
    </div>
    <textarea id="edit-observacao">${transportadoraSelecionada.observacao || ''}</textarea>
    <button class="btn-edit" onclick="salvarEdicao()">Salvar</button>
    <button class="btn-danger" onclick="excluirTransportadora()">Excluir</button>
  `;

  configurarAutocompleteCidade({
    inputId: 'edit-cidade',
    cidadeIdId: 'edit-cidade-id',
    ufId: 'edit-cidade-uf',
    listaId: 'edit-cidade-autocomplete'
  });
}

// =============================
async function salvarEdicao() {
  if (!transportadoraSelecionada) return;

  const nome = document.getElementById('edit-nome').value.trim();
  const telefone = document.getElementById('edit-telefone').value.trim();
  const telefone_principal = document.getElementById('edit-telefone-principal').value.trim();
  const cidadeTexto = document.getElementById('edit-cidade').value.trim();
  const cidade_id = document.getElementById('edit-cidade-id').value || null;
  const observacao = document.getElementById('edit-observacao').value.trim();

  if (!nome) return alert('Nome é obrigatório');
  if (cidadeTexto && !cidade_id) return alert('Selecione a cidade na lista de sugestões ou deixe o campo em branco.');

  const response = await fetch(`${API_TRANSPORTADORAS}/${transportadoraSelecionada.id}`, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ nome, telefone, telefone_principal, cidade_id, observacao })
  });

  if (!response.ok) {
    const erro = await response.json().catch(() => ({}));
    return alert(erro.error || 'Erro ao atualizar transportadora');
  }

  transportadoraSelecionada = null;
  cidadesVinculadasCarregadas = [];
  document.getElementById('detalhes').innerHTML = '';
  document.getElementById('cidades-area').innerHTML = '';
  carregarTransportadoras();
}

// =============================
async function excluirTransportadora() {
  if (!transportadoraSelecionada) return;
  if (!confirm('Excluir transportadora?')) return;

  await fetch(`${API_TRANSPORTADORAS}/${transportadoraSelecionada.id}`, {
    method:'DELETE'
  });

  transportadoraSelecionada = null;
  cidadesVinculadasCarregadas = [];
  document.getElementById('detalhes').innerHTML = '';
  document.getElementById('cidades-area').innerHTML = '';
  carregarTransportadoras();
}

// =============================
async function carregarCidades() {
  if (!transportadoraSelecionada) return;

  const div = document.getElementById('cidades-area');

  div.innerHTML = `
    <input id="input-busca-cidade" placeholder="Buscar cidade..." onkeyup="buscarCidade(event)">
    <div id="resultado-busca"></div>
    <div class="divider"></div>
    <div class="section-header">
      <strong>Cidades vinculadas:</strong>
      <button class="btn-secondary" type="button" onclick="copiarCidadesVinculadas()">Copiar cidades</button>
    </div>
    <div id="lista-cidades-vinculadas"></div>
  `;

  const res = await fetch(`/api/logistica/transportadoras/${transportadoraSelecionada.id}/cidades`);
  const dados = await res.json();

  const lista = document.getElementById('lista-cidades-vinculadas');
  cidadesVinculadasCarregadas = Array.isArray(dados) ? dados : [];

  if (!dados.length) {
    lista.innerHTML = '<small>Nenhuma cidade vinculada</small>';
    return;
  }

  dados.forEach(c => {
    lista.innerHTML += `
      <div class="cidade">
        ${c.nome} - ${c.estado}
        <button class="btn-danger" onclick="removerCidade(${c.codigo_ibge})">Remover</button>
      </div>
    `;
  });
}

// =============================

async function copiarTextoParaClipboard(texto) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(texto);
    return;
  }

  const textarea = document.createElement('textarea');
  textarea.value = texto;
  textarea.setAttribute('readonly', 'readonly');
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
}

async function copiarCidadesVinculadas() {
  if (!transportadoraSelecionada) {
    alert('Selecione uma transportadora.');
    return;
  }

  if (!cidadesVinculadasCarregadas.length) {
    alert('Essa transportadora não possui cidades vinculadas carregadas.');
    return;
  }

  const texto = [
    `Transportadora: ${transportadoraSelecionada.nome}`,
    ...cidadesVinculadasCarregadas.map(c => `${c.nome} - ${c.estado}`)
  ].join('\n');

  try {
    await copiarTextoParaClipboard(texto);
    alert('Cidades copiadas para a memória.');
  } catch (error) {
    console.error('Erro ao copiar cidades:', error);
    alert('Não foi possível copiar as cidades.');
  }
}

async function buscarCidade(e) {
  const termo = e.target.value;
  if (termo.length < 3) return;

  const res = await fetch(`/api/logistica/cidades/busca?nome=${termo}`);
  const dados = await res.json();

  const div = document.getElementById('resultado-busca');
  div.innerHTML = '';

  if (!dados.length) {
    div.innerHTML = `
      <div class="cidade">
        Nenhuma cidade encontrada<br>
        <button onclick="abrirModalNovaCidade('${termo}')">Cadastrar nova cidade</button>
      </div>
    `;
    return;
  }

  dados.forEach(c => {
    div.innerHTML += `
      <div class="cidade">
        ${c.nome} - ${c.estado}
        <button onclick="vincular(${c.codigo_ibge})">Vincular</button>
      </div>
    `;
  });
}

// =============================
function abrirModalNovaCidade(nome='') {
  document.getElementById('modal-overlay').style.display='flex';
  document.getElementById('nova-cidade-nome').value=nome;
  carregarEstados();
}

function fecharModal() {
  document.getElementById('modal-overlay').style.display='none';
}

async function carregarEstados() {
  const res = await fetch('/api/logistica/estados');
  const dados = await res.json();

  const select = document.getElementById('nova-cidade-estado');
  select.innerHTML = '<option>Selecione</option>';

  dados.forEach(e => {
    select.innerHTML += `<option value="${e.estado}">${e.estado}</option>`;
  });
}

// =============================
async function salvarNovaCidade() {
  const nome = document.getElementById('nova-cidade-nome').value;
  const estado = document.getElementById('nova-cidade-estado').value;

  const res = await fetch('/api/logistica/cidades', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ nome, estado })
  });

  const cidade = await res.json();
  fecharModal();

  await vincular(cidade.codigo_ibge);
}

async function vincular(codigo_ibge) {
  await fetch(`/api/logistica/transportadoras/${transportadoraSelecionada.id}/cidades`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ codigo_ibge })
  });

  carregarCidades();
}

async function removerCidade(codigo_ibge) {
  await fetch(`/api/logistica/transportadoras/${transportadoraSelecionada.id}/cidades/${codigo_ibge}`, {
    method:'DELETE'
  });

  carregarCidades();
}

// =============================
// AUTOCOMPLETE DA CIDADE DA TRANSPORTADORA
// Reaproveita a mesma API usada no cadastro de clientes.
// =============================
function fecharAutocompleteCidade(lista) {
  if (!lista) return;
  lista.classList.remove('ativo');
  lista.innerHTML = '';
}

function configurarAutocompleteCidade({ inputId, cidadeIdId, ufId, listaId }) {
  const input = document.getElementById(inputId);
  const cidadeId = document.getElementById(cidadeIdId);
  const uf = document.getElementById(ufId);
  const lista = document.getElementById(listaId);

  if (!input || !cidadeId || !uf || !lista || input.dataset.autocompleteConfigurado === '1') return;
  input.dataset.autocompleteConfigurado = '1';

  let sugestoes = [];
  let indiceAtivo = -1;
  let controlador = null;

  function selecionar(cidade) {
    if (!cidade) return;
    input.value = cidade.nome || '';
    cidadeId.value = cidade.id || '';
    uf.value = String(cidade.estado || '').toUpperCase().slice(0, 2);
    fecharAutocompleteCidade(lista);
  }

  function renderizar() {
    if (!sugestoes.length) {
      lista.innerHTML = '<div class="autocomplete-vazio">Nenhuma cidade encontrada.</div>';
      lista.classList.add('ativo');
      return;
    }

    lista.innerHTML = sugestoes.map((cidade, indice) => `
      <button type="button" class="autocomplete-item ${indice === indiceAtivo ? 'ativo' : ''}" data-indice="${indice}">
        ${cidade.nome} - ${cidade.estado}
      </button>
    `).join('');
    lista.classList.add('ativo');

    lista.querySelectorAll('.autocomplete-item').forEach((botao) => {
      botao.addEventListener('mousedown', (event) => {
        event.preventDefault();
        selecionar(sugestoes[Number(botao.dataset.indice)]);
      });
    });
  }

  async function buscar() {
    const termo = input.value.trim();
    if (termo.length < 3) {
      fecharAutocompleteCidade(lista);
      return;
    }

    if (controlador) controlador.abort();
    controlador = new AbortController();

    try {
      const response = await fetch(`/api/logistica/cidades/busca?nome=${encodeURIComponent(termo)}`, {
        signal: controlador.signal
      });
      const dados = await response.json();
      if (!response.ok) throw new Error('Erro ao buscar cidades');

      sugestoes = Array.isArray(dados) ? dados : [];
      indiceAtivo = sugestoes.length ? 0 : -1;
      renderizar();
    } catch (error) {
      if (error.name === 'AbortError') return;
      console.error('Erro ao buscar cidades:', error);
      fecharAutocompleteCidade(lista);
    }
  }

  function mover(direcao) {
    if (!sugestoes.length) return;
    indiceAtivo += direcao;
    if (indiceAtivo < 0) indiceAtivo = sugestoes.length - 1;
    if (indiceAtivo >= sugestoes.length) indiceAtivo = 0;
    renderizar();
  }

  input.addEventListener('input', () => {
    cidadeId.value = '';
    uf.value = '';
    buscar();
  });

  input.addEventListener('focus', () => {
    if (input.value.trim().length >= 3) buscar();
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowDown') { event.preventDefault(); mover(1); return; }
    if (event.key === 'ArrowUp') { event.preventDefault(); mover(-1); return; }
    if (event.key === 'Enter' && indiceAtivo >= 0) { event.preventDefault(); selecionar(sugestoes[indiceAtivo]); return; }
    if (event.key === 'Escape') fecharAutocompleteCidade(lista);
  });

  input.addEventListener('blur', () => {
    setTimeout(() => fecharAutocompleteCidade(lista), 120);
  });
}

configurarAutocompleteCidade({
  inputId: 'novo-cidade',
  cidadeIdId: 'novo-cidade-id',
  ufId: 'novo-cidade-uf',
  listaId: 'novo-cidade-autocomplete'
});

carregarTransportadoras();
</script>

</body>
</html>
