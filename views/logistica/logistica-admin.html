<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Logística - Alumínio JR</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  margin: 0;
  padding: 20px;
}

h3 { margin-top: 0; }

.main-grid {
  display: grid;
  grid-template-columns: 260px 1fr 1fr;
  gap: 20px;
}

.box {
  background: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  height: fit-content;
}

.transportadora-item {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 5px;
}

.transportadora-item:hover { background: #eef2f7; }

.transportadora-item.active {
  background: #007bff;
  color: white;
}

input, textarea, select {
  width: 100%;
  padding: 6px;
  margin-bottom: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

button {
  padding: 6px 12px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-right: 5px;
}

.btn-primary { background: #007bff; color: white; }
.btn-danger { background: #dc3545; color: white; }
.btn-edit { background: #17a2b8; color: white; }

.cidade {
  background: #f8f9fa;
  padding: 6px;
  margin-bottom: 5px;
  border-radius: 4px;
  font-size: 14px;
}

.divider {
  height: 1px;
  background: #eee;
  margin: 10px 0;
}

/* MODAL */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal {
  background: white;
  padding: 20px;
  border-radius: 8px;
  width: 320px;
}

.modal-buttons {
  margin-top: 15px;
  display: flex;
  justify-content: space-between;
}
</style>
</head>

<body>

<h2>🚚 Admin Logística</h2>

<div class="main-grid">

  <!-- COLUNA 1 -->
  <div class="box">
    <h3>Transportadoras</h3>
    <div class="divider"></div>

    <input id="novo-nome" placeholder="Nome">
    <input id="novo-telefone" placeholder="Telefone">
    <textarea id="novo-observacao" placeholder="Observação"></textarea>
    <button class="btn-primary" onclick="criarTransportadora()">Criar</button>

    <div class="divider"></div>
    <div id="lista"></div>
  </div>

  <!-- COLUNA 2 -->
  <div class="box">
    <h3>Detalhes</h3>
    <div id="detalhes">
      <small>Selecione uma transportadora</small>
    </div>
  </div>

  <!-- COLUNA 3 -->
  <div class="box">
    <h3>Cidades</h3>
    <div id="cidades-area">
      <small>Selecione uma transportadora</small>
    </div>
  </div>

</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <h3>Nova Cidade</h3>
    <input id="nova-cidade-nome" placeholder="Nome da cidade">

    <select id="nova-cidade-estado">
      <option value="">Selecione o estado</option>
      <option>PB</option>
      <option>CE</option>
      <option>PE</option>
      <option>RN</option>
      <option>MA</option>
      <option>PI</option>
      <option>AL</option>
      <option>BA</option>
      <option>SE</option>
    </select>

    <div class="modal-buttons">
      <button class="btn-primary" onclick="salvarNovaCidade()">Salvar</button>
      <button class="btn-danger" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const API_TRANSPORTADORAS = '/api/transportadoras';
const API_LOGISTICA = '/api/logistica';

let transportadoraSelecionada = null;

// =============================
// TRANSPORTADORAS
// =============================
async function carregarTransportadoras() {
  const res = await fetch(API_TRANSPORTADORAS);
  const dados = await res.json();

  const div = document.getElementById('lista');
  div.innerHTML = '';

  dados.forEach(t => {
    const item = document.createElement('div');
    item.className = 'transportadora-item';
    item.innerText = t.nome;
    item.onclick = () => selecionarTransportadora(t);

    if (transportadoraSelecionada && transportadoraSelecionada.id === t.id) {
      item.classList.add('active');
    }

    div.appendChild(item);
  });
}

function selecionarTransportadora(t) {
  transportadoraSelecionada = t;
  carregarTransportadoras();
  renderDetalhes();
  carregarCidades();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// =============================
// DETALHES
// =============================
function renderDetalhes() {
  const div = document.getElementById('detalhes');

  if (!transportadoraSelecionada) {
    div.innerHTML = '<small>Selecione uma transportadora</small>';
    return;
  }

  div.innerHTML = `
    <strong>${transportadoraSelecionada.nome}</strong>
    <div class="divider"></div>
    <input id="edit-nome" value="${transportadoraSelecionada.nome}">
    <input id="edit-telefone" value="${transportadoraSelecionada.telefone || ''}">
    <textarea id="edit-observacao">${transportadoraSelecionada.observacao || ''}</textarea>
    <button class="btn-edit" onclick="salvarEdicao()">Salvar</button>
    <button class="btn-danger" onclick="excluirTransportadora()">Excluir</button>
  `;
}

// =============================
// CIDADES
// =============================
async function carregarCidades() {
  const div = document.getElementById('cidades-area');

  if (!transportadoraSelecionada) {
    div.innerHTML = '<small>Selecione uma transportadora</small>';
    return;
  }

  div.innerHTML = `
    <input id="input-busca-cidade"
           placeholder="Buscar cidade..."
           onkeyup="buscarCidade(event)">
    <div id="resultado-busca"></div>
    <div class="divider"></div>
    <strong>Cidades vinculadas:</strong>
    <div id="lista-cidades-vinculadas"></div>
  `;

  const res = await fetch(
    API_LOGISTICA +
    '/transportadoras/' +
    transportadoraSelecionada.id +
    '/cidades'
  );

  const dados = await res.json();
  const lista = document.getElementById('lista-cidades-vinculadas');

  if (!dados.length) {
    lista.innerHTML = '<small>Nenhuma cidade vinculada</small>';
    return;
  }

  dados.forEach(c => {
    lista.innerHTML += `
      <div class="cidade">
        ${c.nome} - ${c.estado}
        <button class="btn-danger"
          onclick="removerCidade(${c.codigo_ibge})">
          Remover
        </button>
      </div>
    `;
  });
}

// =============================
// BUSCA
// =============================
async function buscarCidade(event) {
  const termo = event.target.value;
  const resultadoDiv = document.getElementById('resultado-busca');

  if (termo.length < 3) {
    resultadoDiv.innerHTML = '';
    return;
  }

  const res = await fetch(API_LOGISTICA + '/cidades/busca?nome=' + termo);
  const dados = await res.json();

  if (!dados.length) {
    resultadoDiv.innerHTML = `
      <div class="cidade">
        Nenhuma cidade encontrada.<br><br>
        <button class="btn-edit"
          onclick="abrirModalNovaCidade('${termo}')">
          Cadastrar nova cidade
        </button>
      </div>
    `;
    return;
  }

  resultadoDiv.innerHTML = '';

  dados.forEach(c => {
    resultadoDiv.innerHTML += `
      <div class="cidade">
        ${c.nome} - ${c.estado}
        <button class="btn-primary"
          onclick="vincular(${c.codigo_ibge})">
          Vincular
        </button>
      </div>
    `;
  });
}

// =============================
// MODAL
// =============================
function abrirModalNovaCidade(nome='') {
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('nova-cidade-nome').value = nome;
}

function fecharModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharModal();
});

document.getElementById('modal-overlay')
.addEventListener('click', e => {
  if (e.target.id === 'modal-overlay') fecharModal();
});

// =============================
// SALVAR CIDADE
// =============================
async function salvarNovaCidade() {
  const nome = document.getElementById('nova-cidade-nome').value.trim();
  const estado = document.getElementById('nova-cidade-estado').value;

  if (!nome || !estado) {
    alert('Preencha todos os campos.');
    return;
  }

  const res = await fetch('/api/logistica/cidades', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome, estado })
  });

  if (!res.ok) {
    const erro = await res.json();
    alert(erro.error || 'Erro ao criar cidade');
    return;
  }

  const novaCidade = await res.json();
  fecharModal();

  await fetch(
    `/api/logistica/transportadoras/${transportadoraSelecionada.id}/cidades`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        codigo_ibge: novaCidade.codigo_ibge,
        observacao: ''
      })
    }
  );

  carregarCidades();
}

async function vincular(codigo_ibge) {
  await fetch(
    `/api/logistica/transportadoras/${transportadoraSelecionada.id}/cidades`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo_ibge, observacao: '' })
    }
  );

  carregarCidades();
}

async function removerCidade(codigo_ibge) {
  await fetch(
    `/api/logistica/transportadoras/${transportadoraSelecionada.id}/cidades/${codigo_ibge}`,
    { method: 'DELETE' }
  );

  carregarCidades();
}

carregarTransportadoras();
</script>

</body>
</html>
