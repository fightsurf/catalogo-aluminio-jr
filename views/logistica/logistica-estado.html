<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Consulta por Estado - Logística</title>

<style>
body {
  font-family: Arial
  background: #f4f6f9;
  padding: 30px;
}
.container {
  max-width: 1000px;
  margin: auto;
}

.box {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 4px;
  border: 1px solid #ccc;
  text-transform: uppercase;
}

button {
  padding: 8px 16px;
  background: #007bff;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 4px;
}

button:hover {
  opacity: 0.9;
}

.cidade {
  margin-bottom: 15px;
  padding: 12px;
  background: #f8f9fa;
  border-radius: 6px;
}

.transportadora {
  margin-left: 15px;
  font-size: 14px;
}

.loading {
  color: #666;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
</style>
<link rel="stylesheet" href="/css/theme.css" />
</head>

<body>

<div class="container">
  <h2>🔎 Consulta de Cidades por UF</h2>

  <div class="box">
    <input id="estado"
           maxlength="2"
           placeholder="Digite a sigla do estado (ex: PB)"
           onkeypress="if(event.key==='Enter') buscar()">
    <button onclick="buscar()">Buscar</button>
  </div>

  <div id="resultado"></div>
</div>

<script>
const API = '/api/logistica';

function normalizarTexto(txt) {
  return txt
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

async function buscar() {
  const estadoInput = document.getElementById('estado');
  const estado = normalizarTexto(estadoInput.value.trim()).toUpperCase();

  const div = document.getElementById('resultado');

  if (!estado) {
    div.innerHTML = '<p>Informe a sigla do estado.</p>';
    return;
  }

  if (estado.length !== 2) {
    div.innerHTML = '<p>Digite uma UF válida com 2 letras. Ex: PB</p>';
    return;
  }

  div.innerHTML = '<p class="loading">Carregando...</p>';

  try {
    const res = await fetch(API + '/estado/' + encodeURIComponent(estado));

    if (!res.ok) {
      throw new Error('Erro na requisição');
    }

    const dados = await res.json();

    if (!dados.length) {
      div.innerHTML = '<p>Nenhuma cidade encontrada.</p>';
      return;
    }

    const textoCopiar = dados
      .map(c => `${c.nome ?? 'N/D'} - ${c.estado}`)
      .join('\n');

    window.textoParaCopiar = textoCopiar;

    div.innerHTML = `
      <div class="box top-bar">
        <strong>${dados.length} cidade(s) encontrada(s)</strong>
        <button onclick="copiarTudo()">📋 Copiar cidades</button>
      </div>
    `;

    dados.forEach(c => {
      div.innerHTML += `
        <div class="box cidade">
          <strong>${c.nome ?? 'N/D'} - ${c.estado}</strong>
          ${
            c.transportadoras && c.transportadoras.length
              ? c.transportadoras.map(t => `
                <div class="transportadora">
                  🚚 ${t.nome} - ${t.telefone || 'Sem telefone'}
                </div>
              `).join('')
              : '<div class="transportadora">Sem transportadoras vinculadas</div>'
          }
        </div>
      `;
    });

  } catch (error) {
    div.innerHTML = '<p>Erro ao buscar dados.</p>';
    console.error(error);
  }
}

function copiarTudo() {
  if (!window.textoParaCopiar) return;

  navigator.clipboard.writeText(window.textoParaCopiar)
    .then(() => alert('Cidades copiadas com sucesso.'))
    .catch(() => alert('Erro ao copiar.'));
}
</script>

</body>
</html>
