<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Combinador de Kits</title>

<style>
  body { font-family: Arial; margin: 20px; background: #f9f9f9; }
  h1 { margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
  th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
  th { background: #007bff; color: white; cursor: pointer; }
  tr:hover { background: #eef; }
  #config { background: #fff; padding: 10px; border: 1px solid #ccc; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
  input, select { padding: 5px; border: 1px solid #ccc; border-radius: 3px; }
  button { padding: 8px 18px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 3px; align-self: flex-end; }
  button:hover { background: #0056b3; }
  #status { font-size: 13px; color: #555; margin-bottom: 6px; }
</style>
</head>

<body>

<h1>Gerador de Kits</h1>

<div id="config">
  <label>Qtd de itens
    <input type="number" id="tamKit" value="4" min="1" max="20">
  </label>

  <label>Preço médio máximo (R$)
    <input type="number" id="precoMax" value="15" step="0.01" min="0">
  </label>

  <label>Item obrigatório
    <select id="obrigatorio">
      <option value="">Nenhum</option>
    </select>
  </label>

  <button onclick="gerar()">Gerar</button>
</div>

<div id="status"></div>

<table id="tabela">
  <thead>
    <tr>
      <th onclick="ordenar(0)">Valor ↕</th>
      <th onclick="ordenar(1)">Médio ↕</th>
      <th>Itens</th>
    </tr>
  </thead>
  <tbody>
    <tr><td colspan="3">Carregando produtos...</td></tr>
  </tbody>
</table>

<script>
const API = '/api/produtos';

let produtos = [];
let resultados = [];
let asc = true;

// ─── Carrega produtos ao abrir a página ──────────────────────────────────────

async function carregarProdutos() {
  const select = document.getElementById('obrigatorio');
  setStatus('Carregando produtos da API...');

  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const json = await res.json();

    // A API retorna { success: true, data: [...] }
    const lista = Array.isArray(json) ? json : (json.data || []);

    if (!lista.length) throw new Error('Nenhum produto retornado');

    produtos = lista
      .filter(p => p.nome && p.preco != null)
      .map(p => ({
        id: p.id,
        nome: p.nome,
        preco: Number(p.preco)
      }))
      .sort((a, b) => a.preco - b.preco);

    produtos.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.nome} (R$ ${p.preco.toFixed(2)})`;
      select.appendChild(opt);
    });

    setStatus(`${produtos.length} produtos carregados. Configure e clique em Gerar.`);
    setTabela('<tr><td colspan="3">Aguardando...</td></tr>');

  } catch (e) {
    setStatus('');
    setTabela(`<tr><td colspan="3">❌ Erro ao carregar produtos: ${e.message}</td></tr>`);
  }
}

// ─── Geração dos kits ────────────────────────────────────────────────────────

function gerar() {
  const tamKit  = parseInt(document.getElementById('tamKit').value);
  const precoMax = parseFloat(document.getElementById('precoMax').value);
  const obrigId  = document.getElementById('obrigatorio').value;

  if (!produtos.length) {
    setStatus('Produtos ainda não carregados.');
    return;
  }

  setStatus('Calculando...');
  setTabela('<tr><td colspan="3">Calculando...</td></tr>');

  // Deixa o DOM atualizar antes do loop pesado
  setTimeout(() => {
    const obrigatorio = obrigId ? produtos.find(p => String(p.id) === String(obrigId)) : null;
    const lista = obrigatorio
      ? produtos.filter(p => String(p.id) !== String(obrigId))
      : produtos;

    resultados = [];

    // Se houver obrigatório, o item já entra em cada kit
    // Os demais slots = tamKit - 1
    const slotsLivres = obrigatorio ? tamKit - 1 : tamKit;
    const basePreco   = obrigatorio ? obrigatorio.preco : 0;

    function bt(i, kit, soma) {
      if (kit.length === slotsLivres) {
        const total = soma + basePreco;
        const medio = total / tamKit;

        if (medio <= precoMax) {
          const itensFinal = obrigatorio ? [obrigatorio, ...kit] : [...kit];
          resultados.push([
            total.toFixed(2),
            medio.toFixed(2),
            itensFinal.map(p => p.nome).join(' - ')
          ]);
        }
        return;
      }

      for (let x = i; x < lista.length; x++) {
        const p = lista[x];
        const novaSoma  = soma + p.preco;
        const novaQtd   = kit.length + 1 + (obrigatorio ? 1 : 0);
        const mediaParcial = (novaSoma + basePreco) / novaQtd;

        // Poda: lista ordenada por preço → se média já estourou, os próximos só pioram
        if (mediaParcial > precoMax) break;

        kit.push(p);
        bt(x + 1, kit, novaSoma);
        kit.pop();
      }
    }

    bt(0, [], 0);
    setStatus('');
    render();
  }, 0);
}

// ─── Renderização ────────────────────────────────────────────────────────────

function render() {
  if (resultados.length === 0) {
    setTabela('<tr><td colspan="3">Nenhum resultado para os critérios informados.</td></tr>');
    return;
  }

  const linhas = resultados.map(r => `
    <tr>
      <td>R$ ${r[0]}</td>
      <td>R$ ${r[1]}</td>
      <td style="text-align:left">${r[2]}</td>
    </tr>
  `).join('');

  setTabela(linhas + `<tr><td colspan="3" style="color:#555;font-size:12px">(${resultados.length} kits encontrados)</td></tr>`);
}

function ordenar(col) {
  resultados.sort((a, b) => asc
    ? parseFloat(a[col]) - parseFloat(b[col])
    : parseFloat(b[col]) - parseFloat(a[col])
  );
  asc = !asc;
  render();
}

// ─── Helpers ─────────────────────────────────────────────────────────────────

function setTabela(html) {
  document.querySelector('#tabela tbody').innerHTML = html;
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// ─── Init ────────────────────────────────────────────────────────────────────

carregarProdutos();
</script>

</body>
</html>
