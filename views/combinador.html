<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Combinador de Kits</title>

<style>
  body { font-family: Arial; margin: 20px; background: #f9f9f9; }
  h1 { margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
  th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
  th { background: #007bff; color: white; cursor: pointer; }
  tr:hover { background: #eef; }
  #config { background: #fff; padding: 10px; border: 1px solid #ccc; margin-bottom: 15px; }
  button { padding: 8px 14px; background: #007bff; color: white; border: none; cursor: pointer; }
</style>
</head>

<body>

<h1>Gerador de Kits</h1>

<div id="config">
  <label>Qtd de itens:
    <input type="number" id="tamKit" value="4" min="1">
  </label>

  <label style="margin-left:10px">Preço médio máximo:
    <input type="number" id="precoMax" value="15" step="0.01">
  </label>

  <button onclick="gerar()">Gerar</button>
</div>

<table id="tabela">
  <thead>
    <tr>
      <th onclick="ordenar(0)">Valor</th>
      <th onclick="ordenar(1)">Médio</th>
      <th>Itens</th>
    </tr>
  </thead>
  <tbody>
    <tr><td colspan="3">Aguardando...</td></tr>
  </tbody>
</table>

<script>
const API = '/api/produtos';

let resultados = [];
let asc = true;

async function gerar() {
  const tamKit = parseInt(document.getElementById('tamKit').value);
  const precoMax = parseFloat(document.getElementById('precoMax').value);

  const res = await fetch(API);
  const produtos = (await res.json())
    .map(p => ({ nome: p.nome, preco: Number(p.preco) }))
    .sort((a, b) => a.preco - b.preco);

  resultados = [];

  function backtrack(inicio, kit, soma) {
    if (kit.length === tamKit) {
      const medio = soma / tamKit;

      if (medio <= precoMax) {
        resultados.push([
          soma.toFixed(2),
          medio.toFixed(2),
          kit.map(p => p.nome).join(' - ')
        ]);
      }
      return;
    }

    for (let i = inicio; i < produtos.length; i++) {
      const p = produtos[i];

      const novaSoma = soma + p.preco;
      const novaQtd = kit.length + 1;

      const mediaParcial = novaSoma / novaQtd;

      // PODA
      if (mediaParcial > precoMax) break;

      kit.push(p);
      backtrack(i + 1, kit, novaSoma);
      kit.pop();
    }
  }

  backtrack(0, [], 0);

  render();
}

function render() {
  const tbody = document.querySelector('#tabela tbody');

  if (resultados.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3">Nenhum resultado</td></tr>`;
    return;
  }

  tbody.innerHTML = resultados.map(r => `
    <tr>
      <td>R$ ${r[0]}</td>
      <td>R$ ${r[1]}</td>
      <td>${r[2]}</td>
    </tr>
  `).join('');

  tbody.insertAdjacentHTML('beforeend',
    `<tr><td colspan="3">(${resultados.length} kits)</td></tr>`
  );
}

function ordenar(col) {
  resultados.sort((a, b) => {
    return asc
      ? parseFloat(a[col]) - parseFloat(b[col])
      : parseFloat(b[col]) - parseFloat(a[col]);
  });
  asc = !asc;
  render();
}
</script>

</body>
</html>
