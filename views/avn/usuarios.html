<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVN • Usuários</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#182334;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1060px;margin:35px auto;padding:0 18px}h1{margin:0 0 5px}.muted{color:#667085}section{background:white;padding:22px;border:1px solid #dce2ea;border-radius:12px;margin-top:20px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}input,select{width:100%;padding:11px;border:1px solid #c5cfdb;border-radius:7px;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:7px;padding:10px 14px;background:#165ac3;color:white;cursor:pointer;font-weight:600}button.secondary{background:#e6edf6;color:#24384f}button.danger{background:#b82e3d}.toolbar{display:flex;gap:10px;align-items:center}.toolbar input{max-width:360px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e8edf3}th{font-size:13px;color:#64748b}td button{padding:7px 10px}#status{min-height:24px;margin-top:12px}.error{color:#b42318}.ok{color:#027a48}.scroll{overflow-x:auto}@media(max-width:620px){.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}}
</style></head><body><main class="wrap"><h1>AVN · Cadastro de usuários</h1><div class="muted">Dados pessoais para os protocolos de avaliação física</div><section><h2 id="titulo">Novo usuário</h2><form id="form"><input type="hidden" id="id"><div class="grid"><div><label for="nome">Nome completo *</label><input id="nome" maxlength="150" required autocomplete="name"></div><div><label for="nascimento">Data de nascimento *</label><input id="nascimento" type="date" required></div><div><label for="sexo">Referência fisiológica para cálculos *</label><select id="sexo" required><option value="">Selecione</option><option value="masculino">Masculino</option><option value="feminino">Feminino</option><option value="nao_informado">Não informado</option></select></div><div><label for="altura">Altura (cm) *</label><input id="altura" type="number" step="0.01" min="50" max="250" required placeholder="175"></div></div><div class="buttons"><button type="submit" id="salvar">Salvar usuário</button><button type="button" class="secondary" id="novo">Limpar / novo</button></div></form><div id="status" role="status" aria-live="polite"></div></section><section><h2>Usuários cadastrados</h2><div class="toolbar"><input id="busca" placeholder="Buscar por nome (ignora acentos)" aria-label="Buscar usuário"><button id="pesquisar" type="button">Pesquisar</button></div><div class="scroll"><table><thead><tr><th>Nome</th><th>Nascimento</th><th>Altura</th><th>Ações</th></tr></thead><tbody id="lista"><tr><td colspan="4">Carregando...</td></tr></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);let registros=[];const api='/api/avn/usuarios';
function msg(t,erro=false){$('status').textContent=t;$('status').className=erro?'error':'ok'}
async function request(url,opts){const r=await fetch(url,{credentials:'same-origin',...opts});let data;try{data=await r.json()}catch{throw Error('Sessão expirada ou resposta inválida. Entre novamente no sistema.')}if(!r.ok)throw Error(data.erro||'Falha na operação.');return data}
function limpar(){$('form').reset();$('id').value='';$('titulo').textContent='Novo usuário';$('salvar').textContent='Salvar usuário';msg('')}
function dataBR(v){return v? v.slice(8,10)+'/'+v.slice(5,7)+'/'+v.slice(0,4):''}
async function carregar(){try{registros=await request(api+'?busca='+encodeURIComponent($('busca').value.trim()));const tbody=$('lista');tbody.replaceChildren();if(!registros.length){const tr=tbody.insertRow();const td=tr.insertCell();td.colSpan=4;td.textContent='Nenhum usuário encontrado.';return}for(const u of registros){const tr=tbody.insertRow();for(const value of [u.nome,dataBR(u.data_nascimento),u.altura_cm+' cm'])tr.insertCell().textContent=value;const td=tr.insertCell();const edit=document.createElement('button');edit.textContent='Editar';edit.className='secondary';edit.onclick=()=>editar(u.id);const del=document.createElement('button');del.textContent='Excluir';del.className='danger';del.style.marginLeft='6px';del.onclick=()=>excluir(u.id);td.append(edit,del)}}catch(e){msg(e.message,true);$('lista').replaceChildren()}}
function editar(id){const u=registros.find(x=>x.id===id);if(!u)return;$('id').value=u.id;$('nome').value=u.nome;$('nascimento').value=u.data_nascimento;$('sexo').value=u.sexo_referencia_calculo;$('altura').value=u.altura_cm;$('titulo').textContent='Editar usuário #'+id;$('salvar').textContent='Atualizar usuário';msg('');window.scrollTo({top:0,behavior:'smooth'})}
async function excluir(id){const u=registros.find(x=>x.id===id);if(!u||!confirm('Excluir definitivamente o usuário '+u.nome+'?'))return;try{await request(api+'/'+id,{method:'DELETE'});if(String($('id').value)===String(id))limpar();msg('Usuário excluído.');await carregar()}catch(e){msg(e.message,true)}}
$('form').addEventListener('submit',async e=>{e.preventDefault();const id=$('id').value;const payload={nome:$('nome').value.trim(),data_nascimento:$('nascimento').value,sexo_referencia_calculo:$('sexo').value,altura_cm:Number($('altura').value)};try{await request(api+(id?'/'+id:''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});limpar();msg(id?'Usuário atualizado.':'Usuário cadastrado.');await carregar()}catch(err){msg(err.message,true)}});$('novo').onclick=limpar;$('pesquisar').onclick=carregar;$('busca').addEventListener('keydown',e=>{if(e.key==='Enter')carregar()});carregar();
</script></body></html>
