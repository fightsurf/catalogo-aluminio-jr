<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prestação de Contas</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/prestacao_contas/prestacao.css" />
</head>
<body>

  <!-- ─── TOPBAR ──────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-icon">📊</span>
      <div>
        <h1 class="topbar-title">Prestação de Contas</h1>
        <span id="prestacao-ativa-subtitle" class="topbar-subtitle"></span>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn-painel-saldos" onclick="window.location.href='/prestacao-contas-saldos'">Painel de saldos</button>
      <button id="btn-nova" class="btn-nova">＋ Nova Prestação</button>
    </div>
    <!-- mantido para compatibilidade com JS -->
    <select id="sel-prestacao" style="display:none;">
      <option value="">-- selecione --</option>
    </select>
  </header>

  <!-- ─── FEEDBACK ────────────────────────────────────────── -->
  <div id="msg-feedback" class="msg-feedback" style="display:none;"></div>

  <!-- ─── FORM NOVA PRESTAÇÃO ─────────────────────────────── -->
  <div id="form-nova" class="form-nova-prestacao nova-panel" style="display:none;">
    <div class="nova-grid">
      <label class="nova-field">
        <span>Título</span>
        <input type="text" id="nova-titulo" placeholder="Ex: Maio 2026" />
      </label>
      <label class="nova-field">
        <span>Data de Referência</span>
        <input type="date" id="nova-data" />
      </label>
      <label class="nova-field">
        <span>Fornecedor</span>
        <select id="nova-fornecedor">
          <option value="">-- selecione --</option>
        </select>
      </label>
    </div>
    <div class="nova-footer">
      <button id="btn-confirmar-nova" class="btn-criar">Criar Prestação</button>
      <button id="btn-cancelar-nova" class="btn-secundario">Cancelar</button>
    </div>
  </div>

  <!-- ─── SEÇÃO LISTA ──────────────────────────────────────── -->
  <section class="page-section">
    <div class="section-head">
      <h2 class="section-title grid-titulo">Prestações</h2>
      <div class="filters-line">
        <label class="grid-filtro-label filter-wrap">
          <span>Status:</span>
          <select id="filtro-status">
            <option value="ABERTA">Abertas</option>
            <option value="CONCLUIDA">Concluídas</option>
          </select>
        </label>
        <label class="grid-filtro-label filter-wrap">
          <span>Fornecedor:</span>
          <select id="filtro-fornecedor">
            <option value="">Todos</option>
          </select>
        </label>
      </div>
    </div>
    <div class="table-scroll">
      <table class="tabela-lista">
        <thead>
          <tr>
            <th>#</th>
            <th>Título</th>
            <th>Data Ref.</th>
            <th>Fornecedor</th>
            <th>Status</th>
            <th style="width:110px;"></th>
          </tr>
        </thead>
        <tbody id="tbody-lista">
          <tr><td colspan="6" class="msg-vazio">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- ─── ESTADO VAZIO ─────────────────────────────────────── -->
  <div id="empty-state" class="empty-state">
    <div class="empty-icon">📋</div>
    <p>Clique em <strong>Abrir</strong> em uma prestação acima para ver os detalhes.</p>
  </div>

  <!-- ─── DETALHE (planilha-container) ─────────────────────── -->
  <section class="page-section detail-section" id="planilha-container" style="display:none;">

    <!-- cabeçalho do detalhe -->
    <div class="detail-head">
      <div class="detail-head-info">
        <div class="detail-title-row">
          <h2 id="faixa-titulo" class="detail-title">PRESTAÇÃO DE CONTAS</h2>
          <span id="status-prestacao-badge" class="status-badge status-aberta">ABERTA</span>
        </div>
        <p id="credito-info" class="credito-info" style="display:none;"></p>
      </div>
      <div class="detail-actions">
        <button id="btn-concluir-prestacao" class="btn-concluir-prestacao" type="button">✅ Concluir</button>
        <button id="btn-reabrir-prestacao" class="btn-reabrir-prestacao" type="button" style="display:none;">↩ Reabrir</button>
        <button id="btn-whatsapp-resumo" class="btn-whatsapp-resumo" type="button">WhatsApp resumo</button>
        <button id="btn-whatsapp-pdf" class="btn-whatsapp-pdf" type="button">📎 WhatsApp PDF</button>
        <button id="btn-excluir-prestacao" class="btn-excluir-prestacao" type="button">Excluir</button>
      </div>
    </div>

    <!-- abas -->
    <div class="tab-bar">
      <button class="tab-btn tab-active" data-tab="materiais">📦 Materiais</button>
      <button class="tab-btn" data-tab="pagamentos">💰 Pagamentos</button>
    </div>

    <!-- aba materiais -->
    <div class="tab-panel" id="tab-materiais">
      <div class="table-scroll">
        <table id="tabela-materiais">
          <thead>
            <tr>
              <th>Material</th>
              <th class="col-num">Peso (Kg)</th>
              <th class="col-num">Preço/Kg (R$)</th>
              <th class="col-num">Total (R$)</th>
              <th style="width:50px;"></th>
            </tr>
          </thead>
          <tbody id="tbody-materiais"></tbody>
          <tfoot>
            <tr class="linha-total" id="linha-total-materiais">
              <td>Total</td>
              <td id="total-peso" class="num"></td>
              <td></td>
              <td id="total-material" class="num"></td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <!-- formulário adicionar item -->
      <div class="add-row form-section" id="form-item">
        <label class="add-field">
          <span>Material</span>
          <input type="text" id="item-material" placeholder="Ex: Alumínio 6060" />
        </label>
        <label class="add-field">
          <span>Peso (Kg)</span>
          <input type="number" id="item-peso" step="0.001" min="0" />
        </label>
        <label class="add-field">
          <span>Preço/Kg (R$)</span>
          <input type="number" id="item-preco" step="0.01" min="0" />
        </label>
        <button id="btn-add-item" class="btn-add">＋ Adicionar</button>
      </div>
    </div><!-- /#tab-materiais -->

    <!-- aba pagamentos -->
    <div class="tab-panel" id="tab-pagamentos" style="display:none;">
      <div class="table-scroll">
        <table id="tabela-pagamentos">
          <thead>
            <tr>
              <th>Data</th>
              <th class="col-num">Valor (R$)</th>
              <th>Observação</th>
              <th style="width:50px;"></th>
            </tr>
          </thead>
          <tbody id="tbody-pagamentos"></tbody>
          <tfoot>
            <tr class="linha-total">
              <th scope="row">Total pago</th>
              <td id="total-pago" class="num"></td>
              <th scope="row">Saldo restante</th>
              <td id="saldo-restante" class="num"></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <!-- formulário adicionar pagamento -->
      <div class="add-row form-section" id="form-pagamento">
        <label class="add-field">
          <span>Data</span>
          <input type="date" id="pag-data" />
        </label>
        <label class="add-field">
          <span>Valor (R$)</span>
          <input type="number" id="pag-valor" step="0.01" min="0" />
        </label>
        <label class="add-field">
          <span>Observação</span>
          <input type="text" id="pag-obs" placeholder="Opcional" />
        </label>
        <button id="btn-add-pag" class="btn-add">＋ Adicionar</button>
      </div>
    </div><!-- /#tab-pagamentos -->

  </section><!-- /#planilha-container -->

  <script src="/prestacao_contas/prestacao.js"></script>
  <script>
    // Troca de abas
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('tab-active'); });
        document.querySelectorAll('.tab-panel').forEach(function(p) { p.style.display = 'none'; });
        btn.classList.add('tab-active');
        document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
      });
    });
  </script>
</body>
</html>
