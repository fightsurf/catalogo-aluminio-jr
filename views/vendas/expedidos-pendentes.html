<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expedidos com pagamento pendente</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      text-align: left;
    }
    .pagina {
      width: 100%;
      max-width: 760px;
      margin: 0;
      padding: 0;
      text-align: left;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 700;
      text-align: left;
    }
    .subtitulo,
    .status {
      margin: 0 0 8px;
      font-size: 12px;
      color: #555;
      text-align: left;
    }
    .status.erro { color: #a40000; }
    .tabela-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #cfcfcf;
    }
    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }
    th,
    td {
      border-right: 1px solid #d9d9d9;
      border-bottom: 1px solid #d9d9d9;
      padding: 6px 7px;
      font-size: 12px;
      line-height: 1.25;
      vertical-align: middle;
      text-align: left !important;
    }
    th {
      background: #f0f0f0;
      font-weight: 700;
      white-space: nowrap;
    }
    th:last-child,
    td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafafa; }
    .col-pedido { width: 92px; }
    .col-cliente { width: 225px; }
    .col-valor { width: 105px; }
    .col-data { width: 105px; }
    .pedido-link {
      color: #111;
      text-decoration: none;
      font-weight: 700;
    }
    .pedido-link:hover { text-decoration: underline; }
    .vazio {
      padding: 14px 7px;
      color: #666;
      text-align: left;
    }
    @media (max-width: 700px) {
      body { padding: 6px; }
      .pagina { max-width: 100%; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <h1>Expedidos com pagamento pendente</h1>
    <p class="subtitulo" id="periodo">Últimos 6 meses</p>
    <p class="status" id="status">Carregando...</p>

    <div class="tabela-wrap">
      <table aria-label="Pedidos expedidos com pagamento pendente">
        <thead>
          <tr>
            <th class="col-pedido">Pedido</th>
            <th class="col-cliente">Nome do cliente</th>
            <th class="col-valor">Valor</th>
            <th class="col-data">Data Expedição</th>
            <th class="col-data">Data Carrada</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">
          <tr><td colspan="5" class="vazio">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const INTERVALO_ATUALIZACAO_MS = 30000;
    let carregando = false;

    function escapeHtml(valor) {
      return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatarMoeda(valor) {
      const numero = Number(valor || 0);
      return numero.toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL',
        minimumFractionDigits: 2
      });
    }

    function formatarData(valor) {
      if (!valor) return '-';
      const partes = String(valor).slice(0, 10).split('-');
      if (partes.length !== 3) return String(valor);
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function horaAtualizacao() {
      return new Date().toLocaleTimeString('pt-BR', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function renderizarTabela(pedidos) {
      const corpo = document.getElementById('corpoTabela');

      if (!Array.isArray(pedidos) || pedidos.length === 0) {
        corpo.innerHTML = '<tr><td colspan="5" class="vazio">Nenhum pedido encontrado.</td></tr>';
        return;
      }

      corpo.innerHTML = pedidos.map((pedido) => {
        const numero = escapeHtml(pedido.numero || '-');
        const href = `/legado/pedidos?numero=${encodeURIComponent(pedido.numero || '')}`;

        return `
          <tr>
            <td><a class="pedido-link" href="${href}" target="_blank" rel="noopener noreferrer">${numero}</a></td>
            <td>${escapeHtml(pedido.cliente_nome || '-')}</td>
            <td>${escapeHtml(formatarMoeda(pedido.valor))}</td>
            <td>${escapeHtml(formatarData(pedido.data_expedicao))}</td>
            <td>${escapeHtml(formatarData(pedido.data_carrada))}</td>
          </tr>
        `;
      }).join('');
    }

    async function carregar() {
      if (carregando) return;
      carregando = true;

      const status = document.getElementById('status');
      status.classList.remove('erro');

      try {
        const response = await fetch('/api/vendas/expedidos-pendentes', { cache: 'no-store' });
        const json = await response.json();

        if (!response.ok || !json.success) {
          throw new Error(json.message || 'Falha ao carregar os dados.');
        }

        const dados = json.data || {};
        const periodo = dados.periodo || {};
        document.getElementById('periodo').textContent =
          `Período: ${formatarData(periodo.data_inicial)} até ${formatarData(periodo.data_final)}`;

        renderizarTabela(dados.pedidos || []);
        status.textContent = `${Number(dados.quantidade_pedidos || 0)} pedido(s) · atualização automática a cada 30 s · última atualização ${horaAtualizacao()}`;
      } catch (error) {
        status.classList.add('erro');
        status.textContent = `Erro: ${error.message}`;
      } finally {
        carregando = false;
      }
    }

    carregar();
    setInterval(carregar, INTERVALO_ATUALIZACAO_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) carregar();
    });
  </script>
</body>
</html>
