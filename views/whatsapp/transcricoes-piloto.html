<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente administrativo • Alumínio JR</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1320;color:#e7effc}
.wrap{width:min(100%,1040px);margin:auto;padding:26px 22px 48px}
h1{font-size:clamp(1.4rem,3vw,1.85rem);letter-spacing:-.035em;margin:0 0 22px}
#lista{display:grid;gap:12px}
.item{background:#131f30;border:1px solid #2a3c55;border-radius:13px;padding:18px}
.meta{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;color:#a9bbd1;font-size:.84rem}
.phone{color:#f1f5fe;font-weight:650}
.pill{padding:4px 9px;border:1px solid #5a6980;border-radius:99px;font-size:.79rem}
.pill.concluida{border-color:#3c9f84;color:#80dfbb}
.pill.processando,.pill.pendente{border-color:#c1964d;color:#fbd187}
.pill.erro{border-color:#b75d6c;color:#ffadba}
.transcricao{white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0 0;font-size:1.05rem;line-height:1.6}
.muted{color:#99adc7}
.error{color:#ffb2bd}
.empty{border:1px dashed #3a4b61;background:#121f30;color:#a8bcd5;border-radius:13px;padding:38px 22px;text-align:center;line-height:1.6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.tabs button,.actions button,form button{border:1px solid #48627d;border-radius:9px;padding:10px 14px;background:#1d3047;color:#edf4fe;cursor:pointer}
.tabs button[aria-selected="true"]{background:#275d9f;border-color:#699ee0}
[hidden]{display:none!important}
.panel{background:#131f30;border:1px solid #2a3c55;border-radius:13px;padding:18px;margin-bottom:18px}
.panel h2{font-size:1.1rem;margin:0 0 14px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{color:#c8d9ed}
.field input,.field select,.field textarea{width:100%;background:#0b1726;color:#fff;border:1px solid #48627d;border-radius:8px;padding:10px;font:inherit}
.field textarea{min-height:115px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.intencao{padding:14px 0;border-bottom:1px solid #2a3c55}
.intencao:last-child{border:0}
.intencao strong{display:block;margin-bottom:4px}
.resposta{margin:12px 0 0;white-space:pre-wrap;color:#a9ebc7;line-height:1.5}
.notice{color:#b2c9e7;min-height:1.6em;white-space:pre-wrap}
.checkline{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.panel-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-heading h2{margin:0}
.modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(3,9,18,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{position:relative;width:min(100%,620px);max-height:90vh;overflow:auto;background:#131f30;border:1px solid #48627d;border-radius:14px;padding:24px;box-shadow:0 22px 60px rgba(0,0,0,.5)}
.modal-card h2{font-size:1.2rem;margin:0 42px 20px 0}
.modal-fechar{position:absolute;top:15px;right:16px;border:1px solid #48627d;border-radius:8px;background:#1d3047;color:#edf4fe;cursor:pointer;font-size:1.4rem;line-height:1;padding:7px 11px}
body.modal-aberto{overflow:hidden}
@media(max-width:620px){.modal-card{padding:18px}}
@media(max-width:620px){.wrap{padding:19px 14px 35px}.item{padding:14px}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Assistente administrativo</h1>
  <nav class="tabs" aria-label="Áreas do assistente">
    <button id="aba-mensagens" type="button" aria-selected="true">Mensagens recebidas</button>
    <button id="aba-intencoes" type="button" aria-selected="false">Intenções administrativas</button>
  </nav>
  <section id="painel-mensagens" aria-label="Mensagens recebidas">
    <div id="lista" aria-live="polite">
      <div class="empty">Carregando mensagens...</div>
    </div>
  </section>
  <section id="painel-intencoes" hidden aria-label="Intenções administrativas">
    <div class="panel">
      <div class="panel-heading">
        <h2>Intenções cadastradas</h2>
        <div class="actions">
          <button id="nova-intencao" type="button">+ Nova Intenção</button>
        </div>
      </div>
      <p id="status-intencoes" class="notice" role="status"></p>
      <div id="lista-intencoes"></div>
    </div>
  </section>
</main>
<div id="modal-intencao" class="modal-backdrop" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="titulo-formulario">
    <button id="fechar-modal" type="button" class="modal-fechar" aria-label="Fechar formulário">&times;</button>
    <h2 id="titulo-formulario">Nova intenção administrativa</h2>
    <form id="form-intencao">
      <input type="hidden" id="intencao-id">
      <div class="field"><label for="intencao-nome">Nome da intenção</label>
        <input id="intencao-nome" required maxlength="120" placeholder="Ex.: Localizar cliente"></div>
      <div class="field"><label for="intencao-acao">Ação do sistema</label>
        <select id="intencao-acao"><option value="localizar_cliente">Localizar cliente (somente consulta)</option></select></div>
      <div class="field"><label for="intencao-frases">Frases de reconhecimento (uma por linha)</label>
        <textarea id="intencao-frases" required placeholder="localize cliente&#10;localizar cliente"></textarea></div>
      <label class="checkline"><input type="checkbox" id="intencao-ativa" checked> Intenção ativa</label>
      <p id="modal-status" class="notice" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" id="salvar-intencao">Salvar intenção</button>
        <button id="cancelar-modal" type="button">Cancelar</button>
      </div>
    </form>
  </div>
</div>
<script>
(() => {
  'use strict';
  const lista = document.getElementById('lista');
  const labels = { pendente:'Na fila', processando:'Transcrevendo', concluida:'Transcrito', erro:'Falha' };
  let ultimaVersao = '';

  function horario(valor) {
    try {
      return new Intl.DateTimeFormat('pt-BR', {
        dateStyle:'short', timeStyle:'medium'
      }).format(new Date(valor));
    } catch (_) { return 'Horário indisponível'; }
  }

  function desenhar(registros) {
    const versao = JSON.stringify(registros);
    if (versao === ultimaVersao) return;
    ultimaVersao = versao;
    const fragmento = document.createDocumentFragment();
    if (!registros.length) {
      const vazio = document.createElement('div');
      vazio.className = 'empty';
      vazio.textContent = 'Nenhum áudio recebido ainda.';
      fragmento.appendChild(vazio);
    }
    for (const r of registros) {
      const item = document.createElement('article');
      item.className = 'item';
      const meta = document.createElement('div');
      meta.className = 'meta';
      const phone = document.createElement('span');
      phone.className = 'phone';
      phone.textContent = r.telefone || 'Número não informado';
      const quando = document.createElement('time');
      quando.textContent = horario(r.recebido_em);
      const pill = document.createElement('span');
      pill.className = 'pill ' + (labels[r.status] ? r.status : '');
      pill.textContent = labels[r.status] || 'Recebido';
      const fala = document.createElement('p');
      fala.className = 'transcricao' +
        (r.status === 'erro' ? ' error' : r.status !== 'concluida' ? ' muted' : '');
      fala.textContent = r.status === 'concluida' ? r.texto :
        r.status === 'erro' ? r.erro : 'Aguardando texto da transcrição...';
      if (r.origem === 'enviado_para_si') {
        const origem = document.createElement('span');
        origem.textContent = 'Conversa consigo mesmo';
        meta.appendChild(origem);
      }
      meta.append(phone, quando, pill);
      item.append(meta, fala);
      if (r.resposta) {
        const resposta = document.createElement('p');
        resposta.className = 'resposta';
        resposta.textContent = 'Resposta administrativa:\n' + r.resposta;
        item.appendChild(resposta);
      }
      if (r.erroComando) {
        const erro = document.createElement('p');
        erro.className = 'error';
        erro.textContent = r.erroComando;
        item.appendChild(erro);
      }
      fragmento.appendChild(item);
    }
    // Atualiza apenas esta lista; não consulta novamente e não recarrega a página.
    lista.replaceChildren(fragmento);
  }

  const abaMensagens = document.getElementById('aba-mensagens');
  const abaIntencoes = document.getElementById('aba-intencoes');
  const painelMensagens = document.getElementById('painel-mensagens');
  const painelIntencoes = document.getElementById('painel-intencoes');
  const modalIntencao = document.getElementById('modal-intencao');
  const modalStatus = document.getElementById('modal-status');
  const botaoSalvar = document.getElementById('salvar-intencao');
  const form = document.getElementById('form-intencao');
  const campoId = document.getElementById('intencao-id');
  const campoNome = document.getElementById('intencao-nome');
  const campoAcao = document.getElementById('intencao-acao');
  const campoFrases = document.getElementById('intencao-frases');
  const campoAtiva = document.getElementById('intencao-ativa');
  const listaIntencoes = document.getElementById('lista-intencoes');
  const statusIntencoes = document.getElementById('status-intencoes');
  let intencoes = [];
  function alternar(qual) {
    const intencao = qual === 'intencoes';
    painelMensagens.hidden = intencao;
    painelIntencoes.hidden = !intencao;
    abaMensagens.setAttribute('aria-selected', String(!intencao));
    abaIntencoes.setAttribute('aria-selected', String(intencao));
    if (!intencao) fecharModal();
    if (intencao) carregarIntencoes();
  }
  abaMensagens.addEventListener('click', () => alternar('mensagens'));
  abaIntencoes.addEventListener('click', () => alternar('intencoes'));
  let focoAnterior = null;
  function limparFormulario() {
    form.reset();
    campoId.value = '';
    campoAtiva.checked = true;
    modalStatus.textContent = '';
    modalStatus.hidden = true;
    document.getElementById('titulo-formulario').textContent = 'Nova intenção administrativa';
  }
  function abrirModal(item) {
    limparFormulario();
    if (item) {
      campoId.value = item.id;
      campoNome.value = item.nome;
      campoAcao.value = item.acao;
      campoFrases.value = item.frases;
      campoAtiva.checked = item.ativo;
      document.getElementById('titulo-formulario').textContent = 'Editar intenção administrativa';
    }
    focoAnterior = document.activeElement;
    modalIntencao.hidden = false;
    document.body.classList.add('modal-aberto');
    campoNome.focus();
  }
  function fecharModal() {
    if (modalIntencao.hidden) return;
    modalIntencao.hidden = true;
    document.body.classList.remove('modal-aberto');
    limparFormulario();
    if (focoAnterior && focoAnterior.isConnected) focoAnterior.focus();
    focoAnterior = null;
  }
  document.getElementById('nova-intencao').addEventListener('click', () => abrirModal());
  document.getElementById('fechar-modal').addEventListener('click', fecharModal);
  document.getElementById('cancelar-modal').addEventListener('click', fecharModal);
  modalIntencao.addEventListener('click', evento => {
    if (evento.target === modalIntencao) fecharModal();
  });
  modalIntencao.addEventListener('keydown', evento => {
    if (evento.key === 'Escape') {
      evento.preventDefault();
      fecharModal();
    } else if (evento.key === 'Tab') {
      const controles = Array.from(modalIntencao.querySelectorAll(
        'button:not(:disabled),input:not([type="hidden"]):not(:disabled),select:not(:disabled),textarea:not(:disabled)'
      ));
      if (!controles.length) return;
      const primeiro = controles[0];
      const ultimo = controles[controles.length - 1];
      if (evento.shiftKey && document.activeElement === primeiro) {
        evento.preventDefault();
        ultimo.focus();
      } else if (!evento.shiftKey && document.activeElement === ultimo) {
        evento.preventDefault();
        primeiro.focus();
      }
    }
  });
  async function requisitar(url, options) {
    const r = await fetch(url, { credentials: 'same-origin', ...options,
      headers: { 'Content-Type':'application/json', ...(options?.headers || {}) } });
    const dados = await r.json().catch(() => ({}));
    if (!r.ok || !dados.success) throw new Error(dados.message || 'Falha na requisição.');
    return dados;
  }
  function desenharIntencoes() {
    listaIntencoes.replaceChildren();
    if (!intencoes.length) {
      listaIntencoes.textContent = 'Nenhuma intenção cadastrada.';
      return;
    }
    for (const item of intencoes) {
      const linha = document.createElement('div');
      linha.className = 'intencao';
      const titulo = document.createElement('strong');
      titulo.textContent = item.nome + (item.ativo ? ' — Ativa' : ' — Inativa');
      const resumo = document.createElement('p');
      resumo.className = 'muted';
      resumo.textContent = 'Ação: ' + item.acao + ' | Frases: ' + item.frases.replace(/\n/g, ' · ');
      const comandos = document.createElement('div');
      comandos.className = 'actions';
      const editar = document.createElement('button');
      editar.type = 'button';
      editar.textContent = 'Editar';
      editar.onclick = () => abrirModal(item);
      const apagar = document.createElement('button');
      apagar.type = 'button';
      apagar.textContent = 'Excluir';
      apagar.onclick = async () => {
        if (!confirm('Excluir a intenção ' + item.nome + '?')) return;
        try {
          await requisitar('/whatsapp/transcricoes/intencoes/' + item.id, { method:'DELETE' });
          await carregarIntencoes();
          if (String(campoId.value) === String(item.id)) fecharModal();
        } catch (e) { statusIntencoes.textContent = e.message; }
      };
      comandos.append(editar, apagar);
      linha.append(titulo, resumo, comandos);
      listaIntencoes.appendChild(linha);
    }
  }
  async function carregarIntencoes() {
    statusIntencoes.textContent = 'Carregando intenções...';
    try {
      const r = await requisitar('/whatsapp/transcricoes/intencoes');
      intencoes = Array.isArray(r.dados) ? r.dados : [];
      desenharIntencoes();
      statusIntencoes.textContent = intencoes.length + ' intenção(ões) cadastrada(s).';
    } catch (e) { statusIntencoes.textContent = e.message; }
  }
  form.addEventListener('submit', async evento => {
    evento.preventDefault();
    const id = campoId.value;
    const dados = { nome: campoNome.value, acao: campoAcao.value, frases: campoFrases.value,
      ativo: campoAtiva.checked };
    modalStatus.hidden = false;
    modalStatus.textContent = 'Salvando intenção...';
    botaoSalvar.disabled = true;
    try {
      await requisitar('/whatsapp/transcricoes/intencoes' + (id ? '/' + id : ''), {
        method: id ? 'PUT' : 'POST', body: JSON.stringify(dados)
      });
      fecharModal();
      await carregarIntencoes();
    } catch (e) {
      modalStatus.textContent = e.message;
    } finally {
      botaoSalvar.disabled = false;
    }
  });

  // O servidor envia eventos quando novas mensagens chegam ou mudam de estado.
  // EventSource restabelece a conexão automaticamente em caso de interrupção.
  const eventos = new EventSource('/whatsapp/transcricoes/eventos');
  eventos.addEventListener('mensagens', evento => {
    try {
      const dados = JSON.parse(evento.data);
      desenhar(Array.isArray(dados.registros) ? dados.registros : []);
    } catch (_) {
      // Um evento inválido não altera a lista atual.
    }
  });
  window.addEventListener('pagehide', () => eventos.close());
})();
</script>
</body>
</html>
