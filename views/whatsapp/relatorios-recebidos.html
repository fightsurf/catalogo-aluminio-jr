<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatórios WhatsApp - Alumínio JR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #1f2937;
    }
    .pagina {
      width: min(980px, calc(100% - 24px));
      margin: 24px auto 48px;
    }
    .topo {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .subtitulo { margin: 0; color: #6b7280; font-size: 14px; }
    .busca {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-top: 16px;
    }
    input, button {
      min-height: 44px;
      border-radius: 9px;
      font-size: 15px;
    }
    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      padding: 0 12px;
    }
    button {
      border: 0;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-buscar { background: #111827; color: #fff; }
    .btn-limpar { background: #e5e7eb; color: #111827; }
    .lista { display: grid; gap: 10px; }
    .registro {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
    }
    .registro-topo {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .telefone { font-size: 18px; font-weight: 800; word-break: break-word; }
    .data { margin-top: 4px; color: #6b7280; font-size: 13px; }
    .preview {
      margin: 12px 0;
      padding: 10px;
      background: #f8fafc;
      border-radius: 8px;
      color: #475569;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 92px;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.35;
    }
    .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-ver { background: #111827; color: white; }
    .btn-excluir { background: #fee2e2; color: #991b1b; }
    .vazio, .carregando, .erro {
      padding: 26px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      color: #6b7280;
    }
    .erro { color: #991b1b; background: #fff7f7; }
    .modal-fundo {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-fundo.aberto { display: flex; }
    .modal {
      width: min(760px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
    }
    .modal-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    .modal-titulo { font-weight: 800; }
    .btn-fechar {
      min-height: 36px;
      background: #e5e7eb;
      color: #111827;
      padding: 0 12px;
    }
    .relatorio-completo {
      margin: 0;
      padding: 18px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    @media (max-width: 620px) {
      .pagina { margin-top: 12px; }
      h1 { font-size: 21px; }
      .busca { grid-template-columns: 1fr; }
      .busca button { width: 100%; }
      .registro-topo { display: block; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <section class="topo">
      <h1>Relatórios recebidos pelo WhatsApp</h1>
      <p class="subtitulo">Histórico dos relatórios armazenados pela plataforma.</p>

      <div class="busca">
        <input id="telefoneBusca" type="search" inputmode="tel" placeholder="Pesquisar pelo número do WhatsApp" autocomplete="off" />
        <button id="btnBuscar" class="btn-buscar" type="button">Pesquisar</button>
        <button id="btnLimpar" class="btn-limpar" type="button">Limpar</button>
      </div>
    </section>

    <section id="lista" class="lista">
      <div class="carregando">Carregando...</div>
    </section>
  </main>

  <div id="modalFundo" class="modal-fundo" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal">
      <div class="modal-topo">
        <div id="modalTitulo" class="modal-titulo">Relatório</div>
        <button id="btnFecharModal" class="btn-fechar" type="button">Fechar</button>
      </div>
      <pre id="relatorioCompleto" class="relatorio-completo"></pre>
    </div>
  </div>

  <script>
    const lista = document.getElementById('lista');
    const telefoneBusca = document.getElementById('telefoneBusca');
    const btnBuscar = document.getElementById('btnBuscar');
    const btnLimpar = document.getElementById('btnLimpar');
    const modalFundo = document.getElementById('modalFundo');
    const modalTitulo = document.getElementById('modalTitulo');
    const relatorioCompleto = document.getElementById('relatorioCompleto');
    const btnFecharModal = document.getElementById('btnFecharModal');

    let registrosAtuais = [];

    function escapeHtml(valor) {
      return String(valor ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatarData(valor) {
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return '-';
      return new Intl.DateTimeFormat('pt-BR', {
        dateStyle: 'short',
        timeStyle: 'short'
      }).format(data);
    }

    function previewRelatorio(texto) {
      const limite = 350;
      const valor = String(texto || '');
      return valor.length > limite ? `${valor.slice(0, limite)}…` : valor;
    }

    function renderizar() {
      if (!registrosAtuais.length) {
        lista.innerHTML = '<div class="vazio">Nenhum relatório encontrado.</div>';
        return;
      }

      lista.innerHTML = registrosAtuais.map((item) => `
        <article class="registro" data-id="${item.id}">
          <div class="registro-topo">
            <div>
              <div class="telefone">${escapeHtml(item.telefone)}</div>
              <div class="data">Recebido em ${escapeHtml(formatarData(item.recebido_em))}</div>
            </div>
          </div>
          <div class="preview">${escapeHtml(previewRelatorio(item.relatorio))}</div>
          <div class="acoes">
            <button class="btn-ver" type="button" data-acao="ver" data-id="${item.id}">Ver relatório</button>
            <button class="btn-excluir" type="button" data-acao="excluir" data-id="${item.id}">Excluir</button>
          </div>
        </article>
      `).join('');
    }

    async function carregar() {
      lista.innerHTML = '<div class="carregando">Carregando...</div>';
      const telefone = telefoneBusca.value.trim();
      const query = telefone ? `?telefone=${encodeURIComponent(telefone)}` : '';

      try {
        const response = await fetch(`/api/whatsapp/relatorios${query}`, {
          headers: { Accept: 'application/json' }
        });

        if (response.status === 401) {
          window.location.href = `/login?next=${encodeURIComponent(window.location.pathname)}`;
          return;
        }

        const json = await response.json();
        if (!response.ok || !json.success) {
          throw new Error(json.message || 'Erro ao carregar relatórios.');
        }

        registrosAtuais = Array.isArray(json.data) ? json.data : [];
        renderizar();
      } catch (error) {
        lista.innerHTML = `<div class="erro">${escapeHtml(error.message)}</div>`;
      }
    }

    function abrirRelatorio(id) {
      const item = registrosAtuais.find((registro) => Number(registro.id) === Number(id));
      if (!item) return;

      modalTitulo.textContent = `${item.telefone} · ${formatarData(item.recebido_em)}`;
      relatorioCompleto.textContent = item.relatorio || '';
      modalFundo.classList.add('aberto');
    }

    function fecharModal() {
      modalFundo.classList.remove('aberto');
    }

    async function excluirRelatorio(id) {
      const item = registrosAtuais.find((registro) => Number(registro.id) === Number(id));
      if (!item) return;

      const confirmou = window.confirm(
        `Tem certeza que deseja excluir este relatório recebido de ${item.telefone}?\n\nA exclusão é definitiva.`
      );
      if (!confirmou) return;

      try {
        const response = await fetch(`/api/whatsapp/relatorios/${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: { Accept: 'application/json' }
        });
        const json = await response.json();

        if (!response.ok || !json.success) {
          throw new Error(json.message || 'Não foi possível excluir o relatório.');
        }

        registrosAtuais = registrosAtuais.filter((registro) => Number(registro.id) !== Number(id));
        renderizar();
      } catch (error) {
        window.alert(error.message);
      }
    }

    lista.addEventListener('click', (event) => {
      const botao = event.target.closest('button[data-acao]');
      if (!botao) return;

      if (botao.dataset.acao === 'ver') abrirRelatorio(botao.dataset.id);
      if (botao.dataset.acao === 'excluir') excluirRelatorio(botao.dataset.id);
    });

    btnBuscar.addEventListener('click', carregar);
    btnLimpar.addEventListener('click', () => {
      telefoneBusca.value = '';
      carregar();
    });
    telefoneBusca.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') carregar();
    });
    btnFecharModal.addEventListener('click', fecharModal);
    modalFundo.addEventListener('click', (event) => {
      if (event.target === modalFundo) fecharModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') fecharModal();
    });

    carregar();
  </script>
</body>
</html>
