<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatórios WhatsApp - Alumínio JR</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #1f2937; }
    .pagina { width: min(1050px, calc(100% - 24px)); margin: 24px auto 48px; }
    .topo,.registro { background:#fff; border:1px solid #e5e7eb; border-radius:14px; }
    .topo { padding:18px; margin-bottom:14px; }
    h1 { margin:0 0 6px; font-size:24px; }
    .subtitulo { margin:0; color:#6b7280; font-size:14px; }
    .busca { display:grid; grid-template-columns:1fr auto auto; gap:8px; margin-top:16px; }
    input,button { min-height:44px; border-radius:9px; font-size:15px; }
    input { width:100%; border:1px solid #cbd5e1; padding:0 12px; }
    button { border:0; padding:0 14px; cursor:pointer; font-weight:700; }
    .btn-buscar,.btn-ver,.btn-pedido { background:#111827; color:#fff; }
    .btn-limpar,.btn-copiar,.btn-fechar { background:#e5e7eb; color:#111827; }
    .btn-excluir { background:#fee2e2; color:#991b1b; }
    .lista { display:grid; gap:10px; }
    .registro { padding:14px; }
    .registro-topo { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
    .telefone { font-size:18px; font-weight:800; word-break:break-word; }
    .telefone-linha { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .telefone-acoes { display:inline-flex; align-items:center; gap:5px; }
    .telefone-atalho { width:32px; height:32px; min-height:32px; padding:0; border:1px solid #e2e8f0; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; background:#f8fafc; color:#334155; font-size:17px; text-decoration:none; line-height:1; cursor:pointer; }
    .telefone-atalho:hover { background:#e2e8f0; }
    .telefone-atalho:focus-visible { outline:2px solid #2563eb; outline-offset:2px; }
    .telefone-whatsapp { background:#e8fff0; border-color:#bbf7d0; color:#16a34a; }
    .telefone-whatsapp:hover { background:#bbf7d0; }
    .telefone-whatsapp svg { width:21px; height:21px; fill:currentColor; }
    .data { margin-top:4px; color:#6b7280; font-size:13px; }
    .cliente { margin-top:8px; padding:10px 12px; border-radius:9px; background:#ecfdf5; border:1px solid #a7f3d0; }
    .cliente strong { display:block; margin-bottom:3px; }
    .cliente small { color:#475569; }
    .cliente-nao { margin-top:8px; color:#6b7280; font-size:13px; }
    .preview { margin:12px 0; padding:10px; background:#f8fafc; border-radius:8px; color:#475569; white-space:pre-wrap; overflow-wrap:anywhere; max-height:92px; overflow:hidden; font-size:13px; line-height:1.35; }
    .acoes { display:flex; gap:8px; flex-wrap:wrap; }
    .vazio,.carregando,.erro { padding:26px; text-align:center; background:#fff; border:1px solid #e5e7eb; border-radius:12px; color:#6b7280; }
    .erro { color:#991b1b; background:#fff7f7; }
    .modal-fundo { position:fixed; inset:0; background:rgba(15,23,42,.65); display:none; align-items:center; justify-content:center; padding:16px; z-index:1000; }
    .modal-fundo.aberto { display:flex; }
    .modal { width:min(780px,100%); max-height:90vh; display:flex; flex-direction:column; background:#fff; border-radius:14px; overflow:hidden; }
    .modal-topo { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border-bottom:1px solid #e5e7eb; }
    .modal-titulo { font-weight:800; }
    .modal-acoes { display:flex; gap:8px; flex-wrap:wrap; }
    .relatorio-completo { margin:0; padding:18px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font-family:Arial,Helvetica,sans-serif; font-size:14px; line-height:1.45; }
    @media (max-width:680px) {
      .pagina { margin-top:12px; }
      h1 { font-size:21px; }
      .busca { grid-template-columns:1fr; }
      .busca button { width:100%; }
      .registro-topo { display:block; }
      .acoes button { flex:1 1 46%; }
      .modal-topo { align-items:flex-start; flex-direction:column; }
      .modal-acoes { width:100%; }
      .modal-acoes button { flex:1; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <section class="topo">
      <h1>Relatórios recebidos pelo WhatsApp</h1>
      <p class="subtitulo">A lista é atualizada automaticamente.</p>
      <div class="busca">
        <input id="telefoneBusca" type="search" inputmode="tel" placeholder="Pesquisar pelo número do WhatsApp" autocomplete="off" />
        <button id="btnBuscar" class="btn-buscar" type="button">Pesquisar</button>
        <button id="btnLimpar" class="btn-limpar" type="button">Limpar</button>
      </div>
    </section>
    <section id="lista" class="lista"><div class="carregando">Carregando...</div></section>
  </main>

  <div id="modalFundo" class="modal-fundo" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal">
      <div class="modal-topo">
        <div id="modalTitulo" class="modal-titulo">Relatório</div>
        <div class="modal-acoes">
          <button id="btnCopiarModal" class="btn-copiar" type="button">Copiar relatório</button>
          <button id="btnFecharModal" class="btn-fechar" type="button">Fechar</button>
        </div>
      </div>
      <pre id="relatorioCompleto" class="relatorio-completo"></pre>
    </div>
  </div>

  <script>
    const lista = document.getElementById('lista');
    const telefoneBusca = document.getElementById('telefoneBusca');
    const btnBuscar = document.getElementById('btnBuscar');
    const btnLimpar = document.getElementById('btnLimpar');
    const modalFundo = document.getElementById('modalFundo');
    const modalTitulo = document.getElementById('modalTitulo');
    const relatorioCompleto = document.getElementById('relatorioCompleto');
    const btnCopiarModal = document.getElementById('btnCopiarModal');
    const btnFecharModal = document.getElementById('btnFecharModal');

    let registrosAtuais = [];
    let relatorioModalAtual = '';
    let telefoneFiltroAplicado = '';
    let carregandoEmAndamento = false;

    function escapeHtml(valor) {
      return String(valor ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    }

    // O cadastro pode trazer DDI + DDD, ou apenas DDD + telefone.
    // Para copiar e abrir o WhatsApp, usar o mesmo número recebido, sem máscara.
    function telefoneParaWhatsapp(valor) {
      const digitos = String(valor || '').replace(/\D/g, '');
      if (digitos.length === 12 || digitos.length === 13) {
        return digitos.startsWith('55') ? digitos : '';
      }
      if (digitos.length === 10 || digitos.length === 11) return `55${digitos}`;
      return '';
    }

    function formatarTelefone(valor) {
      const digitos = String(valor || '').replace(/\D/g, '');
      if (!digitos) return '-';

      const numero = digitos.startsWith('55') ? digitos.slice(2) : digitos;
      if (numero.length === 10) {
        return `+55 (${numero.slice(0,2)}) ${numero.slice(2,6)}-${numero.slice(6)}`;
      }
      if (numero.length === 11) {
        return `+55 (${numero.slice(0,2)}) ${numero.slice(2,7)}-${numero.slice(7)}`;
      }
      return String(valor || '');
    }

    function formatarData(valor) {
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return '-';
      return new Intl.DateTimeFormat('pt-BR',{ dateStyle:'short', timeStyle:'short' }).format(data);
    }

    function previewRelatorio(texto) {
      const valor = String(texto || '');
      return valor.length > 350 ? `${valor.slice(0,350)}…` : valor;
    }

    function clienteHtml(cliente) {
      if (!cliente) return '<div class="cliente-nao">Telefone não localizado no cadastro de clientes.</div>';
      const local = [cliente.cidade, cliente.uf].filter(Boolean).join(' / ');
      const detalhes = [cliente.codigo ? `Código: ${cliente.codigo}` : '', local].filter(Boolean).join(' · ');
      return `<div class="cliente"><strong>${escapeHtml(cliente.nome || cliente.razao || 'Cliente cadastrado')}</strong><small>${escapeHtml(detalhes || cliente.telefonePrincipal || '')}</small></div>`;
    }

    function renderizar() {
      if (!registrosAtuais.length) {
        lista.innerHTML = '<div class="vazio">Nenhum relatório encontrado.</div>';
        return;
      }

      lista.innerHTML = registrosAtuais.map((item) => {
        const numeroWhatsApp = telefoneParaWhatsapp(item.telefone);
        return `
        <article class="registro" data-id="${item.id}">
          <div class="registro-topo">
            <div>
              <div class="telefone-linha">
                <div class="telefone">${escapeHtml(formatarTelefone(item.telefone))}</div>
                ${numeroWhatsApp ? `
                  <span class="telefone-acoes">
                    <button class="telefone-atalho" type="button" data-acao="copiar-telefone" data-id="${item.id}" title="Copiar telefone com DDI (somente números)" aria-label="Copiar telefone">📋</button>
                    <a class="telefone-atalho telefone-whatsapp" href="whatsapp://send?phone=${numeroWhatsApp}" title="Abrir conversa no aplicativo WhatsApp" aria-label="Abrir conversa no WhatsApp">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.52 3.48A11.83 11.83 0 0 0 12.08 0C5.5 0 .14 5.35.14 11.93c0 2.1.55 4.15 1.6 5.95L.04 24l6.28-1.65a11.94 11.94 0 0 0 5.76 1.47h.01c6.58 0 11.94-5.35 11.94-11.93a11.85 11.85 0 0 0-3.51-8.41ZM12.09 21.8h-.01a9.94 9.94 0 0 1-5.06-1.38l-.36-.21-3.76.99 1-3.66-.24-.38a9.92 9.92 0 0 1-1.52-5.23c0-5.49 4.47-9.96 9.97-9.96a9.9 9.9 0 0 1 7.05 2.92 9.9 9.9 0 0 1 2.91 7.05c0 5.49-4.48 9.96-9.98 9.96Zm5.46-7.45c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.23-.65.08-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.38-.03-.53-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.08-.79.38-.27.3-1.04 1.02-1.04 2.49s1.07 2.88 1.22 3.08c.15.2 2.1 3.21 5.08 4.5.71.31 1.27.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"/></svg>
                    </a>
                  </span>` : ''}
              </div>
              <div class="data">Recebido em ${escapeHtml(formatarData(item.recebido_em))}</div>
              ${item.clienteConsultaStatus === 'erro_consulta'
                ? '<div class="cliente-nao" style="color:#991b1b">Erro ao consultar o cadastro de clientes (API local/Firebird). Verifique os logs do Render e da API local.</div>'
                : clienteHtml(item.cliente)}
            </div>
          </div>
          <div class="preview">${escapeHtml(previewRelatorio(item.relatorio))}</div>
          <div class="acoes">
            <button class="btn-ver" type="button" data-acao="ver" data-id="${item.id}">Ver relatório</button>
            <button class="btn-copiar" type="button" data-acao="copiar" data-id="${item.id}">Copiar relatório</button>
            <button class="btn-pedido" type="button" data-acao="pedido" data-id="${item.id}">Inserir pedido</button>
            <button class="btn-excluir" type="button" data-acao="excluir" data-id="${item.id}">Excluir</button>
          </div>
        </article>
      `;
      }).join('');
    }

    async function carregar({ silencioso = false } = {}) {
      if (carregandoEmAndamento) return;
      carregandoEmAndamento = true;
      if (!silencioso) lista.innerHTML = '<div class="carregando">Carregando...</div>';

      const query = telefoneFiltroAplicado ? `?telefone=${encodeURIComponent(telefoneFiltroAplicado)}` : '';
      try {
        const response = await fetch(`/api/whatsapp/relatorios${query}`, { headers:{ Accept:'application/json' }, cache:'no-store' });
        if (response.status === 401) {
          window.location.href = `/login?next=${encodeURIComponent(window.location.pathname)}`;
          return;
        }
        const json = await response.json();
        if (!response.ok || !json.success) throw new Error(json.message || 'Erro ao carregar relatórios.');
        registrosAtuais = Array.isArray(json.data) ? json.data : [];
        renderizar();
      } catch (error) {
        if (!silencioso) lista.innerHTML = `<div class="erro">${escapeHtml(error.message)}</div>`;
      } finally {
        carregandoEmAndamento = false;
      }
    }

    function obterRegistro(id) { return registrosAtuais.find((r) => Number(r.id) === Number(id)); }

    function abrirRelatorio(id) {
      const item = obterRegistro(id);
      if (!item) return;
      modalTitulo.textContent = `${item.cliente?.nome || formatarTelefone(item.telefone)} · ${formatarData(item.recebido_em)}`;
      relatorioModalAtual = item.relatorio || '';
      relatorioCompleto.textContent = relatorioModalAtual;
      modalFundo.classList.add('aberto');
    }

    function fecharModal() { modalFundo.classList.remove('aberto'); }

    async function copiarTexto(texto, botao, { textoSucesso = 'Copiado!', mensagemErro = 'Não foi possível copiar o relatório.' } = {}) {
      const conteudo = String(texto || '');
      if (!conteudo) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(conteudo);
        } else {
          const area = document.createElement('textarea');
          area.value = conteudo;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          const copiou = document.execCommand('copy');
          area.remove();
          if (!copiou) throw new Error('Falha ao copiar.');
        }
        const original = botao.textContent;
        const tituloOriginal = botao.title;
        botao.textContent = textoSucesso;
        botao.title = 'Copiado!';
        setTimeout(() => {
          if (!botao.isConnected) return;
          botao.textContent = original;
          botao.title = tituloOriginal;
        }, 1200);
      } catch (_) {
        window.alert(mensagemErro);
      }
    }

    function abrirInsercaoPedido(id) {
      const url = `/legado/pedidos-insercao-v2?relatorio_whatsapp_id=${encodeURIComponent(id)}`;
      window.location.href = url;
    }

    async function excluirRelatorio(id) {
      const item = obterRegistro(id);
      if (!item) return;
      if (!window.confirm(`Tem certeza que deseja excluir este relatório recebido de ${formatarTelefone(item.telefone)}?\n\nA exclusão é definitiva.`)) return;
      try {
        const response = await fetch(`/api/whatsapp/relatorios/${encodeURIComponent(id)}`, { method:'DELETE', headers:{ Accept:'application/json' } });
        const json = await response.json();
        if (!response.ok || !json.success) throw new Error(json.message || 'Não foi possível excluir o relatório.');
        registrosAtuais = registrosAtuais.filter((r) => Number(r.id) !== Number(id));
        renderizar();
      } catch (error) { window.alert(error.message); }
    }

    lista.addEventListener('click', (event) => {
      const botao = event.target.closest('button[data-acao]');
      if (!botao) return;
      const item = obterRegistro(botao.dataset.id);
      if (botao.dataset.acao === 'ver') abrirRelatorio(botao.dataset.id);
      if (botao.dataset.acao === 'copiar' && item) copiarTexto(item.relatorio, botao);
      if (botao.dataset.acao === 'copiar-telefone' && item) {
        const telefone = telefoneParaWhatsapp(item.telefone);
        if (telefone) copiarTexto(telefone, botao, { textoSucesso: '✓', mensagemErro: 'Não foi possível copiar o telefone.' });
      }
      if (botao.dataset.acao === 'pedido') abrirInsercaoPedido(botao.dataset.id);
      if (botao.dataset.acao === 'excluir') excluirRelatorio(botao.dataset.id);
    });

    btnBuscar.addEventListener('click', () => { telefoneFiltroAplicado = telefoneBusca.value.trim(); carregar(); });
    btnLimpar.addEventListener('click', () => { telefoneBusca.value = ''; telefoneFiltroAplicado = ''; carregar(); });
    telefoneBusca.addEventListener('keydown', (event) => { if (event.key === 'Enter') { telefoneFiltroAplicado = telefoneBusca.value.trim(); carregar(); } });
    btnCopiarModal.addEventListener('click', () => copiarTexto(relatorioModalAtual, btnCopiarModal));
    btnFecharModal.addEventListener('click', fecharModal);
    modalFundo.addEventListener('click', (event) => { if (event.target === modalFundo) fecharModal(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') fecharModal(); });

    carregar();
    setInterval(() => { if (!document.hidden) carregar({ silencioso:true }); }, 5000);
  </script>
</body>
</html>
