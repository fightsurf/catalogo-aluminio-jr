<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mapa Logística - Alumínio JR</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  padding: 20px;
}

.container {
  max-width: 1200px;
  margin: auto;
}

h2 {
  text-align: center;
}

.layout {
  display: grid;
  grid-template-columns: 500px 1fr;
  gap: 30px;
}

svg path {
  fill: #d0d7de;
  cursor: pointer;
  transition: 0.2s;
}

svg path:hover {
  fill: #007bff;
}

svg path.ativo {
  fill: #28a745;
}

.box {
  background: white;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.cidade {
  margin-bottom: 10px;
  padding: 8px;
  background: #f8f9fa;
  border-radius: 4px;
}

.transportadora {
  margin-left: 15px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🗺️ Mapa Logístico - Clique no Estado</h2>

  <div class="layout">

    <!-- MAPA -->
    <div class="box">
      <!-- SVG simplificado com alguns estados para exemplo -->
      <svg viewBox="0 0 600 600" width="100%">

        <path data-estado="Bahia"
              d="M250 300 L300 280 L320 330 L270 350 Z" />

        <path data-estado="São Paulo"
              d="M200 400 L260 380 L280 420 L220 440 Z" />

        <path data-estado="Rio de Janeiro"
              d="M280 420 L310 410 L320 430 L290 440 Z" />

        <path data-estado="Pernambuco"
              d="M300 250 L340 230 L360 260 L320 270 Z" />

        <!-- Você pode depois colocar SVG completo -->

      </svg>
    </div>

    <!-- RESULTADO -->
    <div class="box">
      <div id="resultado">
        <p>Selecione um estado no mapa.</p>
      </div>
    </div>

  </div>
</div>

<script>
const API = '/api/logistica';

const estados = document.querySelectorAll('svg path');

estados.forEach(estado => {
  estado.addEventListener('click', function () {

    estados.forEach(e => e.classList.remove('ativo'));
    this.classList.add('ativo');

    const nomeEstado = this.dataset.estado;
    buscarPorEstado(nomeEstado);
  });
});

async function buscarPorEstado(nomeEstado) {

  const div = document.getElementById('resultado');
  div.innerHTML = `<p>Carregando ${nomeEstado}...</p>`;

  try {
    const res = await fetch(API + '/estado/' + encodeURIComponent(nomeEstado));

    if (!res.ok) throw new Error();

    const dados = await res.json();

    if (!dados.length) {
      div.innerHTML = `<p>Nenhuma cidade encontrada em ${nomeEstado}.</p>`;
      return;
    }

    div.innerHTML = `<h3>${nomeEstado}</h3>`;

    dados.forEach(c => {
      div.innerHTML += `
        <div class="cidade">
          <strong>${c.cidade}</strong>
          ${c.transportadoras.map(t => `
            <div class="transportadora">
              🚚 ${t.nome} - ${t.telefone || 'Sem telefone'}
            </div>
          `).join('')}
        </div>
      `;
    });

  } catch (err) {
    div.innerHTML = '<p>Erro ao buscar dados.</p>';
  }
}
</script>

</body>
</html>
