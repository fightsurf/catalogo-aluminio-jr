<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Consulta por Estado - Logística</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    .cidade {
      margin-bottom: 15px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 4px;
    }

    .transportadora {
      margin-left: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🔎 Consulta de Cidades por Estado</h2>

  <div class="box">
    <input id="estado" placeholder="Digite o nome do estado (ex: Bahia)">
    <button onclick="buscar()">Buscar</button>
  </div>

  <div id="resultado"></div>
</div>

<script>
const API = '/api/logistica';

async function buscar() {
  const estado = document.getElementById('estado').value;

  if (!estado) return;

  const res = await fetch(API + '/estado/' + estado);
  const dados = await res.json();

  const div = document.getElementById('resultado');
  div.innerHTML = '';

  if (!dados.length) {
    div.innerHTML = '<p>Nenhuma cidade encontrada.</p>';
    return;
  }

  dados.forEach(c => {
    div.innerHTML += `
      <div class="box cidade">
        <strong>${c.cidade} - ${c.estado}</strong>
        ${c.transportadoras.map(t => `
          <div class="transportadora">
            🚚 ${t.nome} - ${t.telefone || 'Sem telefone'}
          </div>
        `).join('')}
      </div>
    `;
  });
}
</script>

</body>
</html>
