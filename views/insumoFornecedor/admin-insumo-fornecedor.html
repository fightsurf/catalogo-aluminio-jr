<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custos de Insumos por Fornecedor - Alumínio JR</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; padding: 24px; }
    .container { max-width: 1280px; margin: 0 auto; }
    .box { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.08); margin-bottom: 24px; }
    h1,h2 { margin-top: 0; color: #243447; }
    .menu-modulo { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .menu-modulo a { text-decoration:none; background:#34495e; color:#fff; padding:9px 12px; border-radius:6px; font-size:13px; }
    .menu-modulo a.ativo { background:#2ecc71; }
    .form-cadastro { width:100%; max-width:760px; border-collapse:collapse; margin-top:12px; }
    .form-cadastro td { border-bottom:1px solid #edf1f5; padding:9px 10px; vertical-align:middle; }
    .form-cadastro tr:last-child td { border-bottom:none; }
    .form-cadastro .titulo-campo { width:220px; font-size:13px; font-weight:bold; color:#4a5568; background:#f7f9fb; }
    .form-cadastro .campo { width:auto; }
    .form-cadastro .acoes-form { display:flex; gap:12px; max-width:320px; }
    .form-cadastro label { margin-bottom:0; }
    .form-cadastro tr:hover { background:transparent; }
    .grid-filtro { display:grid; grid-template-columns: 1fr 1fr 1fr 160px 140px 140px; gap:12px; align-items:end; }
    label { display:block; font-size:13px; font-weight:bold; color:#4a5568; margin-bottom:6px; }
    input, select, button { width:100%; padding:10px 12px; border-radius:6px; border:1px solid #ccd3db; font-size:14px; box-sizing:border-box; }
    input[readonly] { background:#f4f7fa; }
    button { border:none; cursor:pointer; font-weight:bold; }
    .btn-salvar { background:#2ecc71; color:#fff; }
    .btn-limpar { background:#95a5a6; color:#fff; }
    .btn-buscar { background:#34495e; color:#fff; }
    .btn-editar { background:#f39c12; color:#fff; }
    .btn-excluir { background:#e74c3c; color:#fff; }
    table { width:100%; border-collapse:collapse; margin-top:16px; }
    th { background:#2c3e50; color:#fff; padding:10px; text-align:left; }
    td { padding:10px; border-bottom:1px solid #e9edf2; vertical-align:middle; }
    tr:hover { background:#f9fbfd; }
    .tabela-custos { font-size:12px; table-layout:fixed; }
    .tabela-custos th,
    .tabela-custos td { padding:4px 8px; height:32px; line-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tabela-custos th { padding-top:7px; padding-bottom:7px; }
    .tabela-custos .col-insumo { width:34%; }
    .tabela-custos .col-categoria { width:16%; }
    .tabela-custos .col-fornecedor { width:20%; }
    .tabela-custos .col-unidade { width:6%; text-align:center; }
    .tabela-custos .col-custo { width:9%; text-align:right; }
    .tabela-custos .col-status { width:7%; text-align:center; }
    .tabela-custos .col-acoes { width:88px; text-align:center; }
    .acoes { display:flex; gap:4px; flex-wrap:nowrap; justify-content:center; align-items:center; }
    .btn-acao { width:26px; height:24px; min-width:26px; padding:0; border-radius:5px; font-size:13px; line-height:24px; display:inline-flex; align-items:center; justify-content:center; }
    .btn-acao span { display:block; transform:translateY(-1px); }
    .status { font-weight:bold; }
    .status-ativo { color:#1e8449; }
    .status-inativo { color:#c0392b; }
    .mensagem { margin-top:12px; font-weight:bold; display:none; }
    .mensagem.sucesso { color:#1e8449; display:block; }
    .mensagem.erro { color:#c0392b; display:block; }
    .observacao-disco { margin-top: 12px; font-size: 13px; color: #2c3e50; background: #f5f8fb; padding: 10px 12px; border-radius: 6px; display:none; }
    @media (max-width: 1280px) { .grid-filtro { grid-template-columns:1fr; } }
    @media (max-width: 760px) {
      .form-cadastro, .form-cadastro tbody, .form-cadastro tr, .form-cadastro td { display:block; width:100%; }
      .form-cadastro .titulo-campo { width:100%; box-sizing:border-box; border-bottom:none; }
      .form-cadastro .campo { padding-top:0; }
      .form-cadastro .acoes-form { max-width:none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Custos de Insumos por Fornecedor</h1>
      <div class="menu-modulo">
        <a href="/admin-insumos-categorias">Categorias de insumo</a>
        <a href="/admin-insumos">Insumos</a>
        <a href="/admin-insumos-discos">Discos de alumínio</a>
        <a href="/admin-insumos-fornecedores" class="ativo">Custos por fornecedor</a>
      </div>

      <input type="hidden" id="registro_id" />
      <table class="form-cadastro">
        <tbody>
          <tr>
            <td class="titulo-campo"><label for="insumo_id">Insumo</label></td>
            <td class="campo"><select id="insumo_id" onchange="atualizarInsumoSelecionado()"></select></td>
          </tr>
          <tr>
            <td class="titulo-campo"><label for="fornecedor_id">Fornecedor</label></td>
            <td class="campo"><select id="fornecedor_id"></select></td>
          </tr>
          <tr>
            <td class="titulo-campo"><label for="unidade_custo">Unidade custo</label></td>
            <td class="campo"><input type="text" id="unidade_custo" readonly /></td>
          </tr>
          <tr>
            <td class="titulo-campo"><label for="preco_base">Preço base</label></td>
            <td class="campo"><input type="number" id="preco_base" min="0" step="0.0001" oninput="atualizarCustoFinalPreview()" /></td>
          </tr>
          <tr>
            <td class="titulo-campo"><label for="impostos_valor">Impostos</label></td>
            <td class="campo"><input type="number" id="impostos_valor" min="0" step="0.0001" oninput="atualizarCustoFinalPreview()" /></td>
          </tr>
          <tr>
            <td class="titulo-campo"><label for="frete_valor">Frete</label></td>
            <td class="campo"><input type="number" id="frete_valor" min="0" step="0.0001" oninput="atualizarCustoFinalPreview()" /></td>
          </tr>
          <tr>
            <td class="titulo-campo"><label for="outras_despesas_valor">Outras despesas</label></td>
            <td class="campo"><input type="number" id="outras_despesas_valor" min="0" step="0.0001" oninput="atualizarCustoFinalPreview()" /></td>
          </tr>
          <tr>
            <td class="titulo-campo"><label for="desconto_valor">Desconto</label></td>
            <td class="campo"><input type="number" id="desconto_valor" min="0" step="0.0001" oninput="atualizarCustoFinalPreview()" /></td>
          </tr>
          <tr>
            <td class="titulo-campo"><label for="custo_final">Custo final</label></td>
            <td class="campo"><input type="text" id="custo_final" readonly /></td>
          </tr>
          <tr>
            <td class="titulo-campo"><label for="ativo">Ativo</label></td>
            <td class="campo">
              <select id="ativo">
                <option value="true">Sim</option>
                <option value="false">Não</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="titulo-campo">Ações</td>
            <td class="campo">
              <div class="acoes-form">
                <button type="button" class="btn-salvar" onclick="salvar()">Salvar</button>
                <button type="button" class="btn-limpar" onclick="limparFormulario()">Limpar</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div id="discoInfo" class="observacao-disco"></div>
      <div id="mensagem" class="mensagem"></div>
    </div>

    <div class="box">
      <h2>Lista de Custos</h2>
      <div class="grid-filtro">
        <div>
          <label for="filtroInsumo">Buscar por insumo</label>
          <input type="text" id="filtroInsumo" placeholder="Nome do insumo" />
        </div>
        <div>
          <label for="filtroCategoria">Categoria</label>
          <select id="filtroCategoria"></select>
        </div>
        <div>
          <label for="filtroFornecedor">Fornecedor</label>
          <select id="filtroFornecedor"></select>
        </div>
        <div>
          <label for="filtroAtivo">Status</label>
          <select id="filtroAtivo">
            <option value="">Todos</option>
            <option value="true">Ativos</option>
            <option value="false">Inativos</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="button" class="btn-buscar" onclick="listar()">Buscar</button>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="button" class="btn-limpar" onclick="limparFiltros()">Limpar filtros</button>
        </div>
      </div>

      <table class="tabela-custos">
        <thead>
          <tr>
            <th class="col-insumo">Insumo</th>
            <th class="col-categoria">Categoria</th>
            <th class="col-fornecedor">Fornecedor</th>
            <th class="col-unidade">Unid.</th>
            <th class="col-custo">Custo final</th>
            <th class="col-status">Status</th>
            <th class="col-acoes">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = '/api/insumos-fornecedores';
    let insumos = [];
    let fornecedores = [];
    let categorias = [];

    function mostrarMensagem(texto, tipo = 'sucesso') {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = `mensagem ${tipo}`;
    }

    function limparMensagem() {
      const el = document.getElementById('mensagem');
      el.textContent = '';
      el.className = 'mensagem';
    }

    function moeda(valor) {
      return Number(valor || 0).toFixed(4);
    }

    async function carregarBases() {
      const [insumosResp, fornResp, catResp] = await Promise.all([
        fetch('/api/insumos/todos?ativo=true'),
        fetch('/api/fornecedores'),
        fetch('/api/insumos-categorias')
      ]);

      const insumosJson = await insumosResp.json();
      const fornJson = await fornResp.json();
      const catJson = await catResp.json();

      insumos = insumosJson.data || [];
      fornecedores = Array.isArray(fornJson) ? fornJson : (fornJson.data || []);
      categorias = catJson.data || [];

      document.getElementById('insumo_id').innerHTML = '<option value="">Selecione</option>' + insumos.map(i => `<option value="${i.id}">${i.nome}</option>`).join('');
      document.getElementById('fornecedor_id').innerHTML = '<option value="">Selecione</option>' + fornecedores.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
      document.getElementById('filtroFornecedor').innerHTML = '<option value="">Todos</option>' + fornecedores.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
      document.getElementById('filtroCategoria').innerHTML = '<option value="">Todas</option>' + categorias.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
    }

    function obterInsumoSelecionado() {
      const id = Number(document.getElementById('insumo_id').value || 0);
      return insumos.find(item => Number(item.id) === id) || null;
    }

    function atualizarInsumoSelecionado() {
      const insumo = obterInsumoSelecionado();
      const unidade = insumo ? (insumo.eh_disco ? 'kg' : insumo.unidade_medida) : '';
      document.getElementById('unidade_custo').value = unidade;

      const info = document.getElementById('discoInfo');
      if (insumo && insumo.eh_disco) {
        info.style.display = 'block';
        info.innerHTML = `<strong>Disco selecionado:</strong> ${insumo.nome} | Diâmetro: ${Number(insumo.diametro_mm).toFixed(2).replace(/\.00$/, '')} mm | Espessura: ${Number(insumo.espessura_mm).toFixed(2)} mm | Peso: ${Number(insumo.peso_kg).toFixed(6)} kg | Unidade de custo fixa: kg`;
      } else {
        info.style.display = 'none';
        info.textContent = '';
      }
    }

    function atualizarCustoFinalPreview() {
      const preco = Number(document.getElementById('preco_base').value || 0);
      const impostos = Number(document.getElementById('impostos_valor').value || 0);
      const frete = Number(document.getElementById('frete_valor').value || 0);
      const outras = Number(document.getElementById('outras_despesas_valor').value || 0);
      const desconto = Number(document.getElementById('desconto_valor').value || 0);
      document.getElementById('custo_final').value = (preco + impostos + frete + outras - desconto).toFixed(4);
    }

    function limparFormulario() {
      document.getElementById('registro_id').value = '';
      document.getElementById('insumo_id').value = '';
      document.getElementById('fornecedor_id').value = '';
      document.getElementById('unidade_custo').value = '';
      document.getElementById('preco_base').value = '';
      document.getElementById('impostos_valor').value = '';
      document.getElementById('frete_valor').value = '';
      document.getElementById('outras_despesas_valor').value = '';
      document.getElementById('desconto_valor').value = '';
      document.getElementById('custo_final').value = '';
      document.getElementById('ativo').value = 'true';
      atualizarInsumoSelecionado();
      limparMensagem();
    }

    function limparFiltros() {
      document.getElementById('filtroInsumo').value = '';
      document.getElementById('filtroCategoria').value = '';
      document.getElementById('filtroFornecedor').value = '';
      document.getElementById('filtroAtivo').value = '';
      listar();
    }

    async function listar() {
      const params = new URLSearchParams();
      const insumo = document.getElementById('filtroInsumo').value.trim();
      const categoria = document.getElementById('filtroCategoria').value;
      const fornecedor = document.getElementById('filtroFornecedor').value;
      const ativo = document.getElementById('filtroAtivo').value;
      if (insumo) params.append('insumo', insumo);
      if (categoria) params.append('categoria_insumo_id', categoria);
      if (fornecedor) params.append('fornecedor_id', fornecedor);
      if (ativo) params.append('ativo', ativo);

      const resp = await fetch(`${API}?${params.toString()}`);
      const json = await resp.json();
      const dados = json.data || [];
      const tbody = document.getElementById('tbody');

      tbody.innerHTML = dados.map(item => {
        const infoDisco = item.eh_disco
          ? ` | Ø ${Number(item.diametro_mm).toFixed(2).replace(/\.00$/, '')} mm | Esp. ${Number(item.espessura_mm).toFixed(2)} mm | Peso ${Number(item.peso_kg).toFixed(6)} kg`
          : '';
        const tituloInsumo = `${item.insumo}${infoDisco}`;

        return `
          <tr>
            <td class="col-insumo" title="${tituloInsumo}">${item.insumo}</td>
            <td class="col-categoria" title="${item.categoria || ''}">${item.categoria || ''}</td>
            <td class="col-fornecedor" title="${item.fornecedor || ''}">${item.fornecedor || ''}</td>
            <td class="col-unidade" title="${item.unidade_custo || ''}">${item.unidade_custo || ''}</td>
            <td class="col-custo" title="${moeda(item.custo_final)}">${moeda(item.custo_final)}</td>
            <td class="col-status"><span class="status ${item.ativo ? 'status-ativo' : 'status-inativo'}">${item.ativo ? 'Ativo' : 'Inativo'}</span></td>
            <td class="col-acoes">
              <div class="acoes">
                <button type="button" class="btn-acao btn-editar" onclick="editar(${item.id})" title="Editar"><span>✏️</span></button>
                <button type="button" class="btn-acao btn-limpar" onclick="inativar(${item.id})" title="Inativar"><span>🚫</span></button>
                <button type="button" class="btn-acao btn-excluir" onclick="excluirItem(${item.id})" title="Excluir"><span>🗑️</span></button>
              </div>
            </td>
          </tr>
        `;
      }).join('') || '<tr><td colspan="7">Nenhum registro encontrado.</td></tr>';
    }

    async function editar(id) {
      const resp = await fetch(`${API}/${id}`);
      const json = await resp.json();
      if (!json.success) {
        mostrarMensagem(json.message || 'Erro ao carregar registro', 'erro');
        return;
      }

      const item = json.data;
      document.getElementById('registro_id').value = item.id;
      document.getElementById('insumo_id').value = item.insumo_id;
      document.getElementById('fornecedor_id').value = item.fornecedor_id;
      document.getElementById('preco_base').value = item.preco_base;
      document.getElementById('impostos_valor').value = item.impostos_valor;
      document.getElementById('frete_valor').value = item.frete_valor;
      document.getElementById('outras_despesas_valor').value = item.outras_despesas_valor;
      document.getElementById('desconto_valor').value = item.desconto_valor;
      document.getElementById('ativo').value = String(item.ativo);
      atualizarInsumoSelecionado();
      atualizarCustoFinalPreview();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      limparMensagem();
    }

    async function salvar() {
      try {
        limparMensagem();
        const id = document.getElementById('registro_id').value;
        const payload = {
          insumo_id: document.getElementById('insumo_id').value,
          fornecedor_id: document.getElementById('fornecedor_id').value,
          preco_base: document.getElementById('preco_base').value,
          impostos_valor: document.getElementById('impostos_valor').value,
          frete_valor: document.getElementById('frete_valor').value,
          outras_despesas_valor: document.getElementById('outras_despesas_valor').value,
          desconto_valor: document.getElementById('desconto_valor').value,
          ativo: document.getElementById('ativo').value === 'true'
        };

        const metodo = id ? 'PUT' : 'POST';
        const url = id ? `${API}/${id}` : API;
        const resp = await fetch(url, {
          method: metodo,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await resp.json();
        if (!resp.ok || !json.success) {
          throw new Error(json.message || 'Erro ao salvar registro');
        }

        mostrarMensagem('Registro salvo com sucesso');
        limparFormulario();
        listar();
      } catch (error) {
        mostrarMensagem(error.message, 'erro');
      }
    }

    async function inativar(id) {
      if (!confirm('Deseja inativar este registro de custo?')) return;
      const resp = await fetch(API + "/" + id + "/inativar", { method: "PATCH" });
      const json = await resp.json();
      if (!resp.ok || !json.success) {
        mostrarMensagem(json.message || 'Erro ao inativar registro', 'erro');
        return;
      }
      mostrarMensagem('Registro inativado com sucesso');
      listar();
    }

    async function excluirItem(id) {
      if (!confirm('Deseja realmente excluir este INSUMO-FORNECEDOR? Esta ação remove o registro do banco.')) return;

      const resp = await fetch(API + "/" + id, { method: "DELETE" });
      const json = await resp.json();
      if (!resp.ok || !json.success) {
        mostrarMensagem(json.message || 'Erro ao excluir registro', 'erro');
        return;
      }

      mostrarMensagem('Registro excluído com sucesso');
      limparFormulario();
      listar();
    }

    (async function init() {
      await carregarBases();
      atualizarInsumoSelecionado();
      await listar();
    })();
  </script>
</body>
</html>
