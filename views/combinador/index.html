<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Combinador de Kits</title>

<style>
body { font-family: Arial; margin: 20px; background: #f9f9f9; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
th { background: #007bff; color: white; }
select, input { margin-right: 10px; }
button { padding: 8px 14px; background: #007bff; color: white; border: none; cursor: pointer; }
</style>
</head>

<body>

<h1>Gerador de Kits</h1>

<div>
  <label>Qtd de itens:
    <input type="number" id="tamKit" value="4" min="1">
  </label>

  <label>Preço médio máximo:
    <input type="number" id="precoMax" value="15" step="0.01">
  </label>

  <label>Item obrigatório:
    <select id="obrigatorio">
      <option value="">Nenhum</option>
    </select>
  </label>

  <button onclick="gerar()">Gerar</button>
</div>

<table id="tabela">
<thead>
<tr>
<th onclick="ordenar(0)">Valor</th>
<th onclick="ordenar(1)">Médio</th>
<th>Itens</th>
</tr>
</thead>
<tbody>
<tr><td colspan="3">Aguardando...</td></tr>
</tbody>
</table>

<script>
const API = '/api/produtos';

let produtos = [];
let resultados = [];
let asc = true;

async function carregarProdutos() {
  const select = document.getElementById('obrigatorio');

  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error();

    produtos = await res.json();

    produtos = produtos
      .filter(p => p.nome && p.preco)
      .map(p => ({
        id: p.id,
        nome: p.nome,
        preco: Number(p.preco)
      }))
      .sort((a,b)=>a.preco-b.preco);

    produtos.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.nome} (R$ ${p.preco.toFixed(2)})`;
      select.appendChild(opt);
    });

  } catch (e) {
    document.querySelector('#tabela tbody').innerHTML =
      `<tr><td colspan="3">Erro ao carregar produtos</td></tr>`;
  }
}

function gerar() {
  const tamKit = +document.getElementById('tamKit').value;
  const precoMax = +document.getElementById('precoMax').value;
  const obrigId = document.getElementById('obrigatorio').value;

  const tbody = document.querySelector('#tabela tbody');
  tbody.innerHTML = `<tr><td colspan="3">Calculando...</td></tr>`;

  const obrigatorio = produtos.find(p => p.id == obrigId);

  const lista = obrigatorio
    ? produtos.filter(p => p.id != obrigatorio.id)
    : produtos;

  resultados = [];

  function bt(i, kit, soma) {
    const qtdAtual = kit.length + (obrigatorio ? 1 : 0);

    if (qtdAtual === tamKit) {
      const total = soma + (obrigatorio ? obrigatorio.preco : 0);
      const medio = total / tamKit;

      if (medio <= precoMax) {
        const itensFinal = obrigatorio
          ? [obrigatorio, ...kit]
          : kit;

        resultados.push([
          total.toFixed(2),
          medio.toFixed(2),
          itensFinal.map(p => p.nome).join(' - ')
        ]);
      }
      return;
    }

    for (let x = i; x < lista.length; x++) {
      const p = lista[x];

      const novaSoma = soma + p.preco;
      const novaQtd = kit.length + 1 + (obrigatorio ? 1 : 0);

      const mediaParcial =
        (novaSoma + (obrigatorio ? obrigatorio.preco : 0)) / novaQtd;

      if (mediaParcial > precoMax) break;

      kit.push(p);
      bt(x + 1, kit, novaSoma);
      kit.pop();
    }
  }

  bt(0, [], 0);
  render();
}

function render() {
  const tbody = document.querySelector('#tabela tbody');

  if (resultados.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3">Nenhum resultado</td></tr>`;
    return;
  }

  tbody.innerHTML = resultados.map(r => `
    <tr>
      <td>R$ ${r[0]}</td>
      <td>R$ ${r[1]}</td>
      <td>${r[2]}</td>
    </tr>
  `).join('');

  tbody.insertAdjacentHTML('beforeend',
    `<tr><td colspan="3">(${resultados.length} kits)</td></tr>`
  );
}

function ordenar(col) {
  resultados.sort((a,b)=> asc
    ? parseFloat(a[col]) - parseFloat(b[col])
    : parseFloat(b[col]) - parseFloat(a[col])
  );
  asc = !asc;
  render();
}

carregarProdutos();
</script>

</body>
</html>
