<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Admin – Intenções</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; padding: 20px; }
    h1 { margin-bottom: 16px; font-size: 1.4rem; }
    .topo { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .topo h1 { margin-bottom: 0; }
    button.btn-voltar { background: #7f8c8d; color: #fff; border: none; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    button.btn-voltar:hover { background: #636e72; }
    button.btn-novo { background: #2980b9; color: #fff; border: none; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    button.btn-novo:hover { background: #1f6fa3; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 0.9rem; }
    th { background: #2c3e50; color: #fff; }
    tr:last-child td { border-bottom: none; }
    button.btn-editar { background: #f39c12; color: #fff; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.82rem; }
    button.btn-editar:hover { background: #d68910; }
    button.btn-excluir { background: #e74c3c; color: #fff; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.82rem; margin-left: 6px; }
    button.btn-excluir:hover { background: #c0392b; }
    #loading { margin: 20px 0; color: #555; }
    /* Modal */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; }
    .overlay.ativo { display: flex; align-items: center; justify-content: center; }
    .modal { background: #fff; border-radius: 8px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
    .modal h2 { margin-bottom: 16px; font-size: 1.1rem; }
    .campo { margin-bottom: 12px; }
    .campo label { display: block; font-size: 0.85rem; margin-bottom: 4px; font-weight: bold; }
    .campo input[type="text"], .campo textarea { width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    .campo textarea { resize: vertical; min-height: 70px; }
    .campo input[disabled] { background: #eee; color: #666; cursor: not-allowed; }
    .campo-check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .acoes-modal { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    button.btn-salvar { background: #27ae60; color: #fff; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button.btn-salvar:hover { background: #219150; }
    button.btn-cancelar { background: #bdc3c7; color: #333; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button.btn-cancelar:hover { background: #a0a8ad; }
    .msg-modal { font-size: 0.82rem; margin-top: 8px; }
    .msg-modal.ok { color: #27ae60; }
    .msg-modal.err { color: #e74c3c; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.78rem; font-weight: bold; }
    .badge-sim { background: #d5f5e3; color: #1e8449; }
    .badge-nao { background: #fde8e8; color: #c0392b; }
  </style>
</head>
<body>
  <div class="topo">
    <button class="btn-voltar" onclick="location.href='/bot/admin'">← Voltar</button>
    <h1>🤖 Gestão de Intenções – Bot WhatsApp</h1>
    <button class="btn-novo" onclick="abrirModalNovo()">+ Nova Intenção</button>
  </div>

  <p id="loading">Carregando intenções…</p>
  <table id="tabela" style="display:none">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Fluxo (chave)</th>
        <th>Exige Humano</th>
        <th>Ativa</th>
        <th>Criado em</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <!-- Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modal-titulo">Nova Intenção</h2>
      <div class="campo">
        <label for="campo-nome">Nome <small>(sem espaços, será salvo em MAIÚSCULO)</small></label>
        <input type="text" id="campo-nome" placeholder="ex: SAUDACAO" />
      </div>
      <div class="campo">
        <label for="campo-descricao">Descrição *</label>
        <input type="text" id="campo-descricao" placeholder="Descrição da intenção" />
      </div>
      <div class="campo">
        <label for="campo-fluxo-chave">Fluxo (chave)</label>
        <input type="text" id="campo-fluxo-chave" placeholder="Chave do fluxo para o motor de ações (opcional)" />
      </div>
      <div class="campo">
        <div class="campo-check">
          <input type="checkbox" id="campo-exige-humano" />
          <label for="campo-exige-humano">Exige atendimento humano</label>
        </div>
      </div>
      <div class="campo" id="campo-ativa-wrap" style="display:none">
        <div class="campo-check">
          <input type="checkbox" id="campo-ativa" />
          <label for="campo-ativa">Ativa</label>
        </div>
      </div>
      <div class="acoes-modal">
        <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        <button class="btn-salvar" onclick="salvar()">Salvar</button>
      </div>
      <div class="msg-modal" id="msg-modal"></div>
    </div>
  </div>

  <script>
    let modoEdicao = false;
    let idEdicao = null;

    async function carregar() {
      try {
        const res = await fetch('/bot/intencoes');
        if (!res.ok) throw new Error('Erro ao carregar intenções');
        const intencoes = await res.json();
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        intencoes.forEach(i => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${esc(i.nome)}</strong></td>
            <td>${esc(i.descricao)}</td>
            <td>${esc(i.fluxo_chave || '—')}</td>
            <td><span class="badge ${i.exige_humano ? 'badge-sim' : 'badge-nao'}">${i.exige_humano ? 'Sim' : 'Não'}</span></td>
            <td><span class="badge ${i.ativa ? 'badge-sim' : 'badge-nao'}">${i.ativa ? 'Sim' : 'Não'}</span></td>
            <td>${formatarData(i.criado_em)}</td>
            <td><button class="btn-editar" onclick='abrirModalEditar(${JSON.stringify(i)})'>Editar</button><button class="btn-excluir" onclick='excluir(${i.id}, "${esc(i.nome)}")'>Excluir</button></td>
          `;
          tbody.appendChild(tr);
        });
        document.getElementById('loading').style.display = 'none';
        document.getElementById('tabela').style.display = '';
      } catch (err) {
        document.getElementById('loading').textContent = 'Erro ao carregar: ' + err.message;
      }
    }

    async function excluir(id, nome) {
      if (!confirm(`Tem certeza que deseja excluir a intenção "${nome}"? Esta ação não pode ser desfeita.`)) return;
      try {
        const res = await fetch(`/bot/intencoes/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Erro ao excluir');
        carregar();
      } catch (err) {
        alert('Erro ao excluir: ' + err.message);
      }
    }

    function abrirModalNovo() {
      modoEdicao = false;
      idEdicao = null;
      document.getElementById('modal-titulo').textContent = 'Nova Intenção';
      document.getElementById('campo-nome').value = '';
      document.getElementById('campo-nome').disabled = false;
      document.getElementById('campo-descricao').value = '';
      document.getElementById('campo-fluxo-chave').value = '';
      document.getElementById('campo-exige-humano').checked = false;
      document.getElementById('campo-ativa').checked = true;
      document.getElementById('campo-ativa-wrap').style.display = 'none';
      document.getElementById('msg-modal').textContent = '';
      document.getElementById('msg-modal').className = 'msg-modal';
      document.getElementById('overlay').classList.add('ativo');
    }

    function abrirModalEditar(i) {
      modoEdicao = true;
      idEdicao = i.id;
      document.getElementById('modal-titulo').textContent = 'Editar Intenção';
      document.getElementById('campo-nome').value = i.nome;
      document.getElementById('campo-nome').disabled = true;
      document.getElementById('campo-descricao').value = i.descricao;
      document.getElementById('campo-fluxo-chave').value = i.fluxo_chave || '';
      document.getElementById('campo-exige-humano').checked = !!i.exige_humano;
      document.getElementById('campo-ativa').checked = !!i.ativa;
      document.getElementById('campo-ativa-wrap').style.display = '';
      document.getElementById('msg-modal').textContent = '';
      document.getElementById('msg-modal').className = 'msg-modal';
      document.getElementById('overlay').classList.add('ativo');
    }

    function fecharModal() {
      document.getElementById('overlay').classList.remove('ativo');
    }

    async function salvar() {
      const msgEl = document.getElementById('msg-modal');
      msgEl.textContent = '';
      msgEl.className = 'msg-modal';

      const descricao = document.getElementById('campo-descricao').value.trim();
      const fluxo_chave = document.getElementById('campo-fluxo-chave').value.trim();
      const exige_humano = document.getElementById('campo-exige-humano').checked;

      try {
        let res;
        if (modoEdicao) {
          const ativa = document.getElementById('campo-ativa').checked;
          res = await fetch(`/bot/intencoes/${idEdicao}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ descricao, fluxo_chave: fluxo_chave || null, exige_humano, ativa })
          });
        } else {
          const nome = document.getElementById('campo-nome').value.trim();
          res = await fetch('/bot/intencoes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nome, descricao, fluxo_chave: fluxo_chave || null, exige_humano })
          });
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Erro ao salvar');
        msgEl.textContent = '✓ Salvo com sucesso!';
        msgEl.classList.add('ok');
        setTimeout(() => { fecharModal(); carregar(); }, 800);
      } catch (err) {
        msgEl.textContent = '✗ ' + err.message;
        msgEl.classList.add('err');
      }
    }

    function esc(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function formatarData(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    carregar();
  </script>

  <!-- ─── BotBus & BotConfig – inicialização compartilhada ─────────────────── -->
  <script>
    (function () {
      // BotBus: EventTarget local com bridge via BroadcastChannel para comunicação entre abas/páginas
      if (!window.BotBus) {
        const bus = new EventTarget();
        const ch = new BroadcastChannel('bot-channel');

        // Emite localmente e propaga para outras abas/páginas
        bus.emit = function (type, detail) {
          bus.dispatchEvent(new CustomEvent(type, { detail: detail }));
          ch.postMessage({ type: type, detail: detail });
        };

        // Recebe eventos emitidos por outras abas/páginas
        ch.onmessage = function (e) {
          bus.dispatchEvent(new CustomEvent(e.data.type, { detail: e.data.detail }));
        };

        window.BotBus = bus;
      }

      // BotConfig: configuração central do bot (autonomia, thresholds, mapeamentos)
      if (!window.BotConfig) {
        window.BotConfig = {
          autonomyEnabled: true,
          dryRun: false,
          thresholds: {
            SAUDACAO: 0.70,
            CATALOGO: 0.75,
            ORCAMENTO: 0.80,
            FOLLOWUP: 0.70
          },
          intentionActionMap: {
            CATALOGO: 'SEND_CATALOG_LINK',
            ORCAMENTO: 'CREATE_QUOTE_DRAFT',
            FOLLOWUP: 'FOLLOWUP_MESSAGE'
          },
          autonomousActions: [
            'SEND_CATALOG_LINK',
            'CREATE_QUOTE_DRAFT',
            'FOLLOWUP_MESSAGE'
          ]
        };
      }
    })();
  </script>

  <!-- ─── Pipeline de decisão de ações a partir de intenções detectadas ──────── -->
  <script>
    /**
     * BotIntentions: módulo de decisão autônoma.
     * Recebe o resultado de uma intenção classificada, avalia se deve disparar
     * uma ação autônoma e publica o evento bot:action-decision no BotBus.
     */
    window.BotIntentions = {
      /**
       * Ponto de entrada principal. Deve ser chamado com o resultado da classificação.
       * @param {{ name: string, confidence: number, entities?: object }} intentResult
       */
      onIntentDetected: function (intentResult) {
        const name       = (intentResult && intentResult.name) ? String(intentResult.name).toUpperCase() : '';
        const confidence = Number((intentResult && intentResult.confidence) || 0);
        const entities   = (intentResult && intentResult.entities) ? intentResult.entities : {};

        const cfg = window.BotConfig || {};

        // Autonomia desabilitada globalmente
        if (!cfg.autonomyEnabled) {
          console.log('[BotIntentions] Autonomia desabilitada; decisão ignorada.');
          return;
        }

        // Threshold de confiança mínimo por intenção (default 0.75)
        const threshold = cfg.thresholds && cfg.thresholds[name] != null
          ? cfg.thresholds[name]
          : 0.75;

        if (confidence < threshold) {
          console.log('[BotIntentions] Confiança ' + confidence + ' abaixo do threshold ' + threshold + ' para ' + name + '; nenhuma ação autônoma.');
          return;
        }

        // Verifica se há mapeamento intenção -> tipo de ação
        const actionType = cfg.intentionActionMap && cfg.intentionActionMap[name];
        if (!actionType) {
          console.log('[BotIntentions] Intenção "' + name + '" sem mapeamento de ação; nenhuma ação autônoma.');
          return;
        }

        // Verifica se o tipo de ação está na allowlist de ações autônomas
        const allowlist   = cfg.autonomousActions || [];
        const autonomous  = allowlist.includes(actionType);

        const decision = {
          actionType: actionType,
          autonomous: autonomous,
          intentName: name,
          confidence: confidence,
          entities:   entities
        };

        const payload = {
          intentResult: intentResult,
          decision:     decision,
          timestamp:    new Date().toISOString()
        };

        console.log('[BotIntentions] Decisão gerada:', payload);

        // Publica evento para o BotBus (local + BroadcastChannel para outras abas)
        if (window.BotBus) {
          window.BotBus.emit('bot:action-decision', payload);
        }
      }
    };
  </script>

  <!-- ─── Painel de teste de intenção (uso manual/dev) ─────────────────────── -->
  <div id="painel-teste-intencao" style="margin-top:28px; padding:16px; background:#fff; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.1); max-width:520px;">
    <h3 style="font-size:1rem; margin-bottom:12px;">🧪 Testar Pipeline de Intenção</h3>
    <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end;">
      <div>
        <label style="font-size:0.82rem; font-weight:bold; display:block; margin-bottom:3px;">Intenção (nome)</label>
        <input type="text" id="teste-nome" placeholder="ex: CATALOGO" style="padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:0.88rem; width:140px;" />
      </div>
      <div>
        <label style="font-size:0.82rem; font-weight:bold; display:block; margin-bottom:3px;">Confiança (0–1)</label>
        <input type="number" id="teste-confianca" step="0.01" min="0" max="1" value="0.90" style="padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:0.88rem; width:100px;" />
      </div>
      <div>
        <label style="font-size:0.82rem; font-weight:bold; display:block; margin-bottom:3px;">Entidades (JSON)</label>
        <input type="text" id="teste-entities" placeholder="{}" style="padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:0.88rem; width:160px;" />
      </div>
      <button onclick="dispararTestIntencao()" style="background:#2980b9; color:#fff; border:none; padding:7px 14px; border-radius:4px; cursor:pointer; font-size:0.85rem; height:32px;">Disparar</button>
    </div>
    <div id="teste-resultado" style="margin-top:10px; font-size:0.82rem; color:#555;"></div>
  </div>

  <script>
    function dispararTestIntencao() {
      const nome       = document.getElementById('teste-nome').value.trim();
      const confianca  = parseFloat(document.getElementById('teste-confianca').value) || 0;
      const entidadesRaw = document.getElementById('teste-entities').value.trim() || '{}';
      const resultado  = document.getElementById('teste-resultado');

      let entities = {};
      try { entities = JSON.parse(entidadesRaw); } catch (e) {
        resultado.textContent = '✗ JSON de entidades inválido: ' + e.message;
        resultado.style.color = '#e74c3c';
        return;
      }

      if (!nome) {
        resultado.textContent = '✗ Informe o nome da intenção.';
        resultado.style.color = '#e74c3c';
        return;
      }

      const intentResult = { name: nome, confidence: confianca, entities: entities };
      resultado.textContent = 'Disparando: ' + JSON.stringify(intentResult);
      resultado.style.color = '#2980b9';

      window.BotIntentions.onIntentDetected(intentResult);

      setTimeout(function () {
        resultado.textContent = '✓ onIntentDetected chamado. Verifique o console e a aba botFluxo.';
        resultado.style.color = '#27ae60';
      }, 300);
    }
  </script>
</body>
</html>
