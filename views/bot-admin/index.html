<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Admin – Alumínio JR</title>
  <link rel="stylesheet" href="/bot-admin/style.css" />
</head>
<body>
  <div id="app">
    <!-- SIDEBAR: lista de conversas -->
    <aside id="sidebar">
      <div id="filtros">
        <h2>🤖 Bot Admin</h2>
        <input type="text" id="filtro-telefone" placeholder="Buscar telefone..." />
        <div id="filtros-grid">
          <input type="date" id="filtro-data-inicio" title="Data início" />
          <input type="date" id="filtro-data-fim" title="Data fim" />
          <select id="filtro-nivel">
            <option value="">Todos os níveis</option>
            <option value="HUMANO">HUMANO</option>
            <option value="IA">IA</option>
          </select>
        </div>
        <button id="btn-filtrar">Filtrar</button>
      </div>
      <div id="lista-conversas"></div>
      <div id="paginacao-conversas"></div>
    </aside>

    <!-- MAIN: histórico de mensagens -->
    <main id="chat-area">
      <div id="chat-header">
        <span id="chat-titulo">Selecione uma conversa</span>
        <div id="classificacao-controls" style="display:none">
          <button id="btn-classificar" disabled>🔍 Classificar intenção</button>
          <span id="badge-intencao" class="badge-intencao oculto"></span>
          <span id="status-classificacao"></span>
        </div>
      </div>
      <div id="chat-mensagens"></div>
      <div id="paginacao-mensagens"></div>
    </main>
  </div>

  <!-- ─── BotBus & BotConfig – inicialização compartilhada ─────────────────── -->
  <script>
    (function () {
      // BotBus: EventTarget local com bridge via BroadcastChannel para comunicação entre abas/páginas
      if (!window.BotBus) {
        const bus = new EventTarget();
        const ch = new BroadcastChannel('bot-channel');

        // Emite localmente e propaga para outras abas/páginas
        bus.emit = function (type, detail) {
          bus.dispatchEvent(new CustomEvent(type, { detail: detail }));
          ch.postMessage({ type: type, detail: detail });
        };

        // Recebe eventos emitidos por outras abas/páginas
        ch.onmessage = function (e) {
          bus.dispatchEvent(new CustomEvent(e.data.type, { detail: e.data.detail }));
        };

        window.BotBus = bus;
      }

      // BotConfig: configuração central do bot (autonomia, thresholds, mapeamentos)
      if (!window.BotConfig) {
        window.BotConfig = {
          autonomyEnabled: true,   // habilita operação autônoma do bot
          dryRun: false,           // true = simula sem efeitos colaterais reais
          thresholds: {            // confiança mínima por intenção (0–1)
            SAUDACAO: 0.70,
            LOCALIZACAO: 0.75,
            CATALOGO: 0.75,
            ORCAMENTO: 0.80,
            FOLLOWUP: 0.70
          },
          intentionActionMap: {    // intenção -> tipo de ação a disparar
            LOCALIZACAO: 'SEND_LOCATION',
            CATALOGO: 'SEND_LINK',
            ORCAMENTO: 'SEND_TEXT',
            FOLLOWUP: 'SEND_TEXT'
          },
          autonomousActions: [     // allowlist de ações que podem ser executadas autonomamente
            'SEND_TEXT',
            'SEND_IMAGE',
            'SEND_LOCATION',
            'SEND_VIDEO',
            'SEND_AUDIO',
            'SEND_LINK'
          ]
        };
      }

      // Helper global: emite uma intenção classificada para o barramento.
      // Caminho primário: delega ao pipeline de decisão de BotIntentions (bot-intencoes.html).
      // Caminho alternativo (fallback): publica bot:intent-raw quando BotIntentions não está
      // carregado na mesma aba (ex.: index.html usado isoladamente). Nesse caso, o consumidor
      // responsável por ouvir bot:intent-raw e chamar onIntentDetected deve ser registrado
      // pela aplicação que integrar este módulo.
      window.BotAdmin = window.BotAdmin || {};
      window.BotAdmin.emitIntent = function (intentResult) {
        if (window.BotIntentions && window.BotIntentions.onIntentDetected) {
          // Preferencial: passa pelo pipeline de decisão completo
          window.BotIntentions.onIntentDetected(intentResult);
        } else if (window.BotBus) {
          // Fallback: publica evento bruto para que outro módulo processe
          window.BotBus.emit('bot:intent-raw', intentResult);
        }
      };
    })();
  </script>

  <!-- ─── Pipeline de decisão de ações a partir de intenções detectadas ──────── -->
  <script>
    /**
     * BotIntentions: módulo de decisão autônoma.
     * Recebe o resultado de uma intenção classificada, avalia se deve disparar
     * uma ação autônoma e publica o evento bot:action-decision no BotBus.
     */
    window.BotIntentions = window.BotIntentions || {
      onIntentDetected: function (intentResult) {
        const name       = (intentResult && intentResult.name) ? String(intentResult.name).toUpperCase() : '';
        const confidence = Number((intentResult && intentResult.confidence) || 0);
        const entities   = (intentResult && intentResult.entities) ? intentResult.entities : {};

        const cfg = window.BotConfig || {};

        if (!cfg.autonomyEnabled) {
          console.log('[BotIntentions] Autonomia desabilitada; decisão ignorada.');
          return;
        }

        const threshold = cfg.thresholds && cfg.thresholds[name] != null
          ? cfg.thresholds[name]
          : 0.75;

        if (confidence < threshold) {
          console.log('[BotIntentions] Confiança ' + confidence + ' abaixo do threshold ' + threshold + ' para ' + name + '; nenhuma ação autônoma.');
          return;
        }

        const actionType = cfg.intentionActionMap && cfg.intentionActionMap[name];
        if (!actionType) {
          console.log('[BotIntentions] Intenção "' + name + '" sem mapeamento de ação; nenhuma ação autônoma.');
          return;
        }

        const allowlist  = cfg.autonomousActions || [];
        const autonomous = allowlist.includes(actionType);

        if (!autonomous) {
          console.log('[BotIntentions] actionType "' + actionType + '" não está na allowlist de ações autônomas; decisão emitida com autonomous=false.');
        }

        const decision = {
          actionType: actionType,
          autonomous: autonomous,
          intentName: name,
          confidence: confidence,
          entities:   entities
        };

        const payload = {
          intentResult: intentResult,
          decision:     decision,
          timestamp:    new Date().toISOString()
        };

        console.log('[BotIntentions] Decisão gerada:', payload);

        if (window.BotBus) {
          window.BotBus.emit('bot:action-decision', payload);
        }
      }
    };
  </script>

  <script src="/bot-admin/script.js"></script>
</body>
</html>
