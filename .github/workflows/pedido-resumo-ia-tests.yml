name: Testes de apresentação do pedido com IA
on:
  push:
    paths:
      - 'public/js/pedido-resumo-ia.js'
      - 'tests/pedido-resumo-ia-botao-audio.test.js'
      - 'tests/resumo-pedido-ia.test.js'
      - '.github/workflows/pedido-resumo-ia-tests.yml'
  pull_request:
    paths:
      - 'public/js/pedido-resumo-ia.js'
      - 'tests/pedido-resumo-ia-botao-audio.test.js'
      - 'tests/resumo-pedido-ia.test.js'
      - '.github/workflows/pedido-resumo-ia-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface-resumo-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe e regressão do botão Gerar áudio
        run: |
          node --check public/js/pedido-resumo-ia.js
          node --check tests/pedido-resumo-ia-botao-audio.test.js
          node --test tests/pedido-resumo-ia-botao-audio.test.js tests/resumo-pedido-ia.test.js
