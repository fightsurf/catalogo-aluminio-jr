name: Testes AVN Sono Samsung

on:
  pull_request:
    paths:
      - 'src/routes/avn/avn-sono-mobile.routes.js'
      - 'test/avn-sono-samsung.test.js'
      - '.github/workflows/avn-sono-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-sono:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checar sintaxe e testar validador sem dados reais
        shell: bash
        run: |
          set -euo pipefail
          node --check src/routes/avn/avn-sono-mobile.routes.js
          node --check test/avn-sono-samsung.test.js
          mkdir -p "$RUNNER_TEMP/avn-test-deps"
          npm install --prefix "$RUNNER_TEMP/avn-test-deps" --no-audit --no-fund --ignore-scripts express pg
          NODE_PATH="$RUNNER_TEMP/avn-test-deps/node_modules" node --test test/avn-sono-samsung.test.js
