name: Android - Status Vídeos

on:
  push:
    paths:
      - 'apps/status-videos-android/**'
      - '.github/workflows/status-videos-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK debug
        working-directory: apps/status-videos-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: aluminio-jr-status-videos-debug
          path: apps/status-videos-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
