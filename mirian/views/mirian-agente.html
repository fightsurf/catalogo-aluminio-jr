<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente de Saúde | Projeto Mirian</title>
  <link rel="stylesheet" href="/mirian/assets/css/mirian.css">
</head>
<body>
  <header class="mirian-topo">
    <div class="mirian-topo-conteudo">
      <div class="mirian-topo-linha">
        <a class="mirian-voltar" href="/mirian" aria-label="Voltar">‹</a>
        <div>
          <h1>Agente de Saúde</h1>
          <p>Consulte os cadastros e registre as visitas realizadas.</p>
        </div>
      </div>
    </div>
  </header>

  <main class="mirian-container">
    <div id="mirian-mensagem" class="mirian-mensagem" role="status" aria-live="polite"></div>

    <section class="mirian-card">
      <form id="mirian-form-filtros" class="mirian-filtros">
        <div class="mirian-campo">
          <label for="mirian-filtro-nome">Nome</label>
          <input id="mirian-filtro-nome" name="nome" type="search" maxlength="160">
        </div>

        <div class="mirian-campo">
          <label for="mirian-filtro-telefone">Telefone</label>
          <input id="mirian-filtro-telefone" name="telefone" type="search" maxlength="30" inputmode="tel">
        </div>

        <div class="mirian-campo">
          <label for="mirian-filtro-cidade">Cidade</label>
          <input id="mirian-filtro-cidade" name="cidade" type="search" maxlength="120">
        </div>

        <div class="mirian-campo">
          <label for="mirian-filtro-sintoma">Sintoma</label>
          <select id="mirian-filtro-sintoma" name="sintomaId">
            <option value="">Todos os sintomas</option>
          </select>
        </div>

        <div class="mirian-acoes">
          <button class="mirian-botao-primario" type="submit">Pesquisar</button>
          <button id="mirian-limpar-filtros" class="mirian-botao-secundario" type="button">Limpar</button>
        </div>
      </form>
    </section>

    <div id="mirian-resumo" class="mirian-resumo"></div>
    <div id="mirian-atualizado" class="mirian-meta" style="margin-bottom: 12px;"></div>
    <section id="mirian-lista-pacientes" class="mirian-lista" aria-live="polite"></section>
  </main>


  <div
    id="mirian-modal-whatsapp"
    class="mirian-modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="mirian-modal-whatsapp-titulo"
    hidden
  >
    <section class="mirian-modal">
      <div class="mirian-modal-cabecalho">
        <div>
          <h2 id="mirian-modal-whatsapp-titulo">Enviar aviso pelo WhatsApp</h2>
          <p id="mirian-modal-whatsapp-destinatario" class="mirian-meta"></p>
        </div>
        <button
          id="mirian-fechar-modal-whatsapp"
          class="mirian-modal-fechar"
          type="button"
          aria-label="Fechar"
        >×</button>
      </div>

      <form id="mirian-form-whatsapp" class="mirian-formulario">
        <div class="mirian-campo">
          <label for="mirian-whatsapp-mensagem">Mensagem</label>
          <textarea
            id="mirian-whatsapp-mensagem"
            name="mensagem"
            rows="6"
            maxlength="2000"
            required
            placeholder="Digite a mensagem que será enviada ao paciente"
          ></textarea>
          <span class="mirian-meta">Máximo de 2.000 caracteres.</span>
        </div>

        <div
          id="mirian-modal-whatsapp-mensagem"
          class="mirian-mensagem"
          role="status"
          aria-live="polite"
        ></div>

        <div class="mirian-acoes">
          <button
            id="mirian-cancelar-whatsapp"
            class="mirian-botao-secundario"
            type="button"
          >Cancelar</button>
          <button
            id="mirian-enviar-whatsapp"
            class="mirian-botao-whatsapp-enviar"
            type="submit"
          >Enviar mensagem</button>
        </div>
      </form>
    </section>
  </div>

  <footer class="mirian-rodape">Atualização automática a cada 10 segundos</footer>

  <script src="/mirian/assets/js/mirian-comum.js"></script>
  <script src="/mirian/assets/js/mirian-agente.js"></script>
</body>
</html>
